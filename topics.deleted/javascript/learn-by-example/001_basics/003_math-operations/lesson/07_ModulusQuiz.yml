type: "quiz"
lang: javascript
question: |
  ما هي القيمة التي سيتم تخزينها في المتغير `result`؟
code: |
  let items = 25;
  let boxCapacity = 7;
  let result = items % boxCapacity;
solution: 0
options:
  - "4"
  - "3"
  - "5"
  - "0"
explanation: |
  نريد معرفة كم قطعة ستبقى بعد ملء أكبر عدد ممكن من الصناديق:
  - `25` قطعة إجمالاً، وكل صندوق يتسع لـ `7` قطع.
  - يمكننا ملء 3 صناديق بالكامل: `3 * 7 = 21` قطعة.
  - عدد القطع المتبقية هو `25 - 21 = 4`.
  - لذلك، `25 % 7` يساوي `4`.
