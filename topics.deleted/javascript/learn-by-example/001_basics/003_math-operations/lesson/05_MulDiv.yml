type: "quiz"
lang: javascript
question: |
  ماذا سيكون ناتج `calculation` في هذا الكود؟
code: |
  let a = 12;
  let b = 3;
  let c = 2;
  let calculation = a / b * c;
solution: 2
options:
  - "2"
  - "18"
  - "8"
  - "6"
explanation: |
  العمليات الحسابية للضرب والقسمة لها نفس الأولوية، ويتم تنفيذها من اليسار إلى اليمين:
  1. `a / b` يعني `12 / 3`، والناتج هو `4`.
  2. ثم `4 * c` يعني `4 * 2`، والناتج النهائي هو `8`.

  لذلك، قيمة `calculation` هي `8`.
