type: "quiz"
lang: javascript
question: |
  سؤال ماكر! ما هو الناتج المتوقع لهذا الكود؟
code: |
  // فحص العمر
  const age = "18";

  if (age >= 18) {
    console.log("بالغ 👨");
  } else if (age >= 13) {
    console.log("مراهق 🧒");
  } else {
    console.log("طفل 👶");
  }
solution: 2
options:
  - "بالغ 👨"
  - "مراهق 🧒"
  - "طفل 👶"
  - "لن يطبع شيئاً"
explanation: |
  المتغير `age` قيمته "18" كنص (string) وليس رقم!

  عند المقارنة `"18" >= 18`:
  - JavaScript يحول النص "18" إلى رقم 18 تلقائياً
  - المقارنة `18 >= 18` صحيحة
  - لذلك يطبع "بالغ 👨"

  الخدعة: حتى لو كان العمر نص، JavaScript ذكي في التحويل!
