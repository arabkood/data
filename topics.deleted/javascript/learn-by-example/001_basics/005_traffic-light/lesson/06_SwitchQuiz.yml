type: "quiz"
lang: javascript
question: |
  انتبه للتفاصيل! ما هو الناتج المتوقع لهذا الكود؟
code: |
  // أيام الأسبوع
  const day = "الثلاثاء";

  switch (day) {
    case "الاثنين":
      console.log("بداية الأسبوع 💼");
    case "الثلاثاء":
      console.log("يوم عادي 📚");
    case "الأربعاء":
      console.log("منتصف الأسبوع ⚡");
      break;
    case "الخميس":
      console.log("قريب من نهاية الأسبوع 😴");
      break;
    default:
      console.log("عطلة نهاية الأسبوع 🎉");
  }
solution: 2
options:
  - "يوم عادي 📚"
  - "منتصف الأسبوع ⚡"
  - "يوم عادي 📚 و منتصف الأسبوع ⚡"
  - "بداية الأسبوع 💼 و يوم عادي 📚 و منتصف الأسبوع ⚡"
explanation: |
  قيمة المتغير `day` هي "الثلاثاء". الكود يجد `case "الثلاثاء"` ويبدأ التنفيذ من هناك:
  - ينفذ `console.log("يوم عادي 📚")` ✅
  - لا يوجد `break`، فيستمر للحالة التالية
  - ينفذ `console.log("منتصف الأسبوع ⚡")` ✅  
  - يجد `break` فيتوقف

  هذا مثال على أهمية كلمة `break` في switch!
