type: "quiz"
lang: javascript
question: |
  مثال من الحياة اليومية! ما هو الناتج المتوقع لهذا الكود؟
code: |
  // إشارة المرور
  const lightColor = "أصفر";

  if (lightColor === "أحمر") {
    console.log("قف! 🛑");
  } else if (lightColor === "أصفر") {
    console.log("استعد للتوقف ⚠️");
  } else if (lightColor === "أخضر") {
    console.log("تحرك 🚦");
  } else {
    console.log("إشارة غير معروفة");
  }
solution: 1
options:
  - "قف! 🛑"
  - "استعد للتوقف ⚠️"
  - "تحرك 🚦"
  - "إشارة غير معروفة"
explanation: |
  قيمة المتغير `lightColor` هي "أصفر". الكود يفحص الشروط بالترتيب:
  - `lightColor === "أحمر"` خطأ ("أصفر" لا يساوي "أحمر")
  - `lightColor === "أصفر"` صحيح ("أصفر" يساوي "أصفر") ✅

  لذلك ينفذ الكود داخل أول `else if` ويطبع "استعد للتوقف ⚠️" ثم يتوقف.
