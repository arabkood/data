type: "quiz"
lang: javascript
question: |
  اعثر على الخطأ! ما هو الناتج المتوقع لهذا الكود؟
code: |
  // فحص النتيجة النهائية
  const score = 75;

  if (score = 100) {
    console.log("درجة كاملة! 💯");
  } else if (score >= 90) {
    console.log("ممتاز 🌟");
  } else if (score >= 75) {
    console.log("جيد جداً ✨");
  } else {
    console.log("يحتاج تحسين 📈");
  }
solution: 0
options:
  - "درجة كاملة! 💯"
  - "ممتاز 🌟"
  - "جيد جداً ✨"
  - "يحتاج تحسين 📈"
explanation: |
  الخطأ في السطر الأول: `if (score = 100)` 

  استُخدم `=` (إسناد) بدلاً من `===` (مقارنة)!
  - `score = 100` يُغير قيمة score إلى 100
  - القيمة 100 تُعتبر true في الشرط
  - لذلك ينفذ الشرط الأول ويطبع "درجة كاملة! 💯"

  الخطأ الشائع: الخلط بين = (إسناد) و === (مقارنة).
