type: "quiz"
lang: javascript
question: |
  ما هي النتيجة التي ستُطبع عند تشغيل هذا الكود؟
code: |
  const temperature = 25;

  if (temperature > 30) {
    console.log("الجو حار!");
  } else {
    console.log("الجو معتدل");
  }
solution: 1
options:
  - "الجو حار!"
  - "الجو معتدل"
  - "لن يُطبع شيء"
  - "سيحدث خطأ"
explanation: |
  الحاسوب يتحقق من الشرط: `temperature > 30`

  - قيمة `temperature` هي `25`
  - هل `25 > 30`؟ **لا** (`:false`)
  - لذلك يتجاهل كتلة `if` وينفذ كتلة `else`
  - النتيجة: `"الجو معتدل"`
