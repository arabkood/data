type: "quiz"
lang: javascript
question: |
  ماذا يفعل السطر التالي من الكود؟

code: |
  const now = new Date();

solution: 0
options:
  - "ينشئ كائنًا جديدًا من نوع Date يحتوي على الوقت الحالي ويخزنه في ثابت اسمه now"
  - "يضبط التاريخ على 1 يناير 1970"
  - "ينشئ مؤقتًا يعمل كل ساعة"
  - "يغيّر الوقت في نظام تشغيل الحاسوب"
explanation: |
  `new Date()` تنشئ كائنًا جديدًا يمثل التاريخ والوقت الحاليين. يتم تخزين هذا الكائن في ثابت اسمه `now`.
