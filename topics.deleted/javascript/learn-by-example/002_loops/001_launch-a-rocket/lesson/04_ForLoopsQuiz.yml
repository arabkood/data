type: "quiz"
lang: javascript
question: |
  ماذا سيطبع هذا الكود؟
code: |
  for (let x = 2; x <= 6; x += 2) {
    console.log(x);
  }
solution: 1
options:
  - "2, 3, 4, 5, 6"
  - "2, 4, 6"
  - "2, 4, 6, 8"
  - "خطأ في الكود"
explanation: |
  لنتتبع الحلقة خطوة بخطوة:

  - **البداية**: `x = 2`
  - **الشرط**: `x <= 6` (نستمر طالما x أقل من أو يساوي 6)
  - **التحديث**: `x += 2` (نزيد x بـ 2 في كل مرة)

  التكرارات:
  1. `x = 2` ← يطبع 2
  2. `x = 4` ← يطبع 4
  3. `x = 6` ← يطبع 6
  4. `x = 8` ← الشرط `8 <= 6` خاطئ، تتوقف الحلقة

  النتيجة: `2, 4, 6`
