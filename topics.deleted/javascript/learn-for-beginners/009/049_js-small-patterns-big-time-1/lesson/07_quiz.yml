type: "quiz"
lang: "javascript"
question: |
  ما القيمة النهائية للمتغير `:userType` بعد تنفيذ هذا الكود الذي يدمج بين الأنماط التي تعلمناها؟
code: |
  const user = { isAdmin: true, name: "مدير" };
  let permissions = user.isAdmin && "كاملة"; // سيتم إسناد 'كاملة'

  const userType = permissions === "كاملة" ? "مسؤول" : "مستخدم عادي";
options:
  - "`'مسؤول'`"
  - "`'مستخدم عادي'`"
  - "`true`"
  - "`'كاملة'`"
solution: 0
explanation: |
  1.  `user.isAdmin` هي `:true`، لذلك يقوم عامل `:&&` بإسناد القيمة الثانية (`'كاملة'`) إلى المتغير `:permissions`.
  2.  بعد ذلك، يتم تقييم الشرط في العامل الثلاثي: `permissions === 'كاملة'` وهو `:true`.
  3.  لذلك، يتم إسناد القيمة الأولى (`'مسؤول'`) إلى `:userType`.