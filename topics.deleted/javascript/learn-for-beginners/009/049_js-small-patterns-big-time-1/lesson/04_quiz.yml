type: "quiz"
lang: "javascript"
question: |
  أكمل الكود التالي باستخدام العامل الثلاثي لتحديد ما إذا كان المستخدم قاصرًا أم بالغًا.
code: |
  let age = 15;
  let status = age >= 18 ? "بالغ" : __@@INPUT@@__;
options:
  - "`'قاصر'`"
  - "`'طفل'`"
  - "`age`"
  - "`undefined`"
solution: 0
explanation: |
  العامل الثلاثي يحتاج إلى قيمة ليُرجعها عندما يكون الشرط `:false`. في هذه الحالة، بما أن `15 >= 18` هو `:false`، فسيتم إرجاع القيمة الثانية وهي `'قاصر'`.