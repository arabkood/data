type: "quiz"
lang: "javascript"
question: |
  لدينا خطة من ثلاث خطوات لإنشاء رسالة ترحيب. بالنظر إلى الكود، ما هي الخطوة **التالية** التي يجب تنفيذها؟
code: |
  let user = "فاطمة";
  
  // الخطوة التالية؟
  
  console.log(welcomeMessage);
options:
  - "تعريف `:variable` جديد باسم `welcomeMessage` ودمج `user` فيه"
  - "إعادة تعريف `:variable` `user`"
  - "حذف السطر الأول"
  - "لا شيء، الكود صحيح كما هو"
solution: 0
explanation: |
  وفقًا للخطة، بعد الحصول على المدخلات (اسم المستخدم)، فإن الخطوة المنطقية التالية هي معالجتها (إنشاء رسالة الترحيب) قبل محاولة طباعتها.