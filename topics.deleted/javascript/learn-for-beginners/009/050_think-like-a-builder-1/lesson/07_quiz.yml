type: "quiz"
lang: "javascript"
question: |
  هذا الكود لا يعمل والسبب هو فشل في التخطيط. ما هو الخطأ المنطقي هنا؟
code: |
  let finalMessage = "مرحباً " + username;
  console.log(finalMessage);
  
  let username = "خالد";
options:
  - "يجب استخدام `:const` بدلاً من `let`"
  - "تم استخدام `:variable` `username` قبل تعريفه"
  - "اسم `:variable` `finalMessage` طويل جداً"
  - "`console.log` يجب أن تكون في السطر الأول"
solution: 1
explanation: |
  تماماً مثل محاولة بناء السقف قبل الجدران! لا يمكنك استخدام `:variable` `username` لإنشاء الرسالة قبل أن تقوم بتعريفه وإعطائه قيمة. الترتيب هو مفتاح النجاح.