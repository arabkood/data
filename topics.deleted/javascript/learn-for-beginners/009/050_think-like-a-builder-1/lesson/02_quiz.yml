type: "quiz"
lang: "javascript"
question: |
  إذا طُلب منك إنشاء برنامج بسيط يعرض رسالة ترحيب باسم المستخدم وعمره، فما هي أول خطوة منطقية يجب اتخاذها؟
options:
  - "البحث عن حل جاهز على الإنترنت"
  - "البدء بكتابة `:function` مباشرة"
  - "تحديد الألوان والخطوط للتطبيق"
  - "تجزئة المشكلة إلى خطوات أصغر (مثل: الحصول على الاسم، ثم العمر، ثم دمجهم)"
solution: 3
explanation: |
  التخطيط أولاً! تجزئة المشكلة الكبيرة إلى أجزاء صغيرة يمكن التحكم فيها هي عقلية البنّاء. هذا يجعل الكود أسهل في الكتابة والفهم والصيانة.