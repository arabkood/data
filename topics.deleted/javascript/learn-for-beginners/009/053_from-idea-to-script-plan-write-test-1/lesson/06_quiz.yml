type: "quiz"
lang: "javascript"
question: |
  قمنا باستدعاء الدالة `:calculateArea` مع القيم `7` و `3`. ما الناتج الذي سيتم طباعته في الـ`:console`؟
code: |
  function calculateArea(length, width) {
    return length * width;
  }

  let result = calculateArea(7, 3);
  console.log(result);
options:
  - "`10`"
  - "`4`"
  - "`calculateArea`"
  - "`21`"
solution: 3
explanation: |
  هذا مثال عملي على مرحلة **الاختبار**. قمنا بتمرير قيم معروفة (`7` و `3`) وتأكدنا من أن الناتج المطبوع (`21`) هو الناتج الصحيح المتوقع.