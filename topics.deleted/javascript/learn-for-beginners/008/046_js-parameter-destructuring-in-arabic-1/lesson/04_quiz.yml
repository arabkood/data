type: "quiz"
lang: "javascript"
question: |
  الكود التالي لا يعمل كما هو متوقع. ما هو سبب الخطأ الرئيسي؟
code: |
  function displayBook({ title, publicationYear }) {
    console.log(`الكتاب: ${title}, سنة النشر: ${publicationYear}`);
  }

  const book = { bookTitle: 'مقدمة في البرمجة', year: 2021 };
  displayBook(book);
options:
  - "يجب تمرير الكائن `book` كـ `:string`"
  - "أسماء المتغيرات في التفكيك (`title`, `publicationYear`) لا تتطابق مع أسماء الخصائص في الكائن (`bookTitle`, `year`)"
  - "لا يمكن استخدام التفكيك مع `:const`"
  - "الدالة `console.log` لا يمكنها طباعة متغيرين معًا"
solution: 1
explanation: |
  يعتمد تفكيك الكائنات على تطابق أسماء الخصائص. بما أن `:function` تتوقع خاصيتين باسم `title` و `publicationYear`، ولكنهما غير موجودتين في `:object` `book`، ستكون قيمتهما `:undefined`.