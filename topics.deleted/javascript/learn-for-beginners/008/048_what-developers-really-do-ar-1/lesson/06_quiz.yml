type: "quiz"
lang: "javascript"
question: |
  الهدف من الكود التالي هو حساب سعر المنتج بعد إضافة الضريبة (15%). لكنه يحتوي على `:bug`.
  
  ما هو التعديل الصحيح لإصلاح الكود؟
code: |
  function calculateFinalPrice(price) {
    const tax = 0.15;
    let finalPrice = price + tax;
    return finalPrice;
  }
  
  // الناتج عند استدعاء calculateFinalPrice(100) هو 100.15 بدلاً من 115
options:
  - "تغيير `const` إلى `let`"
  - "إضافة `price * tax` إلى `price`"
  - "إزالة `return`"
  - "تعريف `tax` داخل `:function` أخرى"
solution: 1
explanation: |
  هذا مثال كلاسيكي على خطأ منطقي يتم اكتشافه أثناء مرحلة الاختبار. الخطة كانت صحيحة، لكن التنفيذ كان خاطئًا.
  
  العملية الحسابية الصحيحة هي `price + (price * tax)` أو `price * (1 + tax)`.
  
  التصحيح هو: `let finalPrice = price + (price * tax);`.