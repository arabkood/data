type: "quiz"
lang: "javascript"
question: |
  بالنظر إلى سيناريو بناء المنزل، ما هي أهم خطوة **أولى** يجب على المبرمج اتخاذها قبل كتابة أي سطر كود؟
options:
  - "اختيار لغة البرمجة"
  - "كتابة الكود بأسرع ما يمكن"
  - "فهم المشكلة ووضع خطة واضحة"
  - "شراء حاسوب جديد"
solution: 2
explanation: |
  تمامًا مثل المهندس المعماري الذي يرسم المخططات أولاً، يجب على المبرمج أن يفهم المشكلة بعمق ويضع خطة (أو `:algorithm`) لحلها. هذه هي أهم خطوة لضمان نجاح المشروع.