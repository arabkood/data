type: "quiz"
lang: "javascript"
question: |
  أكمل الكود لإنشاء رسالة ترحيب. استخدم التفكيك لاستخراج `name` و `age`، ثم استخدم `:template literal` لإنشاء الرسالة المطلوبة.
code: |
  const person = { name: "خالد", age: 28 };
  const { name, age } = person;
  const greeting = __@@INPUT@@__;
  // يجب أن يكون الناتج: "مرحباً خالد، عمرك 28 عاماً."
options:
  - "`'مرحباً ' + name + '، عمرك ' + age + ' عاماً.'`"
  - "`مرحباً ${name}، عمرك ${age} عاماً.`"
  - "``مرحباً ${name}، عمرك ${age} عاماً.``"
  - "`f'مرحباً {name}، عمرك {age} عاماً.'`"
solution: 2
explanation: |
  أولاً، نستخدم `const { name, age } = person;` لاستخراج الخصائص. ثانياً، نستخدم الفاصلة العلوية المائلة `` `` مع `${...}` لإدراج المتغيرات في النص، مما يجمع بين المفهومين بشكل فعال.