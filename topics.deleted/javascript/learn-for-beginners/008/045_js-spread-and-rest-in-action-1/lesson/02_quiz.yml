type: "quiz"
lang: "javascript"
question: |
  لدينا مصفوفتان. ما هو الناتج المتوقع عند دمجهم باستخدام `...` ؟
code: |
  const fruits = ['🍎', '🍌'];
  const moreFruits = ['🍓', '🍇'];

  const allFruits = [...fruits, ...moreFruits];
  console.log(allFruits);
options:
  - "`['🍎', '🍌']`"
  - "`[['🍎', '🍌'], ['🍓', '🍇']]`"
  - "`['🍎', '🍌', '🍓', '🍇']`"
  - "`'🍎,🍌,🍓,🍇'`"
solution: 2
explanation: |
  عامل التفريق (`:spread syntax`) `...` يقوم بـ 'نشر' عناصر كل `:array` داخل الـ`:array` الجديدة، مما يؤدي إلى دمجهم في `:array` واحدة مسطحة.