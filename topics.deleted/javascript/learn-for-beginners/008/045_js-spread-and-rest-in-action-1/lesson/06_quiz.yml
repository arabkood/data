type: "quiz"
lang: "javascript"
question: |
  نريد إنشاء `:function` تأخذ أول وسيط كعنوان، وتجمع كل الوسائط المتبقية في `:array` تسمى `items`. ما هو التعديل الصحيح للكود؟
code: |
  function createList(title, __@@INPUT@@__) {
    console.log(`العنوان: ${title}`);
    console.log(`العناصر: ${items.join(', ')}`);
  }

  createList('مشتريات', 'خبز', 'حليب', 'جبن');
options:
  - "`items...`"
  - "`...items`"
  - "`*items`"
  - "`&items`"
solution: 1
explanation: |
  معامل الراحة (`:rest parameter`) `...items` يجب أن يكون آخر معامل في قائمة معاملات الـ`:function`. يقوم بجمع كل الوسائط المتبقية ('خبز', 'حليب', 'جبن') في `:array` واحدة اسمها `items`.