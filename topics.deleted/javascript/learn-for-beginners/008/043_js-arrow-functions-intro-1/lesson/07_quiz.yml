type: "quiz"
lang: "javascript"
question: |
  الكود التالي لا يعمل كما هو متوقع، فهو لا يُرجع ناتج الجمع. ما هو التعديل الصحيح؟
code: |
  const add = (a, b) => {
    a + b;
  };
  console.log(add(5, 3));
options:
  - "إزالة الأقواس المعقوفة `{}`"
  - "تغيير `=>` إلى `:function`"
  - "إضافة كلمة `:return` قبل `a + b`"
  - "لا يوجد خطأ في الكود"
solution: 2
explanation: |
  عند استخدام الأقواس المعقوفة `{}` في دالة السهم، يجب استخدام الكلمة المفتاحية `:return` بشكل صريح لإرجاع قيمة. الإرجاع الضمني يعمل فقط عند عدم استخدام الأقواس المعقوفة.