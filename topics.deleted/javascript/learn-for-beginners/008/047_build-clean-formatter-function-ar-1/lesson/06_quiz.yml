type: "quiz"
lang: "javascript"
question: |
  الدالة الحالية تعمل بشكل جيد، لكن ماذا لو كان الإدخال فارغًا (`""`)؟ ستتسبب بمشكلة. ما هو التعديل الصحيح لجعل الدالة أكثر أمانًا؟
code: |
  function formatName(name) {
    // أضف الحماية هنا
    const trimmed = name.trim();
    if (trimmed.length === 0) return ""; // ماذا لو كان الإدخال فارغًا؟

    const first = trimmed.charAt(0).toUpperCase();
    const rest = trimmed.slice(1).toLowerCase();
    return first + rest;
  }
options:
  - "الكود صحيح ولا يحتاج تعديل"
  - "يجب التحقق من `name` قبل `trim`"
  - "يجب إزالة التحقق من الطول"
  - "يجب استخدام `try...catch`"
solution: 1
explanation: |
  من أفضل الممارسات التحقق من الإدخال أولاً. إذا كان `:variable` `name` قد يكون `null` أو `undefined`، فإن استدعاء `:trim()` عليه سيؤدي إلى خطأ. أفضل حماية هي التحقق `if (!name) return "";` في بداية الدالة.