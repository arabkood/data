type: "quiz"
lang: "javascript"
question: |
  باستخدام كل ما تعلمته، ما هو الناتج النهائي لهذا الكود؟
code: |
  let hasPremium = false;
  let userName = "نورة";
  let welcomeMessage = "";

  if (hasPremium) {
    welcomeMessage = `أهلاً بعودتك، ${userName}! نورتِ حسابك المميز.`;
  } else {
    welcomeMessage = `مرحباً بك يا ${userName}!`;
  }

  console.log(welcomeMessage);
options:
  - "`أهلاً بعودتك، نورة! نورتِ حسابك المميز.`"
  - "`مرحباً بك يا نورة!`"
  - "لا شيء سيتم طباعته"
  - "سيحدث خطأ بسبب `:template literals`"
solution: 1
explanation: |
  بما أن `hasPremium` قيمته `false`، يتم تنفيذ الكود داخل كتلة `:else`. يتم استخدام `:template literals` لإنشاء رسالة ترحيب مخصصة للمستخدم `نورة`.