type: "quiz"
lang: "javascript"
question: |
  للبدء، نحتاج إلى عد تنازلي. أكمل الكود التالي ليبدأ العد من 3 إلى 1.
code: |
  for (let i = 3; __@@INPUT@@__; i--) {
    console.log(i);
  }
  console.log("انطلاق!");
options:
  - "i < 0"
  - "i > 0"
  - "i === 1"
  - "i = 0"
solution: 1
explanation: |
  نحتاج أن تستمر الحلقة التكرارية (`:for loop`) طالما أن قيمة العداد `i` أكبر من 0. عندما تصل `i` إلى 0، يتوقف الشرط `i > 0` وتتوقف الحلقة.