type: "quiz"
lang: "javascript"
question: |
  رائع! لقد تم إصلاح كل الأخطاء. ما هو الناتج النهائي الذي سيتم طباعته على الشاشة عند تشغيل هذا الكود الكامل؟
code: |
  let countdown = 3;
  const fuel = 95;
  
  if (fuel >= 90) {
    while (countdown > 0) {
      console.log(countdown);
      countdown--;
    }
    console.log("انطلاق!");
  } else {
    console.log("وقود غير كافٍ.");
  }
options:
  - |-
    `3`
    `2`
    `1`
    `انطلاق!`
  - "`وقود غير كافٍ.`"
  - |-
    `3`
    `2`
    `1`
  - "`انطلاق!`"
solution: 0
explanation: |
  أولاً، يتم التحقق من الشرط `fuel >= 90` وهو صحيح. بعد ذلك، تبدأ حلقة `:while` وتطبع العد التنازلي `3`, `2`, `1`. وأخيراً، بعد انتهاء الحلقة، يتم طباعة `انطلاق!`.