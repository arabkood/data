type: "quiz"
lang: "javascript"
question: |
  تحلل جافاسكريبت العمليات الحسابية بترتيب معين. ما هو الناتج النهائي الذي سيتم طباعته في الـ:terminal: بعد تنفيذ هذا الكود؟
code: |
  let baseScore = 50;
  let levelBonus = 10 * 5;
  let finalScore = baseScore + levelBonus;
  console.log(finalScore);
options:
  - "`65`"
  - "`250`"
  - "`100`"
  - "`baseScore + levelBonus`"
solution: 2
explanation: |
  تقوم جافاسكريبت بتنفيذ عملية الضرب (`*`) قبل الجمع (`+`). لذلك، يتم حساب `10 * 5` أولاً (الناتج `50`)، ثم يتم جمعه مع `baseScore` (الناتج `50`) لتكون النتيجة النهائية `100`. هذا المفهوم يسمى `:operator precedence:.`