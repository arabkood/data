type: "quiz"
lang: "javascript"
question: |
  في أي سيناريو يكون استخدام جملة `:switch` أفضل من سلسلة `:if`/`:else if`؟
options:
  - "عند التحقق من نطاقات أرقام (مثلاً: أكبر من 90)"
  - "عند مقارنة متغير واحد بعدة قيم ثابتة ومحددة (مثلاً: 'أ', 'ب', 'ج')"
  - "عند التحقق من شرطين مختلفين تمامًا (مثلاً: العمر والجنسية)"
  - "لا يوجد فرق، كلاهما يؤدي نفس الوظيفة دائمًا"
solution: 1
explanation: |
  تتفوق جملة `:switch` في الوضوح والتنظيم عندما تعتمد جميع الشروط على مقارنة متغير واحد بقيم منفصلة وثابتة (مثل أرقام أو نصوص). أما `:if`/`:else if` فهي أكثر مرونة للتعامل مع نطاقات أو شروط معقدة ومتنوعة.