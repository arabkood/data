type: "quiz"
lang: "javascript"
question: |
  لنتذكر معًا، ما هو ناتج تنفيذ الكود التالي؟
code: |
  let grade = 85;
  let result = "";
  if (grade > 50) {
    result = "ناجح";
  } else {
    result = "راسب";
  }
  console.log(result);
options:
  - "`راسب`"
  - "`ناجح`"
  - "`85`"
  - "`undefined`"
solution: 1
explanation: |
  بما أن قيمة المتغير `:grade` هي `85`، وهي أكبر من `50`، فإن الشرط في جملة `:if` يتحقق، ويتم إسناد القيمة "ناجح" إلى المتغير `:result`.