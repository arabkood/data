type: "quiz"
lang: "javascript"
question: |
  بناءً على ما تعرفه عن تصفح الإنترنت، ما هو الدور الرئيسي الذي تلعبه لغة `:javascript` في صفحات الويب؟
options:
  - "تحديد بنية وهيكل الصفحة (مثل العناوين والفقرات)"
  - "إضافة التفاعل والحركة للموقع (مثل النوافذ المنبثقة والرسوم المتحركة)"
  - "تخزين بيانات المستخدم بشكل دائم على الخادم"
  - "تصميم شكل الصفحة وألوانها (مثل لون الخلفية وحجم الخط)"
solution: 1
explanation: |
  لغة `:javascript` هي المسؤولة عن جعل صفحات الويب تفاعلية وديناميكية. بينما تُستخدم `HTML` للبنية و `CSS` للتصميم، تُضيف `:javascript` "الحياة" إلى الصفحة.