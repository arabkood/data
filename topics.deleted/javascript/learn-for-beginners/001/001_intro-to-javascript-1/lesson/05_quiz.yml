type: "quiz"
lang: "javascript"
question: |
  أي من الخيارات التالية يصف بشكل صحيح ما تفعله `:javascript`؟
options:
  - "تعمل فقط على الخوادم (servers) ولا يمكن للمستخدم رؤيتها."
  - "هي لغة لتصميم قواعد البيانات."
  - "تُنفذ في متصفح المستخدم لجعل الصفحات تفاعلية."
  - "هي نسخة أخرى من لغة Java."
solution: 2
explanation: |
  السمة الأساسية لـ `:javascript` هي أنها لغة برمجة نصية من جانب العميل (client-side)، مما يعني أنها تعمل بشكل أساسي في متصفح الويب الخاص بالمستخدم لإدارة سلوك صفحة الويب.