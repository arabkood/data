type: "quiz"
lang: "javascript"
question: |
  بالنظر إلى الكود السابق، ما هي المشكلة الرئيسية في تكرار منطق حساب المساحة؟
options:
  - "الكود لا يعمل بشكل صحيح."
  - "استخدام الكثير من المتغيرات (`:variable`)."
  - "صعوبة التعديل والصيانة، ف أي تغيير يجب أن يتم في أماكن متعددة."
  - "الكود سيصبح بطيئًا جدًا."
solution: 2
explanation: |
  المشكلة الكبرى في تكرار الكود هي الصيانة. إذا اكتشفت خطأ أو أردت تحسين طريقة الحساب، ستحتاج إلى العثور على كل نسخة من الكود وتعديلها، مما يزيد من احتمالية حدوث أخطاء جديدة.