type: "quiz"
lang: "javascript"
question: |
  الكود التالي يهدف إلى إضافة عنصر إلى `:array`، ولكنه يُنتج خطأ. ما هو التفسير الصحيح للمشكلة؟
code: |
  const cart = ["تفاح"];
  cart = cart.push("موز"); // هذا السطر خاطئ
  console.log(cart);
solution: 1
options:
  - "لا يمكن استخدام `:const` لتعديل `:array`."
  - "دالة `:push` تُرجع طول الـ `:array` الجديد (وهو `:number`)، وليس الـ `:array` نفسه."
  - "يجب استدعاء `:push` في سطر منفصل عن `console.log`."
  - "الـ `:array` ممتلئ ولا يمكن إضافة المزيد من العناصر."
explanation: |
  هذه مشكلة شائعة! دالة `:push` تعدل الـ `:array` الأصلي مباشرة، ولكنها تُرجع قيمة من نوع `:number` (الطول الجديد). السطر الخاطئ يحاول إسناد هذا الرقم (2) إلى المتغير `cart` الذي تم تعريفه كـ `:const`، مما يسبب خطأ. التصحيح هو استدعاء `cart.push("موز")` بدون إعادة الإسناد.