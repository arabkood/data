type: "quiz"
lang: "javascript"
question: |
  الآن، نريد حذف آخر عنصر من قائمة المهام. أكمل الكود باستخدام الـ `:method` الصحيح.
code: |
  let tasks = ["دراسة", "تمرين", "قراءة"];
  tasks.__@@INPUT@@__();
  // المطلوب: tasks تصبح ["دراسة", "تمرين"]
solution: 1
options:
  - ".push()"
  - ".pop()"
  - ".length"
  - ".remove()"
explanation: |
  الـ `:method` المسمى `:pop` يُستخدم خصيصًا لحذف **آخر عنصر** من الـ `:array`.