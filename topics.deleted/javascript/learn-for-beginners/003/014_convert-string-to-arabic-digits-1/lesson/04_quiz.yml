type: "quiz"
lang: "javascript"
question: |
  الكود التالي يحتوي على حلقة `:for` للمرور على كل حرف. أكمل الجزء الناقص لاستبدال الرقم بنظيره العربي من الخريطة.
code: |
  const arabicDigitsMap = { '0': '٠', '1': '١', '2': '٢' }; // مثال مختصر
  let input = "12";
  let output = "";
  for (let char of input) {
    // إذا كان الحرف موجودًا في الخريطة، أضف مقابله العربي
    // وإلا، أضف الحرف الأصلي
    output += __@@INPUT@@__;
  }
  console.log(output);
options:
  - "arabicDigitsMap[char] || char"
  - "arabicDigitsMap[char]"
  - "char"
  - "arabicDigitsMap.char"
solution: 0
explanation: |
  التعبير `arabicDigitsMap[char] || char` هو الطريقة المثلى. 
  - إذا كان `char` مفتاحًا في `arabicDigitsMap` (مثل '1')، فسيُرجع القيمة المقابلة ('١').
  - إذا لم يكن موجودًا (مثل حرف 'a')، ستكون النتيجة `:undefined`، ويقوم المعامل `||` (OR) بإرجاع القيمة الثانية، وهي `char` نفسه.