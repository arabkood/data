type: "quiz"
lang: "javascript"
question: |
  أي معامل منطقي يُستخدم عادةً لتعيين قيمة افتراضية إذا كانت القيمة الأولى "falsy" (مثل `:undefined`)؟
options:
  - "`&&` (AND)"
  - "`||` (OR)"
  - "`===` (Strict Equality)"
  - "`!=` (Inequality)"
solution: 1
explanation: |
  معامل OR المنطقي (`||`) يُرجع القيمة على يمينه إذا كانت القيمة على يساره "falsy" (ومنها `:undefined`, `null`, `0`, `false`). هذا يجعله مثاليًا لتعيين قيم افتراضية.