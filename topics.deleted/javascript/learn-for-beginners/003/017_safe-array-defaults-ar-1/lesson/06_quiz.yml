type: "quiz"
lang: "javascript"
question: |
  نريد عرض اسم المستخدم من مصفوفة. إذا لم يكن المستخدم الثالث موجودًا، يجب عرض كلمة "زائر".
  
  أكمل الكود لتحقيق ذلك.
code: |
  const users = ["أحمد", "سارة"];
  const currentUser = users[2] __@@INPUT@@__ "زائر";
  console.log(currentUser);
options:
  - "`+`"
  - "`&&`"
  - "`||`"
  - "`=`"
solution: 2
explanation: |
  نستخدم معامل `||` للتحقق من `users[2]`. بما أن قيمته `:undefined`، يتم إرجاع القيمة الافتراضية "زائر" وتخزينها في `:variable` المسمى `currentUser`.