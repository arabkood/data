question: |
  باستخدام ما تعلمته عن `:map`، أكمل الكود لتحويل قائمة الأسعار بإضافة الضريبة.
code: |
  const prices = [10, 50, 100];
  const pricesWithTax = prices.map(function(price) {
    return price * __@@INPUT@@__;
  });
options:
  - "`1.15`"
  - "`prices`"
  - "`tax`"
  - "`15`"
solution: 0
explanation: |
  لإضافة ضريبة 15%، نحتاج إلى ضرب كل سعر في `1.15`. الدالة `:map` ستطبق هذه العملية على كل عنصر في `:array` `prices`.