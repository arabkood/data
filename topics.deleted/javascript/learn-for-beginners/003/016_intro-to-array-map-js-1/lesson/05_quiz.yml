type: "quiz"
lang: "javascript"
question: |
  ما ناتج تنفيذ الكود التالي؟
code: |
  const names = ["أحمد", "سارة", "علي"];
  const greetings = names.map(function(name) {
    return "مرحباً, " + name;
  });
  console.log(greetings[1]);
options:
  - "`مرحباً, أحمد`"
  - "`مرحباً, سارة`"
  - "`name`"
  - "`undefined`"
solution: 1
explanation: |
  الدالة `:map` أنشأت مصفوفة `greetings` جديدة تحتوي على `["مرحباً, أحمد", "مرحباً, سارة", "مرحباً, علي"]`. العنصر في الفهرس `1` هو `"مرحباً, سارة"`.