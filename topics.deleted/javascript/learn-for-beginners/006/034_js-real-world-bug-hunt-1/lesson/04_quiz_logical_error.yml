type: "quiz"
lang: "javascript"
question: |
  هذه `:function` يجب أن تعيد `true` إذا كان عمر المستخدم 18 عامًا أو أكبر. لكنها لا تعمل بشكل صحيح لمن هم في عمر 18 بالضبط. ما هو الخطأ المنطقي هنا؟
code: |
  function isAdult(age) {
    if (age > 18) {
      return true;
    } else {
      return false;
    }
  }
  // console.log(isAdult(18)) -> returns false
options:
  - "يجب استخدام `age == 18`"
  - "الشرط يجب أن يكون `age >= 18`"
  - "يجب حذف كتلة `else`"
  - "يجب أن تعود `:function` بـ `:string`"
solution: 1
explanation: |
  هذا `:logical error` شائع. الشرط `age > 18` يعني 'فقط إذا كان العمر أكبر تمامًا من 18'. هذا يستثني عمر 18 نفسه. لتضمين عمر 18، يجب أن نستخدم معامل 'أكبر من أو يساوي' (`>=`). هذا يضمن أن الشرط يتحقق لكل من هو بعمر 18 عامًا أو أكبر.
