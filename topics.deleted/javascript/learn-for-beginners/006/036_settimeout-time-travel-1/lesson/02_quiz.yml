type: "quiz"
lang: "javascript"
question: |
  في `:javascript`، نستخدم `:setTimeout` لتأجيل تنفيذ `:function`. الوقت يُعطى بالمللي ثانية (1000 مللي ثانية = 1 ثانية).

  أكمل الكود التالي لطباعة رسالة بعد 3 ثوانٍ.
code: |
  setTimeout(function() {
    console.log("مرحباً بعد 3 ثوانٍ!");
  }, __@@INPUT@@__);
options:
  - "`3`"
  - "`3s`"
  - "`3000`"
  - "`'ثلاثة آلاف'`"
solution: 2
explanation: |
  الدالة `:setTimeout` تتوقع أن يكون الوسيط الثاني هو عدد المللي ثانية. لتأخير الكود لمدة 3 ثوانٍ، يجب أن نمرر القيمة `3000`.