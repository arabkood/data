type: "quiz"
lang: "javascript"
question: |
  بناءً على ما تعلمته عن أن `:setTimeout` لا توقف الكود، ما هو الناتج الذي سيتم طباعته في الـ `:console` عند تشغيل هذا الكود؟
code: |
  console.log("البداية");

  setTimeout(function() {
    console.log("رسالة مؤجلة");
  }, 0);

  console.log("النهاية");
options:
  - "`البداية` ثم `رسالة مؤجلة` ثم `النهاية`"
  - "`البداية` ثم `النهاية` ثم `رسالة مؤجلة`"
  - "`رسالة مؤجلة` ثم `البداية` ثم `النهاية`"
  - "سيحدث خطأ لأن الوقت هو `0`"
solution: 1
explanation: |
  مذهل! حتى مع تأخير قدره `0` مللي ثانية، يقوم `:javascript` بوضع `:function` الخاصة بـ `:setTimeout` في قائمة انتظار المهام لتنفيذها لاحقًا. لذلك، يتم تنفيذ كل الأكواد المتزامنة الأخرى (مثل `console.log("النهاية")`) أولاً، ثم يتم تنفيذ `:function` المؤجلة.