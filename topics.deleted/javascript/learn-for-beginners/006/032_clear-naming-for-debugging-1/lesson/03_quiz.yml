type: "quiz"
lang: "javascript"
question: |
  أي من الخيارات التالية هو أفضل اسم لـ `:variable` يخزن عمر المستخدم؟
options:
  - "`u`"
  - "`age`"
  - "`userAge`"
  - "`data`"
solution: 2
explanation: |
  الاسم `userAge` هو الأكثر وضوحاً ودقة. إنه يصف محتوى `:variable` (`age`) وسياقه (`user`). الوضوح يمنع الأخطاء ويجعل الكود قابلاً للصيانة.
