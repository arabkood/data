type: "quiz"
lang: "javascript"
question: |
  هناك `:ReferenceError` في هذا الكود بسبب خطأ إملائي. أي من الخيارات التالية يصحح الكود ليعمل؟
code: |
  let itemsCount = 10; // تم التعريف هنا
  let pricePerItem = 5;
  
  // السطر التالي به خطأ
  let totalCost = itemCount * pricePerItem;
  
  console.log(totalCost);
options:
  - "تغيير `itemCount` إلى `itemsCount` في السطر الرابع"
  - "تغيير `totalCost` إلى `total`"
  - "تغيير `itemsCount` إلى `itemCount` في السطر الأول"
  - "حذف السطر الرابع بأكمله"
solution: 0
explanation: |
  الخطأ هو `:ReferenceError` لأن `:variable` `itemCount` (بدون `s`) غير معرّف. `:variable` الصحيح الذي تم تعريفه في السطر الأول هو `itemsCount` (مع `s`). تصحيح الخطأ الإملائي يحل المشكلة، مما يوضح أهمية الدقة في التسمية والهجاء.
