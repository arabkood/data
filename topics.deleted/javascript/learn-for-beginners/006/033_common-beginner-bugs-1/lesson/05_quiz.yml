type: "quiz"
lang: "javascript"
question: |
  الكود التالي ينتج عنه '205' بدلاً من '25'. ما هو التعديل الصحيح للحصول على عملية جمع حسابية؟
code: |
  let score = "20";
  let total = score + 5;
options:
  - "تغيير `let` إلى `:const`"
  - "حذف علامتي الاقتباس حول `20`"
  - "وضع `5` بين علامتي اقتباس"
  - "إضافة فاصلة منقوطة في النهاية"
solution: 1
explanation: |
  حدث هنا `:TypeError` ضمني. عندما تجمع `:string` مع `:number`، تقوم جافاسكريبت بدمجهما كنصوص. لإجراء عملية جمع حسابية، يجب أن يكون كلا الطرفين من نوع `:number`. إزالة علامات الاقتباس تحول `"20"` إلى `20`.