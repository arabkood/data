type: "quiz"
lang: "javascript"
question: |
  أمامك مهمة لطباعة رسالة ترحيب. أي تعديل من الخيارات التالية هو **أول** تعديل يجب القيام به لتشغيل الكود بنجاح؟
code: |
  const GREETING = "أهلاً بك يا";
  let user = "مريم"

  GREETING = "مرحباً بك يا";
  console.log(userMessage);
options:
  - "تعريف `:variable` `userMessage` قبل استخدامه"
  - "حذف السطر الذي يعيد إسناد قيمة لـ `GREETING`"
  - "تغيير `let user` إلى `const user`"
  - "إضافة فاصلة منقوطة بعد `let user`"
solution: 1
explanation: |
  الكود سيُطلق خطأ `:TypeError` أولاً عند محاولة إعادة إسناد قيمة لثابت (`:const`). لا يمكنك تغيير قيمة `:variable` تم تعريفه باستخدام `:const`. بعد حل هذه المشكلة، ستواجه `:ReferenceError` لأن `userMessage` غير مُعرَّف.