type: "quiz"
lang: "javascript"
question: |
  هذا الـ`:object` يحتوي على `:property` اسمها `"first name"`. أي من الخيارات التالية يصل إلى قيمتها بشكل صحيح؟
code: |
  const student = {
    "first name": "سارة",
    score: 95
  };
options:
  - "`student.first name`"
  - "`student["first name"]`"
  - "`student.firstName`"
  - "`student("first name")`"
solution: 1
explanation: |
  تدوين النقطة لا يعمل مع الأسماء التي تحتوي على مسافات أو رموز خاصة. هنا يأتي دور تدوين الأقواس `[]`، حيث نضع اسم الـ`:property` كـ`:string` داخل الأقواس.