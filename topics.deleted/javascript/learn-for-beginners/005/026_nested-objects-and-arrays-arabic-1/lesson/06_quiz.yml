type: "quiz"
lang: "javascript"
question: |
  أكمل الكود للحصول على سعر المنتج الثاني (الشاشة).
code: |
  const products = [
    { name: "لابتوب", price: 4000 },
    { name: "شاشة", price: 1500 },
    { name: "فأرة", price: 100 }
  ];

  const screenPrice = products[1].__@@INPUT@@__;

  console.log(screenPrice); // يجب أن يطبع 1500
options:
  - "name"
  - "price"
  - "[price]"
  - "1"
solution: 1
explanation: |
  `products[1]` يعطينا الـ`:object` الثاني: `{ name: "شاشة", price: 1500 }`.
  للحصول على السعر من هذا الـ`:object`، نستخدم `.price`.