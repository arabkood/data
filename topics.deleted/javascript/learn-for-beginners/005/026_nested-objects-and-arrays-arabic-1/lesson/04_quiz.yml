type: "quiz"
lang: "javascript"
question: |
  ما ناتج تنفيذ الكود التالي للوصول إلى أول طالب في دورة البرمجة؟
code: |
  const course = {
    title: "مقدمة في البرمجة",
    students: ["أحمد", "فاطمة", "يوسف"]
  };

  console.log(course.students[0]);
options:
  - "`فاطمة`"
  - "`أحمد`"
  - "`:undefined`"
  - "سيحدث خطأ"
solution: 1
explanation: |
  أولاً، نصل إلى `:array` الطلاب باستخدام `course.students`.
  ثانياً، نصل إلى العنصر الأول في هذا الـ`:array` باستخدام `:index` رقم `0`، فتكون النتيجة `"أحمد"`.