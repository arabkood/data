type: "quiz"
lang: "javascript"
question: |
  لدينا بيانات مستخدم مع قائمة منشوراته. ما هو التعديل الصحيح للحصول على عنوان المنشور الأول؟
code: |
  const userProfile = {
    username: "sara",
    posts: [
      { title: "رحلتي إلى الصحراء", likes: 50 },
      { title: "نصائح في البرمجة", likes: 120 }
    ]
  };

  // let firstPostTitle = userProfile.posts.title;
  let firstPostTitle = ?;
options:
  - "`userProfile.posts[0].title`"
  - "`userProfile.posts.title[0]`"
  - "`userProfile[0].posts.title`"
  - "`userProfile.posts[1].title`"
solution: 0
explanation: |
  الكود الصحيح هو `userProfile.posts[0].title`.
  `userProfile.posts` يصل إلى `:array` المنشورات.
  `[0]` يختار الـ`:object` الأول في الـ`:array`.
  `.title` يصل إلى قيمة `:property` العنوان في ذلك الـ`:object`.