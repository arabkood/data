type: "quiz"
lang: "javascript"
question: |
  نريد الحصول على عمر المستخدم من الكائن التالي. أي من الخيارات هو الصواب؟
code: |
  const user = {
    name: "علي",
    age: 30
  };
  // كيف تحصل على قيمة العمر؟
options:
  - "`user[age]`"
  - "`user.age`"
  - "`user[1]`"
  - "`user.getAge()`"
solution: 1
explanation: |
  للوصول إلى قيمة `:property` في `:object`، نستخدم اسمها بعد نقطة (`.`) أو كـ `:string` داخل الأقواس `[]`. الخيار `user.age` هو الطريقة الأكثر شيوعًا.