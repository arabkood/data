type: "quiz"
lang: "javascript"
question: |
  باستخدام الكود الكامل أدناه، ما هو ناتج استدعاء `findByTag('work')`؟
code: |
  const contacts = [
    { name: 'علياء', phone: '111', tags: ['work', 'client'] },
    { name: 'بدر', phone: '222', tags: ['family'] },
    { name: 'سامي', phone: '333', tags: ['work', 'friend'] }
  ];

  function findByTag(tag) {
    return contacts.filter(c => c.tags.includes(tag));
  }

  console.log(findByTag('work'));
options:
  - "`[{ name: 'علياء', ... }, { name: 'سامي', ... }]`"
  - "`[{ name: 'بدر', ... }]`"
  - "`'work'`"
  - "`[]` (مصفوفة فارغة)"
solution: 0
explanation: |
  الـ `:function` ستقوم بتصفية الـ `:array` `contacts` وإعادة `:array` جديدة تحتوي فقط على جهات الاتصال التي تملك الوسم 'work'، وهما علياء وسامي.