type: "quiz"
lang: "javascript"
question: |
  نريد إنشاء "مصنع دوال" (`:function factory`) يصنع دوال تحية مخصصة. أكمل الكود الناقص ليعمل بشكل صحيح.
code: |
  function createGreeter(greeting) {
    return function(name) {
      // ما الذي يجب أن يُعاد هنا؟
      __@@INPUT@@__;
    };
  }

  const sayHello = createGreeter("أهلاً");
  console.log(sayHello("سارة")); // يجب أن يطبع "أهلاً سارة"
solution: 3
options:
  - "`return greeting + name`"
  - "`return 'أهلاً ' + name`"
  - "`console.log(greeting + ' ' + name)`"
  - "`return greeting + ' ' + name`"
explanation: |
  الدالة الداخلية (الـ`:closure`) لديها وصول للمتغير `greeting` من نطاقها الخارجي. يجب أن تعيد (`:return`) السلسلة النصية المدمجة التي تجمع بين `greeting` و `name`.