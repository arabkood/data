type: "quiz"
lang: "javascript"
question: |
  هذا تحدٍ كلاسيكي يتعلق بالـ`:closure` والحلقات التكرارية (`:loops`). ما الذي سيتم طباعته في الطرفية (`:console`) عند تنفيذ هذا الكود؟
code: |
  for (var i = 1; i <= 3; i++) {
    setTimeout(function() {
      console.log(i);
    }, 10);
  }
solution: 2
options:
  - "`1` `2` `3`"
  - "`undefined` `undefined` `undefined`"
  - "`4` `4` `4`"
  - "`3` `3` `3`"
explanation: |
  بسبب استخدام `:var`، يوجد متغير `i` واحد فقط مشترك بين جميع دورات الحلقة. عندما يتم تنفيذ دوال `:setTimeout` (بعد انتهاء الحلقة)، تكون قيمة `i` قد وصلت إلى `4`. الـ`:closure` هنا تشترك جميعها في نفس البيئة ونفس المتغير `i`.
  لحل هذه المشكلة، يمكن استخدام `let` بدلاً من `:var` لإنشاء نطاق لكل دورة من الحلقة.