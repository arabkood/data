type: "quiz"
lang: "javascript"
question: |
  تحتاج إلى إنشاء `:function` للطرح. أكمل الكود الناقص لتعريف واستخدام `:function` باسم `subtract`.
code: |
  __@@INPUT@@__

  let difference = subtract(50, 20);
  console.log(difference); // يجب أن يطبع 30
options:
  - "`function subtract(a, b) { return a * b; }`"
  - "`let subtract = (a, b) => a - b;`"
  - "`function subtract(a, b) { return a - b; }`"
  - "`function subtract() { return 50 - 20; }`"
solution: 2
explanation: |
  الخيار الصحيح يعرف `:function` باسم `subtract` تأخذ معاملين (`:parameters`) `a` و `b`، وتقوم بإعادة ناتج طرحهما. الخيارات الأخرى إما تستخدم عملية خاطئة أو لا تستخدم الـ `:parameters` بشكل صحيح.