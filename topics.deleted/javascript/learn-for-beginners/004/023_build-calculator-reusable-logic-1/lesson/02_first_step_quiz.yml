type: "quiz"
lang: "javascript"
question: |
  في `:javascript`، ما هي الكلمة المفتاحية الأساسية التي نستخدمها لإنشاء كتلة كود قابلة لإعادة الاستخدام؟
options:
  - "`repeat`"
  - "`:function`"
  - "`block`"
  - "`logic`"
solution: 1
explanation: |
  الكلمة المفتاحية `:function` هي التي تسمح لنا بتعريف كتلة من الكود يمكننا استدعاؤها وتنفيذها عدة مرات.