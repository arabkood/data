type: "quiz"
lang: "javascript"
question: |
  أكمل الكود بحيث تعيد الـ `:function` ضعف العدد المُمرر إليها.
code: |
  function double(number) {
    __@@INPUT@@__ number * 2;
  }
options:
  - "`console.log`"
  - "`let result =`"
  - "`return`"
  - "`var`"
solution: 2
explanation: |
  نستخدم الكلمة المفتاحية `:return` لإعادة قيمة من الـ `:function`. بدونها، ستنفذ الـ `:function` العملية الحسابية ولكن لن تعيد أي نتيجة قابلة للاستخدام خارجها.