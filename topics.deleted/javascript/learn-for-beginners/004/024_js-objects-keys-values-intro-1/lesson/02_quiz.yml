type: "quiz"
lang: "javascript"
question: |
  أي من الخيارات التالية يُستخدم لإنشاء `:object` فارغ في `:javascript`؟
options:
  - "`[]`"
  - "`{}`"
  - "`()`"
  - "`''`"
solution: 1
explanation: |
  يتم استخدام الأقواس المتعرجة `{}` لإنشاء `:object`. بينما تُستخدم الأقواس المربعة `[]` لإنشاء `:array`.