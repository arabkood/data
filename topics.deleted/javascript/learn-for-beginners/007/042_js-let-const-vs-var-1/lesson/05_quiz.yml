type: "quiz"
lang: "javascript"
question: |
  أنت تبني لعبة. أي كلمة مفتاحية هي الأنسب لتخزين اسم اللاعب (الذي لا يتغير) وأي كلمة مفتاحية هي الأنسب لنتيجة اللاعب (التي تتغير باستمرار)؟
options:
  - "استخدام `:let` لاسم اللاعب و `:const` للنتيجة"
  - "استخدام `:const` لاسم اللاعب و `:let` للنتيجة"
  - "استخدام `:let` لكليهما"
  - "استخدام `:const` لكليهما"
solution: 1
explanation: |
  اسم اللاعب ثابت طوال اللعبة، لذا `:const` هو الخيار الأمثل. نتيجة اللاعب تتغير، لذا `:let` هو الخيار الصحيح.