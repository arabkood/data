type: "quiz"
lang: "javascript"
question: |
  محاولة تغيير قيمة `:const` تؤدي إلى خطأ. ما هو نوع الخطأ الذي سيظهر؟
code: |
  const birthYear = 2005;
  birthYear = 2006; // محاولة تغيير القيمة
options:
  - "`:SyntaxError`"
  - "`:ReferenceError`"
  - "`:TypeError`"
  - "لن يحدث أي خطأ"
solution: 2
explanation: |
  عندما نحاول إعادة إسناد قيمة جديدة لـ `:variable` تم تعريفه باستخدام `:const`، تحدث جافاسكريبت خطأ من نوع `:TypeError`، لأن الثوابت لا يمكن تغيير قيمتها.