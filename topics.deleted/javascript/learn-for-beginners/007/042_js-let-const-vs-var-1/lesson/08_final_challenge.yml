type: "quiz"
lang: "javascript"
question: |
  الكود التالي يحتوي على أخطاء في استخدام المتغيرات. ما هو أول تعديل صحيح يجب القيام به لجعل الكود يعمل كما هو متوقع؟
code: |
  let PI = 3.14;
  var userScore = 0;

  PI = 3.14159; // يجب أن يكون ثابتًا
  userScore = userScore + 10;
options:
  - "تغيير `let PI` إلى `const PI`"
  - "تغيير `var userScore` إلى `const userScore`"
  - "إبقاء `let PI` كما هي"
  - "حذف السطر `PI = 3.14159;`"
solution: 0
explanation: |
  قيمة `PI` هي ثابت رياضي لا يجب أن يتغير. لذا، يجب تعريفه باستخدام `:const` لمنع إعادة إسناد القيمة إليه عن طريق الخطأ. استخدام `:let` هنا غير مناسب دلاليًا. أيضًا، من الأفضل استخدام `:let` بدلًا من `:var` لـ `userScore`.