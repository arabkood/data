type: "quiz"
lang: "javascript"
question: |
  ما هي القيمة النهائية للمتغير `score` التي ستتم طباعتها؟
code: |
  let score = 100;
  score = 150;
  console.log(score);
options:
  - "`100`"
  - "`150`"
  - "`undefined`"
  - "سيحدث خطأ"
solution: 1
explanation: |
  باستخدام الكلمة المفتاحية `:let`، يمكننا تعريف `:variable` وتغيير قيمته لاحقًا. تم تغيير القيمة من `100` إلى `150`.