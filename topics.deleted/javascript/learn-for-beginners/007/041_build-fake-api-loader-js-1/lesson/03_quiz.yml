type: "quiz"
lang: "javascript"
question: |
  ما الذي سيتم طباعته في الـ`:console` بعد تنفيذ هذا الكود؟
code: |
  setTimeout(() => {
    console.log("A");
  }, 0);

  console.log("B");
options:
  - "`A` ثم `B`"
  - "`B` ثم `A`"
  - "`A` فقط"
  - "`B` فقط"
solution: 1
explanation: |
  حتى مع تأخير قدره `0` ميلي ثانية، يقوم `:setTimeout` بجدولة الـ`:callback` ليتم تنفيذه في دورة الأحداث التالية (event loop)، مما يسمح للكود المتزامن (مثل `console.log("B")`) بالتشغيل أولاً.