type: "quiz"
lang: "javascript"
question: |
  بالنظر إلى أن `:setTimeout` تؤخر تنفيذ الكود، ما هو ترتيب الرسائل التي ستتم طباعتها في الطرفية (console)؟
code: |
  console.log("1. البدء");

  setTimeout(() => {
    console.log("2. جلب البيانات...");
  }, 1000); // تأخير لمدة ثانية واحدة

  console.log("3. النهاية");
solution: 1
options:
  - "`1. البدء`، `2. جلب البيانات...`، `3. النهاية`"
  - "`1. البدء`، `3. النهاية`، `2. جلب البيانات...`"
  - "`2. جلب البيانات...`، `1. البدء`، `3. النهاية`"
  - "سيحدث خطأ"
explanation: |
  يعمل `:javascript` بشكل غير متزامن. يبدأ المؤقت `:setTimeout` ثم يواصل تنفيذ الكود التالي فوراً. بعد انتهاء المؤقت، يتم تنفيذ الكود الذي بداخله. هذا يوضح الحاجة إلى طريقة لإدارة ترتيب العمليات غير المتزامنة.