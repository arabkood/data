type: "quiz"
lang: "javascript"
question: |
  ما هو الترتيب الذي ستظهر به الرسائل في الطرفية (console) عند تنفيذ هذا الكود؟
code: |
  console.log("الرسالة الأولى");

  setTimeout(function() {
    console.log("الرسالة الثانية (المؤجلة)");
  }, 0);

  console.log("الرسالة الثالثة");
options:
  - "الأولى، الثانية، الثالثة"
  - "الأولى، الثالثة، الثانية"
  - "الثانية، الأولى، الثالثة"
  - "سيحدث خطأ"
solution: 1
explanation: |
  هذه نقطة مهمة في `:javascript`! حتى مع تأخير قدره `0` مللي ثانية، تقوم `:setTimeout` بجدولة الـ`:callback function` لتُنفذ *بعد* اكتمال الكود المتزامن الحالي. 

  لذلك، يتم طباعة "الرسالة الأولى" و"الرسالة الثالثة" أولاً، ثم تُنفذ الـ`:function` المؤجلة من قائمة المهام.