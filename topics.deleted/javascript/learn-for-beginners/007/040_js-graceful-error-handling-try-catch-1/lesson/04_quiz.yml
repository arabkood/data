question: |
  أكمل الفراغ لوضع الكود الخطير داخل كتلة الحماية المناسبة.
code: |
  __@@INPUT__ {
    let data = JSON.parse("{ 'name': 'بدون علامات اقتباس' }"); // هذا الكود سيسبب خطأ
    console.log(data.name);
  } catch (e) {
    console.log("حدث خطأ في تحليل البيانات.");
  }
solution: 0
options:
  - "`try`"
  - "`catch`"
  - "`if`"
  - "`error`"
explanation: |
  يجب وضع الكود الذي يُحتمل أن يطلق خطأً، مثل `JSON.parse` مع نص غير صالح، داخل كتلة `:try` ليتم "التقاط" الخطأ بواسطة كتلة `:catch`.