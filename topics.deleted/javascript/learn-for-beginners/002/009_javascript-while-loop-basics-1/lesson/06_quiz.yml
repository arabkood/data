type: "quiz"
lang: "javascript"
question: |
  أي خيار يمثل الطريقة الصحيحة لتعريف حلقة `:while` تبدأ العد من 5 وتتوقف عند 10 (شامل)؟
options:
  - "`let i = 5; while(i < 10) { i++; }`"
  - "`let i = 5; while(i <= 10) { i++; }`"
  - "`let i = 5; while(i > 10) { i++; }`"
  - "`let i = 10; while(i >= 5) { i++; }`"
solution: 1
explanation: |
  لشمل الرقم `10` في العد، يجب أن يكون الشرط `i <= 10`. الخيار الأول سيتوقف عند `9`. الخيارات الأخرى تحتوي على شروط منطقية خاطئة لن تعمل كما هو مطلوب.
