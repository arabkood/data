type: "quiz"
lang: "javascript"
question: |
  لدينا `:function` تهدف لطباعة رسالة ترحيب. أكمل الكود المفقود لاستخدام الـ`:parameter` الذي تم تمريره.
code: |
  function welcomeMessage(username) {
    console.log("أهلاً بك، " + __@@INPUT@@__);
  }
  
  welcomeMessage("MonaDev");
options:
  - "`'username'`"
  - "`username`"
  - "`welcomeMessage`"
  - "`MonaDev`"
solution: 1
explanation: |
  يجب استخدام اسم الـ`:parameter` وهو `username` داخل الـ`:function` للوصول إلى القيمة التي تم تمريرها عند استدعاء الدالة (`"MonaDev"`).