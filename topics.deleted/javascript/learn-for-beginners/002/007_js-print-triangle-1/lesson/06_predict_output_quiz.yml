type: "quiz"
lang: "javascript"
question: |
  لقد فهمت المبدأ الأساسي. الآن، ما ناتج تنفيذ هذا الكود المعدل؟
code: |
  for (let i = 5; i > 0; i--) {
    let line = "";
    for (let j = 0; j < i; j++) {
      line += "#";
    }
    console.log(line);
  }
solution: 1
options:
  - "مثلث عادي من `*`"
  - "مثلث مقلوب من `#`"
  - "مربع من `#`"
  - "خطأ برمجي `:error`"
explanation: |
  الـ`:loop` الخارجي هنا تنازلي (من 5 إلى 1)، مما يعني أننا نبدأ بالسطر الأطول أولاً. والـ`:loop` الداخلي يستخدم `#` بدلاً من `*`. النتيجة هي مثلث مقلوب.