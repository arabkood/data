type: "quiz"
lang: "javascript"
question: |
  كيف يمكننا معرفة عدد العناصر الموجودة داخل `:array`؟ الخاصية `.length` تساعدنا في ذلك.

  ما ناتج تنفيذ الكود التالي؟
code: |
  const team = ["أحمد", "سارة", "علي", "فاطمة"];
  console.log(team.length);
options:
  - "`3`"
  - "`4`"
  - "`5`"
  - "`0`"
solution: 1
explanation: |
  الخاصية `.length` تعيد عدد العناصر الإجمالي في الـ `:array`. بما أن لدينا 4 أسماء، فالناتج هو `4`.