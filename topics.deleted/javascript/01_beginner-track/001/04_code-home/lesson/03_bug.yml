type: "bug"
lang: "html"
question: "يوجد خطأ في ملف `HTML` هذا يمنع تحميل ملف `جافاسكريبت`. ابحث عن السطر الذي يحتوي على الخطأ."
code: |
  <html>
    <body>
      <h1>تطبيقي الأول</h1>
      <script scc="script.js"></script>
    </body>
  </html>
solution: 3
explanation: |
  الخاصية المستخدمة لتحديد مصدر ملف السكريبت هي `src`، وليس `scc`. المتصفح لا يفهم `scc`، وبالتالي يفشل في تحميل ملف `script.js`.
hint: "انظر جيداً إلى الخصائص داخل وسم `<script>`. هل اسم الخاصية مكتوب بشكل صحيح؟"
