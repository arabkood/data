type: "quiz"
lang: "javascript"
question: |
  ما هو الغرض الأساسي لدالة `console.log()` في `جافاسكريبت`؟
solution: 2
options:
  - "لحفظ قيمة في متغير."
  - "لعرض النصوص والصور على صفحة الويب."
  - "لطباعة معلومات في الكونسول."
explanation: |
  دالة `console.log()` هي أفضل صديق للمطور. وظيفتها هي "تسجيل" أو طباعة المعلومات في الكونسول.
