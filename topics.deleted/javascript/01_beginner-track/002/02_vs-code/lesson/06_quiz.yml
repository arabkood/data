type: "quiz"
lang: "html"
question: |
  `Visual Studio Code` هو...
solution: 1
options:
  - "متصفح ويب لعرض المواقع"
  - "محرر أكواد لكتابة وتعديل الكود البرمجي"
  - "برنامج لتصميم الصور والرسومات"
explanation: |
  بالضبط! `VS Code` هو `محرر الأكواد` الذي سنستخدمه لكتابة كل أكواد `جافاسكريبت` و `HTML` الخاصة بنا.
