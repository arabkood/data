question: |
  بناءً على ما تعلمته للتو، ما هو الدور الأساسي للغة `جافاسكريبت` في صفحات الويب؟
solution: 0
options:
  - "إضافة التفاعل والديناميكية للمواقع"
  - "تحديد هيكل وترتيب محتوى الصفحة"
  - "تصميم الألوان والخطوط والمظهر العام للصفحة"
explanation: |
  أحسنت! `جافاسكريبت` هي المسؤولة عن جعل المواقع تفاعلية. بينما تُستخدم `HTML` للهيكل و `CSS` للتصميم، فإن `جافاسكريبت` هي التي تضيف "الحياة" والوظائف للصفحة.
