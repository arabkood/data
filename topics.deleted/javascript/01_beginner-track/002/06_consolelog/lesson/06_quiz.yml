type: "quiz"
lang: "javascript"
question: |
  أين ظهر ناتج الأمر `console.log()`؟
solution: 1
options:
  - "على الصفحة البيضاء في المتصفح"
  - "في وحدة تحكم المطور (Developer Console)"
  - "في نافذة منبثقة جديدة"
explanation: |
  ممتاز! الأمر `console.log()` مخصص للمطورين لعرض المخرجات في الكونسول، وهو مكان مثالي لتتبع الأخطاء وفهم ما يحدث خلف الكواليس.
