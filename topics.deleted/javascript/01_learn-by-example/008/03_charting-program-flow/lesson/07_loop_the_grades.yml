type: "quiz"
lang: "javascript"
question: |
  لنتدرب على سيناريو مختلف. لدينا قائمة بدرجات الطلاب. ماذا ستطبع هذه الحلقة التكرارية في الطرفية؟
code: |
  let studentGrades = [95, 88, 45];

  for (let i = 0; i < studentGrades.length; i++) {
    let grade = studentGrades[i];
    if (grade >= 50) {
      console.log("pass");
    } else {
      console.log("fail");
    }
  }
solution: 1
options:
  - "pass\nfail\nfail"
  - "pass\npass\nfail"
  - "pass\npass\npass"
  - "الشفرة ستسبب خطأ."
explanation: |
  تعمل الحلقة التكرارية ثلاث مرات:
  1. قيمة `grade` هي 95. `95 >= 50` صحيحة (true)، لذا تطبع "pass".
  2. قيمة `grade` هي 88. `88 >= 50` صحيحة (true)، لذا تطبع "pass".
  3. قيمة `grade` هي 45. `45 >= 50` خاطئة (false)، لذا تطبع "fail".

