type: "quiz"
lang: "javascript"
question: |
  لدينا كائن لضيفنا عمر.

  **كيف نحصل على اسم مدينته فقط؟**
code: |
  let guest = {
    name: "عمر",
    city: "الدار البيضاء",
    attending: true
  };

  // ما هو الكود الذي يجب وضعه هنا لرؤية المدينة؟
  console.log(@@INPUT@@);
solution: 1
options:
  - "guest"
  - "guest.city"
  - "guest['name']"
  - "city"
explanation: |
  للوصول إلى قيمة خاصية معينة في `كائن`، نستخدم اسم الكائن، متبوعًا بنقطة `.`، ثم اسم الخاصية (`guest.city`).

