type: "quiz"
lang: "javascript"
question: |
  أنت تبني نظام معلومات للطلاب في جامعة بالرياض. `studentID` الخاص بالطالب دائم، لكن **معدله التراكمي (`GPA`)** سيتغير كل فصل دراسي.

  **أي مقطع برمجي يمثل هذا بشكل صحيح؟**
code: |
  // الخيار 1
  let studentID = "S45-123";
  const gpa = 3.8;

  // الخيار 2
  const studentID = "S45-123";
  let gpa = 3.8;

  // الخيار 3
  const studentID = "S45-123";
  const gpa = 3.8;
solution: 1
options:
  - "الخيار 1"
  - "الخيار 2"
  - "الخيار 3"
explanation: |
  `studentID` يجب أن يكون `const` لأنه دائم. أما `gpa` فيجب أن يكون `let` لأنه من المتوقع أن يتغير بمرور الوقت.

