type: "quiz"
lang: "javascript"
question: |
  هيا نختبر معلوماتنا! ما هو نوع البيانات للقيمة `"false"` (مع علامتي الاقتباس)؟
code: |
  // تأمل القيمة أدناه:
  "false"
solution: 0
options:
  - "`سلسلة نصية`"
  - "`رقم`"
  - "`منطقي`"
  - "إنه خطأ"
explanation: |
  لأن القيمة `"false"` محاطة بعلامات اقتباس، فإن الحاسوب يراها كـ `سلسلة نصية`، وليس كقيمة `منطقية` `false`.

