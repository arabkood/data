type: "quiz"
lang: "javascript"
question: |
  انضمت طالبة جديدة، 'فاطمة'، للتو إلى الفصل.

  **ماذا سيكون الناتج النهائي** بعد إضافتها إلى القائمة؟
code: |
  let students = ["Ali", "Hessa"];

  students.push("Fatima");

  console.log(students);
solution: 1
options:
  - '[ "Fatima", "Ali", "Hessa" ]'
  - '[ "Ali", "Hessa", "Fatima" ]'
  - '[ "Ali", "Hessa" ]'
  - "سيحدث خطأ"
explanation: |
  الطريقة `push` تضيف العنصر الجديد دائمًا إلى نهاية المصفوفة، لذلك تظهر 'فاطمة' بعد 'حصة'.

