type: "quiz"
lang: "javascript"
question: |
  لنُضِف شرطًا لـ 'التخرج'.

  أيُّ رمز يضيف كتلة `else if` جديدة بشكل صحيح للتعامل مع مناسبة 'التخرج' برسالة 'مبارك تخرجك!'؟
code: |
  const createGreeting = (name, occasion) => {
    let message;

    if (occasion === 'Ramadan') {
      message = 'Ramadan Kareem!';
    } else if (occasion === 'Eid') {
      message = 'Eid Mubarak!';
    }
    @@INPUT@@

    return `مرحباً ${name}, ${message}`;
  };
solution: 1
options:
  - |
    ```javascript
    else (occasion === 'Graduation') {
      message = 'مبارك تخرجك!';
    }
    ```
  - |
    ```javascript
    else if (occasion === 'Graduation') {
      message = 'مبارك تخرجك!';
    }
    ```
  - |
    ```javascript
    if (occasion === 'Graduation') {
      message = 'مبارك تخرجك!';
    }
    ```
  - |
    ```javascript
    else if {occasion === 'Graduation'}
      message = 'مبارك تخرجك!';
    ```
explanation: |
  لإضافة تحقق آخر بعد `if` أو `else if`، نستخدم الصيغة `else if (condition)`. هذا يُبقي جميع عمليات التحقق مترابطة في كتلة منطقية واحدة.

