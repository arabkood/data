type: "quiz"
lang: "javascript"
question: |
  لنتأكد من فهمنا. ما الذي سيُطبع في الطرفية عند تشغيل هذا الكود؟
code: |
  function getAgeInMonths(years) {
    return years * 12;
  }

  let result = getAgeInMonths(5);

  console.log(result);
solution: 2
options:
  - "5"
  - "12"
  - "60"
  - "getAgeInMonths"
explanation: |
  1. يتم استدعاء الدالة `getAgeInMonths` مع المُعطى `5`. 
  2. داخل الدالة، يتم حساب `5 * 12`، وهو `60`. 
  3. الكلمة المفتاحية `return` تُرجع هذه القيمة `60`، والتي يتم تخزينها في المتغير `result` ثم طباعتها.

