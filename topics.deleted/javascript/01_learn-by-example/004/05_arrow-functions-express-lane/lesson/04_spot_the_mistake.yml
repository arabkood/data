type: "quiz"
lang: "javascript"
question: |
  أوه، يبدو أن هذا الكود به خطأ بسيط! من المفترض أن ينشئ رسالة ترحيب لمستخدمة اسمها فاطمة، لكنه لا يُرجع أي شيء.

  **أي سطر يحتوي على الخطأ؟**
code: |
  const createGreeting = (name) => {
    const message = `مرحباً، ${name}!`;

  };

  console.log(createGreeting("فاطمة")); 
  // المخرجات المتوقعة: 
  // مرحباً، فاطمة!
solution: 2
options:
  - "السطر 1: `المُعاملات` خاطئة."
  - "السطر 2: **الصيغة الحرفية للقالب (`template literal`)** غير صحيحة."
  - "السطر 3: يحتاج إلى جملة `return` صريحة."
  - "السطر 4: القوس المعقوف الختامي في المكان الخطأ."
explanation: |
  لأن هذه الدالة السهمية تستخدم `الأقواس المعقوفة` `{}`, فهي تحتوي على جسم متعدد الأسطر. لذلك، تحتاج إلى جملة `return message;` صريحة لإعادة القيمة.

