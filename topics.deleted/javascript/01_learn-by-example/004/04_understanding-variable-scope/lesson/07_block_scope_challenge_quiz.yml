type: "quiz"
lang: "javascript"
question: |
  ما هو ناتج هذه الشيفرة؟
code: |
  function getGrade(score) {
    let grade; // undefined
    if (score > 90) {
      grade = "ممتاز";
    }
    return grade;
  }

  console.log(getGrade(85));
solution: 2
options:
  - "ممتاز"
  - "ReferenceError: grade is not defined"
  - "undefined"
  - "null"
explanation: |
  تم التصريح عن المتغير `grade` في نطاق الدالة. لكن شرط كتلة `if` وهو `(85 > 90)` غير صحيح، لذا فإن السطر `grade = "ممتاز"` لا يُنفّذ أبدًا. تعيد الدالة القيمة الأولية للمتغير `grade`، وهي `undefined`.

