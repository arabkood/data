title: 'جافا سكريبت ببساطة: أساسيات مع أمثلة تطبيقية'
blurb: >-
  هل تريد تعلم جافا سكريبت بسهولة ودون عناء؟ في هذا المسار التفاعلي، ستتعرّف على
  الأساسيات من خلال أمثلة عملية ومباشرة تساعدك على الفهم بسرعة. الطريقة تعتمد
  على التعلّم التفاعلي والمرئي، لتجعل العملية ممتعة وتناسب طريقة عمل دماغك،
  بدلاً من الشرح النظري الممل. ابدأ رحلتك البرمجية بثقة وبسرعة!
