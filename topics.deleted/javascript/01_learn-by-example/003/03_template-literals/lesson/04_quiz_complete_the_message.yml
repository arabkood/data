type: "quiz"
lang: "javascript"
question: |
  لنساعد مطعمًا في إنشاء رسالة ترحيب بالطبق اليومي الخاص لعميل اسمه عمر.

  **أكمل متغير `greeting`** باستخدام الصيغة الصحيحة للقالب الحرفي.
code: |
  let customerName = "عمر";
  let dish = "كنافة";

  const greeting = `أهلاً بك، ${customerName}! طبق اليوم المميز هو @@INPUT@@.`;

  // ما الذي يجب وضعه في الفراغ لعرض اسم الطبق؟
solution: 1
options:
  - "dish"
  - "${dish}"
  - |
    `dish`
  - "{dish}"
explanation: |
  لدمج متغير داخل `قالب حرفي`، يجب عليك وضعه بين علامة الدولار والأقواس المتعرجة: `${variableName}`.

