type: "quiz"
lang: "javascript"
question: |
  الكود أدناه من المفترض أن ينشئ رسالة ترحيب لتطبيق توصيل طعام، ولكن المخرجات هي `"مرحباً بك في مطعمنايارا"`.

  **ما هو الخطأ** في الكود؟
code: |
  let welcome = "مرحباً بك في مطعمنا";
  let customer = "يارا";

  let message = welcome + customer;

  console.log(message);
solution: 2
options:
  - "يجب أن يكون العامل `+` هو العامل `-`."
  - "المتغير `customer` خاطئ."
  - "توجد مسافة ناقصة بعد الفاصلة في السلسلة النصية `welcome`."
  - "لا يمكنك دمج متغيرين من نوع سلسلة نصية."
explanation: |
  للحصول على المخرجات الصحيحة `"مرحباً بك في مطعمنا يارا"`، يجب أن يكون المتغير `welcome` هو `"مرحباً بك في مطعمنا "` مع وجود مسافة في النهاية.

