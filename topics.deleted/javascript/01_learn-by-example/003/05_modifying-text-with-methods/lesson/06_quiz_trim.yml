type: "quiz"
lang: "javascript"
question: |
  تحاول مستخدمة اسمها `yasmin` تسجيل الدخول. اسم المستخدم الخاص بها مُخزّن كـ `"yasmin"` لكنها كتبته هكذا 
  `"  yasmin  "`.

  الكود لا يعمل. **أي خيار يصلح الكود** بحيث تكون المقارنة `true`؟
code: |
  let savedUser = "yasmin";
  // هذا هو السطر الذي به المشكلة
  let enteredUser = "  yasmin  ";

  @@INPUT@@

  // كيف يمكننا جعل هذه المقارنة صحيحة؟
  console.log(savedUser === enteredUser);
solution: 1
options:
  - "savedUser = savedUser.trim();"
  - "enteredUser = enteredUser.trim();"
  - "let enteredUser = enteredUser.trim();"
  - "لا يمكن إصلاحه."
explanation: |
  المتغير `enteredUser` يحتوي على مسافات زائدة (`"  yasmin  "`) بينما `savedUser` يحتوي على `"yasmin"` فقط. استخدام `trim()` يزيل المسافات من `enteredUser` ليصبح النصان متطابقين والمقارنة تعطي `true`.

