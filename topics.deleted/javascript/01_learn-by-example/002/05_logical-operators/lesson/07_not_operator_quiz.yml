type: "quiz"
lang: "javascript"
question: |
  هذه الشيفرة تتحقق مما إذا كان المستخدم **ليس** عضوًا مميزًا. أكمل شرط `if` بالطريقة الصحيحة:
code: |
  let isPremium = false;
  if (@@INPUT@@) {
    console.log("يرجى ترقية حسابك."); 
  } else {
    console.log("مرحبًا بك، أيها العضو المميز!"); 
  }
solution: 3
options:
  - "NOT isPremium"
  - "&& isPremium"
  - "|| isPremium"
  - "!isPremium"
explanation: |
  الطريقة الصحيحة لاستخدام مُعامِل `NOT` هي بعلامة تعجب واحدة `!` قبل القيمة المنطقية أو المتغيّر، هكذا: `!isPremium`.

