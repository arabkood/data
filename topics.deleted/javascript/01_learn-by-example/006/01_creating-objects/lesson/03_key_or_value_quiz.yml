type: "quiz"
lang: "javascript"
question: |
  في `كائن` المطعم أدناه، أي من الخيارات التالية هو `مفتاح` (`key`)؟
code: |
  let restaurant = {
    name: "Foul w Hummus",
    rating: 4.5
  };
solution: 1
options:
  - '"Foul w Hummus" و 4.5'
  - "rating و 4.5"
  - "restaurant"
explanation: |
  تكون المفاتيح دائمًا على الجانب الأيسر من النقطتين `:`.

