type: "quiz"
lang: "javascript"
question: |
  لنبدأ بإنشاء الهيكل الأساسي لملف عمر.

  املأ الفراغ لإنشاء `كائن` باسم `employee` يحتوي على خاصيتين: `name` بقيمة "Omar" و `employeeId` بقيمة 451.
code: |
  const employee = {
    @@INPUT@@
  };

  console.log(employee.name);
solution: 0
options:
  - "name: \"Omar\",\nemployeeId: 451"
  - "name = \"Omar\";\nemployeeId = 451;"
  - "\"name\": \"Omar\"\n\"employeeId\": 451"
  - "name: Omar,\nemployeeId: 451"
explanation: |
  داخل `الكائن`، نعرّف `الخصائص` على شكل أزواج `key: value` (مفتاح: قيمة)، ويفصل بينها بفاصلة. القيم النصية مثل "Omar" يجب أن تكون محاطة بعلامات اقتباس.

