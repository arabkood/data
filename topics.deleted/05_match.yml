type: match
question: "قم بمطابقة كل متغير بنوع البيانات الصحيح الخاص به في JavaScript."
prompts:
  - type: code
    lang: javascript
    content: 'const name = "Alice";'
  - type: code
    lang: javascript
    content: "const age = 30;"
  - type: code
    lang: javascript
    content: "const isStudent = true;"
  - type: code
    lang: javascript
    content: "const user = { id: 1 };"
options:
  - type: text
    content: "Number"
  - type: text
    content: "Boolean"
  - type: text
    content: "Object"
  - type: text
    content: "String"
solution: [3, 0, 1, 2]
explanation: |
  في JavaScript، يتم تحديد أنواع البيانات ديناميكيًا بناءً على القيمة المعينة:
  - `"Alice"` هي سلسلة نصية (`String`).
  - `30` هو رقم (`Number`).
  - `true` هي قيمة منطقية (`Boolean`).
  - `{ id: 1 }` هو كائن (`Object`).
