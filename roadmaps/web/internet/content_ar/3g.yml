item_id: "module-3-item-2"
item_type: "lesson"
title: "المتجر (الخادم)"
steps:
  - type: "markdown"
    content: |
      في الدرس الماضي، تعلمنا أن حاسوبك يعمل كـ`عميل` عندما تتصفح الويب، فهو مثل زبون يطلب شيئًا ما. لكن من هو على الجانب الآخر من هذه المحادثة؟

      تعرّف على **`الخادم`**: الحاسوب الذي يستقبل الطلبات من `العملاء` ويرسل الردود. إذا كان `العميل` هو الزبون، فإن `الخادم` يشبه المطعم بأكمله: المطبخ، والمخزن، والموظفون، جميعهم يعملون معًا لخدمة الزبائن.

  - type: "markdown"
    content: |
      **ما هو `الخادم`؟**

      `الخادم` هو حاسوب قوي:
      - **يعمل على مدار الساعة طوال أيام الأسبوع، 365 يومًا في السنة** (لا ينام أبدًا)
      - **يخزن البيانات** (المواقع، الفيديوهات، الملفات، `قواعد البيانات`)
      - **ينتظر الطلبات** من `العملاء`
      - **يعالج تلك الطلبات** ويرسل الردود

      فكر في `الخادم` على أنه مطبخ مطعم. المطبخ:
      - يكون مفتوحًا دائمًا خلال ساعات العمل
      - لديه كل المكونات (البيانات) مخزنة وجاهزة
      - ينتظر الطلبات من الزبائن
      - يحضر الطعام (يعالج الطلب) ويرسله

  - type: "markdown"
    content: |
      **وظيفة `الخادم` اليومية**

      إليك ما يحدث من وجهة نظر `الخادم` عندما تزور موقعًا على الويب:

      1. **يستقبل طلبًا:** "شخص ما يريد رؤية صفحتنا الرئيسية"
      2. **يعالج الطلب:** يجد الملفات الصحيحة، ويشغل أي `كود` ضروري
      3. **يجهز الرد:** يجمع كل ملفات `HTML` و `CSS` والصور والبيانات اللازمة
      4. **يرسل الرد:** يسلم كل شيء مرة أخرى إلى `العميل`

      قد يحدث هذا آلاف أو ملايين المرات يوميًا لموقع مشهور! يتعامل `الخادم` مع كل طلب، واحدًا تلو الآخر، مثل مطبخ يحضر الوجبات أثناء ذروة العشاء المزدحمة.

  - type: "quiz"
    question: "ما هي الوظيفة الرئيسية لـ`الخادم`؟"
    options:
      - "طلب المعلومات من الحواسيب الأخرى"
      - "استقبال الطلبات وإرسال الردود"
      - "تصفح المواقع للمستخدمين"
    solution: 1
    explanation: "صحيح! الوظيفة الرئيسية لـ`الخادم` هي استقبال الطلبات من `العملاء` وإرسال الردود. `الخوادم` تقدم المعلومات، ولا تطلبها."

  - type: "markdown"
    content: |
      **لماذا الخوادم قوية جدًا؟**

      تحتاج `الخوادم` إلى أن تكون أقوى بكثير من حاسوبك الشخصي لأن لديها مهمة أصعب بكثير:

      **تخدم العديد من العملاء في وقت واحد:** بينما يخدمك حاسوبك المحمول أنت فقط، قد يخدم `خادم` الويب آلاف الأشخاص في وقت واحد. تخيل مطعمًا يجب أن يخدم 1000 زبون في نفس الوقت!

      **تخزن كميات هائلة من البيانات:** `خوادم` يوتيوب تخزن مليارات الفيديوهات. `خوادم` فيسبوك تخزن تريليونات الصور والمنشورات. لا يحتاج حاسوبك المحمول إلى تخزين كل هذه البيانات.

      **لا ترتاح أبدًا:** يمكن لحاسوبك المحمول أن يدخل في وضع السكون، لكن `الخوادم` تعمل على مدار الساعة طوال أيام الأسبوع. إنها مثل المطاعم التي لا تغلق أبدًا.

      **تحتاج إلى أنظمة احتياطية:** إذا تعطل حاسوبك المحمول، فأنت وحدك المتأثر. أما إذا تعطل `خادم`، يفقد آلاف المستخدمين الوصول إلى الموقع.

  - type: "markdown"
    content: |
      **أنواع مختلفة من الخوادم**

      تمامًا كما توجد أنواع مختلفة من المطاعم، توجد أنواع مختلفة من `الخوادم`:

      **خوادم الويب:** هذه تخزن وتقدم المواقع. عندما تزور أي موقع، فأنت تتصل بـ`خادم ويب`.

      **خوادم البريد الإلكتروني:** هذه تتعامل مع إرسال واستقبال وتخزين رسائل البريد الإلكتروني. يتم تخزين بريدك في جيميل على `خوادم` البريد الإلكتروني الخاصة بجوجل.

      **خوادم الملفات:** هذه تخزن وتشارك الملفات. عندما تحفظ شيئًا على جوجل درايف أو دروب بوكس، يتم تخزينه على `خوادم` الملفات.

      **خوادم قواعد البيانات:** هذه تخزن وتدير البيانات المنظمة. عندما تبحث عن شيء ما على أمازون، يمر البحث عبر `خوادم قواعد البيانات`.

      **خوادم الألعاب:** هذه تدير ألعاب متعددة اللاعبين عبر الإنترنت. عندما تلعب فورتنايت عبر الإنترنت، فأنت تتصل بـ`خوادم` الألعاب.

  - type: "bug"
    lang: "text"
    question: "ابحث عن الجملة غير الصحيحة المتعلقة بالخوادم:"
    code: |
      الخوادم هي حواسيب قوية تعمل على مدار الساعة.
      الخوادم تخزن المواقع والملفات والبيانات الأخرى.
      الخوادم تطلب معلومات من متصفحك.
      الخوادم ترسل الردود إلى العملاء.
      الخوادم يمكنها التعامل مع آلاف الطلبات في وقت واحد.
    solution: 2
    explanation: "صحيح! `الخوادم` لا تطلب معلومات من متصفحك. بل العكس هو الصحيح—متصفحك (`العميل`) هو الذي يطلب المعلومات من `الخوادم`. `الخوادم` تستجيب للطلبات، ولا تقدمها."

  - type: "markdown"
    content: |
      **أين توجد هذه الخوادم؟**

      هل تتذكر `مراكز البيانات` التي تحدثنا عنها في الوحدة الأولى؟ هناك تعيش معظم `الخوادم`!

      `مراكز البيانات` تشبه مستودعات ضخمة مليئة بالآلاف من `الخوادم`، كلها تعمل على مدار الساعة. تحتوي هذه المباني على:
      - **تكييف هواء قوي** للحفاظ على برودة `الخوادم`
      - **أنظمة طاقة احتياطية** في حال انقطاع التيار الكهربائي
      - **أنظمة أمنية** لحماية `الخوادم`
      - **اتصالات إنترنت سريعة** للتعامل مع جميع الطلبات

      عندما تزور فيسبوك، فأنت تتصل بـ`خوادم` في أحد `مراكز بيانات` فيسبوك. وعندما تشاهد فيديو على يوتيوب، فأنت تتصل بـ`خوادم` في أحد `مراكز بيانات` جوجل.

  - type: "quiz"
    question: "يمكن وصف `الخادم` بأفضل شكل بأنه:"
    options:
      - "حاسوب يطلب معلومات من المواقع الإلكترونية"
      - "حاسوب قوي يخزن البيانات ويستجيب لطلبات `العملاء`"
      - "برنامج يساعدك على تصفح الإنترنت"
    solution: 1
    explanation: "ممتاز! `الخادم` هو حاسوب قوي يخزن البيانات ويستجيب لطلبات `العملاء`. إنه `المُقدِّم` في علاقة العميل والخادم."

  - type: "markdown"
    content: |
      **الشراكة الرائعة**

      إليك ما يجعل الإنترنت يعمل: `العملاء` و`الخوادم` شركاء مثاليون.

      **`العملاء`** بارعون في:
      - طلب ما يريده المستخدمون
      - عرض المعلومات بطريقة سهلة الاستخدام
      - كونها محمولة وشخصية

      **`الخوادم`** بارعة في:
      - تخزين كميات هائلة من البيانات
      - التعامل مع آلاف الطلبات في وقت واحد
      - العمل بشكل مستمر دون انقطاع

      لا يمكن لأي منهما أن يوجد بدون الآخر. الأمر يشبه المطعم—أنت بحاجة إلى كل من الزبائن (`العملاء`) والمطبخ (`الخادم`) لكي يعمل النظام.

      في كل مرة تستخدم فيها الإنترنت، فأنت تشارك في الملايين من هذه المحادثات بين `العميل` و`الخادم` التي تحدث في جميع أنحاء العالم. متصفحك يطلب بأدب معلومات من `الخوادم`، و`الخوادم` تستجيب بأدب بالبيانات التي تحتاجها.

      إنه نظام تعاون رائع يجعل الإنترنت الحديث ممكنًا!

      > **تذكر:** إذا سألك أحدهم "ما هو `الخادم`؟"، يمكنك أن تقول له: "إنه مثل مطبخ المطعم—دائمًا جاهز، ولديه كل المكونات (البيانات)، ويحضر بالضبط ما يطلبه الزبائن (`العملاء`)."
