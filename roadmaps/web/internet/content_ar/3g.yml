item_id: "module-3-item-1"
item_type: "lesson"
title: "الزبون (العميل)"
steps:
  - type: "markdown"
    content: |
      الآن بعد أن فهمنا كيف تجد الحواسيب بعضها البعض باستخدام `عناوين IP` و`أسماء النطاقات`، دعنا نستكشف ما يحدث عندما تتصل فعليًا.

      فكر في هذا: عندما تزور موقعًا على الويب، يشارك في الأمر حاسوبان: حاسوبك والحاسوب الذي يستضيف الموقع. لكن لهذين الحاسوبين أدوارًا مختلفة تمامًا، تمامًا مثل الأدوار المختلفة للزبون وموظف المتجر في أي معاملة.

      لنبدأ بدور حاسوبك. عندما تتصفح الويب، يعمل حاسوبك كـ **`عميل`**.

  - type: "markdown"
    content: |
      **ما هو `العميل`؟**

      `العميل` هو أي برنامج **يطلب معلومات** من حاسوب آخر. `العميل` الأكثر شيوعًا الذي تستخدمه هو متصفح الويب الخاص بك، سواء كان كروم أو فايرفوكس أو سفاري أو إيدج.

      فكر في الأمر بهذه الطريقة: تخيل أنك جائع وذهبت إلى مطعم. في هذا السيناريو:
      - **أنت الزبون** (العميل)
      - **أنت تطلب شيئًا** (تطلب الطعام من قائمة الطعام)
      - **أنت تنتظر استلام ما طلبته** (تنتظر وجبتك)

      هذا بالضبط ما يفعله متصفح الويب الخاص بك عندما تزور موقعًا إلكترونيًا!

  - type: "markdown"
    content: |
      **ماذا يفعل `العميل`؟**

      في كل مرة تستخدم فيها الإنترنت، يتبع `العميل` (متصفحك) نفس العملية الأساسية:

      1. **يقدم طلبًا:** "مرحبًا، أريد أن أرى صفحة أكود الرئيسية"
      2. **ينتظر الرد:** ينتظر بصبر أثناء معالجة الطلب
      3. **يستقبل الرد:** يحصل على ملفات `HTML` و `CSS` و `جافاسكريبت` التي تشكل صفحة الويب
      4. **يعرض النتيجة:** يريك صفحة الويب الجميلة والمنسقة

      تمامًا كما هو الحال عند طلب الطعام في مطعم، فأنت تطلب ما تريد، وتنتظر تحضيره، ثم تستلم وجبتك.

  - type: "quiz"
    question: "عندما تشاهد مقطع فيديو على يوتيوب، فإن متصفح الويب الخاص بك يعمل كـ:"
    options:
      - "`خادم`"
      - "`عميل`"
      - "`شبكة`"
    solution: 1
    explanation: "صحيح! يعمل متصفح الويب الخاص بك كـ`عميل` لأنه يطلب معلومات (الفيديو) من `خوادم` يوتيوب. المتصفح يطلب شيئًا، ولا يقدم شيئًا."

  - type: "markdown"
    content: |
      **أنواع مختلفة من العملاء**

      بينما تعد متصفحات الويب النوع الأكثر شيوعًا من `العملاء`، هناك العديد من الأنواع الأخرى التي تستخدمها كل يوم:

      **تطبيقات الجوال:** عندما تفتح تيك توك، أو تيليجرام، أو أي تطبيق آخر، فإن هذا التطبيق يعمل كـ`عميل`. إنه يطلب معلومات من `خوادم` الشركة.

      **برامج البريد الإلكتروني:** عندما تتفقد بريدك الإلكتروني في جيميل أو أوتلوك أو بريد آبل، فإن هذه البرامج هي `عملاء` تطلب رسائلك من `خوادم` البريد الإلكتروني.

      **بث الفيديو:** عندما تشاهد شاهد، فإن تطبيق شاهد هو `عميل` يطلب بيانات الأفلام من `خوادم` شاهد.

      **ألعاب الفيديو:** عندما تلعب لعبة عبر الإنترنت، فإن لعبتك هي `عميل` يطلب بيانات اللعبة من `خوادم` شركة الألعاب.

      النمط دائمًا هو نفسه: **`العملاء` يطلبون الأشياء، و`الخوادم` تقدمها**.

  - type: "markdown"
    content: |
      **وظيفة `العميل` بسيطة**

      إليك ما يميز كونك `عميلًا`: وظيفتك بسيطة نسبيًا. كل ما تحتاجه هو:

      1. **أن تعرف ما تريد** (أي صفحة ويب، أو فيديو، أو بيانات)
      2. **أن تعرف من أين تطلبه** (أي `خادم` يجب الاتصال به)
      3. **أن تفهم الرد** (كيفية عرض صفحة الويب أو تشغيل الفيديو)

      لا تحتاج إلى تخزين كميات هائلة من البيانات، أو خدمة آلاف المستخدمين، أو العمل على مدار الساعة. أنت فقط تطلب ما تحتاجه، عندما تحتاجه.

      إنه مثل كونك زبونًا في مطعم—لست بحاجة إلى معرفة كيفية الطهي، أو إدارة المخزون، أو تشغيل المطبخ. كل ما تحتاجه هو أن تعرف ما تريد وكيف تطلبه.

  - type: "quiz"
    question: "أي من هذه المهام ليست عادةً من وظائف `العميل`؟"
    options:
      - "طلب المعلومات من `خادم`"
      - "عرض صفحات الويب للمستخدم"
      - "تخزين ملفات موقع الويب لآلاف المستخدمين"
    solution: 2
    explanation: "بالضبط! تخزين ملفات موقع الويب لآلاف المستخدمين هو وظيفة `الخادم`، وليس `العميل`. `العملاء` يطلبون المعلومات ويعرضونها، لكنهم لا يخزنون البيانات ويقدمونها لمستخدمين آخرين."

  - type: "markdown"
    content: |
      **أنت تستخدم `عميلًا` الآن**

      أثناء قراءتك لهذا الدرس، أنت تستخدم `عميلًا`! لقد طلب متصفح الويب الخاص بك هذا الدرس من `خوادم` أكود، والآن يعرض لك المحتوى.

      كل نقرة، كل تحميل صفحة، كل فيديو تشاهده—يعمل متصفحك كـ`عميل`، يطلب بأدب من `الخوادم` حول العالم أن ترسل لك المعلومات التي تريدها.

      > **تذكر:** `العميل` هو دائمًا من يطلب شيئًا. إنه الزبون في المطعم، الشخص الذي يقدم الطلب. في الدرس التالي، سنتعرف على الجانب الآخر من هذه العلاقة: `الخادم` الذي يستقبل هذه الطلبات ويقدم الردود.

