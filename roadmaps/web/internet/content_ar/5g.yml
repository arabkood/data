item_id: "module-5-item-1"
item_type: "lesson"
title: "مشكلة الترجمة"

steps:
  - type: "markdown"
    content: |
      لنفكر فيما تعلمناه حتى الآن. نحن نعلم أن كل حاسوب على الإنترنت لديه `عنوان IP` فريد - وهو مجموعة من الأرقام مثل `192.168.1.1` أو `172.217.14.206`. ونعلم أيضًا أنه عندما تريد زيارة موقع ويب، يحتاج متصفحك إلى الاتصال بـ `عنوان IP` الخاص بالخادم.

      ولكن هذا هو مربط الفرس: عندما تريد زيارة جوجل، فأنت لا تكتب `172.217.14.206` في متصفحك، بل تكتب `google.com`. وعندما تريد تصفح فيسبوك، فأنت لا تحفظ `157.240.241.35` - بل تكتب ببساطة `facebook.com`.

      هذا يخلق مشكلة أساسية يواجهها كل مستخدم للإنترنت يوميًا، غالبًا دون أن يدرك ذلك.

  - type: "markdown"
    content: |
      **المشكلة: البشر مقابل الحواسيب**

      فكر في قائمة جهات الاتصال في هاتفك. عندما تريد الاتصال بصديقك إبراهيم، فأنت لا تحفظ رقم هاتفه `+46-70-123-4567`. أنت فقط تنقر على "إبراهيم" في جهات الاتصال، ويقوم هاتفك تلقائيًا بالاتصال بالرقم.

      ولكن ماذا لو كان هاتفك يستطيع الاتصال بالأرقام فقط، وليس الأسماء؟ في كل مرة تريد فيها الاتصال بإبراهيم، سيتعين عليك:
      1. فتح جهات الاتصال
      2. البحث عن اسم إبراهيم
      3. البحث عن رقمه
      4. طلب تلك الأرقام يدويًا

      هذا هو التحدي نفسه على الإنترنت. متصفحك يمكنه الاتصال بـ `عناوين IP` (الأرقام) فقط، لكنك تريد استخدام `أسماء النطاقات` (الأسماء السهلة) لأنها أسهل في التذكر.

  - type: "quiz"
    question: "لماذا نستخدم `أسماء نطاقات` مثل 'google.com' بدلاً من `عناوين IP` مثل '172.217.14.206'؟"
    options:
      - "`أسماء النطاقات` تجعل المواقع تُحمّل بشكل أسرع"
      - "`عناوين IP` ليست آمنة بما يكفي للاستخدام العام"
      - "`أسماء النطاقات` أسهل بكثير للبشر في التذكر والاستخدام"
    solution: 2
    explanation: "`أسماء النطاقات` مصممة لتكون سهلة الاستخدام للبشر. من الأسهل بكثير تذكر 'google.com' بدلاً من سلسلة من الأرقام مثل '172.217.14.206'. هذا يجعل الإنترنت متاحًا للجميع، وليس فقط للأشخاص الذين لديهم ذاكرة قوية للأرقام."

  - type: "markdown"
    content: |
      **حجم المشكلة**

      لنضع هذا في منظوره الصحيح. يوجد أكثر من 1.8 مليار موقع ويب على الإنترنت اليوم. تخيل لو كان عليك حفظ `عنوان IP` لكل موقع ويب تريد زيارته:

      - أمازون: `176.32.103.205`
      - يوتيوب: `172.217.14.174`
      - ويكيبيديا: `91.198.174.192`
      - موقع البنك الخاص بك: `203.0.113.42`
      - موقع الأخبار المفضل لديك: `198.51.100.89`

      لن يكون هذا مستحيل التذكر فحسب، بل هناك مشكلة أخرى: **يمكن لـ`عناوين IP` أن تتغير**. إذا انتقل يوتيوب إلى `خادم` مختلف بـ `عنوان IP` جديد، فإن كل علامة مرجعية ورابط وإشارة إلى يوتيوب عبر الإنترنت بأكمله ستتعطل.

  - type: "markdown"
    content: |
      **ما نحتاجه: خدمة ترجمة**

      ما نحتاجه هو خدمة يمكنها الترجمة الفورية بين الأسماء سهلة الاستخدام للبشر والأرقام سهلة الاستخدام للحواسيب. ستحتاج هذه الخدمة إلى:

      1. **تخزين العلاقات**: تتبع أي `اسم نطاق` يقابل أي `عنوان IP`.
      2. **أن تكون سريعة**: ترجمة الأسماء إلى أرقام فورًا عند الطلب.
      3. **أن تكون موثوقة**: تعمل على مدار الساعة طوال أيام الأسبوع دون انقطاع.
      4. **أن تكون عالمية**: تعمل بنفس الطريقة في كل مكان في العالم.
      5. **أن تبقى محدّثة**: التعامل مع التغييرات عندما تنتقل مواقع الويب إلى `خوادم` جديدة.

      فكر في الأمر كدليل هاتف عالمي يمكن لكل جهاز على الإنترنت الرجوع إليه كلما احتاج إلى "الاتصال" بموقع ويب.

  - type: "markdown"
    content: |
      **مثال من الواقع**

      لنتتبع ما يحدث عندما تكتب `akood.com` في متصفحك:

      1. **أنت تكتب**: `akood.com` (سهل للبشر)
      2. **متصفحك يفكر**: "أحتاج إلى الاتصال بخادم، لكني لا أستطيع الاتصال إلا بـ `عناوين IP`. ما هو `عنوان IP` الخاص بـ akood.com؟"
      3. **المشكلة**: متصفحك لا يعرف `عنوان IP` الخاص بـ akood.com.
      4. **ما هو مطلوب**: طريقة للبحث عن "akood.com" والعثور على `عنوان IP` المقابل له.

      يجب أن تتم عملية البحث هذه لكل موقع ويب تزوره، ويجب أن تحدث بسرعة كافية حتى لا تلاحظ أي تأخير.

      في الدرس التالي، سنكتشف كيف يحل الإنترنت مشكلة الترجمة هذه بنظام أنيق يسمى `DNS`.

