item_id: "module-5-item-2"
item_type: "lesson"
title: "حل دليل الهاتف (DNS)"

steps:
  - type: "markdown"
    content: |
      الآن نفهم المشكلة: المتصفحات تحتاج إلى `عناوين IP`، لكن البشر يفضلون `أسماء النطاقات`. نحن بحاجة إلى خدمة ترجمة يمكنها تحويل `google.com` إلى `172.217.14.206` على الفور.

      حل الإنترنت لهذه المشكلة يسمى **`DNS`** - وهو اختصار لـ **نظام أسماء النطاقات (Domain Name System)**. فكر في `DNS` على أنه دليل هاتف الإنترنت الضخم والعالمي الذي يمكن لكل جهاز الرجوع إليه للبحث عن العناوين.

      ولكن ما يجعل `DNS` رائعًا حقًا هو أنه ليس مجرد دليل هاتف عملاق واحد في مكان واحد. إنه **`نظام موزع`** مكون من آلاف `الخوادم` التي تعمل معًا حول العالم لتقديم خدمة الترجمة هذه.

  - type: "markdown"
    content: |
      **كيف يعمل `DNS`: تشبيه دليل الهاتف**

      تخيل أنك تحاول الاتصال بمطعم، لكنك لا تعرف سوى اسمه: "مطعم أطايب المأكولات". إليك كيف ستجد رقم الهاتف:

      1. **تتحقق من جهات الاتصال الخاصة بك**: ربما اتصلت بهم من قبل وحفظت الرقم.
      2. **تسأل صديقًا**: قد يعرف أحدهم الرقم عن ظهر قلب.
      3. **تبحث في دليل الهاتف**: تجد قائمة المطعم في الدليل.
      4. **تتصل بخدمة الاستعلامات**: تطلب من الموظف البحث عنه نيابة عنك.

      يعمل `DNS` بنفس الطريقة تمامًا، ولكن بدلاً من البحث عن أرقام الهواتف، فإنه يبحث عن `عناوين IP`. يتبع متصفحك عملية مماثلة عندما تكتب `اسم نطاق`.

  - type: "quiz"
    question: "ما هي المهمة الأساسية لخادم `DNS`؟"
    options:
      - "تخزين ملفات مواقع الويب وتقديمها للمستخدمين"
      - "ترجمة `أسماء النطاقات` إلى `عناوين IP`"
      - "تأمين الاتصال بين المتصفحات والخوادم"
    solution: 1
    explanation: "`خوادم DNS` هي حواسيب متخصصة مهمتها الرئيسية هي الاحتفاظ بدليل لـ `أسماء النطاقات` و`عناوين IP` المقابلة لها. عندما تُسأل عن `اسم نطاق`، فإنها تستجيب بـ `عنوان IP` اللازم للوصول إلى ذلك الموقع."

  - type: "markdown"
    content: |
      **عملية بحث `DNS`**

      دعنا نتتبع ما يحدث عندما تكتب `akood.com` في متصفحك:

      **الخطوة 1: التحقق من الذاكرة المؤقتة (Cache)**
      يتحقق متصفحك أولاً مما إذا كان قد بحث مؤخرًا عن akood.com. إذا فعل ذلك، فإنه يستخدم `عنوان IP` المحفوظ (مثل التحقق من مكالماتك الأخيرة).

      **الخطوة 2: سؤال خادم `DNS` المحلي**
      إذا لم يكن مخزّنًا، يسأل متصفحك `خادم DNS` الخاص بـ `مزود خدمة الإنترنت` لديك: "ما هو `عنوان IP` الخاص بـ akood.com؟"

      **الخطوة 3: استجابة خادم `DNS`**
      يبحث `خادم DNS` عن akood.com في سجلاته ويستجيب: "`عنوان IP` الخاص بـ akood.com هو 192.0.2.1"

      **الخطوة 4: الاتصال بالموقع**
      الآن يمكن لمتصفحك الاتصال بـ `192.0.2.1` وطلب موقع akood.com.

  - type: "markdown"
    content: |
      **لماذا `DNS` نظام موزع؟**

      قد تتساءل: لماذا لا يكون هناك `خادم DNS` عملاق واحد يعرف `عنوان IP` لكل موقع ويب؟ إليك المشاكل المتعلقة بهذا النهج:

      **السرعة**: إذا كان هناك `خادم DNS` واحد فقط في أمريكا، فسيتعين على شخص في السويد الانتظار حتى يسافر طلبه نصف المسافة حول العالم.

      **الموثوقية**: إذا تعطل ذلك الخادم الوحيد، سيتوقف الإنترنت بأكمله عن العمل. لن يتمكن أحد من زيارة أي موقع.

      **الحجم**: مليارات الأجهزة تقدم طلبات `DNS` كل ثانية. لا يمكن لخادم واحد التعامل مع هذا الحمل.

      بدلاً من ذلك، يستخدم `DNS` آلاف `الخوادم` الموزعة عالميًا، حيث يعرف كل `خادم` أجزاء مختلفة من الإنترنت.

  - type: "quiz"
    question: "أي عبارة عن `DNS` صحيحة؟"
    options:
      - "`DNS` هو خادم واحد مركزي يخزن جميع معلومات `أسماء النطاقات`"
      - "`DNS` هو نظام موزع من الخوادم التي تعمل معًا على مستوى العالم"
      - "`DNS` يعمل فقط للمواقع التي تنتهي بـ '.com'"
    solution: 1
    explanation: "`DNS` موزع عبر آلاف الخوادم في جميع أنحاء العالم. يوفر هذا التوزيع السرعة (خوادم أقرب للمستخدمين)، والموثوقية (لا توجد نقطة فشل واحدة)، والقابلية للتوسع (يمكنه التعامل مع مليارات الطلبات)."

  - type: "markdown"
    content: |
      **التخزين المؤقت لـ `DNS`: لجعله أسرع**

      لجعل `DNS` أسرع، يستخدم النظام التخزين المؤقت (caching) على مستويات متعددة:

      **الذاكرة المؤقتة للمتصفح**: يتذكر متصفحك عمليات البحث الأخيرة لبضع دقائق.
      **الذاكرة المؤقتة لنظام التشغيل**: يتذكر حاسوبك عمليات البحث لفترة أطول.
      **الذاكرة المؤقتة لمزود خدمة الإنترنت**: يتذكر مزود الإنترنت الخاص بك المواقع الشهيرة.
      **الذاكرة المؤقتة لخادم `DNS`**: حتى `خوادم DNS` تتذكر عمليات البحث الأخيرة.

      هذا يشبه كيف تحفظ تدريجيًا أرقام الهواتف التي تتصل بها بشكل متكرر. كلما زادت زيارة موقع ما، زاد احتمال تخزين `عنوان IP` الخاص به في مكان قريب منك، مما يجعل الزيارات المستقبلية أسرع.

      **حقيقة ممتعة**: لهذا السبب عندما يغير موقع ويب `عنوان IP` الخاص به، قد يستغرق الأمر بضع ساعات حتى يرى الجميع حول العالم التغيير. لا يزال `عنوان IP` القديم مخزنًا في أماكن مختلفة حتى تنتهي صلاحية الذاكرة المؤقتة.

  - type: "markdown"
    content: |
      **`DNS` في حياتك اليومية**

      في كل مرة تقوم فيها بـ:
      - كتابة عنوان ويب والضغط على Enter
      - النقر على رابط في صفحة ويب
      - التحقق من بريدك الإلكتروني
      - استخدام تطبيق جوال يتصل بالإنترنت
      - بث مقطع فيديو

      يعمل `DNS` خلف الكواليس، مترجماً الأسماء سهلة الاستخدام للبشر إلى `عناوين IP` التي تحتاجها الحواسيب للتواصل.

      `DNS` أساسي جدًا لكيفية عمل الإنترنت لدرجة أنه إذا توقف عن العمل، سيصبح الإنترنت غير قابل للاستخدام فعليًا لمعظم الناس. إنه أحد تلك الأنظمة غير المرئية التي تعمل ببساطة، مما يسمح لنا بتصفح الويب باستخدام أسماء لا تُنسى بدلاً من حفظ سلاسل من الأرقام.

      في درسنا التالي، سنرى كيف تجتمع كل مفاهيم الإنترنت هذه معًا عند زيارتك لموقع ويب.
