---
item_id: "module-1-item-1"
item_type: "lesson"
title: "عالم من الحواسيب المتصلة"
steps:
  - type: "markdown"
    content: |
      أهلاً بك! لنبدأ بالسؤال الأساسي: ما هو `الإنترنت` أساساً؟

      انسَ أمر السحب والأفكار المجردة. في جوهره، `الإنترنت` هو ببساطة **شبكة عالمية عملاقة من الحواسيب المتصلة.**

      هذا كل شيء. حاسوبك المحمول، هاتفك، `خوادم` جوجل، الحاسوب الذي يشغل الشاشة في محطة القطار—كلها متصلة ببعضها عبر شبكة هائلة من الكابلات المادية والإشارات اللاسلكية.

  - type: "markdown"
    content: |
      فكر في الأمر كمدينة ضخمة، كل منزل فيها هو حاسوب، والطرق التي تربط بينها هي الكابلات والإشارات اللاسلكية.

      تماماً كما يمكنك قيادة سيارتك من منزلك لزيارة صديق في الجانب الآخر من المدينة، يمكن لحاسوبك إرسال رسائل إلى أي حاسوب آخر في هذه الشبكة العالمية. `الإنترنت` هو نظام الطرق هذا—لا أكثر ولا أقل.

      عندما ترسل رسالة على واتساب، أو تتفقد بريدك الإلكتروني، أو تشاهد مقطع فيديو على يوتيوب، فأنت في الأساس تطلب من حاسوبك أن يسافر عبر هذه الطرق الرقمية لزيارة حاسوب آخر في مكان ما من العالم.

  - type: "quiz"
    question: "بناءً على ما تعلمناه، أي من هذه الخيارات يصف الإنترنت بأفضل شكل؟"
    options:
      - "نظام لاسلكي سحري يوجد في السماء"
      - "شبكة عالمية من الحواسيب المتصلة مادياً"
      - "حاسوب عملاق واحد تملكه شركة تقنية"
    solution: 1
    explanation: "بالضبط! الإنترنت في جوهره هو شبكة مادية تتكون من مليارات الحواسيب المتصلة بواسطة الكابلات والإشارات اللاسلكية. إنه ليس سحراً."

  - type: "markdown"
    content: |
      وهنا قد تأتي المفاجأة: `الإنترنت` ليس ملكاً لأحد.

      لا توجد شركة أو حكومة أو منظمة واحدة تسيطر على `الإنترنت` بأكمله. إنه أشبه بنظام طرق سريعة عام ضخم، حيث تساعد منظمات مختلفة في صيانة أجزاء مختلفة منه.

      `مزود خدمة الإنترنت` (ISP) الخاص بك يقوم بصيانة الطريق من منزلك إلى الطريق السريع الرئيسي. وتقوم شركات أخرى بصيانة الطرق السريعة الكبرى العابرة للقارات. لكن لا أحد يمتلك النظام بأكمله.

      لهذا السبب يتمتع `الإنترنت` بهذه المرونة. إذا تعطل جزء منه، يمكن لحركة البيانات عادةً أن تجد مسارًا آخر—تمامًا كما يمكنك أن تسلك طرقًا جانبية إذا كان الطريق الرئيسي مغلقًا.

