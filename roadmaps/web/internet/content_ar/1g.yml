item_id: "module-1-item-2"
item_type: "lesson"
title: "الأسلاك المادية"
steps:
  - type: "markdown"
    content: |
      ربما تفكر الآن: "إذا كان الإنترنت متصلاً بأسلاك، فأين كل هذه الكابلات؟ أنا لا أرى كابلات ضخمة تمتد في الشارع!"

      سؤال رائع! البنية التحتية المادية للإنترنت موجودة في كل مكان حولنا—كل ما عليك هو أن تعرف أين تبحث.

      دعنا ننطلق في رحلة من جهازك إلى حاسوب على الجانب الآخر من العالم لنرى ما هي الاتصالات المادية التي سنواجهها في طريقنا.

  - type: "markdown"
    content: |
      **اتصالك المنزلي**

      في هذه اللحظة، من المحتمل أن يكون هناك كابل يمتد من منزلك إلى صندوق على عمود هاتف أو مدفون تحت الأرض. هذا الكابل يوصلك بـ `مزود خدمة الإنترنت` (ISP) المحلي.

      هذا يشبه الشارع الصغير الذي يربط منزلك بالطريق الرئيسي في تشبيهنا بالمدينة.

  - type: "markdown"
    content: |
      **الطرق السريعة الرئيسية**

      يتصل `مزود خدمة الإنترنت` الخاص بك بشبكات أكبر عبر كابلات ألياف ضوئية ضخمة—فكر فيها على أنها الطرق السريعة الرئيسية في تشبيهنا بالمدينة.

      ولكن هذا هو الجزء المذهل حقًا: عندما تريد الوصول إلى موقع ويب في بلد آخر، فإن بياناتك تسافر عبر **كابلات ألياف ضوئية بحرية** تمتد في قاع المحيط!

      هذه الكابلات لا يتجاوز سمكها خرطوم حديقة، لكنها تحمل معظم حركة `الإنترنت` في العالم. هناك المئات من هذه الكابلات تتقاطع في قيعان المحيطات الآن.

  - type: "quiz"
    question: "كيف تنتقل بيانات الإنترنت بين القارات؟"
    options:
      - "عبر الأقمار الصناعية في الفضاء"
      - "عبر كابلات الألياف الضوئية البحرية في قاع المحيط"
      - "عبر موجات الراديو التي ترتد عن الغلاف الجوي"
    solution: 1
    explanation: "هذا صحيح! معظم حركة الإنترنت بين القارات تنتقل عبر كابلات الألياف الضوئية البحرية. على الرغم من أن الأقمار الصناعية تنقل بعض حركة الإنترنت، إلا أن الغالبية العظمى تمر عبر هذه الكابلات المادية في قاع المحيط."

  - type: "markdown"
    content: |
      **مراكز البيانات: مستودعات الإنترنت**

      في نهاية هذه الكابلات، ستجد مبانٍ ضخمة تسمى `مراكز البيانات`. هذه المباني تشبه مستودعات عملاقة مليئة بالآلاف من الحواسيب القوية التي تسمى `الخوادم`.

      عندما تزور موقعًا على الويب، فأنت في الواقع تتصل بأحد هذه `الخوادم` في `مركز بيانات` ما في مكان ما من العالم. شركات مثل جوجل وفيسبوك وأمازون تدير `مراكز بيانات` ضخمة حول العالم.

      يتم الحفاظ على برودة هذه المباني ولديها أنظمة طاقة احتياطية لأنها تحتاج إلى العمل على مدار الساعة طوال أيام الأسبوع، 365 يومًا في السنة.

  - type: "markdown"
    content: |
      لذا تذكر: `الإنترنت` لا يطفو في السماء أو يعيش في "سحابة" غامضة. إنه شبكة مادية تتكون من:

      - كابلات من منزلك إلى `مزود خدمة الإنترنت`.
      - كابلات ألياف ضوئية تربط المدن والبلدان.
      - كابلات بحرية تربط القارات.
      - `مراكز بيانات` تؤوي `الخوادم` التي تخزن المواقع والخدمات.

      في المرة القادمة التي يتحدث فيها شخص عن "السحابة"، ستعرف أنه في الحقيقة يتحدث عن حاسوب حقيقي ومادي للغاية، موجود في مبنى حقيقي ومادي للغاية في مكان ما من العالم!

---
item_id: "module-1-item-3"
item_type: "lesson"
title: "ما هي 'السحابة'؟"
steps:
  - type: "markdown"
    content: |
      الآن بعد أن فهمنا أن `الإنترنت` هو شبكة مادية من الحواسيب المتصلة، دعنا نتناول أحد أكبر الألغاز في التكنولوجيا الحديثة: **ما هي "السحابة"؟**

      ربما سمعت عبارات مثل "احفظها على السحابة" أو "إنها مخزنة في السحابة". لكن ماذا يعني ذلك حقًا؟

      إليك الحقيقة: **"السحابة" هي مجرد مصطلح تسويقي جذاب يعني "حاسوب شخص آخر".**

  - type: "markdown"
    content: |
      فكر في الأمر بهذه الطريقة: تخيل أن لديك الكثير من الأغراض في منزلك، فقررت استئجار وحدة تخزين في الجانب الآخر من المدينة.

      - منزلك = حاسوبك الشخصي أو هاتفك.
      - وحدة التخزين = "السحابة" (وهي في الواقع `خادم` في `مركز بيانات`).
      - منشأة التخزين = `مركز البيانات`.
      - الشركة التي تدير منشأة التخزين = مقدمو الخدمات السحابية مثل جوجل أو أمازون أو مايكروسوفت.

      عندما "تحفظ شيئًا ما على السحابة"، فأنت في الحقيقة تقوم بتخزينه على حاسوب شخص آخر يمكنك الوصول إليه عبر `الإنترنت`.

  - type: "quiz"
    question: "عندما تحفظ صورة على iCloud، أين يتم تخزينها فعليًا؟"
    options:
      - "في السماء، تطفو لاسلكيًا"
      - "على خوادم Apple في مركز بيانات"
      - "على قرص صلب خاص غير مرئي"
    solution: 1
    explanation: "صحيح تمامًا! عندما تحفظ على iCloud، يتم تخزين صورتك على `خوادم` شركة Apple في أحد `مراكز البيانات` الخاصة بها. يمكنك الوصول إليها من أي جهاز لأنها متصلة بالإنترنت، لكنها مخزنة ماديًا على حواسيب Apple."

  - type: "markdown"
    content: |
      **لماذا نطلق عليها اسم "السحابة"؟**

      يأتي مصطلح "السحابة" من رسوم الشبكات القديمة حيث كان المهندسون يرسمون شكل سحابة لتمثيل "الإنترنت" أو "شبكة شخص آخر لا نحتاج إلى القلق بشأن تفاصيلها".

      لم يكن القصد منه أبدًا الإشارة إلى أن البيانات تطفو في السماء! لقد كانت مجرد طريقة للقول "هذا يحدث في مكان آخر على الإنترنت".

      لكن أقسام التسويق أحبت المصطلح لأنه يبدو أكثر جاذبية من "استأجر مساحة على خوادمنا".

  - type: "markdown"
    content: |
      **فوائد "السحابة"**

      إذًا، لماذا قد ترغب في تخزين ملفاتك على حاسوب شخص آخر بدلاً من حاسوبك؟ لعدة أسباب:

      **سهولة الوصول:** يمكنك الوصول إلى ملفاتك من أي جهاز متصل بالإنترنت. صورك ومستنداتك ورسائل بريدك الإلكتروني تتبعك أينما ذهبت.

      **النسخ الاحتياطي:** إذا تعطل حاسوبك المحمول أو انكسر هاتفك، فإن ملفاتك تظل آمنة على `خوادم` الشركة السحابية.

      **التعاون:** يمكن لعدة أشخاص العمل على نفس المستند في وقت واحد لأنه مخزن في مكان مركزي واحد.

      **لا حاجة للصيانة:** لا داعي للقلق بشأن تشغيل `الخوادم` أو نسخ البيانات احتياطيًا أو تحديث البرامج—فالشركة السحابية تتولى كل ذلك.

  - type: "quiz"
    question: "'السحابة' يمكن وصفها بأفضل شكل بأنها:"
    options:
      - "شبكة لاسلكية موجودة في السماء"
      - "خوادم في مركز بيانات يمكنك الوصول إليها عبر الإنترنت"
      - "نوع جديد من الأقراص الصلبة لا يحتاج إلى كهرباء"
    solution: 1
    explanation: "ممتاز! السحابة هي ببساطة `خوادم` (حواسيب قوية) في `مراكز بيانات` يمكنك الوصول إليها عبر الإنترنت. هي ليست في السماء—بل في مبانٍ حقيقية جدًا بها حواسيب حقيقية جدًا."

  - type: "markdown"
    content: |
      **تذكر هذه النقطة الأساسية**

      في كل مرة تسمع فيها شخصًا يقول "إنه في السحابة"، استبدل ذلك في ذهنك بـ "إنه على حاسوب شخص آخر يمكنني الوصول إليه عبر الإنترنت".

      - "صوري في السحابة" = "صوري مخزنة على `خوادم` جوجل"
      - "التطبيق يعمل في السحابة" = "التطبيق يعمل على `خوادم` أمازون"
      - "التخزين السحابي" = "استئجار مساحة على الأقراص الصلبة لشخص آخر"

      هذا التحويل الذهني البسيط سيساعدك على فهم ما يحدث حقًا وراء كل الكلمات الرنانة في عالم التسويق.

      الآن أنت تعرف الحقيقة: لا توجد سحابة. إنها فقط حواسيب أشخاص آخرين!
