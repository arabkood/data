item_id: "module-2-item-1"
item_type: "lesson"
title: "عنوان الحاسوب (عنوان IP)"
steps:
  - type: "markdown"
    content: |
      الآن بعد أن عرفنا أن الإنترنت هو شبكة ضخمة من الحواسيب المتصلة، دعنا نحل مشكلة جوهرية: **كيف يجد حاسوب ما حاسوبًا آخر محددًا في هذه الشبكة التي تضم المليارات؟**

      فكر في الأمر—عندما تريد زيارة صديق، تحتاج إلى عنوانه. وعندما تريد إرسال رسالة، يجب أن تعرف بالضبط إلى أين يجب أن تذهب. الأمر نفسه ينطبق على الحواسيب على الإنترنت.

      كل جهاز متصل بالإنترنت يحتاج إلى عنوان فريد حتى تتمكن الحواسيب الأخرى من العثور عليه. هذا العنوان يسمى **`عنوان IP`** (اختصار لـ Internet Protocol address).

  - type: "markdown"
    content: |
      **كيف يبدو `عنوان IP`؟**

      `عنوان IP` هو مجموعة فريدة من الأرقام تحدد حاسوبًا معينًا على الإنترنت. ويبدو بهذا الشكل:

      `192.168.1.1` أو `172.217.164.110`

      تمامًا كما أن لعنوان منزلك تنسيقًا محددًا (رقم الشارع، اسم الشارع، المدينة)، فإن لـ `عنوان IP` تنسيقًا محددًا: أربعة أرقام مفصولة بنقاط، حيث يكون كل رقم بين 0 و 255.

  - type: "markdown"
    content: |
      **التشبيه الأمثل: العناوين البريدية**

      فكر في `عنوان IP` تمامًا مثل العنوان البريدي للمنزل:

      - **عنوان منزلك** يخبر خدمة البريد بالضبط أين يجب تسليم بريدك.
      - **`عنوان IP`** يخبر الإنترنت بالضبط أين يجب تسليم بياناتك.

      عندما تكتب "google.com" في متصفحك، فإن حاسوبك خلف الكواليس يحاول في الحقيقة الوصول إلى `خوادم` جوجل على `عنوان IP` التالي: `142.250.191.14`.

      وكما أن لكل منزل في الشارع عنوانًا فريدًا، فإن لكل حاسوب على الإنترنت `عنوان IP` فريدًا.

  - type: "quiz"
    question: "أي من هذه الخيارات يصف الغرض من `عنوان IP` بأفضل شكل؟"
    options:
      - "لجعل المواقع الإلكترونية تُحمَّل بشكل أسرع"
      - "لتوفير عنوان فريد حتى تتمكن الحواسيب من إيجاد بعضها البعض على الإنترنت"
      - "لتأمين اتصالك بالإنترنت"
    solution: 1
    explanation: "بالضبط! `عنوان IP` هو بمثابة عنوان بريدي للحواسيب—إنه يوفر معرّفًا فريدًا حتى تعرف البيانات إلى أين تتجه بالضبط في شبكة الإنترنت الواسعة."

  - type: "markdown"
    content: |
      **من الذي يخصص هذه العناوين؟**

      قد تتساءل: "من الذي يضمن عدم حصول حاسوبين على نفس `عنوان IP`؟"

      سؤال ممتاز! هناك منظمات تدير `عناوين IP` لضمان أنها فريدة، تمامًا كما تضمن بلديتك عدم وجود منزلين لهما نفس عنوان الشارع.

      عندما تتصل بالإنترنت، يقوم `مزود خدمة الإنترنت` (`ISP`) الخاص بك بتعيين `عنوان IP` لجهازك. لديهم مجموعة من العناوين يمكنهم توزيعها، ويتأكدون من عدم حصول عميلين على نفس العنوان في نفس الوقت.

  - type: "fill"
    lang: "text"
    question: "أكمل تنسيق `عنوان IP` الصحيح هذا:"
    code: |
      @@INPUT@@.@@INPUT@@.1.100
    solution:
      - "/^([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$/"
      - "/^([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$/"

  - type: "markdown"
    content: |
      **نوعان من عناوين IP**

      هناك في الواقع نوعان رئيسيان من `عناوين IP` يجب أن تعرفهما:

      **`IPv4` (النظام القديم):** هذا هو ما كنا نراه—أربعة أرقام مفصولة بنقاط. ولكن هنا تكمن المشكلة: لا يوجد سوى حوالي 4.3 مليار `عنوان IPv4` محتمل، وقد نفدت منا تقريبًا!

      **`IPv6` (النظام الجديد):** يبدو هكذا `2001:0db8:85a3:0000:0000:8a2e:0370:7334`. إنه أطول بكثير ويستخدم الحروف والأرقام. هذا يمنحنا تريليونات وتريليونات من العناوين الممكنة—ما يكفي ليكون لكل حبة رمل على الأرض `عنوان IP` خاص بها!

      لا تزال معظم المواقع تستخدم `IPv4`، لكن `IPv6` بدأ يصبح أكثر شيوعًا ببطء.

  - type: "quiz"
    question: "لماذا تم إنشاء `IPv6`؟"
    options:
      - "لجعل `عناوين IP` أسهل في التذكر"
      - "لجعل الإنترنت أسرع"
      - "لأن `عناوين IPv4` كانت على وشك النفاد"
    solution: 2
    explanation: "صحيح! يوفر `IPv4` حوالي 4.3 مليار عنوان محتمل فقط، وهو ما بدا كثيرًا في الأيام الأولى للإنترنت. ولكن مع وجود مليارات الأجهزة على الإنترنت الآن، احتجنا إلى `IPv6` لتوفير عدد أكبر بكثير من العناوين الممكنة."

  - type: "markdown"
    content: |
      **العثور على `عنوان IP` الخاص بك**

      كل جهاز تستخدمه الآن لديه `عنوان IP`. هاتفك لديه واحد، حاسوبك المحمول لديه واحد، وحتى تلفازك الذكي لديه واحد.

      يمكنك بسهولة العثور على `عنوان IP` الحالي الخاص بك عن طريق زيارة مواقع مثل "whatismyipaddress.com" أو ببساطة البحث عن "what is my IP address".

      جرب ذلك الآن إذا كنت تشعر بالفضول! سترى شيئًا مثل `203.0.113.45`—هذا هو عنوانك الفريد على الإنترنت في هذه اللحظة.

      > ⚠️ **تذكر:** لا تشارك `عنوان IP` الخاص بك مع الغرباء.
      > إنه مثل إعطاء عنوان منزلك الرقمي، ويمكن للآخرين استخدامه للعثور على جهازك والتفاعل معه عبر الإنترنت.

