item_id: "module-2-item-2"
item_type: "lesson"
title: "العنوان سهل الاستخدام للبشر (اسم النطاق)"
steps:
  - type: "markdown"
    content: |
      الآن لدينا مشكلة. لقد تعلمت للتو أن الحواسيب تستخدم `عناوين IP` مثل `172.217.164.110` لتجد بعضها البعض على الإنترنت.

      لكن تخيل لو أنك في كل مرة تريد زيارة جوجل، كان عليك كتابة `172.217.164.110` في متصفحك. أو إذا أردت التحقق من فيسبوك، كان عليك أن تتذكر `157.240.241.35`.

      سيكون هذا أمراً فظيعاً! سيشبه الأمر الاضطرار إلى تذكر أرقام هواتف الجميع بدلاً من أسمائهم فقط في قائمة جهات الاتصال الخاصة بك.

  - type: "markdown"
    content: |
      **الحل: أسماء النطاقات**

      لحسن الحظ، لدى الإنترنت حل أفضل بكثير. بدلاً من جعل البشر يتذكرون الأرقام، يمكننا استخدام **`أسماء النطاقات`**—وهي أسماء سهلة التذكر تمثل `عناوين IP` التي يصعب تذكرها.

      أمثلة على `أسماء النطاقات`:
      - `google.com` بدلاً من `172.217.164.110`
      - `facebook.com` بدلاً من `157.240.241.35`
      - `akood.com` بدلاً من أي `عنوان IP` تستخدمه خوادمنا

      فكر في الأمر تمامًا مثل قائمة جهات الاتصال في هاتفك: أنت لا تتذكر رقم هاتف صديقك `أحمد`—أنت تتذكر فقط "أحمد" وهاتفك يبحث عن الرقم نيابة عنك.

  - type: "quiz"
    question: "ما هو الغرض الأساسي من `اسم النطاق`؟"
    options:
      - "لتأمين موقع ويب من المخترقين"
      - "لجعل `عناوين IP` أسهل للبشر في التذكر"
      - "لجعل المواقع الإلكترونية تُحمَّل بشكل أسرع"
    solution: 1
    explanation: "بالضبط! `أسماء النطاقات` موجودة فقط لراحة البشر. إنها علامات سهلة التذكر تمثل `عناوين IP` صعبة التذكر، تمامًا مثل أسماء جهات الاتصال في هاتفك التي تمثل أرقام هواتف صعبة التذكر."

  - type: "markdown"
    content: |
      **فهم بنية النطاق**

      دعنا نحلل كيفية عمل `أسماء النطاقات` باستخدام `akood.com` كمثال:

      **`.com`** - هذا يسمى "النطاق العلوي" (TLD). إنه مثل البلد أو المنطقة في العنوان البريدي. من الأمثلة الأخرى `.org`، `.net`، `.edu`، والنطاقات الخاصة بالبلدان مثل `.sa` أو `.eg`.

      **`akood`** - هذا هو الاسم الفعلي الذي اختاره الشخص أو الشركة التي سجلت النطاق. إنه مثل اسم الشارع في العنوان البريدي.

      **`www.akood.com`** - الجزء "www" يسمى "النطاق الفرعي". إنه مثل رقم الشقة—يمكن أن يساعد في توجيهك إلى جزء معين من الموقع.

  - type: "markdown"
    content: |
      **من يمتلك أسماء النطاقات؟**

      إليك شيء مهم يجب فهمه: **`أسماء النطاقات` يتم استئجارها، وليس امتلاكها إلى الأبد.**

      عندما "تشتري" شركة ما `اسم نطاق`، فإنها في الواقع تستأجره لفترة محددة (عادة من سنة إلى 10 سنوات). ويتعين عليها تجديده بانتظام، تمامًا مثل تجديد عقد إيجار شقة.

      هناك شركات تسمى "مسجلي النطاقات" (مثل Namecheap أو Cloudflare أو Gandi Domains) تتولى عملية الإيجار. وتتأكد من عدم تمكن شخصين من استئجار نفس `اسم النطاق` في نفس الوقت.

      إذا نسي شخص ما تجديد `اسم النطاق` الخاص به، فإنه يصبح متاحًا لأي شخص آخر لاستئجاره!

  - type: "fill"
    lang: "text"
    question: "أكمل بنية `اسم النطاق` هذه:"
    code: |
      www.@@INPUT@@.@@INPUT@@
    solution:
      - "/^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]$|^[a-zA-Z0-9]$/"
      - "/^(com|org|net|edu|io|me|co|tv|ae|eg|sa|qa|kw|om|bh|jo|lb|sy|iq|ye|ps|ma|dz|tn|sd|ly)$/"

  - type: "markdown"
    content: |
      **حقيقة ممتعة: أسماء نطاقات إبداعية**

      تصبح الشركات مبدعة جدًا مع `أسماء النطاقات`! إليك بعض الأمثلة الذكية:

      - `bit.ly` - خدمة لتقصير الروابط (تلاعب لفظي بالكلمة bitly)
      - `del.icio.us` - كانت خدمة لحفظ المواقع (تُقرأ ككلمة delicious)
      - `t.co` - أداة تقصير الروابط الخاصة بتويتر (اختصار لـ Twitter company)

      حتى أن بعض الشركات تستخدم نطاقات البلدان بشكل إبداعي. على سبيل المثال، نطاق `.ly` يعود إلى ليبيا، لكنه شائع لإنشاء كلمات تنتهي بـ "ly"!

      المفتاح هو أن `اسم النطاق` يجب أن يكون سهل التذكر، سهل الكتابة، ويمثل ما يدور حوله موقعك.

  - type: "quiz"
    question: "إذا أردت زيارة جوجل ولكن لا يمكنك استخدام سوى `عناوين IP`، فماذا عليك أن تفعل؟"
    options:
      - "كتابة شيء مثل 172.217.164.110 في متصفحك"
      - "إرسال بريد إلكتروني إلى جوجل أولاً"
      - "الاتصال بالإنترنت بشكل مختلف"
    solution: 0
    explanation: "صحيح! بدون `أسماء النطاقات`، سيتعين عليك تذكر وكتابة `عناوين IP` مثل 172.217.164.110 لزيارة المواقع. `أسماء النطاقات` مثل google.com أسهل بكثير للبشر لتذكرها واستخدامها."

  - type: "markdown"
    content: |
      **الترجمة السحرية**

      وهنا يكمن الشيء الجميل: عندما تكتب `google.com` في متصفحك، يقوم حاسوبك تلقائيًا بترجمته إلى `عنوان IP` الخاص بجوجل خلف الكواليس.

      أنت تستخدم الاسم السهل على البشر، لكن الحواسيب لا تزال تتواصل باستخدام `عناوين IP` الرقمية التي تفضلها.

      إنه مثل وجود مترجم فوري عالمي يتيح لك التحدث باللغة العربية بينما تتحدث الحواسيب بالأرقام. لا داعي للقلق أبدًا بشأن الترجمة—فهي تحدث تلقائيًا.

      في الوحدة التالية، سنتعلم بالضبط كيف تتم هذه الترجمة السحرية. أما الآن، فقط تذكر: `أسماء النطاقات` موجودة لتجعل حياتك أسهل، ولكن تحت كل هذا، لا تزال الحواسيب تستخدم `عناوين IP` لتجد بعضها البعض.

      لذا في المرة القادمة التي يسألك فيها شخص "ما هو `اسم النطاق`؟"، يمكنك أن تقول له: "إنه مثل اسم جهة اتصال في هاتفك—علامة سهلة التذكر تمثل رقمًا صعب التذكر!"
