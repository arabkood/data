---
item_id: "module-6-item-1"
item_type: "lesson"
title: "الهيكل العظمي (HTML)"
steps:
  - type: "markdown"
    content: |
      لقد تعلمنا كيف يجد متصفحك موقع الويب ويتحدث مع الخادم. ولكن ماذا يرسل الخادم في المقابل؟ مم تتكون صفحة الويب فعليًا؟

      فكر في بناء منزل. قبل أن تتمكن من الطلاء أو التزيين، تحتاج إلى **الهيكل**: الأساسات والجدران والسقف. هذا الهيكل العظمي هو ما يعطي المنزل شكله.

      صفحات الويب تعمل بنفس الطريقة. كل صفحة تبدأ بهيكل عظمي يحدد بنيتها الأساسية ومحتواها.

  - type: "markdown"
    content: |
      **تعرّف على `HTML`: هيكل الويب**

      هذا الهيكل العظمي يسمى **`HTML`**، وهو اختصار لـ **HyperText Markup Language**.

      لا تقلق بشأن الاسم. فقط اعلم هذا: `HTML` هي اللغة المستخدمة لإعطاء صفحة الويب هيكلها. هي التي تخبر المتصفح، "هذا عنوان رئيسي"، "هذه فقرة"، أو "هذه صورة".

      إنها المخطط الهندسي لصفحة الويب.

  - type: "quiz"
    question: "ما هي المهمة الأساسية لـ `HTML` في صفحة الويب؟"
    options:
      - "جعل الصفحة تبدو ملونة وأنيقة."
      - "توفير الهيكل والمحتوى الأساسي."
      - "التعامل مع النقرات وتفاعلات المستخدم."
    correct_index: 1

  - type: "markdown"
    content: |
      **المعنى، وليس المظهر**

      فكرة أساسية في `HTML` هي أنها تصف **معنى** المحتوى، وليس كيف يبدو.

      على سبيل المثال، تقول `HTML` "هذا النص هو العنوان الرئيسي"، ولا تقول "اجعل هذا النص كبيرًا وعريضًا".

      هذا مهم لأنه يسمح لمحركات البحث وقارئات الشاشة للمستخدمين ضعاف البصر بفهم بنية الصفحة، بغض النظر عن تصميمها المرئي. إنها تفصل المخطط الهندسي عن التصميم الداخلي.

  - type: "markdown"
    content: |
      **أساس كل شيء**

      كل صفحة ويب على الإنترنت، من منشور مدونة بسيط إلى موقع معقد مثل أمازون، مبنية على أساس من `HTML`.

      حتى عندما تبدو مواقع الويب مختلفة تمامًا، فإنها جميعًا تشترك في هذه اللغة الهيكلية المشتركة الكامنة تحتها.

      لكن الهيكل العظمي وحده يبدو عاديًا جدًا. في العنصر التالي، سنرى كيفية إضافة الأناقة والتصميم إلى هيكلنا.

---
item_id: "module-6-item-2"
item_type: "lesson"
title: "التصميم (CSS)"
steps:
  - type: "markdown"
    content: |
      صفحتنا الآن لديها هيكل عظمي متين (`HTML`)، لكنها تبدو عادية ومملة—مثل منزل بجدران عارية وبدون أثاث.

      كيف نضيف الألوان، ونختار خطوطًا جميلة، ونرتب كل شيء بدقة؟ نحن بحاجة إلى مصمم داخلي.

      بالنسبة لمواقع الويب، مصممنا الداخلي هو **`CSS`**، وهو اختصار لـ **Cascading Style Sheets**.

  - type: "markdown"
    content: |
      **قوة التحويل**

      `CSS` هي اللغة التي تتحكم في **المظهر المرئي** لصفحة الويب. إنها تأخذ هيكل `HTML` البسيط وتجعله يبدو رائعًا.

      باستخدام `CSS`، يمكنك التحكم في:
      - **الألوان:** تغيير لون النصوص والروابط والخلفيات.
      - **الخطوط:** اختيار نمط الخط وحجمه ووزنه (سماكته).
      - **المسافات:** إضافة مساحة بين العناصر لتجنب الفوضى.
      - **التخطيط:** ترتيب المحتوى في أعمدة وشبكات ووضع العناصر بالضبط حيث تريدها.

  - type: "quiz"
    question: "إذا أردت تغيير لون خلفية صفحة ويب، أي تقنية ستستخدم؟"
    options:
      - "`HTML`"
      - "`CSS`"
      - "`DNS`"
    solution: 1

  - type: "markdown"
    content: |
      **فصل الهيكل عن التصميم**

      ميزة كبيرة لهذا النظام هي أن المخطط الهندسي (`HTML`) منفصل عن التصميم (`CSS`).

      هذا يعني أنه يمكنك تغيير شكل ومظهر موقع الويب بالكامل فقط عن طريق تغيير `CSS`، دون المساس بمحتوى `HTML` الأساسي. يمكنك إعادة تزيين المنزل دون هدم أي جدران.

      يسمح هذا أيضًا لموقع الويب بأن يكون له أنماط مختلفة لأجهزة مختلفة. يمكن تنسيق نفس `HTML` بطريقة لشاشة سطح مكتب كبيرة وبطريقة أخرى لشاشة هاتف صغيرة. هذا ما يسمى **`التصميم المتجاوب`**.

  - type: "markdown"
    content: |
      **الويب المرئي**

      كل موقع ويب مصمم بشكل جميل تعجب به هو نتيجة لـ `CSS`. إنها ما يجعل الويب ليس فقط وظيفيًا، ولكن أيضًا جذابًا بصريًا وسهل الاستخدام.

      الآن منزلنا لديه هيكل وتصميم. لكنه لا يزال جامدًا. ماذا يحدث عندما نريد تشغيل الأضواء؟ هنا يأتي دور تقنيتنا الأخيرة.

