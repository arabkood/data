item_id: "module-6-item-3"
item_type: "lesson"
title: "التفاعلية (جافاسكريبت)"
steps:
  - type: "markdown"
    content: |
      منزلنا مبني (`HTML`) ومزين بشكل جميل (`CSS`). لكنه بلا حياة. مفاتيح الإضاءة لا تعمل، جرس الباب لا يرن، وباب المرآب لن يفتح.

      نحن بحاجة إلى النظام الكهربائي، والسباكة، و "العقل" الذي يجعل المنزل ينبض بالحياة.

      على الويب، هذا هو **`جافاسكريبت`**. إنها لغة البرمجة التي تجعل مواقع الويب **تفاعلية** و **ديناميكية**.

  - type: "markdown"
    content: |
      **ما يجلبه `جافاسكريبت` إلى الحياة**

      `جافاسكريبت` مسؤولة عن أي شيء يحدث على الصفحة *بعد* تحميلها. فكر في:
      - أزرار "الإعجاب" التي يتغير لونها فورًا عند النقر عليها.
      - مربعات البحث التي تعرض اقتراحات أثناء الكتابة.
      - معارض الصور التي يمكنك التنقل بينها بالنقر.
      - الخرائط عبر الإنترنت التي يمكنك سحبها وتكبيرها.
      - عربات التسوق التي تحدث إجمالي المبلغ تلقائيًا.

      كل هذه الإجراءات مدعومة بـ `جافاسكريبت`.

  - type: "quiz"
    question: "يحتوي موقع ويب على نموذج يتحقق من قوة كلمة المرور *أثناء كتابتك لها*. ما هي التقنية الأكثر احتمالاً المسؤولة عن هذه التغذية الراجعة الفورية؟"
    options:
      - "`HTML`"
      - "`CSS`"
      - "`جافاسكريبت`"
    solution: 2

  - type: "markdown"
    content: |
      **عقل الصفحة**

      إذا كان `HTML` هو الهيكل العظمي و `CSS` هو المظهر، فإن **`جافاسكريبت` هو العقل**.

      يمكنه التفاعل مع **`أحداث`** المستخدم مثل النقرات والتمرير والضغط على لوحة المفاتيح. عندما يحدث `حدث`، يمكن لـ `جافاسكريبت` تغيير `HTML` أو `CSS` الخاص بالصفحة على الفور.

      هذا يشبه وجود طاقم تجديد يمكنه إعادة تصميم منزلك في الوقت الفعلي بناءً على أوامرك. أنت تنقر على مفتاح (الحدث)، و `جافاسكريبت` يطلي الجدار بلون جديد على الفور (يغير `CSS`).

  - type: "markdown"
    content: |
      **الاتصال بالعالم**

      يمكن لـ `جافاسكريبت` أيضًا التواصل مع `خوادم` وخدمات أخرى على الإنترنت من خلال أشياء تسمى **`API`**.

      هكذا يمكن لموقع الطقس الحصول على أحدث التوقعات، ويمكن لموقع السفر الحصول على أسعار الرحلات الجوية، أو يمكن لموقع إخباري تحميل مقالات جديدة دون الحاجة إلى تحديث الصفحة بأكملها. إنه يمنح صفحة الويب القدرة على جلب معلومات جديدة بنفسها.

  - type: "markdown"
    content: |
      **الأعمدة الثلاثة تعمل معًا**

      الآن أنت تفهم التقنيات الأساسية الثلاث التي تشغل الويب الحديث:

      - **`HTML`**: يوفر الهيكل والمعنى. (الهيكل العظمي)
      - **`CSS`**: يتحكم في النمط المرئي والتخطيط. (المظهر)
      - **`جافاسكريبت`**: يضيف التفاعلية والسلوك الديناميكي. (العقل)

      تعمل هذه الأعمدة الثلاثة معًا بسلاسة لإنشاء كل تجربة ويب غنية وتفاعلية تستخدمها كل يوم.
