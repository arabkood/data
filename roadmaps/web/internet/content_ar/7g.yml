item_id: "module-7-item-1"
item_type: "lesson"
title: "الرحلة الكاملة"
steps:
  - type: "markdown"
    content: |
      تهانينا! لقد تعلمت كل الأجزاء الأساسية لكيفية عمل الإنترنت. الآن، دعنا نرى كيف تتلاءم جميعها معًا.

      تخيل أنك جالس أمام حاسوبك، وقررت أن تزور موقع `akood.com`. ماذا يحدث من لحظة كتابة هذا العنوان حتى ظهور صفحة الويب على شاشتك؟

      دعنا نتتبع هذه الرحلة خطوة بخطوة، باستخدام كل ما تعلمناه حتى الآن.

  - type: "markdown"
    content: |
      ## الخطوة 1: أنت تكتب اسم النطاق

      تفتح متصفح الويب الخاص بك (كروم، فايرفوكس، سفاري، إلخ) وتكتب "akood.com" في شريط العنوان. تذكر، يعمل متصفحك كـ **`عميل`** - سيقوم بطلب معلومات من `خادم`.

      ولكن هنا تكمن المشكلة: يحتاج متصفحك إلى `عنوان IP` للعثور على `الخادم`، وليس `اسم نطاق` سهل الاستخدام للبشر.

  - type: "markdown"
    content: |
      ## الخطوة 2: بحث `DNS` - العثور على العنوان

      يدرك متصفحك أنه يحتاج إلى ترجمة "akood.com" إلى `عنوان IP`. لذلك، يرسل طلبًا إلى **`خادم DNS`** (دليل هاتف الإنترنت).

      يبحث `خادم DNS` عن "akood.com" في دليله ويستجيب بشيء مثل "192.168.1.100" - وهو `عنوان IP` الفعلي الذي يوجد فيه `خادم` `akood.com`.

      فكر في هذا الأمر مثل البحث عن رقم هاتف صديقك في جهات الاتصال قبل الاتصال به.

  - type: "quiz"
    question: "في هذه المرحلة من الرحلة، ما الذي حصل عليه متصفحك بنجاح؟"
    options:
      - "محتوى صفحة الويب الفعلي"
      - "`عنوان IP` لخادم `akood.com`"
      - "اتصال `HTTPS` آمن"
    solution: 1
    explanation: "يعرف متصفحك الآن `عنوان IP` (مثل 192.168.1.100) الذي يوجد به `خادم` `akood.com`، لكنه لم يطلب صفحة الويب بعد."

  - type: "markdown"
    content: |
      ## الخطوة 3: إرسال طلب `HTTP`

      الآن يعرف متصفحك إلى أين يذهب! يقوم بإنشاء **طلب `HTTP`** ويرسله إلى `الخادم` على `عنوان IP` هذا.

      يقول الطلب بشكل أساسي: "مرحبًا أيها الخادم على العنوان `192.168.1.100`، أنا متصفح ويب وأود الحصول على الصفحة الرئيسية لموقع `akood.com`، من فضلك."

      إذا كان الموقع يستخدم `HTTPS` (الإصدار الآمن)، تتم هذه المحادثة داخل مظروف مشفر لا يمكن قراءته إلا بواسطة متصفحك والخادم.

  - type: "markdown"
    content: |
      ## الخطوة 4: معالجة الخادم

      يستقبل **`الخادم`** في `akood.com` طلبك. إنه حاسوب قوي ينتظر على مدار الساعة طوال أيام الأسبوع طلبات مثل طلبك تمامًا.

      يعالج `الخادم` طلبك، ويجمع كل الملفات اللازمة للصفحة الرئيسية لـ `akood.com` (ملفات `HTML`، `CSS`، `جافاسكريبت`)، ويستعد لإرسالها إليك.

      هذا يشبه نادلًا في مطعم يستقبل طلبك ويذهب إلى المطبخ لإعداد وجبتك.

  - type: "markdown"
    content: |
      ## الخطوة 5: استجابة `HTTP`

      يرسل `الخادم` **استجابة `HTTP`** تحتوي على جميع الملفات التي يحتاجها متصفحك لعرض صفحة الويب.

      تتضمن هذه الاستجابة:
      - `HTML` (الهيكل والمحتوى)
      - `CSS` (التصميم والألوان)
      - `جافاسكريبت` (الميزات التفاعلية)
      - أي صور أو ملفات وسائط أخرى

  - type: "quiz"
    question: "ما هو دور الخادم في هذه العملية؟"
    options:
      - "يقوم بترجمة أسماء النطاقات إلى عناوين IP"
      - "يستقبل الطلبات ويرسل ملفات صفحة الويب"
      - "يقوم بتشفير البيانات من أجل الأمان"
    solution: 1
    explanation: "وظيفة `الخادم` هي استقبال طلبات `HTTP` من `العملاء` (مثل متصفحك) والاستجابة بالملفات والبيانات المطلوبة."

  - type: "markdown"
    content: |
      ## الخطوة 6: المتصفح يعرض الصفحة

      أخيرًا، يستقبل متصفحك جميع الملفات ويبدأ العمل على عرض صفحة الويب:

      1. يقرأ **`HTML`** لفهم الهيكل (العناوين، الفقرات، الصور، إلخ.)
      2. يطبق **`CSS`** لجعل كل شيء يبدو جميلاً (الألوان، الخطوط، التخطيط)
      3. يشغل **`جافاسكريبت`** لإضافة ميزات تفاعلية (أزرار تستجيب للنقرات، رسوم متحركة، إلخ.)

      وها هي! تظهر صفحة `akood.com` على شاشتك، جاهزة للاستخدام.

  - type: "markdown"
    content: |
      ## ملخص الرحلة الكاملة

      إليك العملية بأكملها من البداية إلى النهاية:

      1. **أنت تكتب `اسم النطاق`** (`akood.com`) في متصفحك
      2. **المتصفح يسأل `DNS`** عن `عنوان IP` لموقع `akood.com`
      3. **`DNS` يستجيب** بـ `عنوان IP` (مثل 192.168.1.100)
      4. **المتصفح يرسل طلب `HTTP`** إلى `الخادم` على `عنوان IP` هذا
      5. **الخادم يعالج الطلب** ويجمع ملفات صفحة الويب
      6. **الخادم يرسل استجابة `HTTP`** مع ملفات `HTML` و `CSS` و `جافاسكريبت` والوسائط
      7. **المتصفح يعرض الصفحة** من خلال دمج كل هذه الملفات في صفحة الويب النهائية

      تستغرق هذه العملية بأكملها عادة بضع ثوانٍ فقط، ولكنها تتضمن أجهزة كمبيوتر متعددة تعمل معًا عبر العالم!

  - type: "quiz"
    question: "هذه الرحلة بأكملها من كتابة عنوان URL إلى رؤية صفحة ويب تتضمن عادةً كم عدد أجهزة الكمبيوتر المختلفة؟"
    options:
      - "جهاز الكمبيوتر الخاص بك فقط"
      - "جهاز الكمبيوتر الخاص بك وخادم موقع الويب"
      - "جهاز الكمبيوتر الخاص بك، وخوادم DNS، وخادم موقع الويب"
    solution: 2
    explanation: "كحد أدنى، تشارك ثلاثة أنواع من أجهزة الكمبيوتر: جهاز الكمبيوتر الخاص بك (`العميل`)، و`خوادم DNS` (لترجمة `اسم النطاق`)، و`خادم` موقع الويب (لتوفير المحتوى)."

