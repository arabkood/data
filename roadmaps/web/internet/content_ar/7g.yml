item_id: "module-7-item-2"
item_type: "lesson"
title: "رتب الخطوات"
steps:
  - type: "markdown"
    content: |
      حان الوقت الآن لاختبار فهمك! لقد تعلمت عن الرحلة الكاملة من كتابة عنوان URL إلى رؤية صفحة الويب.

      دعنا نرى ما إذا كان بإمكانك وضع الخطوات بالترتيب الصحيح. فكر في هذا الأمر على أنه تجميع قطعة أثاث - يجب تنفيذ الخطوات بالتسلسل الصحيح حتى يعمل كل شيء بشكل صحيح.

  - type: "order"
    lang: "text"
    question: "رتب هذه الخطوات بالترتيب الصحيح لما يحدث عند زيارتك لموقع ويب:"
    code:
      - "يقوم المستخدم بكتابة اسم النطاق في المتصفح"
      - "يطلب المتصفح من خادم DNS عنوان IP"
      - "يستجيب خادم DNS بعنوان IP"
      - "يرسل المتصفح طلب HTTP إلى الخادم"
      - "يعالج الخادم الطلب ويجهز الاستجابة"
      - "يرسل الخادم استجابة HTTP مع ملفات صفحة الويب"
      - "يعرض المتصفح الصفحة باستخدام HTML و CSS و جافاسكريبت"

  - type: "markdown"
    content: |
      ممتاز! لقد نجحت في رسم خريطة الرحلة الكاملة لطلب الويب.

      تحدث هذه العملية ملايين المرات كل ثانية عبر الإنترنت، لتربط الناس بالمعلومات والخدمات وببعضهم البعض.

  - type: "quiz"
    question: "أي خطوة في هذه العملية مسؤولة عن جعل أسماء النطاقات سهلة الاستخدام للبشر؟"
    options:
      - "عرض المتصفح للصفحة"
      - "بحث `DNS` الذي يترجم أسماء النطاقات إلى عناوين IP"
      - "معالجة الخادم للطلب"
    solution: 1
    explanation: "نظام `DNS` موجود خصيصًا لترجمة `أسماء النطاقات` سهلة الاستخدام للبشر (مثل `akood.com`) إلى `عناوين IP` سهلة الاستخدام للحواسيب (مثل `192.168.1.100`)."

  - type: "markdown"
    content: |
      ## لقد أتقنت الأساسيات!

      تهانينا! أنت الآن تفهم كيفية عمل الإنترنت على المستوى الأساسي. أنت تعرف أن:

      - الإنترنت هو **شبكة مادية** من الحواسيب المتصلة
      - كل جهاز له **`عنوان IP`** (مثل العنوان البريدي)
      - **`أسماء النطاقات`** تجعل `عناوين IP` سهلة الاستخدام للبشر
      - **`العملاء`** (مثل المتصفحات) يطلبون المعلومات من **`الخوادم`**
      - **`HTTP/HTTPS`** هي قواعد الاتصال
      - **`DNS`** هو دليل هاتف الإنترنت
      - **`HTML`** و **`CSS`** و **`جافاسكريبت`** تعمل معًا لإنشاء صفحات الويب

      تمنحك هذه المعرفة أساسًا متينًا لفهم أي تقنية ويب تواجهها في المستقبل.

  - type: "quiz"
    question: "عندما تفهم هذه الأساسيات، ما الذي تكون مجهزًا بشكل أفضل للقيام به؟"
    options:
      - "بناء مواقع ويب بسيطة فقط"
      - "فهم وتعلم أي تقنية ويب بشكل أكثر فعالية"
      - "أن تصبح مدير شبكة على الفور"
    solution: 1
    explanation: "فهم هذه الأساسيات يمنحك الأساس المفاهيمي لفهم كيف تتناسب أي تقنية ويب مع الصورة الأكبر، مما يجعل كل تعلم مستقبلي أسهل وأكثر جدوى."

  - type: "markdown"
    content: |
      ## ماذا بعد؟

      الآن بعد أن فهمت كيفية عمل الإنترنت، أنت مستعد للتعمق أكثر في تقنيات محددة:

      - **تطوير الواجهات الأمامية (Frontend)**: تعلم بناء الجانب العميل من المواقع باستخدام `HTML` و `CSS` و `جافاسكريبت`.
      - **تطوير الواجهات الخلفية (Backend)**: تعلم بناء الجانب الخادم الذي يتعامل مع الطلبات ويدير البيانات.
      - **الشبكات**: تعمق أكثر في كيفية انتقال البيانات عبر الشبكات.
      - **أمن الويب**: فهم كيفية حماية المواقع والمستخدمين.

      الشيء الجميل هو أن كل ما ستتعلمه بعد ذلك سيبنى على هذه المفاهيم الأساسية التي أتقنتها للتو.

      أهلاً بك في عالم تقنية الويب! 🚀
