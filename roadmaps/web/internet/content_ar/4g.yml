item_id: "module-4-item-2"
item_type: "lesson"
title: "المصافحة الآمنة (HTTPS)"

steps:
  - type: "markdown"
    content: |
      هل تتذكر تشبيهنا بالمطعم؟ تخيل أنك تطلب طعامًا، ولكن بدلاً من أن تهمس بطلبك للنادل، عليك أن تصرخ به عبر المطعم بأكمله. يمكن للجميع سماع طلبك، بما في ذلك معلومات بطاقتك الائتمانية التي تدفع بها.

      هذا هو ما يحدث بشكل أساسي مع `بروتوكول HTTP` العادي. يتم إرسال تواصلك مع `الخادم` في صورة `نص عادي` يمكن لأي شخص "يتنصت" على الشبكة قراءته. وهذا يشمل كلمات المرور وأرقام بطاقات الائتمان والرسائل الشخصية.

      من الواضح أن هذه مشكلة خطيرة. نحن بحاجة إلى طريقة لإجراء محادثات خاصة على الإنترنت.

  - type: "markdown"
    content: |
      الحل هو **`HTTPS`** - أي `HTTP` **الآمن** (Secure). هذا الحرف الصغير "S" في النهاية يصنع كل الفرق.

      يأخذ `HTTPS` بروتوكول `HTTP` العادي ويغلفه بطبقة آمنة من التشفير تسمى `SSL/TLS`. فكر في الأمر على أنه وضع محادثتك بأكملها في مظروف مختوم غير قابل للكسر لا يمكن فتحه إلا من قبلك أنت والخادم.

      عندما ترى `https://` في شريط عنوان متصفحك (غالبًا مع أيقونة قفل)، فهذا يعني:
      - أن اتصالك مشفر
      - لا يمكن لأي شخص آخر قراءة ما ترسله أو تستقبله
      - يمكنك إدخال معلومات حساسة مثل كلمات المرور وأرقام بطاقات الائتمان بأمان

  - type: "quiz"
    question: "يجب عليك دائمًا البحث عن `HTTPS` عند:"
    options:
      - "مشاهدة مقاطع الفيديو على يوتيوب"
      - "قراءة المقالات الإخبارية"
      - "إدخال كلمة مرور أو رقم بطاقة ائتمان"
    solution: 2
    explanation: "`HTTPS` ضروري عند نقل المعلومات الحساسة مثل كلمات المرور أو أرقام بطاقات الائتمان أو البيانات الشخصية. على الرغم من أن العديد من المواقع تستخدم `HTTPS` الآن لجميع المحتويات، إلا أنه مهم للغاية للمعلومات الحساسة."

  - type: "markdown"
    content: |
      إليك كيفية عمل تشفير `HTTPS` بعبارات بسيطة:

      **الخطوة 1: المصافحة**
      عندما تزور موقعًا يستخدم `HTTPS`، يقوم متصفحك والخادم أولاً بإجراء "مصافحة". يتفقان على `كود سري` لا يعرفه أحد غيرهما.

      **الخطوة 2: النفق الآمن**
      يتم بعد ذلك تشفير جميع الاتصالات باستخدام هذا الكود السري. حتى لو اعترض شخص ما بياناتك، فكل ما سيراه هو بيانات مشوشة لا معنى لها.

      **الخطوة 3: التحقق من قبل متصفحك**
      يتحقق متصفحك أيضًا من أن `الخادم` هو من يدعي أنه هو (باستخدام شيء يسمى `الشهادة الرقمية`)، مما يمنع المحتالين من التظاهر بأنهم مواقع ويب شرعية.

  - type: "markdown"
    content: |
      **كيف يمكنك معرفة ما إذا كان موقع الويب يستخدم `HTTPS`؟**

      انظر إلى شريط العنوان في متصفحك:
      - ✅ `https://example.com` - آمن
      - ❌ `http://example.com` - غير آمن
      - تعرض معظم المتصفحات أيضًا أيقونة قفل (🔒) بجوار المواقع الآمنة
      - تحذرك بعض المتصفحات بتسميات "غير آمن" لمواقع `HTTP`

      **نصيحة احترافية:** لا تدخل أبدًا معلومات حساسة على موقع ويب لا يستخدم `HTTPS`. إذا رأيت تحذيرًا بشأن "اتصال غير آمن"، فخذه على محمل الجد!

  - type: "quiz"
    question: "أي من هذه العبارات حول `HTTPS` صحيحة؟"
    options:
      - "`HTTPS` يجعل المواقع الإلكترونية تُحمَّل بشكل أسرع من `HTTP`"
      - "`HTTPS` يشفر البيانات المرسلة بين متصفحك والخادم"
      - "`HTTPS` ضروري فقط لمواقع التسوق عبر الإنترنت"
    solution: 1
    explanation: "`HTTPS` يشفر جميع البيانات المنقولة بين متصفحك والخادم، مما يجعلها غير قابلة للقراءة لأي شخص قد يعترضها. هذه الحماية قيمة لجميع أنواع الاتصالات الحساسة، وليس فقط للتسوق."

  - type: "markdown"
    content: |
      **لماذا لا يستخدم كل شيء `HTTPS`؟**

      سؤال رائع! في الواقع، معظم الويب الحديث *يتجه* إلى `HTTPS`. لقد دفعت جوجل والشركات الأخرى باتجاه "HTTPS في كل مكان" للأسباب التالية:

      - يحمي خصوصية المستخدم
      - يمنع التلاعب بالبيانات
      - تفضل محركات البحث مواقع `HTTPS`
      - يبني ثقة المستخدم

      كانت الأسباب التاريخية الرئيسية لبقاء بعض المواقع مع `HTTP` هي التكلفة والأداء، لكن هذه الحواجز اختفت إلى حد كبير. اليوم، لا يوجد سبب وجيه لعدم استخدام `HTTPS` لجميع مواقع الويب.

