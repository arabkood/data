---
item_id: "module-4-item-1"
item_type: "lesson"
title: "قواعد التواصل (HTTP)"

steps:
  - type: "markdown"
    content: |
      تخيل أنك تدخل مطعمًا في بلد أجنبي. تريد طلب الطعام، لكنك أنت والنادل لا تتحدثان نفس اللغة. كيف ستتواصلان؟ غالبًا ستشير إلى قائمة الطعام، وتستخدم الإيماءات، وربما ترسم صورًا. سيكون الأمر فوضويًا ومربكًا.

      نفس المشكلة موجودة على الإنترنت. متصفحك (`العميل`) يريد التحدث إلى `الخادم`، لكنهما برنامجان مختلفان تمامًا يعملان على أجهزة كمبيوتر مختلفة. كيف يفهمان بعضهما البعض؟

      الحل هو **`البروتوكولات`** - وهي مجموعات من القواعد المتفق عليها التي تحدد بالضبط كيف يجب أن يتواصل حاسوبان.

  - type: "markdown"
    content: |
      أهم `بروتوكول` لتصفح الويب هو **`HTTP`**، وهو اختصار لـ **HyperText Transfer Protocol**.

      فكر في `HTTP` على أنه اللغة العالمية التي تستخدمها المتصفحات وخوادم الويب للتواصل. تمامًا كما أن لجميع المطاعم أنماطًا متشابهة (تجلس، تنظر في قائمة الطعام، تقدم طلبًا، تستلم الطعام، تدفع)، فإن `HTTP` يحدد الأنماط القياسية للتواصل عبر الويب.

      عندما تكتب عنوان موقع ويب وتضغط على "Enter"، يستخدم متصفحك `بروتوكول HTTP` من أجل:
      - طلب صفحة ويب معينة من `الخادم`
      - إخبار `الخادم` بنوع الجهاز الذي تستخدمه
      - استقبال محتوى صفحة الويب من `الخادم`

  - type: "quiz"
    question: "ما هو الغرض الأساسي من `بروتوكول HTTP`؟"
    options:
      - "لجعل المواقع الإلكترونية تُحمَّل بشكل أسرع"
      - "لتوفير طريقة قياسية لتواصل المتصفحات والخوادم"
      - "لتأمين نقل البيانات عبر الإنترنت"
    solution: 1
    explanation: "`HTTP` هو البروتوكول الذي يحدد القواعد والتنسيق للتواصل بين متصفحات الويب والخوادم، مما يضمن فهم كل منهما للآخر."

  - type: "markdown"
    content: |
      دعنا نحلل ما يحدث عند زيارتك لموقع ويب باستخدام `بروتوكول HTTP`:

      **الخطوة 1: طلبك**
      يقوم متصفحك بإنشاء طلب `HTTP` يقول شيئًا مثل: "مرحبًا أيها الخادم، أود الحصول على الصفحة الرئيسية لهذا الموقع من فضلك. أنا أستخدم متصفح كروم على نظام ويندوز."

      **الخطوة 2: استجابة الخادم**
      يستقبل `الخادم` طلبك ويرسل استجابة `HTTP` تقول: "تفضل صفحة الويب التي طلبتها، بالإضافة إلى بعض المعلومات حول كيفية عرضها."

      هذه المحادثة ذهابًا وإيابًا تتبع قواعد `HTTP`، مما يضمن أن كلا الجانبين يفهمان بعضهما البعض تمامًا.

  - type: "fill"
    lang: "text"
    question: "أكمل هذه الجملة حول `بروتوكول HTTP`:"
    code: |
      @@INPUT@@ هو البروتوكول الذي يحدد قواعد التواصل بين متصفحات الويب و الخوادم.
    solution:
      - "/^HTTP$/i"

  - type: "markdown"
    content: |
      إليك أمر مثير للاهتمام: `HTTP` هو ما يسمى ببروتوكول "عديم الحالة" (stateless). هذا يعني أن كل طلب مستقل بذاته - فالخادم لا يتذكر المحادثات السابقة مع متصفحك.

      فكر في الأمر على هذا النحو: في كل مرة تتصل فيها بمطعم بيتزا، عليك أن تقدم نفسك مرة أخرى وتعطي طلبك بالكامل، حتى لو اتصلت بالأمس. يتعامل `الخادم` مع كل طلب `HTTP` على أنه محادثة جديدة تمامًا.

      قد يبدو هذا غير فعال، ولكنه في الواقع يجعل الإنترنت أكثر موثوقية وقابلية للتوسع. إذا تعطل `الخادم` وأعيد تشغيله، فلن يحتاج إلى تذكر آلاف المحادثات الجارية - يمكنه فقط التعامل مع الطلبات الجديدة عند وصولها.

