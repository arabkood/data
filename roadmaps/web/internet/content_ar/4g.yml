item_id: "module-4-item-3"
item_type: "lesson"
title: "صندوق أدوات الإنترنت (بروتوكولات أخرى)"

steps:
  - type: "markdown"
    content: |
      لقد ركزنا حتى الآن على `HTTP` و `HTTPS` لأنهما يجعلان تصفح الويب ممكنًا. ولكن إليك الأمر: الإنترنت أكبر بكثير من مجرد مواقع ويب.

      فكر في الإنترنت كصندوق أدوات ضخم. `HTTP` يشبه المطرقة - ربما تكون الأداة التي تستخدمها في أغلب الأحيان، لكنها ليست الأداة الوحيدة المتاحة. تمامًا كما يحتاج عامل البناء إلى أدوات مختلفة لوظائف مختلفة، فإن الإنترنت لديه `بروتوكولات` مختلفة لأنواع مختلفة من الاتصالات.

      دعنا نستكشف بعض الأدوات المهمة الأخرى في صندوق أدوات الإنترنت.

  - type: "markdown"
    content: |
      **البريد الإلكتروني: SMTP و POP3 و IMAP**

      عندما ترسل بريدًا إلكترونيًا، فأنت لا تستخدم `HTTP`. بدلاً من ذلك، يستخدم عميل البريد الإلكتروني الخاص بك `بروتوكولات` مصممة خصيصًا للبريد الإلكتروني:

      - **`SMTP`** (بروتوكول نقل البريد البسيط): هذا يشبه خدمة البريد للبريد الإلكتروني. إنه يتعامل مع إرسال بريدك الإلكتروني من جهازك إلى `خادم` البريد الإلكتروني للمستلم.
      - **`POP3`** و **`IMAP`**: هذان البروتوكولان يشبهان طرقًا مختلفة للتحقق من صندوق بريدك. إنهما يتعاملان مع تنزيل رسائل البريد الإلكتروني من `الخادم` إلى جهازك.

      فكر في الأمر بهذه الطريقة: `SMTP` هي شاحنة البريد التي توصل الرسائل، بينما `POP3/IMAP` هما طرق مختلفة لتنظيم صندوق بريدك والوصول إليه.

  - type: "markdown"
    content: |
      **نقل الملفات: FTP**

      **`FTP`** (بروتوكول نقل الملفات) مصمم خصيصًا لرفع وتنزيل الملفات. إنه يشبه خدمة توصيل متخصصة للطرود الكبيرة.

      بينما يمكنك تنزيل الملفات عبر `HTTP` (مثل عندما تنزل ملف PDF من موقع ويب)، فإن `FTP` أكثر كفاءة لنقل الملفات الكبيرة أو العديد من الملفات في وقت واحد. غالبًا ما يستخدم مطورو الويب `FTP` لرفع ملفات مواقعهم إلى `خادم`.

  - type: "quiz"
    question: "طابق كل بروتوكول مع غرضه الأساسي:"
    code: |
      البروتوكول أ: SMTP
      البروتوكول ب: HTTP
      البروتوكول ج: FTP

      الغرض 1: نقل الملفات بين الحواسيب
      الغرض 2: إرسال رسائل البريد الإلكتروني
      الغرض 3: طلب واستقبال صفحات الويب
    options:
      - "أ-1، ب-2، ج-3"
      - "أ-2، ب-3، ج-1"
      - "أ-3، ب-1، ج-2"
    solution: 1
    explanation: "`SMTP` مخصص لإرسال البريد الإلكتروني (أ-2)، و `HTTP` لصفحات الويب (ب-3)، و `FTP` لنقل الملفات (ج-1). كل `بروتوكول` متخصص لنوع الاتصال الخاص به."

  - type: "markdown"
    content: |
      **الاتصال في الزمن الحقيقي: WebRTC و WebSocket**

      يعمل `HTTP` بشكل رائع لصفحات الويب التقليدية، ولكن ماذا عن الاتصال في الزمن الحقيقي مثل مكالمات الفيديو أو الرسائل الفورية؟

      - **`WebRTC`** (اتصال الويب في الزمن الحقيقي): يتيح هذا الاتصال المباشر بين متصفح ومتصفح آخر لإجراء مكالمات الفيديو والمكالمات الصوتية ومشاركة الملفات. فكر في تطبيقات مثل زووم، جوجل ميت، أو الدردشة الصوتية في ديسكورد.
      - **`WebSocket`**: يسمح هذا باتصال مستمر وثنائي الاتجاه بين متصفحك والخادم. مثالي لتطبيقات الدردشة، التحديثات الحية، أو الألعاب عبر الإنترنت.

      على عكس نمط "الطلب والاستجابة" الخاص بـ `HTTP`، تحافظ هذه `البروتوكولات` على اتصالات مستمرة للتواصل الفوري.

  - type: "markdown"
    content: |
      **الأمان والوصول عن بعد: SSH و VPN**

      - **`SSH`** (الصدفة الآمنة): هذا يشبه نفقًا آمنًا يسمح لك بالتحكم في حاسوب آخر عن بعد. يستخدم مديرو الأنظمة `SSH` لإدارة `الخوادم` من أي مكان في العالم.
      - **`VPN`** (الشبكة الخاصة الافتراضية): تنشئ هذه الشبكة اتصالاً آمنًا ومشفرًا بين جهازك وخادم بعيد، مما يجعلك تبدو وكأنك تتصفح من موقع مختلف.

      كلاهما يعطي الأولوية للأمان والخصوصية لأنواع مختلفة من الوصول عن بعد.

  - type: "quiz"
    question: "أي عبارة عن بروتوكولات الإنترنت غير صحيحة؟"
    options:
      - "تم تصميم بروتوكولات مختلفة لأنواع مختلفة من الاتصالات"
      - "`HTTP` هو البروتوكول الوحيد اللازم لجميع اتصالات الإنترنت"
      - "يستخدم البريد الإلكتروني بروتوكولات مختلفة عن تصفح الويب"
    solution: 1
    explanation: "`HTTP` هو مجرد واحد من العديد من البروتوكولات. يستخدم الإنترنت بروتوكولات مختلفة لأغراض مختلفة - البريد الإلكتروني (`SMTP`)، نقل الملفات (`FTP`)، الاتصال في الزمن الحقيقي (`WebRTC`)، وغيرها الكثير."

  - type: "markdown"
    content: |
      **الصورة الكاملة**

      إليك ما هو مهم أن تتذكره: **لست بحاجة إلى حفظ كل هذه البروتوكولات**. الفكرة الرئيسية هي أن الإنترنت نظام مرن به أدوات متخصصة لوظائف مختلفة.

      عندما ترسل بريدًا إلكترونيًا، أو تشاهد مكالمة فيديو، أو تنزل ملفًا، أو تتصفح موقعًا، تعمل `بروتوكولات` مختلفة خلف الكواليس لجعل كل تجربة ممكنة. تختار أجهزتك وتطبيقاتك تلقائيًا البروتوكول المناسب لكل مهمة.

      يظل `HTTP` و `HTTPS` أهم `البروتوكولات` التي يجب على مطوري الويب فهمها، لكن معرفة وجود `بروتوكولات` أخرى يساعدك على تقدير تنوع وقوة الإنترنت.

      بينما تواصل تعلم تطوير الويب، ستعمل بشكل أساسي مع `HTTP/HTTPS`، لكنك قد تواجه أحيانًا هذه `البروتوكولات` الأخرى في سياقات محددة.

  - type: "order"
    lang: "text"
    question: "رتب هذه الخطوات بالترتيب الصحيح لكيفية عمل طلب `HTTP`:"
    code:
      - "يقوم المستخدم بإدخال عنوان URL في المتصفح"
      - "يرسل المتصفح (`العميل`) طلب `HTTP` إلى الخادم"
      - "يستقبل الخادم الطلب ويعالجه"
      - "يرسل الخادم استجابة `HTTP`"
      - "يعرض المتصفح (`العميل`) الاستجابة للمستخدم"
