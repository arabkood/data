item_id: "module-3-item-1"
item_type: "lesson"
title: "The Customer (The Client)"
steps:
  - type: "markdown"
    content: |
      Now that we understand how computers find each other using IP addresses and domain names, let's explore what happens when they actually connect.

      Think about this: when you visit a website, two computers are involved: yours and the one hosting the website. But these two computers have completely different roles, just like a customer and a store employee have different roles in a transaction.

      Let's start with your computer's role. When you browse the web, your computer acts as a **client**.

  - type: "markdown"
    content: |
      **What Is a Client?**

      A client is any piece of software that **requests information** from another computer. The most common client you use is your web browser, whether that's Chrome, Firefox, Safari, or Edge.

      Think of it this way: imagine you're hungry and you go to a restaurant. In this scenario:
      - **You are the customer** (the client)
      - **You ask for something** (you request food from the menu)
      - **You wait to receive what you asked for** (you wait for your meal)

      This is exactly what your web browser does when you visit a website!

      # media_idea: A simple illustration showing a person at a restaurant table looking at a menu, with labels showing "Customer = Client" and "Asking for food = Requesting data"

  - type: "markdown"
    content: |
      **What Does a Client Do?**

      Every time you use the internet, your client (browser) follows the same basic process:

      1. **Makes a request:** "Hey, I want to see the Akood homepage"
      2. **Waits for a response:** Sits patiently while the request is processed
      3. **Receives the response:** Gets the HTML, CSS, and JavaScript that makes up the webpage
      4. **Displays the result:** Shows you the beautiful, formatted webpage

      Just like when you order food at a restaurant, you ask for what you want, wait for it to be prepared, and then receive your meal.

  - type: "quiz"
    question: "When you watch a YouTube video, what is your web browser acting as?"
    options:
      - "A server"
      - "A client"
      - "A network"
    solution: 1
    explanation: "Correct! Your web browser is acting as a client because it's requesting information (the video) from YouTube's servers. The browser is asking for something, not providing something."

  - type: "markdown"
    content: |
      **Different Types of Clients**

      While web browsers are the most common type of client, there are many others you use every day:

      **Mobile Apps:** When you open Tiktok, Telegram, or any other app, that app is acting as a client. It's requesting information from the company's servers.

      **Email Programs:** When you check your email in Gmail, Outlook, or Apple Mail, those programs are clients requesting your emails from email servers.

      **Video Streaming:** When you watch Shahid, the Shahid app is a client requesting movie data from Shahid's servers.

      **Video Games:** When you play an online game, your game is a client requesting game data from the game company's servers.

      The pattern is always the same: **clients ask for things, servers provide things**.

  - type: "markdown"
    content: |
      **The Client's Job Is Simple**

      Here's what's beautiful about being a client: your job is relatively simple. You just need to:

      1. **Know what you want** (which webpage, video, or data)
      2. **Know where to ask for it** (which server to contact)
      3. **Understand the response** (how to display the webpage or play the video)

      You don't need to store massive amounts of data, serve thousands of users, or run 24/7. You just ask for what you need, when you need it.

      It's like being a customer at a restaurant—you don't need to know how to cook, manage inventory, or run a kitchen. You just need to know what you want and how to ask for it.

      # media_idea: A comparison showing a simple client device (laptop) with a few basic functions vs. a complex server setup with multiple responsibilities

  - type: "quiz"
    question: "Which of these is NOT typically a job of a client?"
    options:
      - "Requesting information from a server"
      - "Displaying webpages to the user"
      - "Storing website files for thousands of users"
    solution: 2
    explanation: "Exactly! Storing website files for thousands of users is a server's job, not a client's job. Clients request information and display it, but they don't store and serve data to other users."

  - type: "markdown"
    content: |
      **You Are Using a Client Right Now**

      As you read this lesson, you're using a client! Your web browser requested this lesson from Akood's servers, and now it's displaying the content for you.

      Every click, every page load, every video you watch—your browser is acting as a client, politely asking servers around the world to send you the information you want.

      > **Remember:** A client is always the one asking for something. It's the customer in the restaurant, the person making the request. In the next lesson, we'll learn about the other side of this relationship: the server that receives these requests and provides the responses.

