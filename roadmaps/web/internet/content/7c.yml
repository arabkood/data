item_id: "module-7-item-2"
item_type: "lesson"
title: "Order the Steps"
steps:
  - type: "markdown"
    content: |
      Now it's time to test your understanding! You've learned about the complete journey from typing a URL to seeing a webpage.

      Let's see if you can put the steps in the correct order. Think of this like assembling a piece of furniture - the steps must be done in the right sequence for everything to work properly.

  - type: "order"
    lang: "text"
    question: "Put these steps in the correct order for what happens when you visit a website:"
    code:
      - "User types domain name into browser"
      - "Browser asks DNS server for IP address"
      - "DNS server responds with IP address"
      - "Browser sends HTTP request to server"
      - "Server processes request and prepares response"
      - "Server sends HTTP response with webpage files"
      - "Browser renders the page using HTML, CSS, and JavaScript"

  - type: "markdown"
    content: |
      Excellent! You've successfully mapped out the complete journey of a web request.

      This process happens millions of times every second across the internet, connecting people to information, services, and each other.

  - type: "quiz"
    question: "Which step in this process is responsible for making domain names human-friendly?"
    options:
      - "The browser rendering the page"
      - "The DNS lookup translating domain names to IP addresses"
      - "The server processing the request"
    solution: 1
    explanation: "The DNS system exists specifically to translate human-friendly domain names (like akood.com) into computer-friendly IP addresses (like 192.168.1.100)."

  - type: "markdown"
    content: |
      ## You've Mastered the Fundamentals!

      Congratulations! You now understand how the internet works at a fundamental level. You know:

      - The internet is a **physical network** of connected computers
      - Every device has an **IP address** (like a postal address)
      - **Domain names** make IP addresses human-friendly
      - **Clients** (like browsers) request information from **servers**
      - **HTTP/HTTPS** are the rules for communication
      - **DNS** is the internet's phonebook
      - **HTML, CSS, and JavaScript** work together to create webpages

      This knowledge gives you a solid foundation for understanding any web technology you encounter in the future.

  - type: "quiz"
    question: "When you understand these fundamentals, what are you better equipped to do?"
    options:
      - "Only build simple websites"
      - "Understand and learn any web technology more effectively"
      - "Become a network administrator immediately"
    solution: 1
    explanation: "Understanding these fundamentals gives you the conceptual foundation to understand how any web technology fits into the bigger picture, making all future learning easier and more meaningful."

  - type: "markdown"
    content: |
      ## What's Next?

      Now that you understand how the internet works, you're ready to dive deeper into specific technologies:

      - **Frontend Development**: Learn to build the client-side of websites using HTML, CSS, and JavaScript
      - **Backend Development**: Learn to build the server-side that handles requests and manages data
      - **Networking**: Dive deeper into how data travels across networks
      - **Web Security**: Understand how to protect websites and users

      The beautiful thing is that everything you learn next will build upon these fundamental concepts you've just mastered.

      Welcome to the world of web technology! 🚀
