item_id: "module-2-item-2"
item_type: "lesson"
title: "The Human-Friendly Address (Domain Name)"
steps:
  - type: "markdown"
    content: |
      Now we have a problem. You just learned that computers use IP addresses like `172.217.164.110` to find each other on the internet.

      But imagine if every time you wanted to visit Google, you had to type `172.217.164.110` into your browser. Or if you wanted to check Facebook, you had to remember `157.240.241.35`.

      This would be absolutely terrible! It would be like having to remember everyone's phone number instead of just their name in your contacts.

  - type: "markdown"
    content: |
      **The Solution: Domain Names**

      Thankfully, the internet has a much better solution. Instead of making humans remember numbers, we can use **domain names**—easy-to-remember names that represent those hard-to-remember IP addresses.

      Examples of domain names:
      - `google.com` instead of `172.217.164.110`
      - `facebook.com` instead of `157.240.241.35`
      - `akood.com` instead of whatever IP address our servers have

      Think of it exactly like your phone's contact list: you don't remember your friend Ibrahim's phone number—you just remember "Ibrahim" and your phone looks up the number for you.

      # media_idea: A side-by-side comparison showing a phone contact list ("Mom", "Ibrahim", "Pizza Place") next to domain names ("google.com", "facebook.com", "akood.com")

  - type: "quiz"
    question: "What is the primary purpose of a domain name?"
    options:
      - "To secure a website from hackers"
      - "To make IP addresses easier for humans to remember"
      - "To make websites load faster"
    solution: 1
    explanation: "Exactly! Domain names exist purely for human convenience. They're easy-to-remember labels that represent hard-to-remember IP addresses, just like contact names in your phone represent hard-to-remember phone numbers."

  - type: "markdown"
    content: |
      **Understanding Domain Structure**

      Let's break down how domain names work using `akood.com` as an example:

      **`.com`** - This is called the "top-level domain" (TLD). It's like the country or region in a postal address. Other examples include `.org`, `.net`, `.edu`, and country-specific ones like `.sa` or `.eg`.

      **`akood`** - This is the actual name chosen by the company or person who registered the domain. It's like the street name in a postal address.

      **`www.akood.com`** - The "www" part is called a "subdomain." It's like an apartment number—it can help direct you to a specific part of the website.

      # media_idea: A visual breakdown of a domain name showing each part labeled, similar to how you might label parts of a postal address

  - type: "markdown"
    content: |
      **Who Owns Domain Names?**

      Here's something important to understand: **domain names are rented, not owned forever.**

      When a company "buys" a domain name, they're actually renting it for a specific period (usually 1-10 years). They have to renew it regularly, just like renewing a lease on an apartment.

      There are companies called "domain registrars" (like Namecheap, Cloudflare or Gandi Domains) that handle the rental process. They make sure no two people can rent the same domain name at the same time.

      If someone forgets to renew their domain name, it becomes available for anyone else to rent!

  - type: "fill"
    lang: "text"
    question: "Complete this domain name structure:"
    code: |
      www.@@INPUT@@.@@INPUT@@
    solution:
      - "/^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]$|^[a-zA-Z0-9]$/"
      - "/^(com|org|net|edu|io|me|co|tv|ae|eg|sa|qa|kw|om|bh|jo|lb|sy|iq|ye|ps|ma|dz|tn|sd|ly)$/"

  - type: "markdown"
    content: |
      **Fun Fact: Creative Domain Names**

      Companies get very creative with domain names! Here are some clever examples:

      - `bit.ly` - A URL shortening service (plays on "bitly")
      - `del.icio.us` - Used to be a bookmarking service (reads as "delicious")
      - `t.co` - Twitter's URL shortener (short for "Twitter company")

      Some companies even use country-specific domains creatively. For example, `.ly` belongs to Libya, but it's popular for making words that end in "ly"!

      The key is that a domain name should be easy to remember, easy to type, and represent what your website is about.

  - type: "quiz"
    question: "If you wanted to visit Google but could only use IP addresses, what would you have to do?"
    options:
      - "Type something like 172.217.164.110 into your browser"
      - "Send an email to Google first"
      - "Connect to the internet differently"
    solution: 0
    explanation: "Correct! Without domain names, you'd have to remember and type IP addresses like 172.217.164.110 to visit websites. Domain names like google.com are much easier for humans to remember and use."

  - type: "markdown"
    content: |
      **The Magic Translation**

      Here's the beautiful thing: when you type `google.com` into your browser, your computer automatically translates it to Google's IP address behind the scenes.

      You get to use the human-friendly name, but the computers still communicate using the numerical IP addresses they prefer.

      It's like having a universal translator that lets you speak in English while the computers speak in numbers. You never have to worry about the translation—it happens automatically.

      In the next module, we'll learn exactly how this magical translation happens. For now, just remember: domain names exist to make your life easier, but underneath it all, computers are still using IP addresses to find each other.

      So the next time someone asks you "What's a domain name?", you can tell them: "It's like a contact name in your phone—an easy-to-remember label that represents a hard-to-remember number!"
