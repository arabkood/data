  # --- STEP 14: Order of operations ---
  - type: "markdown"
    content: |
      Python follows standard math rules for order of operations:

      ```python
      result = 2 + 3 * 4    # result is 14, not 20
      result = (2 + 3) * 4  # result is 20
      ```

      Multiplication and division happen before addition and subtraction, just like in regular math. Use parentheses to change the order when needed.

  # --- STEP 15: Order of operations practice ---
  - type: "quiz"
    question: "What will this code display?"
    code: |
      calculation = 10 + 5 * 2
      print(calculation)
    lang: "python"
    options:
      - "30"
      - "20"
      - "17"
    solution: 2
    explanation: "Following order of operations: 5 * 2 = 10, then 10 + 10 = 20. Multiplication happens before addition."

  # --- STEP 16: Spot the bug ---
  - type: "bug"
    lang: "python"
    question: "Find the line with the mistake"
    code: |
      temperature = 72
      humidity = "65"
      feels_like = temperature + humidity
      print(feels_like)
    solution: 1
    explanation: "You can't do math with a string. The humidity should be 65 (without quotes) to be treated as a number."
    hint: "Look for a number that's stored as a string instead of a number."

  # --- STEP 17: Variable updating ---
  - type: "markdown"
    content: |
      You can update number variables by assigning new values to them:

      ```python
      score = 100
      print(score)    # Displays: 100

      score = 150
      print(score)    # Displays: 150
      ```

      You can even use the variable's current value to calculate its new value:
      ```python
      score = 100
      score = score + 50  # Now score is 150
      print(score)
      ```

