title: "Numbers in Python"

steps:
  # --- STEP 1: Numbers are everywhere ---
  - type: "markdown"
    content: |
      Numbers are just as important as strings in programming. Think about it - ages, prices, scores, temperatures, distances - numbers are everywhere in the programs we use daily.

      The great news? Working with numbers in Python is intuitive and powerful. You can store them in variables, display them with `print()`, and even do math with them!

      Let's dive into the world of numbers in Python.

  # --- STEP 2: Numbers don't need quotes ---
  - type: "markdown"
    content: |
      Remember the key difference from strings: numbers don't need quotation marks.

      ```python
      age = 25          # This is a number
      price = 19.99     # This is also a number
      pi = 3.14159   # Another number
      ```

      Compare this to strings:
      ```python
      name = "Omar"    # This is a string
      year = "2026"    # This is a string that looks like a number
      ```

      When you put quotes around numbers, they become strings (text), not actual numbers you can do math with.

  # --- STEP 3: Quiz about numbers vs strings ---
  - type: "quiz"
    question: "Which of these creates a number variable (not a string)?"
    options:
      - 'temperature = "72"'
      - "temperature = 72"
      - "temperature = '72'"
    solution: 1

  # --- STEP 4: Creating number variables ---
  - type: "fill"
