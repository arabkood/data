item_id: "module-1-item-4"
item_type: "lesson"
title: "الأرقام في بايثون"

steps:
  # --- STEP 1: Numbers are everywhere ---
  - type: "markdown"
    content: |
      تعتبر الأرقام بنفس أهمية النصوص في البرمجة. فكر في الأمر - الأعمار، الأسعار، الدرجات، درجات الحرارة، المسافات - **الأرقام موجودة في كل مكان** في البرامج التي نستخدمها يوميًا.

      والخبر السار؟ التعامل مع الأرقام في بايثون أمر سهل وبديهي للغاية. يمكنك تخزينها في متغيرات، وعرضها باستخدام `print()`، وحتى إجراء العمليات الحسابية عليها!

      هيا بنا نتعمق في عالم الأرقام في بايثون.

  # --- STEP 2: Numbers don't need quotes ---
  - type: "markdown"
    content: |
      تذكر الفرق الرئيسي بين الأرقام والنصوص: **الأرقام لا تحتاج إلى علامات اقتباس**.

      ```python
      age = 25          # هذا رقم
      price = 19.99     # هذا أيضًا رقم
      pi = 3.14159   # رقم آخر
      ```

      قارن هذا بالنصوص:
      ```python
      name = "فاطمة"    # هذا نص
      year = "2026"    # هذا نص يشبه الرقم
      ```

      عندما تضع علامات اقتباس حول الأرقام، فإنها تصبح `نصوصًا`، وليست أرقامًا فعلية يمكنك إجراء عمليات حسابية عليها.

  # --- STEP 3: Quiz about numbers vs strings ---
  - type: "quiz"
    question: "أي من هذه الخيارات ينشئ متغيرًا رقميًا (وليس نصيًا)؟"
    options:
      - 'temperature = "72"'
      - "temperature = 72"
      - "temperature = '72'"
    solution: 1

  # --- STEP 4: Creating number variables ---
  - type: "fill"
    lang: "python"
    question: "أنشئ ثلاثة متغيرات رقمية: `height` بالقيمة 175، و `weight` بالقيمة 68، و `age` بالقيمة 30."
    code: |
      @@INPUT@@
      @@INPUT@@
      @@INPUT@@
    solution:
      - "height = 175"
      - "weight = 68"
      - "age = 30"
    explanation: "الأرقام لا تحتاج إلى علامات اقتباس عند تخزينها في متغيرات."

  # --- STEP 5: Using number variables ---
  - type: "markdown"
    content: |
      تمامًا كما هو الحال مع النصوص، يمكنك الوصول إلى القيمة المخزنة في `متغير` رقمي عن طريق استدعاء اسمه:

      ```python
      score = 85
      print(score)      # هذا يعرض: 85
      print("score")    # هذا يعرض: score
      ```

      تذكر: لا تضع علامات اقتباس حول اسم المتغير عندما تريد استخدام قيمته!

  # --- STEP 6: Practice printing number variables ---
  - type: "fill"
    lang: "python"
    question: "أنشئ متغيرًا باسم `points` بقيمة 250، ثم اطبعه."
    code: |
      points @@INPUT@@ 250
      print(@@INPUT@@)
    solution:
      - "="
      - "points"
    explanation: "يمكنك إسناد القيم للمتغيرات باستخدام علامة المساواة. ويمكنك الوصول إلى القيمة المخزنة في متغير عن طريق استدعاء اسمه بدون علامات اقتباس."

  # --- STEP 7: Simple math operations ---
  - type: "markdown"
    content: |
      وهنا تكمن متعة الأرقام! يمكنك إجراء عمليات حسابية عليها باستخدام هذه الرموز:

      - `+` للجمع
      - `-` للطرح
      - `*` للضرب
      - `/` للقسمة

      ```python
      result = 10 + 5    # result = 15
      difference = 20 - 8  # difference = 12
      product = 6 * 7    # product = 42
      quotient = 15 / 3  # quotient = 5.0
      ```

  # --- STEP 8: Math operations quiz ---
  - type: "quiz"
    question: "ماذا سيعرض هذا الكود؟"
    code: |
      answer = 12 + 8
      print(answer)
    lang: "python"
    options:
      - "12 + 8"
      - "20"
      - "answer"
    solution: 1
    explanation: "تقوم بايثون بحساب 12 + 8 لتحصل على 20، وتخزنها في المتغير `answer`، ثم تطبع تلك القيمة."

  # --- STEP 9: Practice with math operations ---
  - type: "fill"
    lang: "python"
    question: "احسب مساحة مستطيل: أنشئ متغيرين للطول `length` (12) والعرض `width` (8)، ثم احسب المساحة واطبعها."
    code: |
      length = @@INPUT@@
      width = @@INPUT@@
      area = length @@INPUT@@ width
      print(area)
    solution:
      - "12"
      - "8"
      - "*"
    explanation: "مساحة المستطيل هي الطول × العرض. رمز الضرب في بايثون هو `*`."

  # --- STEP 10: Math with variables ---
  - type: "markdown"
    content: |
      يمكنك استخدام المتغيرات في العمليات الحسابية تمامًا مثل الأرقام المباشرة:

      ```python
      price = 25
      tax = 3
      total = price + tax
      print(total)  # هذا يعرض: 28
      ```

      هذا مفيد بشكل لا يصدق - يمكنك تخزين القيم في متغيرات ثم إجراء الحسابات عليها.

  # --- STEP 11: More math practice ---
  - type: "fill"
    lang: "python"
    question: "احسب متوسط درجات طالب: أنشئ متغيرات لثلاث درجات اختبار (85، 92، 78)، ثم احسب المتوسط واطبعه."
    code: |
      test1 = 85
      test2 = 92
      test3 = 78
      total = test1 @@INPUT@@ test2 @@INPUT@@ test3
      average = total @@INPUT@@ 3
      print(average)
    solution:
      - "+"
      - "+"
      - "/"
    explanation: "لإيجاد المتوسط، تقوم بجمع كل الأرقام معًا ثم تقسمها على عددها."

  # --- STEP 12: Mixed strings and numbers ---
  - type: "markdown"
    content: |
      يمكنك دمج النصوص والأرقام في برامجك عن طريق طباعة كل منها على حدة:

      ```python
      name = "ريم"
      age = 25
      score = 95

      print("اسم اللاعبة:")
      print(name)
      print("العمر:")
      print(age)
      print("الدرجة:")
      print(score)
      ```

      هذا ينشئ مخرجات منسقة بشكل جيد تعرض كلًا من التسميات النصية والقيم الرقمية.

  # --- STEP 13: Practice mixing strings and numbers ---
  - type: "fill"
    lang: "python"
    question: |
      أنشئ قائمة بسيطة لمنتج: 

      - المنتج: حاسوب محمول
      - السعر: 899
      - الكمية: 5

      ثم اعرض جميع المعلومات مع تسمياتها."
    code: |
      product = @@INPUT@@
      price = @@INPUT@@
      quantity = @@INPUT@@

      print("المنتج:")
      print(@@INPUT@@)
      print("السعر:")
      print(@@INPUT@@)
      print("الكمية:")
      print(@@INPUT@@)
    solution:
      - '"حاسوب محمول"'
      - "899"
      - "5"
      - "product"
      - "price"
      - "quantity"

  # --- STEP 14: Order of operations ---
  - type: "markdown"
    content: |
      تتبع بايثون القواعد الرياضية القياسية لـ **أولويات العمليات الحسابية**:

      ```python
      result = 2 + 3 * 4    # النتيجة هي 14، وليس 20
      result = (2 + 3) * 4  # النتيجة هي 20
      ```

      تتم عمليات الضرب والقسمة قبل الجمع والطرح، تمامًا كما في الرياضيات العادية. استخدم الأقواس لتغيير الترتيب عند الحاجة.

  # --- STEP 15: Order of operations practice ---
  - type: "quiz"
    question: "ماذا سيعرض هذا الكود؟"
    code: |
      calculation = 10 + 5 * 2
      print(calculation)
    lang: "python"
    options:
      - "30"
      - "20"
      - "17"
    solution: 1
    explanation: "وفقًا لأولويات العمليات الحسابية: 5 * 2 = 10، ثم 10 + 10 = 20. عملية الضرب تحدث قبل عملية الجمع."

  # --- STEP 16: Spot the bug ---
  - type: "bug"
    lang: "python"
    question: "ابحث عن السطر الذي يحتوي على الخطأ"
    code: |
      temperature = 72
      humidity = "65"
      feels_like = temperature + humidity
      print(feels_like)
    solution: 1
    explanation: "لا يمكنك إجراء عملية حسابية على `نص`. يجب أن تكون الرطوبة `humidity` تساوي 65 (بدون علامات اقتباس) ليتم التعامل معها كرقم."
    hint: "ابحث عن رقم تم تخزينه كنص بدلاً من رقم."

  # --- STEP 17: Variable updating ---
  - type: "markdown"
    content: |
      يمكنك تحديث المتغيرات الرقمية عن طريق إسناد قيم جديدة لها:

      ```python
      score = 100
      print(score)    # يعرض: 100

      score = 150
      print(score)    # يعرض: 150
      ```

      يمكنك حتى استخدام القيمة الحالية للمتغير لحساب قيمته الجديدة:
      ```python
      score = 100
      score = score + 50  # الآن score تساوي 150
      print(score)
      ```

  # --- STEP 18: Practice updating variables ---
  - type: "fill"
    lang: "python"
    question: "ابدأ برصيد بنكي قدره 1000، وأضف إيداعًا بقيمة 250، ثم اطرح سحبًا بقيمة 75. اطبع الرصيد النهائي."
    code: |
      balance = @@INPUT@@
      balance = balance + @@INPUT@@
      balance = balance - @@INPUT@@
      print(balance)
    solution:
      - "1000"
      - "250"
      - "75"
    explanation: "يمكنك تحديث متغير باستخدام قيمته الحالية في عملية حسابية وإعادة إسناد النتيجة إلى نفس المتغير."

  # --- STEP 19: Order challenge ---
  - type: "order"
    lang: "python"
    question: "رتب هذه الأسطر البرمجية لحساب التكلفة الإجمالية للعناصر مع الضريبة."
    code:
      - item_price = 50
      - tax_rate = 5
      - total_cost = item_price + tax_rate
      - print("التكلفة الإجمالية:")
      - print(total_cost)
    alternate:
      - [0, 1, 2, 3, 4]
      - [1, 0, 2, 3, 4]
    explanation: "يجب إنشاء المتغيرات قبل استخدامها في العمليات الحسابية. وتأتي العملية الحسابية قبل طباعة النتيجة."

  # --- STEP 20: Final comprehensive practice ---
  - type: "fill"
    lang: "python"
    question: "أنشئ آلة حاسبة بسيطة: قم بتخزين رقمين (15 و 8)، واحسب مجموعهما، والفرق بينهما، وحاصل ضربهما، ثم اعرض جميع النتائج مع تسمياتها."
    code: |
      number1 = @@INPUT@@
      number2 = @@INPUT@@

      sum_result = number1 @@INPUT@@ number2
      difference = number1 @@INPUT@@ number2
      product = number1 @@INPUT@@ number2

      print("الرقم الأول:")
      print(@@INPUT@@)
      print("الرقم الثاني:")
      print(@@INPUT@@)
      print("المجموع:")
      print(@@INPUT@@)
      print("الفرق:")
      print(@@INPUT@@)
      print("الناتج:")
      print(@@INPUT@@)
    solution:
      - "15"
      - "8"
      - "+"
      - "-"
      - "*"
      - "number1"
      - "number2"
      - "sum_result"
      - "difference"
      - "product"
    explanation: "يوضح هذا المثال تخزين الأرقام في متغيرات، وإجراء العمليات الحسابية، وعرض النتائج مع تسميات توضيحية."

  # --- STEP 21: Congratulations ---
  - type: "markdown"
    content: |
      ممتاز! لقد أتقنت التعامل مع الأرقام في بايثون.

      **ماذا تعلمت:**
      - يمكن تخزين القيم الرقمية في متغيرات.
      - يمكنك الوصول إلى القيمة المخزنة في متغير عن طريق استدعاء اسمه.
      - لا يجب إحاطة البيانات الرقمية بعلامات اقتباس.
      - يمكنك إجراء العمليات الحسابية: `+`، `-`، `*`، `/`.
      - يمكنك استخدام المتغيرات في العمليات الحسابية.
      - يمكنك تحديث المتغيرات بقيم جديدة.
      - يمكنك دمج النصوص والأرقام في برامجك.

      تعد الأرقام أساسية في البرمجة - من العد البسيط إلى الحسابات المعقدة. لديك الآن الأدوات اللازمة للعمل مع البيانات الرقمية بثقة.

      > [!NEXT]
      > في الدرس القادم، سنقوم بتطبيق كل ما تعلمناه في تمرين عملي شامل!
