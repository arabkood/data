    solution:
      - "height = 175"
      - "weight = 68"
      - "age = 30"
    explanation: "Numbers don't need quotation marks when stored in variables."

  # --- STEP 5: Using number variables ---
  - type: "markdown"
    content: |
      Just like with strings, you can access the value stored in a number variable by calling its name:

      ```python
      score = 85
      print(score)      # This displays: 85
      print("score")    # This displays: score
      ```

      Remember: no quotes around the variable name when you want to use its value!

  # --- STEP 6: Practice printing number variables ---
  - type: "fill"
    lang: "python"
    question: "Create a variable called 'points' with the value 250, then print it."
    code: |
      points @@INPUT@@ 250
      print(@@INPUT@@)
    solution:
      - "="
      - "points"
    explanation: "You can assign values to variables with the equal sign. You can access the value stored in a variable by calling its name without quotes."

  # --- STEP 7: Simple math operations ---
  - type: "markdown"
    content: |
      Here's where numbers get exciting! You can do math with them using these symbols:

      - `+` for addition
      - `-` for subtraction
      - `*` for multiplication
      - `/` for division

      ```python
      result = 10 + 5    # result = 15
      difference = 20 - 8  # difference = 12
      product = 6 * 7    # product = 42
      quotient = 15 / 3  # quotient = 5.0
      ```

  # --- STEP 8: Math operations quiz ---
  - type: "quiz"
    question: "What will this code display?"
    code: |
      answer = 12 + 8
      print(answer)
    lang: "python"
    options:
      - "12 + 8"
      - "20"
      - "answer"
    solution: 1
    explanation: "Python calculates 12 + 8 to get 20, stores it in the variable 'answer', then prints that value."

  # --- STEP 9: Practice with math operations ---
  - type: "fill"
    lang: "python"
    question: "Calculate the area of a rectangle: create variables for length (12) and width (8), then calculate and print the area."
    code: |
      length = @@INPUT@@
      width = @@INPUT@@
      area = length @@INPUT@@ width
      print(area)
    solution:
      - "12"
      - "8"
      - "*"
    explanation: "Area of a rectangle is length × width. The multiplication symbol in Python is *."

  # --- STEP 10: Math with variables ---
  - type: "markdown"
    content: |
      You can use variables in math operations just like direct numbers:

      ```python
      price = 25
      tax = 3
      total = price + tax
      print(total)  # This displays: 28
      ```

      This is incredibly useful - you can store values in variables and then perform calculations with them.

  # --- STEP 11: More math practice ---
  - type: "fill"
    lang: "python"
    question: "Calculate a student's average: create variables for three test scores (85, 92, 78), then calculate and print the average."
    code: |
      test1 = 85
      test2 = 92
      test3 = 78
      total = test1 @@INPUT@@ test2 @@INPUT@@ test3
      average = total @@INPUT@@ 3
      print(average)
    solution:
      - "+"
      - "+"
      - "/"
    explanation: "To find an average, you add all the numbers together and divide by how many numbers there are."

  # --- STEP 12: Mixed strings and numbers ---
  - type: "markdown"
    content: |
      You can combine strings and numbers in your programs by printing them separately:

      ```python
      name = "Reem"
      age = 25
      score = 95

      print("Player name:")
      print(name)
      print("Age:")
      print(age)
      print("Score:")
      print(score)
      ```

      This creates a nice formatted output showing both text labels and numerical values.

