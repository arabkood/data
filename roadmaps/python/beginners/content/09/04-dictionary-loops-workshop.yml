  - type: "markdown"
    content: |
      **الطريقة الثالثة: المرور على الأزواج (مفتاح + قيمة)**

      ```python
      student = {"name": "أحمد", "age": 20}

      for key, value in student.items():
          print(key, ":", value)
      # name : أحمد
      # age : 20
      ```

      استخدم `.items()` للحصول على المفتاح والقيمة معاً!

