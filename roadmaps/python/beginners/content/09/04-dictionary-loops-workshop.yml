steps:
  - type: "markdown"
    content: |
      الحلقات + القواميس = قوة خارقة! 🔥

      يمكننا المرور على كل عناصر القاموس باستخدام حلقات `for`.

      هناك 3 طرق رئيسية:
      - المرور على المفاتيح
      - المرور على القيم
      - المرور على الأزواج (مفتاح + قيمة)

  - type: "markdown"
    content: |
      **الطريقة الأولى: المرور على المفاتيح**

      ```python
      scores = {"أحمد": 90, "سارة": 95, "خالد": 88}

      for name in scores:
          print(name)
      # أحمد
      # سارة
      # خالد
      ```

      عندما تمر على القاموس مباشرة، تحصل على المفاتيح!

  - type: "fill"
    lang: "python"
    question: "اطبع كل مفتاح في القاموس"
    code: |
      ages = {"علي": 25, "فاطمة": 30, "محمد": 22}
      @@INPUT@@ person @@INPUT@@ ages:
          print(person)
    solution:
      - "for"
      - "in"

  - type: "fill"
    lang: "python"
    question: "اطبع كل اسم منتج من القاموس"
    code: |
      products = {"laptop": 5000, "mouse": 50, "keyboard": 200}
      for @@INPUT@@ in @@INPUT@@:
          print(@@INPUT@@)
    solution:
      - "/^(item|product|key|name)$/"
      - "products"
      - "/^(item|product|key|name)$/"

  - type: "markdown"
    content: |
      **الطريقة الثانية: المرور على القيم**

      ```python
      prices = {"apple": 5, "banana": 3}

      for price in prices.values():
          print(price)
      # 5
      # 3
      ```

      استخدم `.values()` للحصول على القيم فقط!

