steps:
  - type: "markdown"
    content: |
      تخيل أنك تريد تخزين معلومات عن شخص: اسمه، عمره، مدينته.

      يمكنك استخدام قائمة هكذا:
      ```python
      person = ["أحمد", 25, "الرياض"]
      ```

      لكن هناك مشكلة! كيف ستتذكر أن `person[0]` هو الاسم و `person[1]` هو العمر؟ الأرقام لا تخبرنا بشيء!

  - type: "markdown"
    content: |
      هنا تأتي **القواميس** (Dictionaries) لحل هذه المشكلة!

      القاموس يخزن البيانات على شكل **أزواج**: **مفتاح** (key) و**قيمة** (value).

      ```python
      person = {
          "name": "أحمد",
          "age": 25,
          "city": "الرياض"
      }
      ```

      الآن كل قيمة لها اسم واضح! `"name"` هو المفتاح، و`"أحمد"` هو القيمة.

  - type: "quiz"
    question: "ما الفرق الأساسي بين القوائم والقواميس؟"
    options:
      - "القوائم أسرع من القواميس"
      - "القواميس تستخدم مفاتيح لتحديد القيم، القوائم تستخدم أرقام الفهرس"
      - "القواميس يمكنها فقط تخزين النصوص"
    solution: 1
    explanation: "القواميس تستخدم مفاتيح (keys) ذات معنى للوصول للقيم، بينما القوائم تستخدم أرقام الفهرس (0, 1, 2...)"

  - type: "markdown"
    content: |
      لننشئ قاموسنا الأول!

      القاموس يُكتب باستخدام الأقواس المعقوفة `{}` وكل عنصر يكون: `مفتاح: قيمة`

      ```python
      student = {
          "name": "سارة",
          "grade": 95
      }
      ```

  - type: "fill"
    lang: "python"
    question: "أنشئ قاموس لكتاب يحتوي على عنوان ومؤلف"
    code: |
      book = @@INPUT@@
          @@INPUT@@: "الأجنحة المتكسرة",
          @@INPUT@@: "جبران خليل جبران"
      }
    solution:
      - "{"
      - "/^(\"title\"|'title')$/"
      - "/^(\"author\"|'author')$/"

  - type: "markdown"
    content: |
      للوصول إلى قيمة معينة، نستخدم المفتاح بدلاً من الرقم:

      ```python
      person = {"name": "أحمد", "age": 25}
      print(person["name"])  # أحمد
      print(person["age"])   # 25
      ```

      لاحظ: نستخدم الأقواس المربعة `[]` مع المفتاح للوصول للقيمة.

  - type: "fill"
    lang: "python"
    question: "اطبع قيمة المدينة من القاموس"
    code: |
      location = {"country": "السعودية", "city": "جدة"}
      print(@@INPUT@@)
    solution:
      - "/^location\\[(\"|')city(\"|')\\]$/"

  - type: "markdown"
    content: |
      يمكن للقاموس أن يحتوي على أنواع مختلفة من البيانات:

      ```python
      data = {
          "text": "مرحبا",      # نص
          "number": 100,        # رقم صحيح
          "price": 49.99,       # رقم عشري
          "active": True        # قيمة منطقية
      }
      ```

  - type: "quiz"
