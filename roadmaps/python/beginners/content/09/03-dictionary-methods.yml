steps:
  - type: "markdown"
    content: |
      القواميس في Python لديها دوال مفيدة جداً!

      في هذا الدرس سنتعلم 4 دوال أساسية:
      - `.keys()` للحصول على المفاتيح
      - `.values()` للحصول على القيم
      - `.items()` للحصول على الأزواج
      - `.get()` للوصول الآمن

  - type: "markdown"
    content: |
      **الدالة `.keys()`** تعطيك كل المفاتيح في القاموس:

      ```python
      person = {"name": "أحمد", "age": 25, "city": "جدة"}
      print(person.keys())
      # dict_keys(['name', 'age', 'city'])
      ```

      يمكنك تحويلها لقائمة: `list(person.keys())`

  - type: "fill"
    lang: "python"
    question: "احصل على جميع المفاتيح من القاموس"
    code: |
      product = {"name": "كتاب", "price": 50, "stock": 100}
      keys = @@INPUT@@.@@INPUT@@
      print(keys)
    solution:
      - "product"
      - "keys()"

  - type: "markdown"
    content: |
      **الدالة `.values()`** تعطيك كل القيم في القاموس:

      ```python
      scores = {"math": 90, "science": 85}
      print(scores.values())
      # dict_values([90, 85])
      ```

      مفيدة لحساب المجموع أو المتوسط!

