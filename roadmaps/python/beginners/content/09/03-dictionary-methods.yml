  - type: "markdown"
    content: |
      **الدالة `.items()`** تعطيك كل زوج (مفتاح، قيمة):

      ```python
      car = {"brand": "تويوتا", "year": 2023}
      print(car.items())
      # dict_items([('brand', 'تويوتا'), ('year', 2023)])
      ```

      مفيدة جداً مع الحلقات! (سنراها قريباً)

  - type: "quiz"
    question: "ماذا تُرجع الدالة `.items()`؟"
    options:
      - "قائمة بالمفاتيح فقط"
      - "قائمة بالقيم فقط"
      - "أزواج (مفتاح، قيمة) لكل عنصر"
    solution: 2

  - type: "markdown"
    content: |
      **الدالة `.get()`** - طريقة آمنة للوصول للقيم!

      ```python
      user = {"name": "سارة"}

      # الطريقة العادية - تسبب خطأ إن لم يوجد المفتاح
      # print(user["email"])  # خطأ!

      # الطريقة الآمنة - تُرجع None إن لم يوجد
      print(user.get("email"))  # None
      ```

