  - type: "markdown"
    content: |
      ممتاز! الآن أتقنت:

      ✅ `.keys()` - الحصول على كل المفاتيح
      ✅ `.values()` - الحصول على كل القيم
      ✅ `.items()` - الحصول على أزواج (مفتاح، قيمة)
      ✅ `.get()` - الوصول الآمن للقيم

