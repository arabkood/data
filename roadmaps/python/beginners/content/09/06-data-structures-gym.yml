      student[@@INPUT@@].@@INPUT@@(@@INPUT@@)
      print(student["scores"])
    solution:
      - "/^(\"|')scores(\"|')$/"
      - "append"
      - "95"

  - type: "markdown"
    content: |
      **قائمة تحتوي على قواميس:**

      ```python
      students = [
          {"name": "أحمد", "age": 20},
          {"name": "سارة", "age": 22}
      ]

      print(students[0]["name"])  # أحمد
      ```

      نستخدم `[فهرس][مفتاح]` للوصول للقيمة!

