  - type: "markdown"
    content: |
      الآن سنجمع بين القوائم والقواميس معاً! 🔥

      تخيل: قاموس يحتوي على قوائم، أو قائمة تحتوي على قواميس!

      هذا التدريب سيجعلك خبيراً في التعامل مع البيانات المعقدة.

  - type: "markdown"
    content: |
      **قاموس يحتوي على قوائم:**

      ```python
      student = {
          "name": "أحمد",
          "grades": [90, 85, 88]
      }

      print(student["grades"][0])  # 90
      ```

      نستخدم `[مفتاح][فهرس]` للوصول لعنصر في القائمة!

  - type: "fill"
    lang: "python"
    question: "اطبع أول مدينة من قائمة المدن"
    code: |
      country = {
          "name": "السعودية",
          "cities": ["الرياض", "جدة", "الدمام"]
      }
      print(country@@INPUT@@)
    solution:
      - "/^\\[(\"|')cities(\"|')\\]\\[0\\]$/"

  - type: "fill"
    lang: "python"
    question: "أضف درجة جديدة (95) لقائمة الدرجات"
    code: |
