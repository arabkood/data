item_id: "deeper-1-statements-expressions"
item_type: "lesson"
title: "Python Statements & Expressions"

steps:
  - type: "markdown"
    content: |
      You've been writing Python code for a while now, but let's put on our **engineer glasses** and see what's really happening.

      Look at this familiar code:
      ```python
      name = "Alice"
      print(name)
      ```

      There are actually two different types of things happening here. Some parts of your code **do something**, while others **evaluate to something**. Let's discover the difference!

  - type: "markdown"
    content: |
      ## The Two Types of Code

      Think of Python code like a recipe:
      - **Statements** are like instructions: "Mix the ingredients" or "Bake for 30 minutes"
      - **Expressions** are like ingredients: "2 cups of flour" or "the mixture in the bowl"

      **Statements DO something** - they perform an action.
      **Expressions EVALUATE TO something** - they have a value.

      <!-- media_idea: Simple visual showing a chef (statement) working with ingredients (expressions) -->

  - type: "quiz"
    question: "In this line of code, what type of thing is `name = \"Alice\"`?"
    code: |
      name = "Alice"
      print(name)
    lang: python
    options:
      - "An expression - it evaluates to something"
      - "A statement - it does something"
      - "Both a statement and an expression"
    solution: 1
    explanation: "This is a statement because it DOES something - it stores the value \"Alice\" in the variable name. It performs the action of assignment."

  - type: "quiz"
    question: "What about `\"Alice\"` by itself?"
    code: |
      name = "Alice"
      print(name)
    lang: python
    options:
      - "A statement - it does something"
      - "An expression - it evaluates to something"
      - "Neither - it's just text"
    solution: 1
    explanation: "\"Alice\" is an expression because it evaluates to the string value \"Alice\". It has a value, but it doesn't DO anything by itself."

  - type: "markdown"
    content: |
      Let's practice with more examples you already know:

      ```python
      score = 100
      new_score = score + 50
      print(new_score)
      ```

      Can you spot the statements and expressions?

  - type: "quiz"
    question: "What is `score + 50`?"
    code: |
      score = 100
      new_score = score + 50
      print(new_score)
    lang: python
    options:
      - "A statement - it does something"
      - "An expression - it evaluates to something"
      - "A variable"
    solution: 1
    explanation: "score + 50 is an expression because it evaluates to the value 150. It doesn't DO anything - it just has a value that gets stored in new_score."

  - type: "quiz"
    question: "What is `print(new_score)`?"
    code: |
      score = 100
      new_score = score + 50
      print(new_score)
    lang: python
    options:
      - "An expression - it evaluates to something"
      - "A statement - it does something"
      - "A variable"
    solution: 1
    explanation: "print(new_score) is a statement because it DOES something - it displays the value on the screen. It performs an action."

  - type: "markdown"
    content: |
      ## The Secret: Statements Use Expressions

      Here's the key insight: **Statements often contain expressions**.

      ```python
      age = 25 + 5
      ```

      - `age = 25 + 5` is the **statement** (it does the action of storing)
      - `25 + 5` is the **expression** (it evaluates to 30)
      - `25` and `5` are also **expressions** (they evaluate to themselves)

  - type: "fill"
    lang: "python"
    question: "Complete this code by identifying what type each part is:"
    code: |
      # This whole line is a @@INPUT@@
      message = "Hello " + "World"
      #         ^^^^^^^^^^^^^
      #         This part is an @@INPUT@@
    solution:
      - "statement"
      - "expression"
    explanation: "The entire line performs an action (storing), making it a statement. The \"Hello \" + \"World\" part evaluates to \"Hello World\", making it an expression."

  - type: "order"
    lang: "python"
    question: "Put these code parts in order from most specific to most general:"
    code:
      - "42"
      - "age + 10"
      - "result = age + 10"
    explanation: "42 is a simple expression, age + 10 is a more complex expression, and result = age + 10 is a statement that uses the expression."

  - type: "markdown"
    content: |
      ## Code Runs Line by Line

      Remember from our earlier lessons - Python executes your code **line by line, from top to bottom**.

      ```python
      first = "Hello"     # Line 1: Do this first
      second = "World"    # Line 2: Then do this
      result = first + second  # Line 3: Then do this
      print(result)       # Line 4: Finally do this
      ```

      This is called **execution order**.

  - type: "quiz"
    question: "What happens if we switch the order?"
    code: |
      print(result)
      result = first + second
      first = "Hello"
      second = "World"
    lang: python
    options:
      - "It works the same way"
      - "Python gives an error"
      - "It prints an empty result"
    solution: 1
    explanation: "Python gives an error because when it tries to print(result), the variable result doesn't exist yet. Order matters!"

  - type: "fill"
    lang: "python"
    question: "Fix this code by putting the lines in the correct order:"
    code: |
      @@INPUT@@
      @@INPUT@@
      @@INPUT@@
    solution:
      - "price = 100"
      - "tax = price * 0.1"
      - "print(tax)"
    explanation: "We need to create the price variable first, then calculate tax using that price, then print the result."

  - type: "bug"
    lang: "python"
    question: "Find the line that breaks the execution order:"
    code: |
      name = "Python"
      print(greeting)
      greeting = "Hello " + name
      print(name)
    solution: 1
    explanation: "Line 2 tries to print 'greeting' before it's been created on line 3. Variables must be created before they're used."
    hint: "Look for a variable being used before it's defined."

  - type: "markdown"
    content: |
      ## Practice Time: Spot the Statements and Expressions

      Let's test your new engineer vision! Look at this code and identify the different parts:

      ```python
      user_name = "Sam"
      age = 25
      introduction = "Hi, I'm " + user_name
      print(introduction)
      ```

  - type: "quiz"
    question: "How many statements are in the code above?"
    code: |
      user_name = "Sam"
      age = 25
      introduction = "Hi, I'm " + user_name
      print(introduction)
    lang: python
    options:
      - "2 statements"
      - "3 statements"
      - "4 statements"
    solution: 2
    explanation: "All 4 lines are statements because they all DO something: assign values to variables or print output."

  - type: "quiz"
    question: "Which of these is NOT an expression in the code?"
    code: |
      user_name = "Sam"
      age = 25
      introduction = "Hi, I'm " + user_name
      print(introduction)
    lang: python
    options:
      - "\"Sam\""
      - "25"
      - "\"Hi, I'm \" + user_name"
      - "print(introduction)"
    solution: 3
    explanation: "print(introduction) is a statement, not an expression. It DOES something (displays output) rather than evaluating to a value."

  - type: "order"
    lang: "python"
    question: "Arrange these lines so the code runs without errors:"
    code:
      - "total = price + tip"
      - "print(\"Total cost:\", total)"
      - "price = 50"
      - "tip = price * 0.15"
    explanation: "We need to set the price first, then calculate the tip using that price, then calculate the total, and finally print it."

  - type: "fill"
    lang: "python"
    question: "Complete this code with the correct execution order:"
    code: |
      # Step 1: Create the base value
      base = @@INPUT@@
      
      # Step 2: Calculate using the base
      doubled = @@INPUT@@
      
      # Step 3: Display the result
      @@INPUT@@
    solution:
      - "10"
      - "base * 2"
      - "print(doubled)"
    explanation: "We create the base value first, then use it in a calculation, then display the final result."

  - type: "markdown"
    content: |
      ## Summary: Your Engineer Glasses Are On!

      You now understand the fundamental building blocks of Python:

      **Statements** (the doers):
      - Perform actions
      - Examples: `name = "Alice"`, `print(result)`

      **Expressions** (the evaluators):
      - Have values
      - Examples: `"Alice"`, `age + 5`, `"Hello " + name`

      **Execution Order**:
      - Code runs line by line, top to bottom
      - Variables must be created before they're used

      This knowledge will help you read any Python code like a pro! 🚀
