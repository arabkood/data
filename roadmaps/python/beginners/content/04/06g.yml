title: "المعامل NOT"
steps:
  - type: "markdown"
    content: |
      ### عكس المنطق

      حتى الآن، ركزنا على التحقق مما إذا كان الشرط صحيحاً (`True`).
      `if score > 100:` (هل النتيجة أكبر من 100؟)
      `if user == "admin":` (هل المستخدم هو المدير؟)

      ولكن في بعض الأحيان، يكون من الأسهل والأكثر منطقية التحقق مما إذا كان الشرط **خاطئاً** (`False`).

      تخيل أنك تريد تنفيذ إجراء معين فقط إذا كان المستخدم **ليس** مسجلاً دخوله، أو إذا كانت اللعبة **لم** تنتهِ بعد.

      يمكنك كتابة `if is_logged_in == False:`، وهذا يعمل بشكل صحيح. لكن بايثون توفر طريقة أكثر أناقة وقراءة: المعامل `not`.

  - type: "markdown"
    content: |
      ### تقديم المعامل `not`

      المعامل `not` هو أبسط معامل منطقي. كل ما يفعله هو **عكس** قيمة `boolean`.

      *   `not True` تصبح `False`.
      *   `not False` تصبح `True`.

      فكر فيه كمفتاح تبديل للضوء. إذا كان الضوء مضاءً (`True`)، فإن `not` يطفئه (`False`). وإذا كان مطفأً (`False`)، فإن `not` يضيئه (`True`).

      ```python
      print(not True)
      print(not False)

      is_game_over = False
      print(not is_game_over)
      ```

      **الناتج:**
      ```text
      False
      True
      True
      ```
    # media_idea: رسم بسيط يظهر مفتاح تبديل. في الوضع "ON"، هناك لمبة مضيئة وكلمة "True". سهم مكتوب عليه "not" يشير إلى الوضع "OFF" حيث تكون اللمبة مطفأة وكلمة "False". وسهم آخر يعود بالعكس.

