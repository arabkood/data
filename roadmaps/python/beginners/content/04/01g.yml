---
item_id: "m4-l1-intro-to-booleans-and-if"
item_type: "lesson"
title: "مقدمة للمنطق البوليني وجمل if"
steps:
  - type: "markdown"
    content: |
      حتى الآن، كل الأكواد التي كتبناها كانت تُنفذ سطراً بسطر، من الأعلى إلى الأسفل.

      لكن ماذا لو أردنا تشغيل جزء من الكود فقط **في بعض الأحيان**؟

      تخيل لعبة: لا يجب أن تظهر رسالة "لقد فزت!" إلا إذا كانت نقاط اللاعب أعلى من 100. أو في تطبيق تسجيل الدخول، لا يجب أن يُسمح للمستخدم بالدخول إلا إذا كانت كلمة المرور صحيحة.

      هنا يأتي دور اتخاذ القرارات في البرمجة.

  - type: "markdown"
    content: |
      لجعل الكمبيوتر يتخذ قرارًا، يحتاج إلى إجابة بسيطة: "نعم" أو "لا".

      في بايثون، هذه الإجابات لها أسماء خاصة: `True` (صحيح) و `False` (خطأ).

      هاتان القيمتان هما أساس ما يسمى بـ **المنطق البوليني (Boolean Logic)**. إنهما ببساطة طريقتنا لتمثيل الحقيقة والباطل في الكود.
      
      # media_idea: صورة لمفتاح إضاءة. وضع التشغيل ON مُعلَّم بـ `True`، ووضع الإيقاف OFF مُعلَّم بـ `False`.

  - type: "markdown"
    content: |
      لاحظ أن `True` و `False` هما كلمتان مفتاحيتان خاصتان في بايثون، وليستا نصوصًا.

      هذا يعني أننا نكتبهما مباشرة بدون علامات اقتباس.

      `is_raining = True` ✅ (قيمة بولينية)
      `is_raining = "True"` ❌ (هذا مجرد نص أو string)

  - type: "quiz"
    question: "أي من الخيارات التالية يمثل القيم البولينية الصحيحة في بايثون؟"
    options:
      - '`"True"` و `"False"`'
      - "`Yes` و `No`"
      - "`True` و `False`"
      - "`1` و `0`"
    solution: 2
    explanation: |
      القيمتان البولينيتان في بايثون هما الكلمتان المفتاحيتان `True` و `False`. لاحظ أنهما تبدآن بحرف كبير وبدون علامات اقتباس.

  - type: "markdown"
    content: |
      رائع! الآن بعد أن عرفنا عن `True` و `False`، كيف نستخدمهما لاتخاذ القرارات؟

      نستخدم **جملة `if`**.

      فكر في جملة `if` كحارس بوابة للكود الخاص بك. إنها تتحقق من شرط ما. إذا كان الشرط `True`، فإنها تسمح بتنفيذ الكود الذي تحرسه. إذا كان الشرط `False`، فإنها تتجاهل ذلك الكود تمامًا.

      # media_idea: رسم بياني بسيط يظهر مسارًا ينقسم إلى قسمين. عند نقطة الانقسام توجد بوابة عليها علامة `if`. المسار الذي يمر عبر البوابة مكتوب عليه `True`، والمسار الآخر مكتوب عليه `False`.

  - type: "markdown"
    content: |
      هيكل جملة `if` بسيط جدًا:

      1.  الكلمة المفتاحية `if`.
      2.  الشرط الذي يتم التحقق منه (الذي يجب أن يكون `True` أو `False`).
      3.  نقطتان رأسيتان `:`.
      4.  سطر (أو أسطر) من الكود بمسافة بادئة (Indented).

      ```python
      if condition:
          # هذا الكود يُنفذ فقط إذا كان الشرط True
          # لاحظ المسافة في بداية السطر
      ```
      المسافة البادئة (Indentation) مهمة جدًا في بايثون. إنها الطريقة التي يعرف بها بايثون أن هذا الكود "يتبع" جملة `if`. سنتحدث عنها أكثر لاحقًا!

  - type: "fill"
    lang: "python"
    question: |
      أكمل جملة `if` بإضافة النقطتين الرأسيتين المفقودتين (`:`).
    code: |
      has_key = True
      if has_key@@INPUT@@
          print("لقد فتحت الصندوق!")
    solution:
      - ":"
    explanation: |
      كل جمل `if` في بايثون يجب أن تنتهي بنقطتين رأسيتين (`:`). هذا يخبر بايثون أن كتلة الكود التي يجب تنفيذها بشكل شرطي على وشك البدء.

  - type: "markdown"
    content: |
      لنرى مثالاً عمليًا. في هذا الكود، الشرط هو `True` بشكل مباشر.

      ```python
      player_has_shield = True

      if player_has_shield:
          print("درعك يصد الهجوم!")

      print("المعركة مستمرة...")
      ```
      **ماذا سيحدث؟**
      1.  يتحقق `if` من `player_has_shield`، ويجدها `True`.
      2.  لأنها `True`، يتم تنفيذ الكود ذي المسافة البادئة وتُطبع رسالة "درعك يصد الهجوم!".
      3.  يستمر البرنامج ويطبع "المعركة مستمرة..." لأن هذا السطر ليس جزءًا من جملة `if` (لا توجد مسافة بادئة).

  - type: "markdown"
    content: |
      الآن، ماذا يحدث إذا كان الشرط `False`؟

      ```python
      is_enemy_near = False

      if is_enemy_near:
          print("استعد للقتال!") # هذا السطر سيتم تخطيه

      print("كل شيء هادئ.")
      ```
      **ماذا سيحدث هنا؟**
      1.  يتحقق `if` من `is_enemy_near`، ويجدها `False`.
      2.  لأنها `False`، يتم **تخطي** الكود ذي المسافة البادئة بالكامل.
      3.  ينتقل البرنامج مباشرة إلى السطر التالي بعد كتلة `if` ويطبع "كل شيء هادئ.".

  - type: "quiz"
    question: "ماذا سيطبع الكود التالي على الشاشة؟"
    lang: "python"
    code: |
      is_weekend = False
      is_sunny = True

      if is_weekend:
          print("وقت الاسترخاء!")

      if is_sunny:
          print("يا له من يوم جميل!")
    options:
      - "وقت الاسترخاء!"
      - "يا له من يوم جميل!"
      - "وقت الاسترخاء!\nيا له من يوم جميل!"
      - "لن يتم طباعة أي شيء."
    solution: 1
    explanation: |
      جملة `if` الأولى تتحقق من `is_weekend` وهي `False`، لذا يتم تخطي `print("وقت الاسترخاء!")`. جملة `if` الثانية تتحقق من `is_sunny` وهي `True`، لذا يتم تنفيذ `print("يا له من يوم جميل!")`.

  - type: "bug"
    lang: "python"
    question: "هناك خطأ في المسافة البادئة يمنع هذا الكود من العمل. حدد السطر الذي به الخطأ."
    code: |
      raining = True
      if raining:
      print("لا تنس مظلتك!")
    solution: 2
    explanation: |
      السطر `print("لا تنس مظلتك!")` يجب أن يحتوي على مسافة بادئة (عادة 4 مسافات) لأنه يتبع جملة `if`. المسافة البادئة تخبر بايثون أن هذا الكود هو جزء من كتلة `if`. بدونها، ستحصل على خطأ `IndentationError`.

  - type: "fill"
    lang: "python"
    question: |
      املأ الفراغات لجعل الكود يطبع الرسالة فقط إذا كانت قيمة `game_over` تساوي `True`.
    code: |
      game_over = True

      @@INPUT@@ game_over:
          @@INPUT@@("انتهت اللعبة! حاول مرة أخرى.")
    solution:
      - "if"
      - "print"
    explanation: |
      نستخدم الكلمة المفتاحية `if` لبدء الجملة الشرطية، ونتحقق من المتغير `game_over`. داخل كتلة `if` (مع مسافة بادئة)، نستخدم الدالة `print()` لعرض الرسالة.

  - type: "markdown"
    content: |
      ممتاز! لقد تعلمت أحد أقوى المفاهيم في البرمجة.

      **ملخص سريع:**
      -  القيم البولينية هي `True` و `False`.
      -  تُستخدم جمل `if` لتنفيذ الكود بشكل شرطي.
      -  الهيكل هو: `if condition:` متبوعًا بكتلة كود ذات مسافة بادئة.
      -  الكود ذو المسافة البادئة يُنفذ فقط إذا كان الشرط `True`.

      في الدروس القادمة، سنتعلم كيف ننشئ هذه الشروط بأنفسنا عن طريق مقارنة القيم. استعد لجعل برامجك أكثر ذكاءً!
