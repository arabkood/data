      تهانينا! لقد وصلت إلى قمة المنطق الشرطي الأساسي.

      **ملخص سريع:**
      - بايثون لديها ترتيب أولويات: `not` ثم `and` ثم `or`.
      - **القاعدة الذهبية:** تجاهل الاعتماد على الذاكرة واستخدم دائماً الأقواس `()` لتجميع الشروط المعقدة. هذا يجعل الكود أكثر وضوحاً، وأسهل في القراءة، وأقل عرضة للأخطاء.

      أنت الآن قادر على بناء برامج يمكنها اتخاذ قرارات متطورة ومعقدة. هذه مهارة أساسية لأي مبرمج. في الوحدات القادمة، سنبني على هذه الأساسات القوية.
