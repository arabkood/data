      للتأهل لمهمة خاصة، يجب أن يكون اللاعب فارسًا (`is_knight`) **و** أن يمتلك سيفًا سحريًا (`has_magic_sword`) **أو** درعًا أسطوريًا (`has_legendary_shield`). املأ الفراغات بالأقواس والمعاملات الصحيحة.
