title: "شروط منطقية معقدة"
steps:
  - type: "markdown"
    content: |
      لقد أصبح لديك الآن ثلاث أدوات منطقية قوية: `and`، `or`، و `not`. أنت تعرف كيف تستخدم كل واحدة منها على حدة.

      الآن، حان الوقت للارتقاء بمهاراتك إلى المستوى التالي. ماذا يحدث عندما تحتاج إلى دمج هذه الأدوات معاً في شرط واحد؟

      تخيل أنك تبني نظاماً لمنح خصم في متجر. القاعدة هي: "يحصل العميل على خصم إذا كان عضواً مميزاً **و** كانت قيمة مشترياته فوق 50 دولاراً، **أو** إذا كان يستخدم كوبون خصم خاص."

      هنا، لدينا `and` و `or` في نفس الجملة! كيف تفهم بايثون هذا الشرط؟ لنكتشف ذلك.

  - type: "markdown"
    content: |
      ### ترتيب الأولويات (Operator Precedence)

      تماماً كما في الرياضيات حيث يتم حساب الضرب (`*`) قبل الجمع (`+`)، فإن بايثون لديها ترتيب أولويات للمعاملات المنطقية:

      1.  **الأولوية القصوى:** `not` (يتم تقييمه أولاً)
      2.  **الأولوية المتوسطة:** `and` (يتم تقييمه ثانياً)
      3.  **الأولوية الدنيا:** `or` (يتم تقييمه أخيراً)

      لذا، في تعبير مثل `True or False and not False`، ستقوم بايثون بالخطوات التالية:
      1.  تقييم `not False` ليصبح `True`.
      2.  يصبح التعبير: `True or False and True`.
      3.  تقييم `False and True` ليصبح `False`.
      4.  يصبح التعبير: `True or False`.
      5.  النتيجة النهائية هي `True`.

      # media_idea: رسم هرمي بسيط. في القمة يوجد "not"، في الوسط "and"، وفي القاعدة "or"، مع أسهم تشير من الأعلى إلى الأسفل للدلالة على ترتيب التقييم.

  - type: "quiz"
    question: "بناءً على ترتيب الأولويات، ما هي النتيجة النهائية لهذا التعبير؟"
    code: |
      print(True and False or True)
    lang: python
    options:
      - "True"
      - "False"
      - "سيحدث خطأ"
    solution: 0
    explanation: "بايثون تقيّم `True and False` أولاً، والذي ينتج `False`. بعد ذلك، تقيّم `False or True`، والذي ينتج `True`."

  - type: "markdown"
    content: |
      ### القاعدة الذهبية: استخدم الأقواس `()`

      الاعتماد على ترتيب الأولويات يمكن أن يكون مربكاً ويجعل الكود صعب القراءة. هناك طريقة أفضل وأكثر أماناً: **استخدم الأقواس `()` لتجميع شروطك**.

      تماماً كما في الرياضيات، أي شيء داخل الأقواس يتم تقييمه أولاً. هذا يزيل أي غموض ويجعل نيتك واضحة تماماً.

      لنعد إلى مثال الخصم:
      `is_premium_member and total > 50 or has_coupon`

      هذا الكود غامض. هل يعني:
      1.  `(is_premium_member and total > 50) or has_coupon`
      2.  `is_premium_member and (total > 50 or has_coupon)`

      النسخة الأولى هي ما تريده على الأرجح وهي ما ستفعله بايثون افتراضياً. لكن كتابتها بالأقواس تجعلها واضحة 100% لأي شخص يقرأ الكود.

      **القاعدة: عندما تشك، أضف الأقواس!**

