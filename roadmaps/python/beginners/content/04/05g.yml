title: "مقارنات عددية"
steps:
  - type: "markdown"
    content: |
      مرحباً بك مجدداً!

      في الدرس السابق، تعلمنا كيف نتحقق مما إذا كانت قيمتان **متساويتين** (`==`) أو **غير متساويتين** (`!=`). هذا مفيد جداً، لكن ماذا لو أردنا أن نعرف ما إذا كانت قيمة ما **أكبر من** أو **أصغر من** قيمة أخرى؟

      تخيل أنك تصمم لعبة. اللاعب يحتاج إلى 1000 نقطة على الأقل للوصول إلى المستوى التالي. أو ربما تبني متجراً إلكترونياً، ويجب أن يكون عمر المستخدم فوق 18 عاماً لشراء منتج معين.

      هذه ليست مجرد مسائل مساواة، إنها **مقارنات**. في هذا الدرس، سنتعلم الأدوات اللازمة للقيام بذلك تماماً!

  - type: "markdown"
    content: |
      ### أكبر من (`>`) وأصغر من (`<`)

      لنبدأ بأبسط مقارنتين:

      *   `>` (أكبر من): يتحقق مما إذا كانت القيمة على اليسار أكبر من القيمة على اليمين.
      *   `<` (أصغر من): يتحقق مما إذا كانت القيمة على اليسار أصغر من القيمة على اليمين.

      تماماً مثل الرياضيات، نتيجة هذه المقارنات تكون دائماً قيمة `boolean` إما `True` أو `False`.

      ```python
      print(10 > 5)   # هل 10 أكبر من 5؟
      print(2 < 9)    # هل 2 أصغر من 9؟
      print(100 > 100) # هل 100 أكبر من 100؟
      ```

      **الناتج:**
      ```text
      True
      True
      False
      ```

