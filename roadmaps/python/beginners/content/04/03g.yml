    solution:
      - "!="
    explanation: "نستخدم `!=` للتحقق من عدم المساواة. بما أن 'online' لا تساوي 'offline'، فإن الشرط صحيح وسيتم طباعة الرسالة."

  - type: "markdown"
    content: |
      **لنجمع كل شيء معًا!**

      الآن يمكننا كتابة جمل `if` أكثر ذكاءً. بايثون ستقوم أولاً بتقييم المقارنة، وتحصل على `True` أو `False`، ثم تستخدم هذه النتيجة لتحديد ما إذا كان سيتم تشغيل كتلة الكود أم لا.

      ```python
      password_attempt = "12345"

      # الخطوة 1: password_attempt == "password123" تقيّم إلى False
      # الخطوة 2: if False: ... لذا يتم تخطي الكتلة
      if password_attempt == "password123":
          print("تم تسجيل الدخول بنجاح.")

      # الخطوة 1: password_attempt != "password123" تقيّم إلى True
      # الخطوة 2: if True: ... لذا يتم تنفيذ الكتلة
      if password_attempt != "password123":
          print("كلمة المرور غير صحيحة.")
      ```

  - type: "bug"
    lang: "python"
    question: "الهدف هو طباعة 'مرحبًا أيها المدير!' فقط إذا كان المستخدم هو 'admin'. حدد السطر الذي به الخطأ المنطقي."
    code: |
      user = "admin"

      if user != "admin":
          print("مرحبًا أيها المدير!")
    solution: 2
    explanation: |
      الخطأ هنا منطقي وليس نحويًا. الشرط `user != "admin"` يعني "إذا لم يكن المستخدم هو admin". بما أن المستخدم *هو* 'admin'، فإن الشرط يصبح `False` ولن يتم طباعة الرسالة أبدًا. يجب أن يكون الشرط `user == "admin"`.

