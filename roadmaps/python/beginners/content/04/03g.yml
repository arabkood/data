item_id: "m4-l3-equality-inequality-comparisons"
item_type: "lesson"
title: "مقارنات المساواة وعدم المساواة"
steps:
  - type: "markdown"
    content: |
      في الدروس السابقة، كنا نحدد قيمة `True` أو `False` بأنفسنا، هكذا:

      `is_raining = True`

      لكن هذا ليس عمليًا دائمًا. غالبًا ما نريد أن يكتشف الكمبيوتر الحقيقة بنفسه بناءً على البيانات. كيف نفعل ذلك؟

      ببساطة، نحن **نسأل الكمبيوتر سؤالاً**. والإجابات التي يمكنه تقديمها هي `True` أو `False`.

  - type: "markdown"
    content: |
      أبسط سؤال يمكننا طرحه هو: "هل هاتان القيمتان متساويتان؟"

      في بايثون، نطرح هذا السؤال باستخدام علامتي يساوي متتاليتين: `==`.

      `5 == 5`   # هل 5 تساوي 5؟ -> الإجابة: True
      `10 == 7`  # هل 10 تساوي 7؟ -> الإجابة: False

      هذا يسمى **عامل المقارنة (Comparison Operator)**. إنه يأخذ قيمتين ويقارنهما، ثم "يعيد" قيمة بولينية.

  - type: "quiz"
    question: "ما هي القيمة التي سينتجها التعبير `100 == 100`؟"
    lang: "python"
    options:
      - "`True`"
      - "`False`"
      - "`100`"
      - "سيحدث خطأ"
    solution: 0
    explanation: "عامل المقارنة `==` يتحقق مما إذا كانت القيمتان على كلا الجانبين متساويتين. بما أن 100 تساوي 100، فإن النتيجة هي `True`."

  - type: "markdown"
    content: |
      **تحذير هام جدًا: `=` مقابل `==`**

      هذا هو أحد أكثر الأخطاء شيوعًا للمبتدئين! من الضروري أن تفهم الفرق:

      -   `=` (علامة يساوي واحدة) هي لـ **الإسناد (Assignment)**. إنها تقول للكمبيوتر: "خذ هذه القيمة وضعها في هذا المتغير". إنها **أمر**.
          `score = 95` (ضع 95 في `score`)

      -   `==` (علامتا يساوي) هي لـ **المقارنة (Comparison)**. إنها تقول للكمبيوتر: "هل هذه القيمة تساوي تلك القيمة؟". إنها **سؤال**.
          `score == 95` (هل القيمة في `score` تساوي 95؟)

      # media_idea: رسم توضيحي بسيط. على اليسار، يد تضع الرقم 100 في صندوق مكتوب عليه `score`، مع التسمية `=`. على اليمين، عين تنظر إلى الصندوق `score` وإلى الرقم 100 مع علامة استفهام كبيرة بينهما، مع التسمية `==`.

  - type: "bug"
    lang: "python"
    question: "هذا الكود يحاول التحقق مما إذا كانت `player_level` تساوي 10، لكنه يستخدم عامل الإسناد بدلاً من عامل المقارنة. حدد السطر الذي به الخطأ."
    code: |
      player_level = 10

      if player_level = 10:
          print("أنت في المستوى العاشر!")
    solution: 2
    explanation: |
      داخل جملة `if`، يجب أن تستخدم عامل المقارنة `==` لطرح سؤال. استخدام `=` واحد هنا هو خطأ نحوي شائع (`SyntaxError`) لأن `if` تتوقع شرطًا (سؤالاً) وليس أمرًا (إسنادًا).

  - type: "markdown"
    content: |
      يمكننا أيضًا استخدام `==` لمقارنة النصوص (strings). تعمل بنفس الطريقة، ولكن مع ملاحظة هامة: **المقارنة حساسة لحالة الأحرف**.

      `"hello" == "hello"`  # -> True
      `"Python" == "python"` # -> False (لأن 'P' تختلف عن 'p')
      `"Ahmed" == "Saleh"`  # -> False

  - type: "quiz"
    question: "ما هي نتيجة التعبير التالي؟"
    lang: "python"
    code: |
      user_input = "Start"
      user_input == "start"
    options:
      - "`True`"
      - "`False`"
      - "`Start`"
      - "`start`"
    solution: 1
    explanation: "بايثون حساسة لحالة الأحرف. الحرف الكبير 'S' لا يساوي الحرف الصغير 's'، لذا فإن المقارنة تعيد `False`."

  - type: "markdown"
    content: |
      الآن، ماذا لو أردنا أن نسأل السؤال المعاكس: "هل هاتان القيمتان **غير** متساويتين؟"

      لهذا، نستخدم عامل عدم المساواة: `!=` (علامة تعجب وعلامة يساوي).

      `5 != 6`   # هل 5 لا تساوي 6؟ -> True
      `10 != 10` # هل 10 لا تساوي 10؟ -> False
      `"A" != "B"` # هل 'A' لا تساوي 'B'؟ -> True

