    content: |
      ### أساس كل قرار: `True` و `False`

      تذكر أن كل قرار في بايثون يرتكز على سؤال بسيط بنعم أو لا. في عالم البرمجة، "نعم" هي `True` و "لا" هي `False`.

      كل تعبير مقارنة تضعه بعد كلمة `if` يتم تقييمه إلى إحدى هاتين القيمتين المنطقيتين (`boolean`).

      `if age > 18:` ⬅️ هل هذه العبارة صحيحة أم خاطئة؟
      `if username == "admin":` ⬅️ هل هذه العبارة صحيحة أم خاطئة؟

      بناءً على الإجابة، يقرر بايثون أي جزء من الكود سيتم تنفيذه.

  - type: "quiz"
    question: "ما هو نوع البيانات (`data type`) الذي ينتج عن التعبير `100 != 50`؟"
    options:
      - "integer"
      - "string"
      - "boolean"
      - "float"
    solution: 2
    explanation: "أي عملية مقارنة (مثل `==`, `!=`, `>`, `<`) تنتج دائماً قيمة منطقية، إما `True` أو `False`. نوع هذه البيانات هو `boolean` أو `bool`."

  - type: "markdown"
    content: |
      ### أدوات المقارنة الخاصة بك

      لقد تعلمت ستة معاملات أساسية للمقارنة بين القيم:

      *   `==` : هل القيمتان متساويتان؟
      *   `!=` : هل القيمتان غير متساويتين؟
      *   `>` : هل القيمة اليسرى أكبر من اليمنى؟
      *   `<` : هل القيمة اليسرى أصغر من اليمنى؟
      *   `>=` : هل القيمة اليسرى أكبر من أو تساوي اليمنى؟
      *   `<=` : هل القيمة اليسرى أصغر من أو تساوي اليمنى؟

      هذه هي اللبنات الأساسية لكل جملة `if` تكتبها.

