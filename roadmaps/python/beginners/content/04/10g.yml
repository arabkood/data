      تهانينا على وصولك إلى نهاية هذه الوحدة!

      لقد قمت برحلة مذهلة. بدأت بتعلم كيفية جعل برامجك "تتحدث" باستخدام `print()`. ثم تعلمت كيفية تخزين المعلومات في **متغيرات**.

      في هذه الوحدة، منحت برامجك **عقلاً**. لم تعد برامجك تتبع التعليمات بشكل أعمى؛ بل يمكنها الآن التحليل، المقارنة، واتخاذ قرارات بناءً على الشروط التي تحددها. هذه خطوة عملاقة في رحلتك كمبرمج.

      لنراجع معاً الأدوات القوية التي أضفتها إلى جعبتك.

