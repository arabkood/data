item_id: "module-4-the-and-operator"
item_type: "lesson"
title: "المعامل AND"
steps:
  - type: "markdown"
    content: |
      مرحباً! لقد تعلمنا كيفية التحقق من شرط واحد (`if age > 18`) وكيفية عكسه (`if not is_logged_in`).

      ولكن، ماذا لو احتجت إلى التحقق من **شرطين أو أكثر في نفس الوقت**؟

      فكر في تسجيل الدخول إلى بريدك الإلكتروني. هل يكفي إدخال اسم المستخدم الصحيح فقط؟ بالطبع لا. هل يكفي إدخال كلمة المرور الصحيحة فقط؟ لا أيضاً.

      أنت بحاجة إلى أن يكون **اسم المستخدم صحيحاً وأيضاً كلمة المرور صحيحة** في نفس اللحظة. هذه الكلمة "و" (and) هي المفتاح. في بايثون، لدينا معامل منطقي لهذا الغرض بالضبط!

  - type: "markdown"
    content: |
      ### تقديم المعامل `and`

      يعمل المعامل `and` على دمج شرطين معاً. التعبير بأكمله يكون `True` **فقط وفقط إذا كان كلا الشرطين صحيحين (`True`)**. إذا كان أي منهما أو كلاهما خاطئاً (`False`)، فإن النتيجة الإجمالية تكون `False`.

      يمكننا تلخيص سلوكه في "جدول الحقيقة" التالي:

      *   `True and True`   ⬅️   ينتج `True`
      *   `True and False`  ⬅️   ينتج `False`
      *   `False and True`  ⬅️   ينتج `False`
      *   `False and False` ⬅️   ينتج `False`

      القاعدة بسيطة: `and` صارم جداً، فهو يتطلب أن يكون كل شيء صحيحاً.
      # media_idea: رسم بياني بسيط يظهر بوابتين (gates). سهمان يدخلان البوابة. السهم الأول مكتوب عليه "الشرط 1"، والثاني "الشرط 2". سهم واحد يخرج من البوابة مكتوب عليه "النتيجة". إذا كان كلا السهمين الداخلين أخضر (True)، يكون السهم الخارج أخضر (True). إذا كان أي من السهمين الداخلين أحمر (False)، يكون السهم الخارج أحمر (False).

  - type: "quiz"
    question: "ما هي نتيجة التعبير التالي في بايثون؟"
    code: |
      print((10 > 5) and (2 == 1))
    lang: python
    options:
      - "True"
      - "False"
      - "Error"
      - "1"
    solution: 1
    explanation: "الشرط الأول `(10 > 5)` هو `True`. الشرط الثاني `(2 == 1)` هو `False`. وبما أن `True and False` ينتج `False`، فإن النتيجة النهائية هي `False`."

  - type: "markdown"
    content: |
      ### `and` في العمل

      لنعد إلى مثال تسجيل الدخول. هكذا سيبدو في بايثون:

      ```python
      username = "user123"
      password = "secret_password"

      # التحقق من كلا الشرطين معاً
      if username == "user123" and password == "secret_password":
          print("تم تسجيل الدخول بنجاح!")
      else:
          print("اسم المستخدم أو كلمة المرور غير صحيحة.")
      ```

      في هذا المثال، بما أن كلا الشرطين صحيحان، ستتم طباعة رسالة الترحيب. لو كان أي منهما خاطئاً، لكانت كتلة `else` هي التي ستُنفذ.

  - type: "fill"
    lang: "python"
    question: |
      في لعبة مغامرات، لفتح باب الكنز، يجب أن يكون مستوى اللاعب 20 أو أعلى **و** أن يمتلك مفتاح الكنز. املأ الفراغ لإكمال الشرط.
    code: |
      player_level = 25
      has_treasure_key = True
      
      if player_level >= 20 @@INPUT@@ has_treasure_key:
          print("الباب يفتح!")
    solution:
      - "and"
    explanation: "نحتاج إلى التأكد من أن كلا الشرطين (المستوى والمفتاح) صحيحان في نفس الوقت، لذلك نستخدم المعامل `and` لربطهما."

  - type: "order"
    lang: "python"
    question: "للحصول على شحن مجاني، يجب أن يكون إجمالي الطلب أكثر من 100 دولار **و** أن يكون العميل عضواً في برنامج الولاء. أعد ترتيب الأسطر لإنشاء هذا البرنامج."
    code:
      - "order_total = 150"
      - "is_loyalty_member = True"
      - "if order_total > 100 and is_loyalty_member:"
      - '    print("تهانينا! لقد حصلت على شحن مجاني.")'
    explanation: "نبدأ بتعريف المتغيرات التي تمثل حالة الطلب. بعد ذلك، نستخدم جملة `if` مع `and` للتحقق من أن كلا الشرطين متحققان قبل طباعة الرسالة."

  - type: "bug"
    lang: "python"
    question: "هذا الكود يهدف إلى التحقق مما إذا كان الرقم يقع بين 10 و 20 (حصرياً). لكنه لا يعمل بشكل صحيح. حدد السطر الذي يحتوي على الخطأ."
    code: |
      number = 25
      
      # هل الرقم أكبر من 10 وأصغر من 20؟
      if number > 10 or number < 20:
          print("الرقم يقع في النطاق المطلوب.")
      else:
          print("الرقم خارج النطاق.")
    solution: 3
    explanation: "الخطأ المنطقي هنا هو استخدام `or` بدلاً من `and`. الشرط `number < 20` صحيح لـ 25 (لأنه ليس أصغر من 20)، لكن `number > 10` صحيح أيضاً. `True or False` هو `True`. لكي يكون الرقم *بين* قيمتين، يجب أن يكون أكبر من الصغرى **و** أصغر من الكبرى. يجب استخدام `and`."
    expectedOutput: "الرقم خارج النطاق."
    actualOutput: "الرقم يقع في النطاق المطلوب."

  - type: "markdown"
    content: |
      عمل رائع!

      لقد أتقنت الآن المعامل `and`، وهو أداة أساسية لكتابة برامج تتخذ قرارات دقيقة ومعقدة.

      **تذكر القاعدة الذهبية لـ `and`:** يجب أن تكون جميع الشروط `True` حتى تكون النتيجة الإجمالية `True`.

      ولكن ماذا لو أردنا أن نكون أكثر مرونة؟ ماذا لو أردنا تنفيذ إجراء إذا كان **أي شرط من الشروط** صحيحاً، وليس بالضرورة كلها؟ هذا هو ما سنتعلمه في الدرس التالي مع المعامل `or`!
