title: "المعامل OR"
steps:
  - type: "markdown"
    content: |
      لقد تعلمنا في الدرس السابق عن المعامل الصارم `and`، الذي يتطلب أن تكون جميع الشروط صحيحة.

      ولكن ماذا لو أردنا أن نكون أكثر مرونة؟

      تخيل أن متجراً يقدم خصماً خاصاً في عطلة نهاية الأسبوع. تحصل على الخصم إذا كان اليوم هو السبت **أو** إذا كان اليوم هو الأحد. ليس من المنطقي أن يكون اليوم هو السبت والأحد في نفس الوقت!

      نحن بحاجة إلى طريقة للتحقق مما إذا كان **شرط واحد على الأقل** من بين عدة شروط صحيحاً. وهنا يأتي دور المعامل المنطقي `or`.

  - type: "markdown"
    content: |
      ### تقديم المعامل `or`

      يعمل المعامل `or` أيضاً على دمج شرطين، لكنه أكثر تساهلاً بكثير من `and`. التعبير بأكمله يكون `True` إذا كان **أحد الشرطين على الأقل `True`**. الحالة الوحيدة التي تكون فيها النتيجة `False` هي عندما يكون **كلا الشرطين `False`**.

      لنلقِ نظرة على جدول الحقيقة الخاص به:

      *   `True or True`   ⬅️   ينتج `True`
      *   `True or False`  ⬅️   ينتج `True`
      *   `False or True`  ⬅️   ينتج `True`
      *   `False or False` ⬅️   ينتج `False`

      القاعدة بسيطة: `or` يحتاج فقط إلى سبب واحد ليكون سعيداً (لإعطاء `True`).
      # media_idea: رسم بياني مشابه لدرس "and". بوابتان، لكن هذه المرة، إذا كان أي من السهمين الداخلين أخضر (True)، يكون السهم الخارج أخضر (True). فقط عندما يكون كلا السهمين الداخلين أحمر (False)، يكون السهم الخارج أحمر (False).

