item_id: "m4-l2-python-indentation-system"
item_type: "lesson"
title: "نظام المسافة البادئة في بايثون"
steps:
  - type: "markdown"
    content: |
      في الدرس السابق، هل لاحظت كيف أن سطر `print()` داخل جملة `if` كان مزاحًا قليلاً إلى اليمين؟

      ```python
      is_sunny = True

      if is_sunny:
          print("يا له من يوم جميل!") # <-- هذا السطر
      ```
      هذه الإزاحة تسمى **المسافة البادئة (Indentation)**، وفي بايثون، هي ليست مجرد اختيار للتنسيق، بل هي قاعدة أساسية ومهمة جدًا!

  - type: "markdown"
    content: |
      **لماذا هي مهمة لهذه الدرجة؟**

      في العديد من لغات البرمجة الأخرى، يستخدم المبرمجون أقواسًا متعرجة `{}` لتجميع الكود معًا في "كتل".

      لكن بايثون اتخذت قرارًا مختلفًا: بدلاً من استخدام الرموز، تستخدم **المسافات البيضاء** لتحديد بنية الكود.

      فكر في الأمر كأنه مخطط تفصيلي لمقال. العناوين الرئيسية تكون على اليسار، والنقاط الفرعية تكون مزاحة للداخل. هذه الإزاحة تخبرنا أن النقاط الفرعية تنتمي إلى العنوان الرئيسي.

      # media_idea: صورة مقارنة جنبًا إلى جنب. على اليسار، كتلة كود JavaScript مع أقواس `{}`. على اليمين، نفس كتلة الكود في بايثون تستخدم المسافة البادئة. يتم تمييز `{}` في JavaScript والمسافات البيضاء في Python.

  - type: "markdown"
    content: |
      في بايثون، هذه المجموعة من الأسطر المزاحة للداخل تسمى **كتلة الكود (Code Block)**.

      عندما نكتب جملة `if`، فإن المسافة البادئة تخبر بايثون بالضبط أي الأسطر يجب تنفيذها إذا كان الشرط `True`. كل الأسطر التي لها نفس مستوى الإزاحة تحت `if` تعتبر جزءًا من نفس الكتلة.

      ```python
      # هذا ليس جزءًا من كتلة if
      if condition:
          # هذا السطر جزء من الكتلة
          # وهذا السطر أيضًا جزء من نفس الكتلة
      # وهذا السطر ليس جزءًا من الكتلة لأنه عاد إلى اليسار
      ```

  - type: "quiz"
    question: "ما الذي تستخدمه بايثون لتحديد بداية ونهاية كتل الكود (مثل تلك الموجودة داخل جملة `if`)؟"
    options:
      - "الأقواس المتعرجة `{}`"
      - "الأقواس المربعة `[]`"
      - "المسافة البادئة (Indentation)"
      - "الكلمة المفتاحية `end`"
    solution: 2
    explanation: "تعتمد بايثون بشكل فريد على المسافة البادئة لتحديد بنية الكود وتجميع الأوامر في كتل. هذا يجعل الكود نظيفًا وسهل القراءة."

  - type: "markdown"
    content: |
      **القاعدة الذهبية: كن متسقًا!**

      الاتفاق الشائع بين مبرمجي بايثون هو استخدام **4 مسافات** لكل مستوى من مستويات المسافة البادئة.

      إذا بدأت كتلة بـ 4 مسافات، فيجب أن تكون جميع الأسطر الأخرى في تلك الكتلة مزاحة بـ 4 مسافات أيضًا. عدم الاتساق سيؤدي إلى خطأ.

      ```python
      # صحيح ✅
      if True:
          print("السطر الأول")
          print("السطر الثاني")

      # خاطئ ❌ (مسافات غير متسقة)
      if True:
          print("السطر الأول")
            print("السطر الثاني") # <-- هذا سيسبب خطأ
      ```

  - type: "bug"
    lang: "python"
    question: "هذا الكود لن يعمل بسبب خطأ في المسافة البادئة. حدد السطر الذي يحتوي على الخطأ."
    code: |
      needs_water = True
      if needs_water:
      print("من فضلك اسقِ النبتة.")
    solution: 2
    explanation: |
      السطر `print(...)` يجب أن يكون مزاحًا للداخل (عادة بـ 4 مسافات) لأنه يتبع جملة `if:`. بدون هذه المسافة البادئة، لا يعرف بايثون أن هذا السطر ينتمي إلى كتلة `if`، مما يسبب خطأ `IndentationError`.

  - type: "markdown"
    content: |
      الخطأ الذي رأيته للتو، `IndentationError`، هو واحد من أكثر الأخطاء شيوعًا التي يواجهها المبتدئون في بايثون.

      لكن لا تقلق! عندما تراه، فإنه يعني ببساطة شيئًا واحدًا: **"تحقق من المسافات البيضاء في بداية أسطرك!"**. عادة ما يكون هناك سطر إما أنه يحتاج إلى مسافة بادئة أو لديه مسافة بادئة خاطئة.

  - type: "quiz"
    question: "أي من مقتطفات الكود التالية يحتوي على مسافة بادئة صحيحة؟"
    options:
      - |
        ```python
        if 10 > 5:
            print("صحيح")
        ```
      - |
        ```python
        if 10 > 5:
        print("صحيح")
        ```
      - |
        ```python
        if 10 > 5: print("صحيح")
        ```
      - |
        ```python
            if 10 > 5:
          print("صحيح")
        ```
    solution: 0
    explanation: |
      الخيار الأول هو الصحيح. جملة `if` موجودة في المستوى الخارجي، وسطر `print` مزاح بشكل صحيح للداخل بأربع مسافات، مما يشير إلى أنه ينتمي إلى كتلة `if`. الخيارات الأخرى إما تفتقر إلى المسافة البادئة أو لديها مسافة بادئة غير متسقة.

  - type: "markdown"
    content: |
      ماذا عن الكتل داخل الكتل؟

      بالطبع يمكنك فعل ذلك! وهذا ما يجعل البرمجة قوية جدًا. إذا وضعت جملة `if` داخل جملة `if` أخرى، فإن كتلة الكود الداخلية تحصل على مستوى آخر من المسافة البادئة.

      ```python
      # المستوى 0 (لا توجد مسافة بادئة)
      if condition_A:
          # المستوى 1 (4 مسافات)
          print("الشرط A صحيح")
          if condition_B:
              # المستوى 2 (8 مسافات)
              print("الشرط B صحيح أيضًا")
      ```
      هذا يوضح التسلسل الهرمي بشكل مرئي.

      # media_idea: رسم متحرك بسيط (GIF). يبدأ بمخطط تفصيلي: 1. العنوان الرئيسي. ثم يظهر سهم ويتم إزاحة النقطة التالية: أ. نقطة فرعية. ثم يظهر سهم آخر ويتم إزاحة النقطة التالية أكثر: i. نقطة فرعية ثانوية. ثم يتحول النص إلى كود بايثون مطابق للبنية.

  - type: "bug"
    lang: "python"
    question: "هناك خطأ في المسافة البادئة في هذا الكود المتداخل. حدد السطر الذي به الخطأ."
    code: |
      has_ticket = True
      is_first_class = True

      if has_ticket:
          print("مرحبًا بك على متن الطائرة.")
          if is_first_class:
          print("تفضل إلى مقعدك في الدرجة الأولى.")
    solution: 5
    explanation: |
      السطر الأخير، `print("تفضل...")`، هو جزء من جملة `if is_first_class:`. لذلك، يجب أن يكون مزاحًا للداخل بالنسبة لتلك الجملة. بما أن `if is_first_class:` مزاح بالفعل بـ 4 مسافات، فإن هذا السطر يجب أن يكون مزاحًا بـ 8 مسافات.

  - type: "fill"
    lang: "python"
    question: "املأ الفراغ لجعل الكود يتحقق مما إذا كان `is_logged_in` صحيحًا."
    code: |
      is_logged_in = True
      is_admin = False

      @@INPUT@@ is_logged_in:
          print("تم تسجيل دخول المستخدم.")
          if is_admin:
              print("لديك صلاحيات المدير.")
    solution:
      - "if"
    explanation: |
      نستخدم الكلمة المفتاحية `if` لبدء الجملة الشرطية. لاحظ كيف أن `print` الثاني مزاح مرتين - مرة لـ `if is_logged_in:` ومرة أخرى لـ `if is_admin:`.

  - type: "markdown"
    content: |
      أحسنت! قد يبدو نظام المسافة البادئة غريبًا في البداية، لكنك ستعتاد عليه بسرعة، وستقدر قريبًا كيف يجعل كود بايثون نظيفًا ومنظمًا.

      **ملخص:**
      - بايثون تستخدم المسافة البادئة (وليس الأقواس) لتنظيم الكود في كتل.
      - المسافة البادئة **إلزامية** وليست اختيارية.
      - المعيار هو **4 مسافات** لكل مستوى.
      - خطأ `IndentationError` يعني أن هناك مشكلة في المسافات البيضاء.

      أنت الآن جاهز لتعلم المزيد عن الشروط التي تدخل في جمل `if`!
