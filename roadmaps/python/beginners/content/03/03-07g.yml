item_id: "m3-debugging-data-problems"
item_type: "lesson"
title: "تصحيح الأخطاء: حل مشاكل البيانات"
steps:
  - type: "markdown"
    content: |
      مرحباً أيها المحقق! حتى الآن، تعلمنا كيفية التعامل مع البيانات: الحصول عليها، تحويلها، وتنظيفها.

      لكن في البرمجة، الأمور لا تسير دائماً كما هو مخطط لها. ستواجه أخطاءً. هذا ليس شيئاً سيئاً، بل هو جزء طبيعي تماماً من عملية بناء البرامج.

      أفضل المبرمجين ليسوا أولئك الذين لا يرتكبون أخطاء، بل أولئك الذين يجيدون العثور عليها وإصلاحها.

      في هذا الدرس، سنرتدي قبعة المحقق ونقوم بحل بعض الألغاز الشائعة المتعلقة بالبيانات. كل "لغز" هو خطأ برمجي (bug) يرتكبه المبتدئون كثيراً. هل أنت مستعد؟

  - type: "markdown"
    content: |
      ### اللغز الأول: الجمع الغامض

      زميلك كتب برنامجاً لحساب عمر شخص ما بعد 5 سنوات. لكن عندما يتم تشغيله، يحدث شيء غريب بدلاً من عملية الجمع الحسابية.

      ألقِ نظرة على الكود. عندما يدخل المستخدم "25"، يتسبب البرنامج في خطأ `TypeError`. لماذا؟

  - type: "bug"
    lang: "python"
    question: "حدد السطر الذي يسبب خطأ `TypeError` عند محاولة جمع نص مع رقم."
    code: |
      age_text = input("كم عمرك؟ ")
      # لنفترض أن المستخدم أدخل "25"
      
      print("بعد 5 سنوات، سيكون عمرك...")
      age_in_future = age_text + 5
      
      print(age_in_future)
    solution: 4
    explanation: |
      هذا هو الخطأ الكلاسيكي! `input()` تُرجع نصاً (`str`). الكود يحاول جمع النص "25" مع الرقم 5، وهو ما لا يمكن لبايثون القيام به.

      **الحل:** يجب تحويل `age_text` إلى عدد صحيح أولاً باستخدام `int()`:
      `age_in_future = int(age_text) + 5`

  - type: "markdown"
    content: |
      ### اللغز الثاني: التنظيف المنسي

      هذا البرنامج يحاول قراءة سعر منتج من نص، لكن النص يحتوي على رمز العملة. هذا يسبب انهيار البرنامج عند محاولة تحويله إلى رقم.

      مهمتك هي إصلاح الكود عن طريق تنظيف النص **قبل** محاولة تحويله.

  - type: "fill"
    lang: "python"
    question: "املأ الفراغ لإزالة ' ريال' من النص حتى يمكن تحويله بنجاح إلى `float`."
    code: |
      price_with_currency = "19.99 ريال"
      
      # الخطوة 1: نظّف النص
      clean_price_text = price_with_currency.@@INPUT@@(" ريال", "")
      
      # الخطوة 2: الآن التحويل آمن
      price_value = float(clean_price_text)
      
      print(f"السعر كرقم هو: {price_value}")
    solution:
      - "replace"
    explanation: |
      عمل رائع! لقد واجهنا خطأ `ValueError` محتمل. من خلال استخدام `.replace()` لإزالة الجزء غير الرقمي من النص أولاً، جعلنا عملية التحويل باستخدام `float()` آمنة وناجحة. تذكر دائماً: نظّف أولاً، ثم حوّل.

  - type: "markdown"
    content: |
      ### اللغز الثالث: التغيير الذي لم يحدث

      في هذا اللغز، نحاول إزالة المسافات الزائدة من اسم مستخدم. الكود يستدعي `.strip()`، لكن المقارنة لا تزال تفشل. يبدو أن المسافات لم تتم إزالتها!

      لماذا لم يتغير المتغير `username`؟

  - type: "bug"
    lang: "python"
    question: "هناك خطأ منطقي هنا. `.strip()` تعمل، لكن تأثيرها يضيع. حدد السطر الذي يحتوي على المشكلة."
    code: |
      username = "  نورة  "
      
      # محاولة إزالة المسافات
      username.strip()
      
      if username == "نورة":
        print("أهلاً بك يا نورة!")
      else:
        print(f"الدخول مرفوض. النظام يرى اسمك كـ '{username}'")
    solution: 3
    explanation: |
      هذا فخ شائع جداً! أساليب النصوص (String methods) مثل `.strip()`, `.lower()`, `.replace()` لا تُعدّل النص الأصلي. إنها تُرجع **نسخة جديدة** ومُعدّلة من النص.

      لقد ضاع تأثير `.strip()` لأننا لم نحفظ نتيجته.

      **الحل:** يجب إعادة تعيين النتيجة للمتغير:
      `username = username.strip()`

  - type: "markdown"
    content: |
      ### اللغز الرابع: حساسية الحالة

      يسأل هذا البرنامج المستخدم سؤالاً بسيطاً ويتوقع إجابة بـ "نعم". لكن إذا كتب المستخدم "نعم" بأي أحرف كبيرة (مثل "نعم" أو "نعم")، فإن البرنامج يفشل في التعرف عليها.

      كيف يمكننا أن نجعل المقارنة تعمل بغض النظر عن حالة الأحرف التي يستخدمها المستخدم؟

  - type: "fill"
    lang: "python"
    question: "استخدم الـ method المناسب لتوحيد إدخال المستخدم إلى أحرف صغيرة قبل مقارنته."
    code: |
      answer = input("هل تريد المتابعة؟ (نعم/لا): ")
      # لنفترض أن المستخدم أدخل "نعم"
      
      # قم بتعديل السطر التالي ليعمل بشكل صحيح
      if answer.@@INPUT@@() == "نعم":
        print("حسناً، لنكمل...")
      else:
        print("إلغاء الأمر.")
    solution:
      - "lower"
    explanation: |
      بالضبط! باستخدام `.lower()`، نقوم بتحويل إجابة المستخدم دائماً إلى أحرف صغيرة قبل مقارنتها بـ "نعم". بهذه الطريقة، ستعمل المقارنة بشكل صحيح مع "نعم"، "نعم"، "نعم"، إلخ. هذه تقنية أساسية لجعل برامجك أكثر مرونة.

  - type: "markdown"
    content: |
      ### اللغز الخامس: الأداة الخاطئة للمهمة

      لدينا برنامج لحساب تكلفة الشحن، وهي 2.5 ريال لكل كيلوغرام. البرنامج يطلب من المستخدم إدخال الوزن، لكنه يتعطل إذا كان الوزن يحتوي على كسور (مثل `4.5`).

      الخطأ الذي يظهر هو `ValueError`. لماذا؟

  - type: "bug"
    lang: "python"
    question: "استخدام دالة التحويل الخاطئة هنا يسبب المشكلة. حدد السطر الذي يمثل الاختيار الخاطئ."
    code: |
      weight_str = input("أدخل وزن الشحنة (بالكيلوغرام): ")
      # المستخدم يدخل "4.5"

      # هذا السطر سيسبب خطأ ValueError
      weight_num = int(weight_str)
      
      shipping_cost = weight_num * 2.5
      print(f"تكلفة الشحن هي: {shipping_cost} ريال")
    solution: 4
    explanation: |
      لقد وجدتها! هذه مشكلة منطقية. الوزن يمكن أن يحتوي على أجزاء عشرية، ولكن دالة `int()` لا يمكنها التعامل إلا مع الأعداد الصحيحة. عندما ترى `int()` النص "4.5"، فإنها لا تعرف ماذا تفعل وتطلق خطأ `ValueError`.

      **الحل:** بما أن الوزن قد يكون عشرياً، يجب أن نستخدم الأداة المناسبة: `float()`.
      `weight_num = float(weight_str)`

  - type: "markdown"
    content: |
      ### أنت الآن مصحح أخطاء أفضل!

      لقد قمت بعمل رائع في حل هذه الألغاز. تذكر هذه الأنماط الشائعة للأخطاء:

      1.  **أخطاء النوع (`TypeError`):** تحدث عند خلط أنواع غير متوافقة. **الحل:** حوّل البيانات إلى نوع موحد قبل إجراء العمليات.
      2.  **أخطاء القيمة (`ValueError`):** تحدث عند فشل التحويل. **الحل:** نظّف البيانات (`.strip()`, `.replace()`) قبل محاولة تحويلها.
      3.  **الأخطاء المنطقية:** تحدث عند استخدام الأداة الصحيحة بطريقة خاطئة (نسيان إعادة التعيين) أو استخدام الأداة الخاطئة ( `int` بدلاً من `float`). **الحل:** فكر في طبيعة بياناتك واختر الأدوات المناسبة.

      تصحيح الأخطاء ليس فشلاً، بل هو مهارة أساسية. كل خطأ تصلحه يجعلك مبرمجاً أقوى.
