---
item_id: "m3-bill-splitter-challenge"
item_type: "code"
title: "تحدي: حاسبة تقسيم الفاتورة"
description: |
  حان الوقت لتطبيق كل ما تعلمته! مهمتك هي بناء برنامج بسيط لتقسيم فاتورة مطعم بين مجموعة من الأشخاص.

  **المطلوب:**
  1.  اطلب من المستخدم إدخال المبلغ الإجمالي للفاتورة باستخدام الرسالة: `ما هو المبلغ الإجمالي للفاتورة؟ `
  2.  اطلب من المستخدم إدخال عدد الأشخاص الذين سيتقاسمون الفاتورة باستخدام الرسالة: `كم عدد الأشخاص؟ `
  3.  قم بتحويل المدخلات إلى الأنواع الرقمية الصحيحة (تذكر أن الفاتورة قد تحتوي على أجزاء عشرية).
  4.  احسب المبلغ الذي يجب على كل شخص دفعه.
  5.  اطبع النتيجة النهائية بالصيغة الدقيقة التالية: `كل شخص يجب أن يدفع: [المبلغ]`

  **مثال:**
  - إذا كانت الفاتورة `150` وعدد الأشخاص `4`، يجب أن يطبع البرنامج: `كل شخص يجب أن يدفع: 37.5`
starter_code: |
  # اكتب الكود الخاص بك هنا
  # الخطوة 1: اطلب إدخال مبلغ الفاتورة
  
  # الخطوة 2: اطلب إدخال عدد الأشخاص
  
  # الخطوة 3: قم بالتحويل والحساب
  
  # الخطوة 4: اطبع النتيجة
solution: |
  bill_total_str = input("ما هو المبلغ الإجمالي للفاتورة؟ ")
  num_people_str = input("كم عدد الأشخاص؟ ")

  bill_total = float(bill_total_str)
  num_people = int(num_people_str)

  amount_per_person = bill_total / num_people

  print(f"كل شخص يجب أن يدفع: {amount_per_person}")
test_cases:
  - name: "حالة أساسية"
    input: "100\n4"
    expected: "كل شخص يجب أن يدفع: 25.0\n"
  - name: "فاتورة عشرية"
    input: "150.75\n3"
    expected: "كل شخص يجب أن يدفع: 50.25\n"
  - name: "عدد كبير من الأشخاص"
    input: "2500\n10"
    expected: "كل شخص يجب أن يدفع: 250.0\n"
  - name: "شخصان"
    input: "99.50\n2"
    expected: "كل شخص يجب أن يدفع: 49.75\n"
  - name: "فاتورة فردية"
    input: "85.20\n1"
    expected: "كل شخص يجب أن يدفع: 85.2\n"
