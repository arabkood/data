    explanation: "ممتاز! الآن يمكنك التحقق من صحة بيانات أي منتج."

  # --- STEP 18: Common mistakes ---
  - type: "markdown"
    content: |
      احذر من هذه الأخطاء الشائعة:

      ```python
      # خطأ شائع - مقارنة مع نص
      if type(value) == "int":  # خطأ!
          print("رقم")

      # الطريقة الصحيحة
      if isinstance(value, int):  # صحيح!
          print("رقم")

      # خطأ آخر - نسيان أن input() يعطي str دائماً
      age = input("عمرك: ")
      if isinstance(age, int):  # هذا دائماً False!
          print("عمر صحيح")
      ```

  # --- STEP 19: Best practices ---
  - type: "markdown"
    content: |
      أفضل الممارسات لفحص الأنواع:

      1. **استخدم `isinstance()` بدلاً من `type()`** - أكثر مرونة واحترافية
      2. **تذكر أن `input()` دائماً تعطي `str`** - ستحتاج للتحويل لاحقاً
      3. **فحص متعدد الأنواع مفيد** - `isinstance(value, (int, float))`
      4. **فحص النوع قبل العمليات الحساسة** - لتجنب الأخطاء

      هذه الممارسات ستجعل برامجك أكثر قوة وموثوقية!

  # --- STEP 20: Congratulations ---
  - type: "markdown"
    content: |
      تهانينا! لقد أتقنت فن فحص أنواع البيانات!

      ما تعلمته اليوم:

      - **`isinstance(value, type)`:** الطريقة المفضلة لفحص الأنواع
      - **فحص متعدد الأنواع:** `isinstance(value, (int, float))`
      - **`input()` دائماً تعطي `str`** - مهم جداً!  
      - **فحص الأنواع يحمي من الأخطاء** - خاصة مع المدخلات
      - **أفضل الممارسات** لكتابة كود آمن وموثوق

      الآن أصبحت تكتب كود ذكي يفهم ما يتعامل معه! هذه مهارة أساسية ستستخدمها في كل برنامج تكتبه.

