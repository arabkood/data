      print("السعر رقم:", @@INPUT__(price, (@@INPUT__, @@INPUT__)))
      print("الكمية رقم صحيح:", @@INPUT__(quantity, @@INPUT__))
    solution:
      - "isinstance"
      - "str"
      - "isinstance"
      - "int"
      - "float"
      - "isinstance"
