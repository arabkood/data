item_id: "module-3-item-3"
item_type: "lesson"
title: "فحص أنواع البيانات"

steps:
  # --- STEP 1: Introduction ---
  - type: "markdown"
    content: |
      تخيل أنك طبيب وأمامك مرضى مختلفون. قبل إعطاء العلاج، تحتاج لفحص كل مريض لمعرفة حالته الصحية، أليس كذلك؟

      نفس الشيء في البرمجة! أحياناً تحتاج لفحص نوع البيانات قبل التعامل معها. هل هذا رقم يمكنني الحساب معه؟ هل هو نص يمكنني عرضه؟

      اليوم ستتعلم كيفية فحص البيانات بذكاء واتخاذ قرارات مبنية على أنواعها!

  # --- STEP 2: Why check data types ---
  - type: "markdown"
    content: |
      لماذا نحتاج لفحص أنواع البيانات؟ لنرى مثالاً:

      ```python
      # المستخدم قد يدخل أي شيء
      user_input = input("أدخل رقماً: ")
      
      # ماذا لو أردنا مضاعفة الرقم؟
      # هذا لن يعمل كما نتوقع!
      result = user_input * 2
      ```

      إذا كتب المستخدم "5"، النتيجة ستكون "55" وليس 10!

      لذلك نحتاج لفحص النوع أولاً لنتعامل معه بالطريقة الصحيحة.

  # --- STEP 3: Using type() for checking ---
  - type: "markdown"
    content: |
      يمكنك استخدام `type()` للفحص والمقارنة:

      ```python
      value = 42

      if type(value) == int:
          print("هذا رقم صحيح!")
      elif type(value) == str:
          print("هذا نص!")
      elif type(value) == float:
          print("هذا رقم عشري!")
      ```

      **ملاحظة:** لا تقلق حول `if` الآن، سنتعلمها لاحقاً. المهم أن تفهم فكرة المقارنة مع الأنواع.

  # --- STEP 4: Practice with type checking ---
  - type: "fill"
    lang: "python"
    question: "أكمل هذا الكود لفحص نوع المتغير"
    code: |
      age = 25
      name = "أحمد"
      
      print("نوع age:", @@INPUT@@(age))
      print("نوع name:", @@INPUT@@(name))
    solution:
      - "type"
      - "type"
    explanation: "ممتاز! الآن يمكنك رؤية أن `age` من نوع `int` و `name` من نوع `str`."

  # --- STEP 5: The isinstance() function ---
  - type: "markdown"
    content: |
      بايثون تقدم طريقة أفضل وأكثر احترافية لفحص الأنواع: الدالة `isinstance()`.

      ```python
      age = 25
      name = "سارة"
      price = 19.99

      print(isinstance(age, int))     # True
      print(isinstance(name, str))    # True  
      print(isinstance(price, float)) # True
      print(isinstance(age, str))     # False
      ```

      `isinstance()` تعطيك `True` إذا كان النوع صحيح، و `False` إذا لم يكن كذلك.

  # --- STEP 6: Practice with isinstance ---
  - type: "fill"
    lang: "python"
    question: "استخدم `isinstance()` لفحص أنواع هذه المتغيرات"
    code: |
      score = 95.5
      student_name = "فاطمة"
      
      print("هل score رقم عشري؟", @@INPUT@@(score, @@INPUT@@))
      print("هل student_name نص؟", @@INPUT@@(student_name, @@INPUT@@))
    solution:
      - "isinstance"
      - "float"
      - "isinstance"
      - "str"
    explanation: "رائع! `isinstance()` أوضح وأسهل في القراءة من `type()`."

  # --- STEP 7: Quiz about isinstance ---
  - type: "quiz"
    question: "ما ناتج هذا الكود؟"
    code: |
      value = "123"
      result = isinstance(value, int)
      print(result)
    lang: "python"
    options:
      - "True"
      - "False"
      - "خطأ"
    solution: 1
    explanation: "الناتج `False` لأن `\"123\"` هو نص وليس رقم صحيح، رغم أنه يحتوي على أرقام."

  # --- STEP 8: Multiple type checking ---
  - type: "markdown"
    content: |
      يمكنك فحص عدة أنواع في نفس الوقت:

      ```python
      value = 42

      # فحص نوع واحد
      if isinstance(value, int):
          print("رقم صحيح!")

      # فحص عدة أنواع
      if isinstance(value, (int, float)):
          print("رقم (صحيح أو عشري)!")

      # فحص نوع مختلف
      if isinstance(value, str):
          print("نص!")
      else:
          print("ليس نص!")
      ```

      لاحظ الأقواس `(int, float)` للفحص المتعدد.

  # --- STEP 9: Practice multiple checking ---
  - type: "fill"
    lang: "python"
    question: "فحص ما إذا كانت القيمة رقم (صحيح أو عشري)"
    code: |
      test_value = 3.14
      
      if @@INPUT@@(test_value, (@@INPUT@@, @@INPUT@@)):
          print("هذا رقم!")
      else:
          print("ليس رقم!")
    solution:
      - "isinstance"
      - "int"
      - "float"
    explanation: "ممتاز! الآن يمكنك فحص عدة أنواع في خط واحد."

  # --- STEP 10: Real world example ---
  - type: "markdown"
    content: |
      لنرى مثالاً عملياً - برنامج حاسبة بسيط:

      ```python
      def safe_calculate(a, b):
          # فحص أن كلا القيمتين أرقام
          if isinstance(a, (int, float)) and isinstance(b, (int, float)):
              return a + b
          else:
              return "خطأ: يجب أن تكون القيم أرقام!"

      # تجربة
      print(safe_calculate(5, 3))      # 8
      print(safe_calculate(5, "3"))    # خطأ: يجب أن تكون القيم أرقام!
      ```

      هذا يحمي برنامجك من الأخطاء!

  # --- STEP 11: Input validation example ---
  - type: "markdown"
    content: |
      مثال آخر - التحقق من صحة المدخلات:

      ```python
      name = input("اسمك: ")
      age_input = input("عمرك: ")

      # التحقق من النوع والمحتوى
      if isinstance(name, str) and len(name) > 0:
          print("الاسم صحيح!")
      else:
          print("يرجى إدخال اسم صحيح!")

      # تذكر: input() دائماً يعطي str
      print("نوع المدخل:", type(age_input))
      ```

      هذا يساعدك في بناء برامج أكثر موثوقية.

  # --- STEP 12: Quiz about input types ---
  - type: "quiz"
    question: "ماذا سيحدث في هذا الكود؟"
    code: |
      user_input = input("أدخل رقماً: ")  # المستخدم يكتب: 25
      print(isinstance(user_input, int))
    lang: "python"
    options:
      - "True"
      - "False"  
      - "خطأ"
    solution: 1
    explanation: "`False` لأن `input()` دائماً تعطي `str`، حتى لو كتب المستخدم رقماً."

  # --- STEP 13: Bug hunting ---
  - type: "bug"
    lang: "python"
    question: "ابحث عن الخطأ في هذا الكود"
    code: |
      price = 29.99
      if isinstance(price, int):
          print("سعر صحيح!")
      elif isinstance(price, Float):
          print("سعر عشري!")
    solution: 3
    explanation: "الخطأ هو كتابة `Float` بحرف كبير بدلاً من `float` بحرف صغير. أنواع البيانات في بايثون تُكتب بأحرف صغيرة."
    hint: "تحقق من كتابة أسماء الأنواع."

  # --- STEP 14: Order challenge ---
  - type: "order"
    lang: "python"
    question: "رتب هذا الكود لفحص نوع البيانات وطباعة رسالة مناسبة"
    code:
      - "value = 42"
      - "if isinstance(value, str):"
      - "    print(\"هذا نص!\")"
      - "elif isinstance(value, int):"
      - "    print(\"هذا رقم صحيح!\")"
      - "else:"
      - "    print(\"نوع آخر!\")"
    explanation: "نحتاج لإنشاء المتغير أولاً، ثم فحص الأنواع بالترتيب المنطقي."

  # --- STEP 15: Practical application ---
  - type: "fill"
    lang: "python"
    question: "أنشئ دالة تفحص نوع البيانات وتعطي وصفاً مناسباً"
    code: |
      def describe_data(value):
          if @@INPUT@@(value, @@INPUT@@):
              return "هذا نص"
          elif @@INPUT@@(value, @@INPUT__):
              return "هذا رقم صحيح"
          elif @@INPUT__(value, @@INPUT__):
              return "هذا رقم عشري"
          else:
              return "نوع غير معروف"

      # تجربة
      print(describe_data("مرحبا"))  # هذا نص
      print(describe_data(42))       # هذا رقم صحيح
      print(describe_data(3.14))     # هذا رقم عشري
    solution:
      - "isinstance"
      - "str"
      - "isinstance"
      - "int"
      - "isinstance"
      - "float"
    explanation: "ممتاز! لقد أنشأت دالة ذكية تحدد نوع أي بيانات."

  # --- STEP 16: Advanced checking ---
  - type: "markdown"
    content: |
      يمكنك أيضاً فحص خصائص أخرى مع النوع:

      ```python
      user_age = input("عمرك: ")

      if isinstance(user_age, str):
          if user_age.isdigit():  # فحص أن النص يحتوي على أرقام فقط
              print("تم إدخال عمر صحيح!")
          else:
              print("يرجى إدخال أرقام فقط!")
      ```

      هذا يجمع بين فحص النوع وفحص المحتوى!

  # --- STEP 17: Final practice ---
  - type: "fill"
    lang: "python"
    question: "أكمل برنامجاً يفحص صحة بيانات منتج"
