      هذا هو الأسلوب! `input()` تعمل أولاً، ونتيجتها النصية تُستخدم فوراً بواسطة `int()`.

  - type: "markdown"
    content: |
      ### ماذا لو فشل التحويل؟

      ماذا سيحدث لو حاولنا تحويل نص لا يبدو كرقم على الإطلاق؟
      
      ```python
      # هذا الكود سيسبب انهيار البرنامج!
      not_a_number = int("مرحباً") 
      ```
      سيغضب بايثون ويعرض خطأ يسمى `ValueError`. هذه هي طريقته ليقول: "لقد أعطيتني نص 'مرحباً'، وأنا لا أعرف كيف أحول هذا إلى رقم!".

      تذكر هذا الخطأ جيداً، لأنه من أكثر الأخطاء شيوعاً عند التعامل مع مدخلات المستخدم.
      
      # media_idea: رسم كرتوني بسيط لثعبان بايثون يرفع يديه في حيرة ويظهر علامة استفهام فوق رأسه، مع فقاعة كلام تقول "ValueError: invalid literal for int()".

  - type: "quiz"
    question: "أي من الأسطر التالية سيسبب `ValueError`؟"
    options:
      - "int('500')"
      - "int('  500  ')"
      - "int('5.0')"
      - "int('-500')"
    solution: 2
    explanation: |
      إجابة دقيقة! `int()` يمكنها التعامل مع الأرقام الموجبة والسالبة والمسافات الفارغة حول الرقم. لكنها لا تفهم الفاصلة العشرية. لتحويل "5.0"، نحتاج إلى أداة مختلفة.

  - type: "markdown"
    content: |
      ### التحويل إلى عدد عشري: `float()`

      كما رأيت، `int()` صارمة جداً وتقبل الأعداد الصحيحة فقط. ولكن ماذا عن الأسعار، أو درجات الحرارة، أو أي قيمة تحتوي على فاصلة عشرية؟

      لهذا نستخدم دالة `float()`. إنها تشبه `int()` ولكنها تحول النص إلى عدد عشري (floating-point number).

      ```python
      price_string = "29.99"
      price_number = float(price_string)

      print(price_number)
      print(type(price_number))
      ```
      **الناتج:**
      ```text
      29.99
      <class 'float'>
      ```

