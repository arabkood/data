item_id: "m3-converting-between-types"
item_type: "lesson"
title: "تحويل البيانات بين الأنواع"
steps:
  - type: "markdown"
    content: |
      أهلاً بك! في الدرس الماضي، تعلمنا كيف نكون مثل المحققين ونتعرف على نوع البيانات باستخدام `type()` و `isinstance()`.

      لقد اكتشفنا مشكلة كبيرة: دالة `input()` تعطينا دائماً بيانات من نوع نص (`str`)، حتى لو أدخل المستخدم رقماً. هذا يمنعنا من إجراء العمليات الحسابية.

      فكيف نحل هذه المشكلة؟ لا يكفي أن **نعرف** أن النوع خاطئ، بل يجب أن نكون قادرين على **تغييره**!

      تخيل أنك في بلد عملته اليورو وأنت لا تملك إلا الدولار. لا يمكنك الشراء بالدولار (`str`)، بل تحتاج إلى الذهاب لمكتب صرافة لتحويل دولاراتك إلى يورو (`int`).

      في بايثون، لدينا "مكاتب صرافة" خاصة بنا على شكل دوال.

  - type: "markdown"
    content: |
      ### التحويل إلى عدد صحيح: `int()`

      الدالة الأولى التي سنتعلمها هي `int()`. وظيفتها بسيطة: تأخذ قيمة (غالباً نص) وتحاول قصارى جهدها لتحويلها إلى عدد صحيح (integer).

      لنرى كيف تحل مشكلتنا:
      ```python
      # نحصل على العمر كنص من المستخدم
      age_string = "25" 

      # نستخدم int() لتحويل النص إلى رقم
      age_number = int(age_string)

      # لنتحقق من الأنواع الآن!
      print( type(age_string) )
      print( type(age_number) )
      ```

      **الناتج:**
      ```text
      <class 'str'>
      <class 'int'>
      ```
      نجحنا! لقد حولنا النص "25" إلى الرقم 25. الآن يمكننا استخدامه في العمليات الحسابية.

