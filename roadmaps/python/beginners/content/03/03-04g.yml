      الترتيب المنطقي هو: تعريف الرقم، ثم تحويله إلى نص باستخدام `str()`, ثم استخدامه لإنشاء الرسالة، وأخيراً طباعة الرسالة النهائية.

  - type: "markdown"
    content: |
      ### ملحوظة أخيرة: التحويل بين الأنواع الرقمية
      
      يمكنك أيضاً التحويل مباشرة بين `int` و `float`.
      
      ```python
      num_float = float(15)   # سيصبح 15.0
      num_int = int(9.9)      # سيصبح 9 (وليس 10!)
      ```
      **نقطة مهمة جداً:** عند تحويل `float` إلى `int`، يقوم بايثون **ببتر** الجزء العشري، وليس تقريبه. `int(9.9)` هي 9، و `int(9.1)` هي 9 أيضاً.
      
      # media_idea: رسم بياني بسيط يظهر الرقم "9.9" يدخل في صندوق مكتوب عليه `int()`. يخرج من الصندوق الرقم "9"، والجزء ".9" يسقط في سلة مهملات بجانب الصندوق.

  - type: "markdown"
    content: |
      ### خلاصة
      لقد أضفت ثلاث أدوات تحويل قوية إلى صندوق أدواتك البرمجية:

      - `int()`: للتحويل إلى عدد صحيح. مثالية للأعمار، عدد العناصر، إلخ.
      - `float()`: للتحويل إلى عدد عشري. مثالية للأسعار، القياسات، إلخ.
      - `str()`: للتحويل إلى نص. ضرورية لدمج الأرقام في رسائل نصية.

      أنت الآن لا تستطيع فقط تحديد أنواع البيانات، بل يمكنك أيضاً تغييرها لتناسب احتياجات برنامجك. أنت الآن جاهز للتعامل مع مدخلات المستخدم بفعالية!
