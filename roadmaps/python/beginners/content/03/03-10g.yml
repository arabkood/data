item_id: "m3-final-challenge"
item_type: "code"
title: "تحدي: نظام التحقق من الدخول"
description: |
  أنت تبني نظام دخول بسيط جداً. يجب على المستخدم إدخال اسمه ورمز دخول سري. مهمتك هي التحقق مما إذا كان الرمز صحيحاً وطباعة رسالة ترحيب.

  **المطلوب:**

  1.  **اطلب المدخلات:**
      - اطلب من المستخدم إدخال اسمه باستخدام الرسالة: `أدخل اسم المستخدم: `
      - اطلب من المستخدم إدخال رمز الدخول باستخدام الرسالة: `أدخل رمز الدخول: `

  2.  **عالج المدخلات:**
      - قم بإزالة أي مسافات فارغة من بداية ونهاية اسم المستخدم، ثم حوّل جميع أحرفه إلى أحرف صغيرة.
      - قم بتحويل رمز الدخول الذي تم إدخاله (وهو نص) إلى عدد صحيح (integer).

  3.  **تحقق من الرمز:**
      - باستخدام جملة `if`، تحقق مما إذا كان رمز الدخول الذي تم تحويله يساوي **بالضبط** القيمة `6419`.
      - **فقط إذا كان الرمز صحيحاً**، اطبع رسالة ترحيب بالصيغة التالية: `أهلاً بك يا [username]`، حيث `[username]` هو اسم المستخدم بعد تنظيفه.
      - إذا كان الرمز خاطئاً، يجب ألا يطبع البرنامج أي شيء.

  **مثال:**
  - إذا كان إدخال اسم المستخدم `  ALI  ` وإدخال الرمز `6419`.
  - يجب أن يكون الإخراج: `أهلاً بك يا ali`
starter_code: |
  # الخطوة 1: اطلب اسم المستخدم ورمز الدخول
  username = input("أدخل اسم المستخدم: ")
  code_str = input("أدخل رمز الدخول: ")

  # الخطوة 2: قم بمعالجة المدخلات (التنظيف والتحويل)
  # نظّف اسم المستخدم هنا

  # حوّل الرمز إلى رقم هنا

  # الخطوة 3: تحقق من الرمز واطبع الرسالة إذا كان صحيحاً
solution: |
  # الخطوة 1: اطلب اسم المستخدم ورمز الدخول
  username = input("أدخل اسم المستخدم: ")
  code_str = input("أدخل رمز الدخول: ")

  # الخطوة 2: قم بمعالجة المدخلات (التنظيف والتحويل)
  cleaned_username = username.strip().lower()
  access_code = int(code_str)

  # الخطوة 3: تحقق من الرمز واطبع الرسالة إذا كان صحيحاً
  if access_code == 6419:
    print(f"أهلاً بك يا {cleaned_username}")
test_cases:
  - name: "الحالة الصحيحة الأساسية"
    input: "ahmed\n6419"
    expected: "أهلاً بك يا ahmed\n"
  - name: "اسم مستخدم غير نظيف ورمز صحيح"
    input: "  SARA  \n6419"
    expected: "أهلاً بك يا sara\n"
  - name: "رمز دخول خاطئ"
    input: "khalid\n1234"
    expected: ""
  - name: "حالة مختلطة ورمز صحيح"
    input: "  NoUrA\n6419"
    expected: "أهلاً بك يا noura\n"
  - name: "رمز خاطئ آخر"
    input: "user\n9999"
    expected: ""
