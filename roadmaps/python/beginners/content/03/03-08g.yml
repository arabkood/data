item_id: "m3-intro-to-conditional-logic"
item_type: "lesson"
title: "مقدمة بسيطة جداً للمنطق الشرطي"
steps:
  - type: "markdown"
    content: |
      مرحباً! حتى هذه اللحظة، كل الكود الذي كتبناه كان مثل طريق مستقيم. يبدأ بايثون من السطر الأول ويقوم بتنفيذ كل سطر بالترتيب، واحداً تلو الآخر، حتى يصل إلى النهاية.

      لكن البرامج الحقيقية ليست طرقاً مستقيمة. إنها مليئة بالتقاطعات والقرارات.

      - **إذا** كانت كلمة المرور صحيحة، اسمح للمستخدم بالدخول.
      - **إذا** كان عمر اللاعب أقل من 18، اعرض رسالة تحذير.
      - **إذا** كانت درجة الطالب أعلى من 90، أعطه الدرجة "A".

      لجعل برامجنا ذكية، نحتاج إلى طريقة لجعلها تتخذ قرارات. نحن بحاجة إلى "منطق شرطي".

  - type: "markdown"
    content: |
      ### أبسط إجابة في العالم: `True` و `False`

      قبل أن يتمكن الكمبيوتر من اتخاذ قرار، يجب أن يفهم مفهوم "الصواب" و "الخطأ".

      في بايثون، لدينا نوع بيانات جديد ومميز جداً لهذا الغرض يسمى **Boolean** (منطقي).
      
      هذا هو أبسط نوع بيانات على الإطلاق، لأنه لا يحتوي إلا على قيمتين ممكنتين:
      - `True` (صحيح)
      - `False` (خطأ)

      لاحظ أن الحرف الأول كبير، ولا توجد علامات اقتباس. هذه كلمات خاصة في بايثون.

      ```python
      is_sunny = True
      is_raining = False

      print(type(is_sunny))
      ```
      الناتج سيكون: `<class 'bool'>`

  - type: "quiz"
    question: "أي من التالي **ليس** قيمة Boolean صالحة في بايثون؟"
    options:
      - "True"
      - "False"
      - "`true`"
      - "كل ما سبق صالح"
    solution: 2
    explanation: "حالة الأحرف مهمة جداً في بايثون! القيمة المنطقية الصحيحة هي `True` و `False` (بحرف أول كبير). `true` بحرف صغير سيعتبره بايثون اسم متغير."

  - type: "markdown"
    content: |
      ### طرح الأسئلة: عامل المقارنة `==`

      نادراً ما نكتب `is_sunny = True` مباشرة. بدلاً من ذلك، نجعل الكمبيوتر يكتشف الحقيقة بنفسه عن طريق طرح سؤال.

      الطريقة الأساسية لطرح سؤال في البرمجة هي مقارنة قيمتين. للسؤال "هل هاتان القيمتان متساويتان؟"، نستخدم علامتي يساوي `==`.

      ```python
      # هل 5 تساوي 5؟ -> نعم، إذن النتيجة True
      print(5 == 5)

      # هل 5 تساوي 6؟ -> لا، إذن النتيجة False
      print(5 == 6)

      # هل "مرحباً" تساوي "مرحباً"؟ -> نعم، إذن النتيجة True
      print("مرحباً" == "مرحباً")
      ```
      عندما يرى بايثون `==`، فإنه يقوم بتقييم المقارنة ويعطينا إجابة `True` أو `False`.

  - type: "markdown"
    content: |
      ### تحذير مهم: `=` مقابل `==`

      هذا هو أحد أكثر الأخطاء شيوعاً التي يقع فيها المبتدئون. من الضروري جداً فهم الفرق:

      - `=` **علامة يساوي واحدة (عامل الإسناد):** تُستخدم لإعطاء قيمة لمتغير. إنها تقول للكمبيوتر: "خذ هذه القيمة وضعها في هذا الصندوق."
        `score = 100`  *(أمر)*

      - `==` **علامتا يساوي (عامل المقارنة):** تُستخدم لطرح سؤال. إنها تسأل: "هل القيمة الموجودة على اليسار تساوي القيمة الموجودة على اليمين؟"
        `score == 100` *(سؤال)*

      # media_idea: رسم بياني بسيط. على اليسار، سهم (`=`) يشير من القيمة `100` إلى صندوق مكتوب عليه `score`. على اليمين، صندوق `score` وصندوق `100` مع علامة استفهام كبيرة وعامل `==` بينهما.

  - type: "fill"
    lang: "python"
    question: "املأ الفراغ لمقارنة `user_input` بكلمة المرور الصحيحة."
    code: |
      password = "secret123"
      user_input = "secret123"

      is_correct = user_input @@INPUT@@ password
      print(is_correct)
    solution:
      - "=="
    explanation: "للمقارنة وطرح سؤال حول المساواة، نستخدم دائماً علامتي يساوي `==`."

  - type: "markdown"
    content: |
      ### اتخاذ القرار: جملة `if`

      الآن بعد أن أصبح لدينا طريقة للحصول على `True` أو `False`، يمكننا أخيراً اتخاذ قرار!

      نحن نفعل ذلك باستخدام جملة `if`. فكر فيها كحارس أمن. إنه ينظر إلى شرط. **إذا** كان الشرط `True`، فإنه يسمح بتنفيذ كتلة معينة من الكود.

      لاحظ الصيغة بعناية:
      1.  كلمة `if`.
      2.  الشرط الذي ينتج عنه `True` أو `False`.
      3.  نقطتان رأسيتان `:`.
      4.  سطر جديد مع **مسافة بادئة (indentation)**.

      ```python
      temperature = 35

      if temperature > 30:
          print("الجو حار اليوم!")

      print("استمتع بيومك.")
      ```
      سيتم طباعة كلتا الجملتين لأن الشرط `True`. الكود الذي يحتوي على مسافة بادئة "ينتمي" إلى جملة `if`.

  - type: "order"
    lang: "python"
    question: "أعد ترتيب هذه الأسطر لإنشاء برنامج يرحب بالمستخدم فقط إذا كان اسمه 'خالد'."
    code:
      - 'name = "خالد"'
      - 'if name == "خالد":'
      - '    print("أهلاً بك يا خالد!")'
    explanation: "أولاً، نحدد المتغير. ثم، نستخدم `if` مع الشرط `==` للتحقق من القيمة. وأخيراً، نضع الكود الذي نريد تشغيله بشكل شرطي، مع مسافة بادئة."

  - type: "markdown"
    content: |
      ### ماذا لو كان الشرط `False`؟

      هذا هو جمال جملة `if`. إذا كان الشرط يُقيّم إلى `False`، فإن الحارس يمنع الدخول.

      بايثون ببساطة **يتخطى** كتلة الكود ذات المسافة البادئة وينتقل إلى السطر الأول بعده.

      ```python
      temperature = 20

      # هل 20 > 30؟ لا، هذا False.
      if temperature > 30:
          # هذا السطر سيتم تجاهله بالكامل.
          print("الجو حار اليوم!")

      # سينتقل بايثون مباشرة إلى هنا.
      print("استمتع بيومك.")
      ```
      **الناتج:**
      ```text
      استمتع بيومك.
      ```

  - type: "bug"
    lang: "python"
    question: "هناك خطأ نحوي شائع جداً في جملة `if` هذه. حدد السطر الذي به المشكلة."
    code: |
      access_level = "admin"

      if access_level = "admin":
        print("تم منح الوصول الكامل.")
    solution: 2
    explanation: "هذا هو الخطأ الكلاسيكي `=` مقابل `==`! نحن هنا نحاول إسناد قيمة داخل جملة `if`، وهو ما لا معنى له ويسبب خطأ. للمقارنة، يجب أن نستخدم `==`. السطر الصحيح هو: `if access_level == 'admin':`"

  - type: "markdown"
    content: |
      ### خلاصة
      لقد خطوت للتو خطوتك الأولى في جعل برامجك ذكية!

      - **القيم المنطقية (Booleans):** هي أساس اتخاذ القرار، بقيمتيها `True` و `False`.
      - **المقارنة (`==`):** هي طريقتنا لطرح أسئلة ينتج عنها `True` أو `False`.
      - **جملة `if`:** هي الأداة التي تستخدم نتيجة المقارنة لتحديد ما إذا كان سيتم تشغيل كتلة من الكود أم لا.

      في الدروس القادمة، سنبني على هذه الفكرة الأساسية لإنشاء منطق أكثر تعقيداً وقوة.
