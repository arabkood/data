item_id: "m3-final-review"
item_type: "lesson"
title: "المراجعة النهائية: التعامل مع البيانات"
steps:
  - type: "markdown"
    content: |
      لقد قطعت شوطاً طويلاً في هذا الفصل! لقد انتقلت من مجرد طباعة الرسائل إلى بناء برامج تتفاعل مع المستخدم، وتفهم أنواع البيانات المختلفة، وتعالجها، بل وتتخذ قرارات بسيطة بناءً عليها.

      في هذه المراجعة، سنواجه بعضاً من أكثر التحديات والأخطاء شيوعاً التي واجهناها في هذا الفصل. الهدف هو التأكد من أن هذه المفاهيم الأساسية قد ترسخت تماماً. لنبدأ!

  - type: "quiz"
    question: "بغض النظر عما يكتبه المستخدم، ما هو نوع البيانات الذي تُرجعه دالة `input()` **دائماً**؟"
    options:
      - "يعتمد على ما إذا كان المستخدم قد أدخل أرقاماً أم نصاً."
      - "`int` (عدد صحيح)"
      - "`str` (نص)"
      - "`bool` (قيمة منطقية)"
    solution: 2
    explanation: "هذه هي القاعدة الذهبية الأولى عند التعامل مع مدخلات المستخدم: `input()` تُرجع دائماً نصاً (`str`). لهذا السبب نحتاج دائماً إلى التفكير في تحويل النوع."

  - type: "bug"
    lang: "python"
    question: "هذا الكود يحاول حساب سعر المنتج بعد الخصم. إذا أدخل المستخدم السعر '99.50'، سيتعطل البرنامج مع `ValueError`. حدد السطر الذي يسبب المشكلة."
    code: |
      original_price_str = input("أدخل سعر المنتج: ")
      # المستخدم يدخل "99.50"
      discount = 10
      
      price_as_num = int(original_price_str)
      final_price = price_as_num - discount
      
      print(f"السعر النهائي: {final_price}")
    solution: 4
    explanation: |
      لقد وجدتها! الخطأ هو استخدام `int()` مع نص يحتوي على فاصلة عشرية. `int()` لا تفهم إلا الأعداد الصحيحة. الأداة الصحيحة لهذه المهمة هي `float()` لأنها تستطيع التعامل مع الأعداد العشرية.

  - type: "markdown"
    content: |
      لنتعامل مع تحدٍ يجمع بين عدة مهارات. سنطلب من المستخدم إدخال درجة حرارته، التي قد تحتوي على مسافات زائدة. مهمتنا هي تنظيف المدخلات وتحويلها إلى رقم عشري.

  - type: "fill"
    lang: "python"
    question: "املأ الفراغات لتنظيف وتحويل درجة الحرارة التي أدخلها المستخدم."
    code: |
      # المستخدم يدخل "  37.5  "
      raw_temp = input("أدخل درجة الحرارة: ")
      
      # الخطوة 1: إزالة المسافات الزائدة
      clean_temp_str = raw_temp.@@INPUT@@()
      
      # الخطوة 2: تحويل النص النظيف إلى رقم عشري
      temp_value = @@INPUT@@(clean_temp_str)
      
      print(f"درجة الحرارة المسجلة هي: {temp_value}")
    solution:
      - "strip"
      - "float"
    explanation: "مثالي! هذا هو التسلسل الصحيح: أولاً، نستخدم `.strip()` لتنظيف البيانات النصية. ثانياً، نستخدم `float()` لتحويل النص النظيف إلى نوع رقمي يمكننا استخدامه في العمليات الحسابية."

  - type: "bug"
    lang: "python"
    question: "هذا الكود يحاول توحيد إجابة المستخدم إلى أحرف صغيرة، لكن المقارنة لا تزال تفشل إذا كتب المستخدم 'نعم'. لماذا لا يتغير المتغير `answer`؟"
    code: |
      answer = "نعم"
      
      # محاولة تحويل الإجابة إلى أحرف صغيرة
      answer.lower()
      
      if answer == "نعم":
        print("تمت الموافقة.")
      else:
        print("الإجابة غير متطابقة.")
    solution: 3
    explanation: |
      هذا هو الفخ الكلاسيكي! تذكر، أساليب النصوص مثل `.lower()` أو `.strip()` لا تُعدّل المتغير الأصلي. إنها تُرجع **نسخة جديدة** ومُعدّلة. بما أننا لم نحفظ هذه النسخة الجديدة، فقد ضاع تأثيرها.

      **الحل الصحيح:** `answer = answer.lower()`

  - type: "order"
    lang: "python"
    question: "أعد ترتيب هذه الأسطر لإنشاء برنامج يعمل بشكل صحيح: يقرأ عمر المستخدم، ويحوله إلى رقم، ثم يتحقق مما إذا كان أكبر من 18."
    code:
      - 'age_str = input("كم عمرك؟ ")'
      - 'age_num = int(age_str)'
      - 'if age_num > 18:'
      - '    print("يمكنك الدخول.")'
    explanation: |
      هذا هو التسلسل المنطقي الصحيح للمعالجة:
      1.  الحصول على المدخلات كنص (`input`).
      2.  تحويل النص إلى رقم (`int`).
      3.  استخدام الرقم في شرط (`if`).
      4.  تنفيذ الإجراء بناءً على الشرط.

  - type: "quiz"
    question: "أي من الخيارات التالية يطرح سؤالاً (يقارن) بدلاً من إعطاء أمر (إسناد قيمة)؟"
    options:
      - "`name = 'سارة'`"
      - "`is_valid = True`"
      - "`name == 'سارة'`"
      - "`level = 1`"
    solution: 2
    explanation: "علامتا يساوي `==` تُستخدم دائماً للمقارنة (طرح سؤال). علامة يساوي واحدة `=` تُستخدم دائماً للإسناد (إعطاء أمر)."

  - type: "fill"
    lang: "python"
    question: "أكمل الكود للتحقق مما إذا كان رمز المرور الذي تم إدخاله، بعد إزالة المسافات، يطابق الرمز السري."
    code: |
      secret_code = "PYTHON101"
      user_code = "  python101  "
      
      # نظّف وحوّل المدخلات إلى أحرف كبيرة
      clean_user_code = user_code.strip().@@INPUT@@()
      
      if clean_user_code @@INPUT@@ secret_code:
        print("الرمز صحيح!")
    solution:
      - "upper"
      - "=="
    explanation: "لضمان مقارنة عادلة، قمنا أولاً بتنظيف المدخلات وتحويلها إلى أحرف كبيرة باستخدام `.strip().upper()` لتطابق `secret_code`. ثم استخدمنا `==` للمقارنة."

  - type: "markdown"
    content: |
      لقد قمت بعمل رائع! لقد أثبت أنك تستطيع التعامل مع البيانات مثل المحترفين، وتحديد الأخطاء الشائعة وإصلاحها.

      أنت الآن جاهز للانتقال إلى الفصل التالي، حيث سنتعمق أكثر في عالم اتخاذ القرارات والتحكم في مسار تنفيذ برنامجك.
