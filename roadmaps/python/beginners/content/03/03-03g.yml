item_id: "m3-type-checking"
item_type: "lesson"
title: "التحقق من أنواع البيانات"
steps:
  - type: "markdown"
    content: |
      مرحباً بك مرة أخرى!

      في الدرس السابق، تعلمنا كيف نحصل على مدخلات من المستخدم باستخدام دالة `input()`. لكن هناك تفصيل صغير ومهم جداً.

      لنتذكر: دالة `input()` دائماً ما تُرجع البيانات كنص (string)، حتى لو أدخل المستخدم أرقاماً.

      ماذا يحدث لو حاولنا إجراء عملية حسابية على هذا النص؟
      ```python
      # يحصل البرنامج على عمر المستخدم كنص
      age_text = input("كم عمرك؟ ")

      # يحاول إضافة 5 إلى النص
      # هذا الكود سيسبب خطأ!
      # new_age = age_text + 5 
      ```
      سيحتج بايثون! لا يمكنك جمع رقم مع نص. الأمر يشبه محاولة جمع "تفاحة" مع الرقم 5.

      لهذا السبب، نحتاج إلى طريقة للتحقق من نوع البيانات التي نتعامل معها قبل محاولة استخدامها.

  - type: "markdown"
    content: |
      ### الأداة الأولى: `type()`

      تقدم بايثون دالة مدمجة بسيطة تسمى `type()`. هذه الدالة تشبه المفتش الذي ينظر إلى القيمة داخل المتغير ويخبرك بنوعها بالضبط.

      دعنا نجرّبها مع دالة `input()`:

      ```python
      user_input = input("أدخل أي شيء (رقم أو نص): ")

      print("البيانات التي أدخلتها من نوع:")
      print(type(user_input))
      ```
      
      جرّب تشغيل هذا الكود وأدخل الرقم `50`. ماذا تتوقع أن تكون النتيجة؟

  - type: "quiz"
    question: "إذا أدخلت الرقم `50` في الكود السابق، ماذا ستكون نتيجة `type(user_input)`؟"
    options:
      - "<class 'int'>"
      - "<class 'str'>"
      - "<class 'number'>"
      - "50"
    solution: 1
    explanation: |
      صحيح! بغض النظر عما تدخله، فإن دالة `input()` تُرجع دائماً سلسلة نصية (`str`). لهذا السبب، نحتاج إلى أن نكون حذرين عند التعامل مع مدخلات المستخدم.

  - type: "markdown"
    content: |
      بالطبع، تعمل دالة `type()` مع جميع أنواع البيانات. دعنا نرى أمثلة مع متغيرات أنشأناها مباشرة في الكود:

      ```python
      # متغير من نوع عدد صحيح (integer)
      score = 100
      print(type(score))
      
      # متغير من نوع عدد عشري (float)
      pi_value = 3.14
      print(type(pi_value))
      
      # متغير من نوع نص (string)
      message = "Hello, Akood!"
      print(type(message))
      ```

      **الناتج:**
      ```text
      <class 'int'>
      <class 'float'>
      <class 'str'>
      ```
      لا تقلق من كلمة `class` الآن. فقط اعتبر أن `<class 'int'>` هي الطريقة الرسمية التي يقول بها بايثون "هذا عدد صحيح".

  - type: "fill"
    lang: "python"
    question: |
      املأ الفراغ لاستخدام الدالة `type()` وطباعة نوع المتغير `temperature`.
    code: |
      temperature = 25.5
      data_type = @@INPUT@@(temperature)
      print(data_type)
    solution:
      - "type"
    explanation: |
      ممتاز! الدالة `type()` تأخذ المتغير كوسيط (`argument`) وتُرجع نوعه.

  - type: "markdown"
    content: |
      ### طريقة أفضل للتحقق: `isinstance()`

      دالة `type()` مفيدة لمعرفة النوع الدقيق، ولكن في كثير من الأحيان، كل ما نريده هو طرح سؤال بسيط والإجابة عليه بـ "نعم" أو "لا".

      على سبيل المثال: "هل هذا المتغير عدد صحيح؟"

      لهذا الغرض، نستخدم دالة `isinstance()`. فكّر فيها كحارس أمن يسأل: "هل أنت من نوع `int`؟" والإجابة تكون إما `True` (صحيح) أو `False` (خطأ).

      **الصيغة:** `isinstance(variable, data_type)`

  - type: "markdown"
    content: |
      لنرى `isinstance()` أثناء العمل.

      ```python
      player_name = "LeBron"
      player_score = 95

      # هل player_name من نوع نص؟
      is_string = isinstance(player_name, str)
      print(f"هل اسم اللاعب نص؟ {is_string}")

      # هل player_score من نوع عدد صحيح؟
      is_integer = isinstance(player_score, int)
      print(f"هل نقاط اللاعب عدد صحيح؟ {is_integer}")

      # هل player_score من نوع نص؟
      is_also_string = isinstance(player_score, str)
      print(f"هل نقاط اللاعب نص؟ {is_also_string}")
      ```

      **الناتج:**
      ```text
      هل اسم اللاعب نص؟ True
      هل نقاط اللاعب عدد صحيح؟ True
      هل نقاط اللاعب نص؟ False
      ```
      كما ترى، `isinstance()` هي أداة دقيقة ومباشرة للإجابة على أسئلة "هل هو من نوع...؟".

  - type: "fill"
    lang: "python"
    question: "املأ الفراغات للتحقق مما إذا كان `item_price` من نوع `float`."
    code: |
      item_price = 19.99
      
      # تحقق مما إذا كان السعر من نوع float
      is_float = @@INPUT@@(item_price, @@INPUT@@)
      
      print(is_float)
    solution:
      - "isinstance"
      - "float"
    explanation: "نستخدم `isinstance()` للتحقق، ونحدد `float` كنوع البيانات الذي نبحث عنه."

  - type: "bug"
    lang: "python"
    question: "هناك خطأ شائع في هذا الكود. هل يمكنك تحديد السطر الذي يحتوي على الخطأ؟"
    code: |
      user_age = 25
      if type(user_age) == "int":
          print("العمر هو عدد صحيح.")
    solution: 1
    explanation: |
      هذا خطأ شائع جداً! عند المقارنة مع نتيجة `type()`, يجب أن نقارنها بنوع البيانات نفسه (`int`, `str`, `float`) وليس بنسخة نصية منه (`"int"`).

      الطريقة الصحيحة هي: `if type(user_age) == int:`
      والطريقة الأفضل والأكثر شيوعاً هي: `if isinstance(user_age, int):`

  - type: "markdown"
    content: |
      ### لماذا كل هذا مهم؟

      التحقق من الأنواع هو أساس كتابة برامج قوية وموثوقة. يتيح لك التعامل مع مدخلات المستخدم بأمان واتخاذ قرارات في الكود الخاص بك.

      سنلقي نظرة سريعة على كيفية استخدام هذا في اتخاذ قرار بسيط. سنتعلم المزيد عن جمل `if` الشرطية لاحقاً بالتفصيل.

      ```python
      data = 42

      if isinstance(data, int):
          # هذا الكود سيعمل فقط إذا كانت البيانات من نوع int
          print("البيانات هي رقم. يمكننا إجراء عمليات حسابية!")
          print(data * 2) 
      ```
      جرّب تغيير `data = 42` إلى `data = "Hello"` وانظر كيف لن يتم تنفيذ الكود داخل جملة `if`.

  - type: "order"
    lang: "python"
    question: "أعد ترتيب الأسطر لإنشاء برنامج يتحقق مما إذا كان `value` نصاً ويطبع رسالة مناسبة."
    code:
      - 'value = "أكود"'
      - 'if isinstance(value, str):'
      - '    print("المتغير يحتوي على نص.")'
    explanation: |
      أولاً، نحدد المتغير. بعد ذلك، نستخدم جملة `if` مع `isinstance()` للتحقق من النوع. أخيراً، نضع السطر الذي نريد تنفيذه (مع مسافة بادئة) داخل جملة `if`.

  - type: "markdown"
    content: |
      ### خلاصة سريعة

      لقد تعلمت أداتين قويتين اليوم:

      1.  `type(variable)`: تخبرك بالنوع الدقيق للمتغير. رائعة لتصحيح الأخطاء وفهم بياناتك.
      2.  `isinstance(variable, type)`: تجيب بـ `True` أو `False` على سؤال "هل هذا المتغير من هذا النوع؟". هذه هي الطريقة المفضلة للتحقق من الأنواع لاتخاذ قرارات في الكود.

      الآن بعد أن عرفنا كيفية **التحقق** من نوع البيانات، ماذا لو كان النوع خاطئاً؟

      في الدرس التالي، سنتعلم كيفية **تحويل** البيانات من نوع إلى آخر!
