  - type: "markdown"
    content: |
      ### تقسيم النص: `.split()`

      هذا واحد من أقوى أساليب النصوص! `.split()` يقوم بتقسيم نص واحد إلى أجزاء متعددة بناءً على "فاصل" (separator) معين، ويضع هذه الأجزاء في شيء جديد يسمى **قائمة (list)**.

      فكر في القائمة على أنها حاوية تحمل عناصر متعددة بالترتيب.
      
      ```python
      shopping_list_text = "تفاح,موز,برتقال"
      
      # اقسم النص عند كل فاصلة
      shopping_list_items = shopping_list_text.split(",")
      
      print(shopping_list_items)
      ```
      **الناتج:**
      ```text
      ['تفاح', 'موز', 'برتقال']
      ```
      لقد حولنا نصاً واحداً إلى قائمة تحتوي على ثلاثة نصوص منفصلة! سنتعلم المزيد عن القوائم لاحقاً، لكن هذه هي أول لمحة لك عنها.

  - type: "bug"
    lang: "python"
    question: "يريد هذا الكود تقسيم أسماء المستخدمين المفصولة بمسافات، لكنه لا يعمل كما هو متوقع. ما هو الخطأ؟"
    code: |
      users = "أحمد فاطمة خالد"
      # نريد الحصول على ['أحمد', 'فاطمة', 'خالد']
      user_list = users.split(",")
      print(user_list)
    solution: 2
    actualOutput: "['أحمد فاطمة خالد']"
    expectedOutput: "['أحمد', 'فاطمة', 'خالد']"
    explanation: |
      الخطأ هو أننا نحاول التقسيم باستخدام فاصلة (`,`) بينما الأسماء مفصولة بمسافة. يجب أن يكون الكود `users.split(" ")` أو ببساطة `users.split()`، حيث أن التقسيم حسب المسافة هو السلوك الافتراضي.

  - type: "markdown"
    content: |
      ### تجميع النصوص: `.join()`

      الـ method المسمى `.join()` هو عكس `.split()`. يأخذ قائمة من النصوص ويجمعها في نص واحد، ويضع "لاصق" (separator) من اختيارك بين كل عنصر.

      صيغته غريبة بعض الشيء: `separator.join(list_of_strings)`

      ```python
      words = ["بايثون", "سهل", "وممتع"]
      
      # اجمع الكلمات معاً وضع مسافة بينها
      sentence = " ".join(words)
      print(sentence)
      
      # اجمع الكلمات معاً وضع "-" بينها
      dashed_sentence = "-".join(words)
      print(dashed_sentence)
      ```
      **الناتج:**
      ```text
      بايثون سهل وممتع
      بايثون-سهل-وممتع
      ```

