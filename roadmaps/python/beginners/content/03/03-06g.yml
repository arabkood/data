item_id: "m3-text-processing"
item_type: "lesson"
title: "معالجة النصوص: تنظيف وتشكيل المدخلات"
steps:
  - type: "markdown"
    content: |
      مرحباً بك! لقد تعلمنا كيفية الحصول على مدخلات من المستخدم وتحويل أنواعها. لكن في العالم الحقيقي، نادراً ما تكون مدخلات المستخدم مثالية.

      تخيل أنك طلبت من المستخدم إدخال اسمه. قد يكتب:
      - `"  أحمد  "` (مع مسافات إضافية)
      - `"أحمد"` (بشكل صحيح)
      - `"أحمد."` (مع علامة ترقيم)
      - `"AHMED"` (بأحرف كبيرة)

      بالنسبة للكمبيوتر، كل هذه النصوص مختلفة! إذا كنت تبحث عن اسم "أحمد" في قاعدة بيانات، فلن تجد "  أحمد  ".

      لهذا السبب، يحتاج المبرمجون إلى "تنظيف" و "معالجة" النصوص قبل استخدامها. بايثون يمنحنا أدوات قوية جداً لهذا الغرض تسمى **"methods" (الأساليب)**.

  - type: "markdown"
    content: |
      ### ما هو الـ Method؟

      فكر في الـ method على أنه **فعل** أو **إجراء** يمكن لنوع معين من البيانات القيام به. بما أننا نتحدث عن النصوص (`str`)، فإن أساليب النصوص هي أفعال يمكن للنصوص القيام بها.

      الصيغة تبدو هكذا: `variable.method_name()`

      النقطة `.` بعد اسم المتغير تعني: "يا متغير، أريدك أن تقوم بهذا الإجراء على نفسك."

      لنبدأ بأول وأشهر إجراء: إزالة المسافات الزائدة.
      
      # media_idea: رسم بسيط يظهر متغير نصي `name = "  Ali  "` ثم سهم يشير إلى صندوق مكتوب عليه `.strip()` ويخرج منه نص نظيف `"Ali"`.

  - type: "markdown"
    content: |
      ### إزالة المسافات: `.strip()`

      الـ method المسمى `.strip()` يزيل أي مسافات فارغة (whitespace) من **بداية ونهاية** النص. إنه لا يلمس المسافات في المنتصف.

      ```python
      messy_input = "   مرحباً بالعالم   "
      clean_input = messy_input.strip()

      print(f"النص الأصلي: '{messy_input}'")
      print(f"النص النظيف: '{clean_input}'")
      ```

      **الناتج:**
      ```text
      النص الأصلي: '   مرحباً بالعالم   '
      النص النظيف: 'مرحباً بالعالم'
      ```
      لاحظ كيف اختفت المسافات من الحواف فقط.

