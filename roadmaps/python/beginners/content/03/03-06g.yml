    explanation: "`.strip()` هو الـ method المثالي لإزالة المسافات البادئة واللاحقة غير المرغوب فيها من مدخلات المستخدم."

  - type: "markdown"
    content: |
      ### تغيير حالة الأحرف: `.upper()` و `.lower()`

      مشكلة شائعة أخرى هي حالة الأحرف. هل "Egypt" هي نفسها "egypt"؟ بالنسبة لنا نعم، لكن ليس للكمبيوتر.

      للتوحيد، يمكننا تحويل كل النص إلى أحرف كبيرة (`UPPERCASE`) أو صغيرة (`lowercase`).

      - `.upper()`: يحول كل الأحرف إلى كبيرة.
      - `.lower()`: يحول كل الأحرف إلى صغيرة.

      ```python
      city = "Cairo"
      print(city.upper()) # سيطبع CAIRO
      print(city.lower()) # سيطبع cairo
      ```
      هذا مفيد جداً للمقارنات غير الحساسة لحالة الأحرف.

  - type: "quiz"
    question: "أي سطر كود سيحول `userInput` إلى 'welcome' لتتم مقارنتها بشكل صحيح؟"
    code: |
      userInput = "  Welcome  "
      # ... أي سطر يجب أن يكون هنا؟
      if ________ == "welcome":
          print("تمت المطابقة!")
    options:
      - "userInput.strip().upper()"
      - "userInput.strip().lower()"
      - "userInput.lower().strip()"
      - "كلا الخيارين الثاني والثالث صحيحان"
    solution: 3
    explanation: |
      كلاهما يعمل! يمكنك تنظيف المسافات أولاً ثم تحويل الحالة، أو العكس. هذه العملية تسمى "method chaining" أو "سلسلة الأساليب"، وهي تقنية قوية جداً تجمع عدة عمليات في خطوة واحدة.

  - type: "markdown"
    content: |
      ### البحث والاستبدال: `.replace()`

      أحياناً، تريد استبدال جزء من النص بشيء آخر. الـ method المسمى `.replace()` يقوم بذلك تماماً.

      الصيغة هي: `.replace("النص القديم", "النص الجديد")`

      ```python
      sentence = "أنا أحب القهوة. القهوة لذيذة."
      
      # استبدل كل "القهوة" بـ "الشاي"
      new_sentence = sentence.replace("القهوة", "الشاي")
      
      print(new_sentence)
      ```
      **الناتج:**
      ```text
      أنا أحب الشاي. الشاي لذيذ.
      ```

