item_id: "module-1-item-1"
item_type: "lesson"
title: "كتابة الكود"

steps:
  # --- STEP 1: Welcome and motivation ---
  - type: "markdown"
    content: |
      أهلاً بك في درس البرمجة الأول! في غضون دقائق قليلة، ستكتب أول سطر من كود بايثون وسترى كيف يعمل.

      الجزء المثير هو أنك لست بحاجة لفهم كل شيء عن البرمجة لتبدأ. سنبدأ مباشرة ونتعلم بالممارسة.

      هل أنت مستعد؟ هيا نكتب بعض الكود!

  # --- STEP 2: The print statement introduction ---
  - type: "markdown"
    content: |
      أول أداة لك كمبرمج هي أمر الطباعة `print()`. فكر فيه كصوت حاسوبك - فهو يسمح لبرنامجك بالتحدث إليك عن طريق عرض نص على الشاشة.

      إليك طريقة عمله:

      ```python
      print("مرحباً بالعالم!")
      ```

      عند تشغيل هذا الكود، سيعرض حاسوبك: `مرحباً بالعالم!`

  # --- STEP 2b: The print statement introduction 2 ---
  - type: "markdown"
    content: |
      كلمة `print` متبوعة بقوسين `()`, وداخل هذين القوسين، تضع النص الذي تريد عرضه. النص محاط بعلامات اقتباس `"`.

      <!-- media_idea: Simple diagram showing print("text") with arrows pointing to each part: print, parentheses, quotation marks, and the output -->

  # --- STEP 3: First practice - fill in the blank ---
  - type: "fill"
    lang: "python"
    question: "أكمل هذا الكود لعرض الرسالة 'أهلاً بك في بايثون!'"
    code: |
      @@INPUT@@("أهلاً بك في بايثون!")
    solution:
      - "print"
    explanation: "تكتب 'print' متبوعة بأقواس تحتوي على رسالتك."

  # --- STEP 4: Quiz about print syntax ---
  - type: "quiz"
    question: "ما الذي تحتاجه لوضعه حول النص عند استخدام print()؟"
    code: |
      print("هذا نص")
    lang: "python"
    options:
      - "أقواس مربعة []"
      - 'علامات اقتباس " "'
      - "أقواس معقوفة {}"
    solution: 1
    explanation: "يجب أن يلتف النص (الذي نسميه في البرمجة `نص`) بعلامات اقتباس حتى تعرف بايثون أنه نص، وليس أمرًا."

  # --- STEP 5: Practice with different text ---
  - type: "fill"
    lang: "python"
    question: "اكتب كودًا لعرض اسمك. استبدل 'اسمك' باسمك الفعلي."
    code: |
      print(@@INPUT@@)
    solution:
      - '/^"[^"]+"$/'
    explanation: "سيتم عرض أي نص داخل علامات الاقتباس بالضبط كما هو مكتوب. هذا يسمى `نص`."

  # --- STEP 6: Introducing numbers ---
  - type: "markdown"
    content: |
      رائع! الآن لنجرب شيئًا مختلفًا. يمكنك أيضًا استخدام `print()` لعرض الأرقام.

      الاختلاف الرئيسي هنا: الأرقام لا تحتاج إلى علامات اقتباس.

      ```python
      print("مرحباً")
      print(42)
      print(100)
      ```

      لاحظ كيف أن الأرقام `42` و `100` ليست محاطة بعلامات اقتباس؟ هذا لأنها أرقام فعلية، وليست نصوصًا.

  # --- STEP 7: Practice with numbers ---
  - type: "fill"
    lang: "python"
    question: "اعرض الرقم 632 على الشاشة."
    code: |
      print(@@INPUT@@)
    solution:
      - "632"
    explanation: "الأرقام لا تحتاج إلى علامات اقتباس. بايثون تتعرف على 632 كرقم، وليس كنص."

  # --- STEP 8: Quiz about numbers vs text ---
  - type: "quiz"
    question: "أي من هذه الأوامر سيعرض الرقم 7 (وليس النص '7')؟"
    options:
      - "print('7')"
      - "print(7)"
      - "print[7]"
    solution: 1
    explanation: "الأرقام بدون علامات اقتباس تُعامل كأرقام فعلية."

  # --- STEP 8a: Quiz about numbers vs text ---
  - type: "quiz"
    question: "أي من هذه الأوامر سيعرض النص '19' (وليس الرقم 19)؟"
    options:
      - "print[19]"
      - "print(19)"
      - "print('19')"
    solution: 2
    explanation: "الأرقام التي تحتوي على علامات اقتباس هي نصوص (`نص`) تحتوي على رقم."

  # --- STEP 9: Multiple print statements ---
  - type: "markdown"
    content: |
      يمكنك كتابة عدة أوامر `print()` في الكود الخاص بك. كل أمر سيعرض رسالته في سطر جديد.

      ```python
      print("السطر الأول")
      print("السطر الثاني")
      print(123)
      ```

      هذا سيؤدي إلى عرض المخرجات التالية:
      ```
      السطر الأول
      السطر الثاني
      123
      ```

  # --- STEP 10: Practice with multiple prints ---
  - type: "fill"
    lang: "python"
    question: "أكمل هذا الكود لعرض ثلاثة أسطر: 'مرحباً'، ثم الرقم 7، ثم 'وداعاً'"
    code: |
      @@INPUT@@
      @@INPUT@@
      @@INPUT@@
    solution:
      - 'print("مرحباً")'
      - "print(7)"
      - 'print("وداعاً")'
    explanation: "كل أمر print() ينشئ سطرًا جديدًا. النص يحتاج إلى علامات اقتباس، والأرقام لا تحتاج."

  # --- STEP 11: Code ordering challenge ---
  - type: "order"
    lang: "python"
    question: "رتب أوامر الطباعة هذه لعرض: 'أهلاً'، ثم 6342، ثم 'نقاط'"
    code:
      - print("أهلاً")
      - print(6342)
      - print("نقاط")
    explanation: "يتم تنفيذ الكود من الأعلى إلى الأسفل، لذا فإن ترتيب أوامر الطباعة الخاصة بك يحدد ترتيب المخرجات."

  # --- STEP 12: Spot the bug ---
  - type: "bug"
    lang: "python"
    question: "ابحث عن السطر الذي يحتوي على الخطأ"
    code: |
      print("مرحباً")
      print(42)
      print(حظاً موفقاً)
      print("أراك لاحقًا")
    solution: 2
    explanation: "النص 'حظاً موفقاً' يفتقد لعلامات الاقتباس. يجب أن يكون كل نص محاطًا بعلامات اقتباس."
    hint: "ابحث عن نص يجب أن يكون داخل علامات اقتباس ولكنه ليس كذلك."

  # --- STEP 13: Final practice ---
  - type: "fill"
    lang: "python"
    question: "أنشئ برنامجًا يعرض رقمك المفضل، ثم النص 'هو رقمي المفضل'"
    code: |
      print(@@INPUT@@)
      print(@@INPUT@@)
    solution:
      - "/^\\d+$/"
      - '"هو رقمي المفضل"'

  # --- STEP 13b: Final practice ---
  - type: "fill"
    lang: "python"
    question: "تمرينك الأخير، أكمل هذا البرنامج!"
    code: |
      print@@INPUT@@عمل رائع!@@INPUT@@
    solution:
      - "("
      - ")"

  # --- STEP 14: Congratulations ---
  - type: "markdown"
    content: |
      تهانينا! لقد كتبت للتو أول كود بايثون لك!

      لنرَ ما تعلمته:

      - الدالة `print()` تعرض المعلومات على الشاشة
      - النص (`نص`) يجب أن يكون محاطًا بعلامات اقتباس: `"هكذا"`
      - الأرقام لا تحتاج لعلامات اقتباس: `42`
      - يمكنك كتابة عدة أوامر print، كل منها ينشئ سطرًا جديدًا
      - الكود يعمل من الأعلى إلى الأسفل، سطرًا بسطر

      > [!TIP]
      > هذه فرصة رائعة لكتابة هذه النقاط الرئيسية كملاحظات. لا تقلق بشأن حفظ كل شيء الآن - ركز على الفهم، وستكون ملاحظاتك مرجعًا مفيدًا لاحقًا!

      > [!NEXT]
      > أنت في بداية ممتازة! في المرة القادمة، سنتناول **المتغيرات** - التي تسمح لبرامجك بتذكر المعلومات.
