item_id: "module-2-item-3"
item_type: "lesson"
title: "العمليات على النصوص وسحرها"
steps:
  - type: "markdown"
    content: |
      لقد تعلمت بالفعل كيفية إنشاء النصوص وتخزينها في متغيرات. والآن دعنا نكتشف السحر الحقيقي: دمج النصوص والتعامل معها!

      تخيل أنك تبني تطبيق محادثة. ستحتاج إلى دمج الاسم الأول والأخير للمستخدم، أو ربما تكرار نمط معين لإنشاء إطار مزخرف. هنا تصبح عمليات النصوص قوتك الخارقة.

      لنبدأ بشيء ربما تفعله كل يوم - دمج الكلمات لتكوين الجمل.

  - type: "markdown"
    content: |
      ## دمج النصوص: فن الربط

      في بايثون، يمكنك ربط النصوص معًا باستخدام عامل التشغيل `+`. يُطلق على هذه العملية اسم **دمج النصوص** (`concatenation`).

      إليك كيف تعمل:

      ```python
      first_name = "أحمد"
      last_name = "سالم"
      full_name = first_name + last_name
      print(full_name)
      ```

      لكن انتظر! هذا سيطبع "أحمدسالم" بدون مسافة. دعنا نصلح ذلك:

      ```python
      full_name = first_name + " " + last_name
      print(full_name)  # يطبع الآن: أحمد سالم
      ```

      إن ` " "` هو `نص` يحتوي على مسافة فقط - لكنه لا يزال `نصًا`!

  - type: "fill"
    lang: "python"
    question: "أنشئ رسالة ترحيب بدمج النصوص. املأ الفراغات لجعلها تطبع 'مرحباً، يا سارة!'"
    code: |
      greeting = "مرحباً، يا "
      name = "سارة"
      exclamation = "!"
      message = greeting @@INPUT@@ name @@INPUT@@ exclamation
      print(message)
    solution:
      - "+"
      - "+"
    explanation: "نستخدم عامل التشغيل + لربط النصوص معًا. كل + تربط نصين في نص واحد أطول."

  - type: "quiz"
    question: "ماذا سيطبع هذا الكود؟"
    code: |
      word1 = "بايثون"
      word2 = "رائعة"
      result = word1 + word2
      print(result)
    lang: "python"
    options:
      - "بايثون رائعة"
      - "بايثونرائعة"
      - "بايثون + رائعة"
    solution: 1
    explanation: "دمج النصوص باستخدام + يربط النصوص مباشرة معًا دون إضافة مسافات تلقائيًا."

  - type: "markdown"
    content: |
      ## إضافة المسافات والمزيد

      تذكر، عند ربط النصوص باستخدام `+`، لا تضيف بايثون مسافات تلقائيًا. **يجب عليك إضافتها بنفسك.**

      إليك بعض الأنماط الشائعة:

      ```python
      # إضافة مسافات
      result = "مرحباً" + " " + "بالعالم"

      # أو قم بتضمين المسافات في نصوصك
      result = "مرحباً " + "بالعالم"

      # مزج المتغيرات والنصوص
      name = "نورة"
      message = "أهلاً بكِ يا " + name + " في موقعنا!"
      ```

  - type: "fill"
    lang: "python"
    question: "أصلح هذا الكود ليطبع 'صباح الخير، يا لمياء!' مع ترك المسافات المناسبة:"
    code: |
      time_of_day = "صباح الخير"
      name = "لمياء"
      message = time_of_day @@INPUT@@ name @@INPUT@@
      print(message)
    solution:
      - "+ \"، يا \" +"
      - "+ \"!\""
    explanation: "نحن بحاجة إلى إضافة فاصلة ومسافة بين التحية والاسم، ثم علامة تعجب في النهاية."

  - type: "markdown"
    content: |
      ## تكرار النصوص: قوة العامل *

      أحيانًا تريد تكرار نص عدة مرات. تجعل بايثون هذا الأمر سهلاً للغاية باستخدام عامل التشغيل `*`:

      ```python
      laugh = "ها"
      big_laugh = laugh * 3
      print(big_laugh)  # يطبع: هاهاها
      ```

      هذا مثالي لإنشاء الأنماط، أو الإطارات، أو لمجرد الاستمتاع بالنصوص!

  - type: "fill"
    lang: "python"
    question: "أنشئ إطارًا مزخرفًا بتكرار نمط. اجعله يطبع 10 نجوم متتالية:"
    code: |
      star = "*"
      border = star @@INPUT@@ @@INPUT@@
      print(border)
    solution:
      - "*"
      - "10"
    explanation: "عامل التشغيل * يكرر النص. `star * 10` تنشئ نصًا يحتوي على 10 من حروف النجمة."

  - type: "markdown"
    content: |
      ## الجمع بين الدمج والتكرار

      هنا يبدأ المرح الحقيقي! يمكنك الجمع بين العمليتين لإنشاء نصوص أكثر تعقيدًا:

      ```python
      decoration = "=" * 5
      title = "أهلاً بكم"
      banner = decoration + " " + title + " " + decoration
      print(banner)
      # Prints: ===== أهلاً بكم =====
      ```

  - type: "fill"
    lang: "python"
    question: "أنشئ عرض عنوان أنيق. املأ الفراغات لجعله يطبع '--- أخبار ---'"
    code: |
      dash = "-"
      title = "أخبار"
      left_border = dash @@INPUT@@ @@INPUT@@
      right_border = dash @@INPUT@@ @@INPUT@@
      result = left_border @@INPUT@@ " " @@INPUT@@ title @@INPUT@@ " " @@INPUT@@ right_border
      print(result)
    solution:
      - "*"
      - "3"
      - "*"
      - "3"
      - "+"
      - "+"
      - "+"
      - "+"
    explanation: "نكرر الشرطات 3 مرات لكل إطار، ثم ندمجها مع المسافات والعنوان."

  - type: "quiz"
    question: "ماذا سيطبع هذا الكود؟"
    code: |
      symbol = "!"
      word = "رائع"
      result = symbol * 2 + word + symbol * 2
      print(result)
    lang: "python"
    options:
      - "!!رائع!!"
      - "!2رائع!2"
      - "! ! رائع ! !"
    solution: 0
    explanation: "عامل التشغيل * يكرر النص، لذا `symbol * 2` تصبح '!!'. ثم ندمج للحصول على '!!رائع!!'."

  - type: "markdown"
    content: |
      ## تطبيق واقعي: بناء الرسائل

      لنتدرب بمثال واقعي. تخيل أنك تبني نظام محادثة بسيط حيث تحتاج إلى تنسيق الرسائل:

  - type: "fill"
    lang: "python"
    question: "أنشئ تنسيقًا لرسالة محادثة. اجعلها تطبع '[فاطمة]: مرحباً بالجميع!'"
    code: |
      username = "فاطمة"
      message_text = "مرحباً بالجميع!"
      formatted_message = "[" @@INPUT@@ username @@INPUT@@ "]: " @@INPUT@@ message_text
      print(formatted_message)
    solution:
      - "+"
      - "+"
      - "+"
    explanation: "نبني الرسالة عن طريق دمج القوس، واسم المستخدم، والقوس المغلق مع النقطتين، ثم نص الرسالة."

  - type: "markdown"
    content: |
      ## وقت التدريب: تواقيع البريد الإلكتروني

      لنقم بإنشاء مولد لتواقيع البريد الإلكتروني:

  - type: "fill"
    lang: "python"
    question: "أكمل توقيع البريد الإلكتروني. اجعله يطبع توقيعًا به شرطات فوق الاسم وأسفله:"
    code: |
      name = "د. خالد"
      separator = "-" @@INPUT@@ @@INPUT@@
      signature = separator @@INPUT@@ "\n" @@INPUT@@ name @@INPUT@@ "\n" @@INPUT@@ separator
      print(signature)
    solution:
      - "*"
      - "10"
      - "+"
      - "+"
      - "+"
      - "+"
    explanation: "ننشئ فاصلاً من 10 شرطات، ثم نبني التوقيع بأسطر جديدة (\\n) فوق الاسم وأسفله."

  - type: "quiz"
    question: "إذا أردت إنشاء النص 'بايثون' + 'بايثون' + 'بايثون'، فما هي الطريقة الأكثر كفاءة؟"
    options:
      - "\"بايثون\" + \"بايثون\" + \"بايثون\""
      - "\"بايثون\" * 3"
      - "\"بايثون\" + 3"
    solution: 1
    explanation: "استخدام * لتكرار النص أكثر كفاءة وأناقة من كتابة عدة عمليات +."

  - type: "bug"
    lang: "python"
    question: "ابحث عن السطر الذي به الخطأ في هذا الكود الذي يحاول إنشاء 'مرحباً بالعالم!!'"
    code: |
      greeting = "مرحباً"
      target = "بالعالم"
      exclamation = "!"
      result = greeting + " " + target + exclamation + 2
      print(result)
    solution: 3
    explanation: "**لا يمكنك استخدام `+` لدمج `نص` مع `رقم`**. يجب أن تكون `exclamation * 2` لتكرار علامة التعجب."
    hint: "انظر إلى الطريقة التي نحاول بها إضافة علامات التعجب."

  - type: "order"
    lang: "python"
    question: "رتب هذه الأسطر لإنشاء برنامج يطبع '*** تخفيضات *** خصم 50% ***'"
    code:
      - "stars = \"*\" * 3"
      - "announcement = \"تخفيضات\""
      - "discount = \"خصم 50%\""
      - "result = stars + \" \" + announcement + \" \" + stars + \" \" + discount + \" \" + stars"
      - "print(result)"
    explanation: "أولاً، ننشئ وحدات البناء الخاصة بنا (النجوم، الإعلان، الخصم)، ثم ندمجها مع ترك المسافات المناسبة."

  - type: "markdown"
    content: |
      ## ما الذي أتقنته

      تهانينا! أنت الآن تعرف كيفية:

      - **دمج النصوص** باستخدام عامل التشغيل `+` (`concatenation`)
      - **تكرار النصوص** باستخدام عامل التشغيل `*`
      - **الجمع بين التقنيتين** لإنشاء أنماط نصية معقدة
      - **بناء رسائل ديناميكية** عن طريق مزج المتغيرات والنصوص

      تعد عمليات النصوص هذه من اللبنات الأساسية التي ستستخدمها باستمرار في برمجة بايثون. سواء كنت تقوم بتنسيق واجهات المستخدم، أو معالجة البيانات، أو إنشاء التقارير، فإن هذه المهارات ستخدمك جيدًا.

      تذكر: لا تضيف بايثون مسافات تلقائيًا عند دمج النصوص - يجب عليك إضافتها بنفسك!
