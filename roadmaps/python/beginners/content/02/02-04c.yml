item_id: "module-2-item-6"
item_type: "lesson"
title: "التعليقات وتوثيق الكود"
steps:
  - type: "markdown"
    content: |
      حتى الآن، كل `الكود` الذي كتبناه كان موجهاً للحاسوب لينفذه.

      ولكن ماذا لو أردت أن تترك ملاحظة لنفسك، أو لمبرمج آخر يقرأ `الكود` الخاص بك؟

      هنا يأتي دور **`التعليقات`**. فكر فيها كملاحظات لاصقة للكود الخاص بك. يتجاهلها الحاسوب تمامًا — هي موجهة للبشر بنسبة 100%.

  - type: "markdown"
    content: |
      في بايثون، يمكنك إنشاء `تعليق` باستخدام رمز المربع (`#`).

      كل شيء في السطر *بعد* الرمز `#` هو `تعليق` ولن يتم تشغيله.

      ```python
      # هذا السطر بأكمله تعليق.

      level = 10  # هذا الجزء هو تعليق. الكود الذي على اليسار سيتم تشغيله.
      ```
    media_idea: "A diagram showing a line of code like `x = 5 # Store the value`. An arrow points from the '#' to the end of the line, with text overlay saying 'Ignored by the computer'."

  - type: "fill"
    lang: "python"
    question: "أضف `تعليقًا` إلى السطر أدناه يشرح أنه يخزن صحة اللاعب."
    code: |
      player_health = 100 @@INPUT@@
    solution:
      - "/^#.*$/" # Matches '#' followed by any characters
    explanation: "ممتاز! بإضافة `# تخزين صحة اللاعب`، جعلت الغرض من الكود واضحًا دون تغيير طريقة عمله."

  - type: "quiz"
    question: "ما هو الغرض الأساسي من كتابة `تعليق` في الكود الخاص بك؟"
    options:
      - "لجعل البرنامج يعمل بشكل أسرع."
      - "لإعطاء تعليمات خاصة للحاسوب."
      - "لشرح الكود للقراء من البشر (بمن فيهم أنت في المستقبل)."
      - "لإضافة رموز رائعة إلى الكود."
    solution: 2
    explanation: "بالضبط! `التعليقات` تتعلق بالتواصل. هي تساعد الآخرين (وأنت، بعد أسابيع!) على فهم ما يحاول الكود الخاص بك إنجازه."

  - type: "markdown"
    content: |
      `التعليقات` لها قوة خارقة أخرى: تسمح لك "بإيقاف" سطر من `الكود` مؤقتًا دون حذفه.

      تُسمى هذه العملية **التعطيل بالتعليق** (`commenting out`) وهي مفيدة بشكل لا يصدق للاختبار وتصحيح الأخطاء.

      ```python
      print("جاري تحميل الموارد...")
      # print("تم تعطيل هذه الرسالة مؤقتًا.")
      print("جاهز!")
      ```

      عند تشغيل هذا `الكود`، سيتم طباعة "جاري تحميل الموارد..." و "جاهز!" فقط.

  - type: "bug"
    lang: "python"
    question: "نحن نختبر لعبتنا ونريد تخطي رسالة المقدمة في الوقت الحالي. أي سطر يجب عليك 'تعطيله بالتعليق' لإيقافه؟"
    code: |
      # تسلسل بدء اللعبة
      print("أهلاً بك في عرين التنين!")
      print("مغامرتك تبدأ الآن...")
    solution: 1
    explanation: "بإضافة `#` في بداية ذلك السطر (`# print(\"أهلاً بك...\")`)، فإنك تخبر بايثون بتخطيه. هذه طريقة سريعة لاختبار أجزاء مختلفة من برنامجك."

  - type: "order"
    lang: "python"
    question: "هذا الكود يعمل، لكن من الصعب قراءته. أضف `التعليقات` إلى الأماكن الصحيحة لشرح وظيفة كل جزء."
    code:
      - "# تخزين اسم اللاعب وفئته"
      - "player_name = \"سارة\""
      - "player_class = \"ساحرة\""
      - "# حساب نقاط المانا الابتدائية"
      - "mana = 10 * 5"
      - "# عرض رسالة الترحيب"
      - "print(\"أهلاً بكِ، أيتها الـ \" + player_class + \" \" + player_name)"
      - "print(\"نقاط المانا الابتدائية:\", mana)"
    explanation: "**`التعليقات` الجيدة توضع مباشرة قبل `الكود` الذي تصفه.** هذا يسهل تصفح الملف وفهم المنطق بنظرة سريعة."

  - type: "markdown"
    content: |
      أخيرًا، بينما يُستخدم الرمز `#` للتعليقات ذات السطر الواحد، يجب أن تعرف أن هناك طريقة لكتابة تعليقات أطول ومتعددة الأسطر.

      يمكنك استخدام علامات الاقتباس الثلاثية (`\"\"\"` أو `'''`) لبدء وإنهاء كتلة من `التعليقات`.

      ```python
      """
      هذا تعليق متعدد الأسطر.
      غالبًا ما يستخدم في بداية الملف
      أو لوصف دالة معقدة.
      """
      player_age = 25 # هذه لا تزال الطريقة الأكثر شيوعًا للتعليق.
      ```

      في الوقت الحالي، التزم باستخدام `#`. هذا هو ما ستستخدمه في 99% من الحالات!

  - type: "markdown"
    content: |
      عمل رائع! لقد تعلمت كيف تجعل الكود الخاص بك مفهومًا وسهل الإدارة.

      **نقاط رئيسية:**
      - **`التعليقات`** تشرح وظيفة الكود الخاص بك.
      - تبدأ بالرمز `#` وتتجاهلها بايثون.
      - `التعليقات` الجيدة تجعل `الكود` أسهل للفهم لك وللآخرين لاحقًا.
      - يمكنك **"تعطيل الكود بالتعليق"** لإيقافه مؤقتًا.
