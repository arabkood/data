item_id: "deeper-2-advanced-print"
item_type: "lesson"
title: "تقنيات متقدمة للطباعة"
steps:
  - type: "markdown"
    content: |
      لقد كنت تستخدم الدالة `print()` لعرض أشياء مفردة مثل `print("مرحباً")` أو `print(name)`.

      ولكن ماذا لو أردت عرض عدة أشياء في وقت واحد؟ ماذا لو أردت إنشاء رسالة تجمع بين النصوص والمتغيرات؟

      دعنا نطلق العنان للقوة الكاملة للدالة `print()` ونجعل برامجك أكثر إثارة للاهتمام!

  - type: "markdown"
    content: |
      ````markdown
      ## طباعة عدة أشياء

      بدلاً من كتابة عدة جمل طباعة:
      ```python
      name = "نورة"
      age = 25
      print("الاسم:")
      print(name)
      print("العمر:")
      print(age)
      ````

      **الناتج:**

      ```
      الاسم:
      نورة
      العمر:
      25
      ```

      **يمكنك طباعة كل شيء في سطر واحد** عبر فصل العناصر بفاصلات (,):

      ```python
      name = "نورة"
      age = 25
      print("الاسم:", name, "العمر:", age)
      ```

      **الناتج:**

      ```
      الاسم: نورة العمر: 25
      ```

  - type: "fill"
    lang: "python"
    question: "جرب بنفسك! اطبع كلًا من التحية والاسم في جملة طباعة واحدة:"
    code: |
      greeting = "مرحباً"
      name = "خالد"
      print(@@INPUT@@, @@INPUT@@)
    output: |
      مرحباً خالد
    solution:
      - "greeting"
      - "name"
    explanation: "رائع! الفاصلة تخبر الدالة `print()` بعرض كلتا القيمتين مفصولتين بمسافة."

  - type: "quiz"
    question: "ماذا سيعرض هذا الكود؟"
    code: |
      city = "باريس"
      country = "فرنسا"
      print("أنا أعيش في", city, "في", country)
    lang: python
    options:
      - "أنا أعيش في باريس في فرنسا"
      - "أناأعيشفي باريسفيفرنسا"
      - "أنا أعيش في, باريس, في, فرنسا"
    solution: 0
    explanation: "الدالة `print()` تضيف مسافات تلقائيًا بين العناصر المفصولة بفاصلات، لذلك يكون الناتج: أنا أعيش في باريس في فرنسا"

  - type: "markdown"
    content: |
      يمكنك مزج النصوص والمتغيرات لإنشاء رسائل ديناميكية:

      ```python
      score = 85
      print("درجتك هي", score, "من 100")
      ```

  - type: "fill"
    lang: "python"
    question: "أنشئ رسالة تعرض اللون المفضل للمستخدم:"
    code: |
      favorite_color = "أزرق"
      print("لوني المفضل هو", @@INPUT@@)
    solution:
      - "favorite_color"
    explanation: "ممتاز! الآن ستعرض الرسالة أي لون مُخزّن في المتغير."

  - type: "quiz"
    question: "ما هو ناتج هذا الكود؟"
    code: |
      product = "حاسوب محمول"
      price = 999
      print("تكلفة", product, "هي", price, "دولار")
    lang: python
    options:
      - "تكلفة الحاسوب المحمول هي 999 دولار"
      - "تكلفة الحاسوب المحمول هي دولار 999"
      - "تكلفةالحاسوب المحمولهي999دولار"
    solution: 0
    explanation: "الدالة `print()` تعرض كل عنصر بالترتيب، مفصولة بمسافات، ليكون الناتج: تكلفة الحاسوب المحمول هي 999 دولار"

  - type: "fill"
    lang: "python"
    question: "أنشئ عرضًا لمعلومات كتاب:"
    code: |
      title = "مغامرات بايثون"
      author = "خبير الأكواد"
      pages = 250
      print("الكتاب:", @@INPUT@@, "تأليف:", @@INPUT@@, "عدد الصفحات:", @@INPUT@@)
    solution:
      - "title"
      - "author"
      - "pages"
    explanation: "ممتاز! لقد أنشأت عرضًا ديناميكيًا لمعلومات الكتاب يعمل مع بيانات أي كتاب."

  - type: "order"
    lang: "python"
    question: "رتب هذه الأسطر لإنشاء تقرير طقس صحيح:"
    code:
      - "temperature = 22"
      - "city = \"لندن\""
      - "condition = \"مشمس\""
      - "print(\"الطقس في\", city, \"هو\", condition, \"بدرجة حرارة\", temperature, \"درجة\")"
    explanation: "نحتاج إلى إنشاء جميع المتغيرات أولاً، ثم استخدامها في جملة الطباعة لعرض تقرير الطقس."

  - type: "markdown"
    content: |
      بايثون تتعامل تلقائيًا مع عرض الأرقام والنصوص بشكل صحيح!

      ```python
      items = 5
      total = 47.50
      print("لديك", items, "عناصر بإجمالي", total, "دولار")
      ```

      **الناتج:**

      ```
      لديك 5 عناصر بإجمالي 47.50 دولار
      ```

  - type: "fill"
    lang: "python"
    question: "أنشئ ملخصًا لعربة التسوق:"
    code: |
      cart_items = 3
      shipping = 5.99
      total = 24.99
      print("العربة:", @@INPUT@@, "عناصر, الشحن:", @@INPUT@@, "الإجمالي:", @@INPUT@@)
    solution:
      - "cart_items"
      - "shipping"
      - "total"
    explanation: "ممتاز! عرض عربة التسوق الخاص بك يظهر جميع المعلومات المهمة في سطر واحد واضح."

  - type: "fill"
    lang: "python"
    question: |
      أكمل هذا الكود لعرض الملف الشخصي للمستخدم في جملة طباعة واحدة، الناتج المتوقع:
      ```
      أحمد 28
      ```
    code: |
      name = "أحمد"
      age = 28
      
      print(@@INPUT@@)
    solution:
      - "name, age"
    explanation: "ممتاز!"

  - type: "bug"
    lang: "python"
    question: "ابحث عن الخطأ في ملخص طلب المطعم هذا:"
    code: |
      dish = "بيتزا"
      quantity = 2
      price = 18.50
      print("الطلب:" dish "الكمية:" quantity "السعر:" price)
    solution: 3
    explanation: "**الخطأ هو عدم وجود الفواصل!** عند طباعة عناصر متعددة، يجب وضع فاصلة بين كل عنصر والآخر: `print(\"الطلب:\", dish, \"الكمية:\", quantity, \"السعر:\", price)`"
    hint: "انظر إلى كيفية فصل العناصر في جملة الطباعة."

  - type: "order"
    lang: "python"
    question: "أنشئ عرضًا لمراجعة فيلم عن طريق وضع هذه الأسطر بالترتيب الصحيح:"
    code:
      - "movie_title = \"سبايدرمان\""
      - "rating = 8.5"
      - "genre = \"أكشن\""
      - "print(\"الفيلم:\", movie_title, \"النوع:\", genre, \"التقييم:\", rating, \"من 10\")"
    explanation: "نقوم بإنشاء جميع بيانات الفيلم أولاً، ثم نعرضها في جملة طباعة واحدة شاملة."

  - type: "markdown"
    content: |
      لقد أتقنت تقنيات الطباعة المتقدمة! الآن يمكنك:

      - طباعة عناصر متعددة باستخدام الفواصل: `print("مرحباً", name, "!")`
      - إنشاء عروض ذات مظهر احترافي لأي نوع من البيانات

      يمكن لبرامجك الآن التواصل بفعالية أكبر مع المستخدمين. بدلاً من الأسطر المنفصلة والمملة، أنت الآن تنشئ رسائل كاملة وغنية بالمعلومات تتكيف مع بياناتك!

      > [!NEXT]
      > سنتعلم المزيد من الطرق للتعامل مع النصوص ونجعل برامجك أكثر قوة! 🚀
