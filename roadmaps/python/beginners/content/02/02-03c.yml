item_id: "module-2-item-5"
item_type: "lesson"
title: "لعبة تدريبية: محترف النصوص"
steps:
  - type: "markdown"
    content: |
      أهلاً بك في تحدي محترف النصوص!

      حتى الآن، تعلمت عن `المتغيرات` و`النصوص` و`الأرقام` والدالة `print()`. حان الوقت الآن لتطبيق كل ذلك في سيناريو عملي وممتع.

      تخيل أنك تنشئ نظام ترحيب مخصص للعبة جديدة. هدفك هو استخدام مهاراتك في بايثون لصياغة رسائل مخصصة للاعبين.

      لنبدأ!

  - type: "fill"
    lang: "python"
    question: "أولاً، لننشئ `متغيرًا` لحفظ اسم اللاعب. أنشئ `متغيرًا` باسم `player_name` وعيّن له القيمة النصية `\"أحمد\"`."
    code: |
      @@INPUT@@ = "أحمد"
    solution:
      - "player_name"
    explanation: "`المتغيرات` تحتاج إلى اسم! لقد أنشأنا واحدًا باسم `player_name` لتخزين اسم اللاعب."

  - type: "fill"
    lang: "python"
    question: "ممتاز. الآن، لننشئ رسالة ترحيب. أنشئ `متغيرًا` جديدًا باسم `welcome_message` يدمج `النص` `\"أهلاً بك، \"` مع `المتغير` `player_name`."
    code: |
      player_name = "أحمد"
      welcome_message = @@INPUT@@ + @@INPUT@@
      print(welcome_message)
    solution:
      - '"أهلاً بك، "'
      - "player_name"

  - type: "markdown"
    content: |
      رائع! لقد دمجت `نصًا` ثابتًا مع `متغير`.

      الآن، لنجعل الرسالة مميزة. يمكننا استخدام عامل التشغيل `*` لتكرار `نص` عدة مرات، وهو أمر رائع لإنشاء إطارات أو زخارف.

  - type: "fill"
    lang: "python"
    question: "أنشئ `متغيرًا` باسم `border` عن طريق تكرار الحرف `=` عشرين مرة."
    code: |
      border = @@INPUT@@ * @@INPUT@@
      print(border)
    solution:
      - '"="'
      - "20"
    explanation: "استخدام `\"=\" * 20` يخبر بايثون بإنشاء `نص` جديد يحتوي على 20 علامة يساوي. هذا أسهل بكثير من كتابتها كلها يدويًا!"

  - type: "quiz"
    question: "ماذا سيكون ناتج هذا الكود؟"
    code: |
      print("نا" * 8 + " باتمان!")
    lang: "python"
    options:
      - "خطأ"
      - "نانانانانانانانا باتمان!"
      - "نا8 باتمان!"
      - "8نا باتمان!"
    solution: 1
    explanation: "بايثون تتعامل أولاً مع عملية الضرب (`\"نا\" * 8`)، لتنشئ `\"نانانانانانانانا\"`، ثم تتعامل مع عملية الجمع (`+ \" باتمان!\"`)، لدمج النصين."

  - type: "order"
    lang: "python"
    question: "لنقم بتجميع لافتة لاعب كاملة! اسحب الأسطر إلى الترتيب الصحيح لتعريف `المتغيرات` ثم طباعة اللافتة الكاملة."
    code:
      - "player_name = \"ليلى\""
      - "decoration = \"*~*\" * 5"
      - "print(decoration)"
      - 'print("أعلى نتيجة!")'
      - "print(\"اللاعب: \" + player_name)"
      - "print(decoration)"
    alternate: 
      - [0, 1, 2, 3, 4, 5]
      - [1, 0, 2, 3, 4, 5]
      - [0, 1, 5, 3, 4, 2]
      - [1, 0, 5, 3, 4, 2]
    explanation: "**يجب عليك دائمًا تعريف متغيراتك قبل أن تتمكن من استخدامها**."

  - type: "markdown"
    content: |
      انظر إلى ذلك! أنت تبني مخرجات معقدة.

      أتتذكر عندما تعلمنا أن الدالة `print()` يمكنها استقبال عدة عناصر مفصولة بفاصلات؟ لنستخدم ذلك للإعلان عن النتيجة الابتدائية للاعب.

  - type: "fill"
    lang: "python"
    question: "اللاعب `\"إلياس\"` وجد `3` جرعات. استخدم جملة `print()` واحدة مع وسائط متعددة لطباعة الرسالة `لقد وجدت 3 جرعات`."
    code: |
      player = "إلياس"
      item_count = 3
      item_name = "جرعات"
      print(@@INPUT@@, @@INPUT@@, @@INPUT@@)
    solution:
      - '"لقد وجدت"'
      - "item_count"
      - "item_name"
    explanation: "بفصل `المتغيرات` و`النصوص` بفاصلات في جملة `print()`، تضيف بايثون تلقائيًا مسافة بينها. هذا يمكن أن يكون أبسط من إضافة المسافات يدويًا باستخدام `+`."

  - type: "bug"
    lang: "python"
    question: "يا إلهي! نحاول الإعلان عن مستوى اللاعب، لكن الكود يتعطل. ابحث عن السطر الذي يحتوي على الخطأ."
    code: |
      player_level = 10
      message = "لقد وصلت إلى المستوى " + player_level
      print(message)
    solution: 1
    expectedOutput: "لقد وصلت إلى المستوى 10"
    actualOutput: "TypeError: can only concatenate str (not \"int\") to str"
    explanation: "بايثون لا تسمح لك باستخدام `+` لدمج `نص` و`رقم` مباشرة. الأمر أشبه بمحاولة جمع كلمة ورقم معًا في الرياضيات - هذا غير منطقي!"

  - type: "fill"
    lang: "python"
    question: "لإصلاح هذا، نحتاج إلى تحويل `الرقم` إلى `نص` قبل دمجهما. استخدم `str(player_level)` لإصلاح الكود."
    code: |
      player_level = 10
      message = "لقد وصلت إلى المستوى " + @@INPUT@@(player_level)
      print(message)
    solution:
      - "str"
    explanation: "تغليف `متغير` بالدالة `str()` مثل `str(player_level)` يخبر بايثون: 'تعامل مع هذا `الرقم` كقطعة من `النص`.' هذا يسمح لك بدمجه مع نصوص أخرى دون التسبب في خطأ."

  - type: "markdown"
    content: |
      عمل رائع!

      **لقد تدربت على:**
      - إنشاء واستخدام `المتغيرات`.
      - ربط `النصوص` باستخدام `+` (الدمج).
      - تكرار `النصوص` باستخدام `*`.
      - دمج `النصوص` و`المتغيرات` في `print()`.
      - إصلاح الأخطاء الشائعة عن طريق تحويل الأرقام إلى نصوص باستخدام `str()`.

      أنت رسميًا محترف الطباعة!
