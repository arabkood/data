item_id: "module-5-item-4"
item_type: "lesson"
title: "إتقان التحكم في تدفق البرنامج"
steps:
  - type: "markdown"
    content: |
      لقد تعلمت الأدوات: `if`, `elif`, `else`, والشروط المتداخلة. الآن، دعنا نتعمق في *عقلية* المبرمج.

      فكر في الكود الذي تكتبه كأنه وصفة طهي. يقرأ الكمبيوتر (الشيف) وصفتك سطراً بسطر، من الأعلى إلى الأسفل. لكن وصفتك ليست مجرد قائمة أوامر بسيطة؛ إنها تحتوي على نقاط قرار.

      - **"إذا** كانت المكونات طازجة، استخدمها مباشرة."
      - **"وإلا،** اذهب إلى المتجر أولاً."

      إتقان التحكم في التدفق يعني أنك تفهم تماماً كيف سيقرأ "الشيف" وصفتك ويتخذ القرارات في كل خطوة. أنت لا تكتب الأوامر فقط، بل تصمم **مسار التنفيذ**.

  - type: "markdown"
    content: |
      دعنا نتتبع مسار تنفيذ بسيط معاً، ونتخيل أننا الكمبيوتر.

      ```python
      status = "online"
      friend_count = 55
      
      print("بدء فحص الملف الشخصي...")
      
      if status == "offline":
          print("المستخدم غير متصل.")
      elif status == "online":
          print("المستخدم متصل الآن.")
      
      if friend_count > 50:
          print("لديه شبكة واسعة من الأصدقاء.")
      
      print("...فحص الملف الشخصي انتهى.")
      ```

      **تحليل التنفيذ:**
      1.  `status` يصبح "online".
      2.  `friend_count` يصبح 55.
      3.  **الناتج:** "بدء فحص الملف الشخصي..."
      4.  هل `status == "offline"`؟ **خطأ**. نتجاهل الكود الخاص بها.
      5.  هل `status == "online"`؟ **صحيح**. ندخل وننفذ الكود.
      6.  **الناتج:** "المستخدم متصل الآن."
      7.  هل `friend_count > 50`؟ **صحيح**. ندخل وننفذ الكود.
      8.  **الناتج:** "لديه شبكة واسعة من الأصدقاء."
      9.  **الناتج:** "...فحص الملف الشخصي انتهى."

      # media_idea: صورة GIF تظهر الكود أعلاه، مع سهم أو هايلايت يتحرك من سطر إلى آخر، ويقفز فوق كتلة `if status == "offline"`.

  - type: "quiz"
    lang: "python"
    question: "في المثال السابق، لماذا تم فحص `friend_count > 50` حتى بعد العثور على أن `status` هو `online`؟"
    code: |
      if status == "offline":
          print("المستخدم غير متصل.")
      elif status == "online":
          print("المستخدم متصل الآن.")
      
      if friend_count > 50:
          print("لديه شبكة واسعة من الأصدقاء.")
    options:
      - "لأن بايثون دائماً تفحص كل الشروط."
      - "لأن `if friend_count > 50` هي عبارة `if` مستقلة ومنفصلة عن سلسلة `if/elif` التي سبقتها."
      - "لأن هناك خطأ في الكود."
      - "لأن `status` و `friend_count` مرتبطان."
    solution: 1
    explanation: "سلسلة `if/elif` هي نقطة قرار واحدة. أما عبارة `if` الثانية فهي نقطة قرار جديدة تماماً. الكمبيوتر ينهي القرار الأول ثم يبدأ القرار الثاني بشكل مستقل."

  - type: "markdown"
    content: |
      هذه النقطة الأخيرة هي من أهم المفاهيم في التحكم بالتدفق!

      **`if / elif / else`** -> سلسلة مترابطة. مثل مفترق طرق متعدد الخيارات. أنت تختار **مساراً واحداً فقط**.
      
      **`if` ... `if` ... `if`** -> عدة أسئلة منفصلة. مثل قائمة تحقق. أنت تجيب على كل سؤال على حدة.

      انظر إلى الفرق الهائل في السلوك بين هذين الكودين:
      
      ```python
      # الحالة الأولى: elif (سؤال واحد، إجابة واحدة)
      score = 95
      if score >= 90:
        print("ممتاز")
      elif score >= 50:
        print("جيد") 
      # الناتج: "ممتاز"
      ```

      ```python
      # الحالة الثانية: if مستقلة (سؤالان، إجابتان محتملتان)
      score = 95
      if score >= 90:
        print("ممتاز")
      if score >= 50:
        print("جيد")
      # الناتج:
      # ممتاز
      # جيد
      ```
      فهم هذا الفرق هو مفتاح بناء منطق صحيح وغير متضارب.

  - type: "bug"
    lang: "python"
    question: |
      يقوم هذا الكود بحساب تكلفة التذكرة. الهدف هو إعطاء خصم واحد فقط: خصم الطلاب له الأولوية على خصم كبار السن.
      
      الكود الحالي يطبق خصم كبار السن على الطالب الذي هو أيضاً كبير في السن. حدد السطر الذي يسبب هذا الخطأ المنطقي.
    code: |
      age = 70
      is_student = True
      ticket_price = 100

      if is_student:
        ticket_price = 50
      
      if age >= 65:
        ticket_price = 60

      print(f"السعر النهائي: {ticket_price}")
    solution: 7
    expectedOutput: "السعر النهائي: 50"
    actualOutput: "السعر النهائي: 60"
    explanation: |
      المشكلة هي استخدام عبارتي `if` مستقلتين. بعد أن يطبق الكود خصم الطالب ويجعل السعر 50، فإنه يسأل سؤالاً جديداً تماماً: "هل العمر >= 65؟". بما أن الشرط صحيح، فإنه **يستبدل** قيمة `ticket_price` بالقيمة 60.
      
      الحل الصحيح هو استخدام `elif` في السطر 8 لتحويلها إلى نقطة قرار واحدة.

  - type: "markdown"
    content: |
      **تتبع حالة البرنامج**

      المسار الذي يسلكه برنامجك يغير قيم المتغيرات. نسمي هذه القيم "حالة" (State) البرنامج. كمبرمج، يجب أن تكون قادراً على تتبع هذه الحالة في رأسك.

      دعنا نتتبع "حالة" متغير `access_level` في هذا الكود:
      ```python
      is_admin = False
      is_moderator = True
      access_level = 1 # الحالة الأولية

      if is_admin:
        access_level = 3
      elif is_moderator:
        access_level = 2 # الحالة تتغير هنا
      
      # في هذه النقطة، ما هي قيمة access_level؟
      # الإجابة: 2
      ```
      لأن مسار `elif` هو الذي تم تنفيذه، تغيرت قيمة `access_level` من 1 إلى 2.

  - type: "fill"
    lang: "python"
    question: "بعد تنفيذ هذا الكود، ما هي القيمة النهائية لمتغير `bonus`؟ تتبع المسار بعناية!"
    code: |
      sales = 15000
      years_of_service = 6
      bonus = 0

      if sales > 10000:
        bonus = 500
        if years_of_service > 5:
          bonus = bonus + 250
      elif sales > 5000:
        bonus = 200
      else:
        bonus = 50

      # ما هي القيمة النهائية هنا؟
      # bonus = ؟
    solution:
      - "750"
    explanation: |
      1. `sales > 10000` (15000 > 10000) صحيح. ندخل الكتلة الأولى.
      2. `bonus` يصبح 500.
      3. ندخل الشرط المتداخل: `years_of_service > 5` (6 > 5) صحيح.
      4. `bonus` يصبح `500 + 250` أي 750.
      5. يتم تجاهل `elif` و `else` بالكامل لأننا وجدنا شرطاً صحيحاً في البداية.

  - type: "markdown"
    content: |
      أحسنت! لقد تعمقت الآن في فهم كيف "يفكر" الكمبيوتر.

      **الخلاصة:**
      - **التدفق** هو المسار الذي يتبعه المفسر عبر الكود الخاص بك.
      - أنت تتحكم في هذا المسار باستخدام `if`, `elif`, و `else`.
      - فهم الفرق بين `elif` (خيار واحد من متعدد) و `if` المستقلة (أسئلة متعددة) أمر حاسم.
      - **تتبع الحالة** (قيم المتغيرات) أثناء تدفق البرنامج هو مهارة أساسية للمبرمج.

      عندما تتمكن من قراءة الكود وتوقع نتيجته بدقة قبل تشغيله، تكون قد أتقنت التحكم في تدفق البرنامج.
