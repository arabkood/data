item_id: "module-5-item-1"
item_type: "lesson"
title: "خيارات متعددة مع Elif و Else"
steps:
  - type: "markdown"
    content: |
      أهلاً بك! في الدروس السابقة، تعلمنا كيف تسمح لنا عبارة `if` باتخاذ قرار بين مسارين: إما أن يتحقق الشرط أو لا يتحقق.

      لكن ماذا لو كانت الحياة أكثر تعقيداً من مجرد خيارين؟ ماذا لو كان لديك ثلاثة، أربعة، أو حتى المزيد من الخيارات؟

      تخيل إشارة المرور:
      - **أخضر**: انطلق
      - **أصفر**: تمهل
      - **أحمر**: توقف

      باستخدام `if` وحدها، يمكننا فقط التعامل مع "هل الضوء أخضر؟" (انطلق) أو "ليس أخضر" (لا تنطلق). هذا لا يكفي للتعامل مع كل الحالات!

  - type: "markdown"
    content: |
      للتعامل مع أكثر من خيارين، تقدم بايثون لنا `elif`. هي اختصار لـ "else if" (وإلا إذا).

      تسمح لك `elif` بطرح سؤال آخر **فقط إذا كان شرط `if` الأول خاطئاً (`False`)**.

      هكذا تبدو البنية:
      ```python
      if condition_1:
        # نفّذ هذا الكود إذا كان الشرط الأول صحيحاً
      elif condition_2:
        # نفّذ هذا الكود إذا كان الشرط الأول خاطئاً والثاني صحيحاً
      ```

  - type: "fill"
    lang: "python"
    question: "لنكتب الكود الخاص بإشارة المرور. املأ الفراغ للتحقق من الضوء الأصفر."
    code: |
      light = "yellow"

      if light == "green":
        print("انطلق!")
      @@INPUT@@ light == "yellow":
        print("تمهل!")
    solution:
      - "elif"
    explanation: |
      استخدمنا `elif` لأننا نريد التحقق من شرط ثانٍ (`light == "yellow"`) فقط في حال لم يكن الشرط الأول (`light == "green"`) صحيحاً.

  - type: "markdown"
    content: |
      ممتاز! ولكن ماذا عن الضوء الأحمر؟ يمكننا إضافة `elif` أخرى، ولكن ماذا لو أردنا إجراءً افتراضياً لـ**كل الحالات الأخرى**؟

      هنا يأتي دور `else` (وإلا). إنها بمثابة "الشبكة الأخيرة" التي تلتقط كل شيء. يتم تنفيذ الكود الموجود داخل `else` إذا كانت **جميع** شروط `if` و `elif` السابقة خاطئة (`False`).

      **نقطة مهمة:** `else` لا تأخذ شرطاً أبداً، لأنها تتعامل مع "كل ما تبقى".

      ```python
      if condition_1:
        # ...
      elif condition_2:
        # ...
      else:
        # نفّذ هذا الكود إذا كانت كل الشروط السابقة خاطئة
      ```

  - type: "fill"
    lang: "python"
    question: "أكمل كود إشارة المرور. أضف `elif` للضوء الأصفر و `else` لأي لون آخر (مثل الأحمر)."
    code: |
      light = "red"

      if light == "green":
        print("انطلق!")
      @@INPUT@@ light == "yellow":
        print("تمهل!")
      @@INPUT@@:
        print("توقف!")
    solution:
      - "elif"
      - "else"
    explanation: |
      الآن الكود كامل! إذا كان الضوء ليس "أخضر" وليس "أصفر"، فإن عبارة `else` ستعمل تلقائياً وتطبع "توقف!".

  - type: "markdown"
    content: |
      **قاعدة مهمة جداً: "واحدة فقط تُنفذ"**

      في سلسلة `if`/`elif`/`else`، يقوم بايثون بفحص الشروط من الأعلى إلى الأسفل. بمجرد أن يجد **أول شرط صحيح (`True`)**، يقوم بتنفيذ الكود الخاص به ثم **يتجاهل بقية السلسلة بالكامل**.

      # media_idea: مخطط انسيابي (flowchart) يوضح مسار التنفيذ. سهم من البداية إلى شرط if. إذا كان true، يذهب إلى كتلة الكود الخاصة به ثم يخرج من الهيكل كله. إذا كان false، يذهب السهم إلى شرط elif. وهكذا.

      لنفكر في الأمر كحارس أمن: يسأل أولاً "هل عمرك فوق 21؟". إذا كانت الإجابة "نعم"، يدخلك ويتوقف عن طرح الأسئلة. لن يسأل "وهل أنت VIP؟" بعد أن سمح لك بالدخول بالفعل.

  - type: "quiz"
    lang: "python"
    question: "ما الذي سيتم طباعته على الشاشة عند تشغيل هذا الكود؟"
    code: |
      score = 85

      if score >= 90:
        print("التقدير: A")
      elif score >= 80:
        print("التقدير: B")
      elif score >= 70:
        print("التقدير: C")
      else:
        print("التقدير: F")
    options:
      - "التقدير: B"
      - "التقدير: B و التقدير: C"
      - "التقدير: A"
      - "لن يتم طباعة أي شيء"
    solution: 0
    explanation: |
      الشرط الأول `score >= 90` (85 >= 90) خاطئ.
      ينتقل بايثون إلى الشرط الثاني `score >= 80` (85 >= 80) وهو صحيح.
      لذلك، يطبع "التقدير: B" ثم يتجاهل بقية عبارات `elif` و `else` فوراً.

  - type: "markdown"
    content: |
      لنطبق هذا على سيناريو واقعي. تخيل متجراً إلكترونياً يقدم خصومات بناءً على قيمة المشتريات:

      - إذا أنفقت أكثر من 100، تحصل على خصم 20%.
      - وإلا، إذا أنفقت أكثر من 50، تحصل على خصم 10%.
      - وإلا (أي أقل من أو يساوي 50)، لا يوجد خصم.

      هذه هي الطريقة المثالية لاستخدام `if`/`elif`/`else`.

  - type: "fill"
    lang: "python"
    question: "املأ الفراغات لإكمال منطق الخصم."
    code: |
      total_spent = 75
      discount = 0

      if total_spent > 100:
        discount = 20
      @@INPUT@@ total_spent > 50:
        discount = 10
      @@INPUT@@:
        discount = 0

      print(f"خصمك هو {discount}%")
    solution:
      - "elif"
      - "else"
    explanation: "بما أن `total_spent` هو 75، فإن شرط `if` الأول خاطئ، لكن شرط `elif` صحيح. لذلك، يتم تعيين الخصم إلى 10."

  - type: "bug"
    lang: "python"
    question: |
      الترتيب مهم جداً! هذا الكود يحتوي على خطأ منطقي. حتى لو أنفقت 150، سيمنحك خصماً بنسبة 10% فقط.
      
      حدد السطر الذي يسبب المشكلة.
    code: |
      total_spent = 150
      discount = 0

      if total_spent > 50:
        discount = 10
      elif total_spent > 100:
        discount = 20
      else:
        discount = 0

      print(f"خصمك هو {discount}%")
    solution: 2
    expectedOutput: "خصمك هو 20%"
    actualOutput: "خصمك هو 10%"
    explanation: |
      المشكلة في الترتيب. بما أن 150 أكبر من 50، فإن الشرط الأول في السطر 3 يكون صحيحاً. يقوم الكود بتعيين الخصم إلى 10 ثم يتجاهل بقية السلسلة، بما في ذلك شرط `elif` الذي يتحقق من `> 100`.
      
      **الحل الصحيح:** يجب دائماً ترتيب الشروط من الأكثر تحديداً (الأكبر) إلى الأقل تحديداً (الأصغر).

  - type: "markdown"
    content: |
      أحسنت! لنلخص ما تعلمناه:

      - استخدم `if`, `elif`, و `else` لإنشاء مسارات قرار تحتوي على أكثر من خيارين.
      - `elif` تعني "وإلا إذا" وتتحقق من شرط إضافي.
      - `else` هي عبارة افتراضية "لكل ما تبقى" إذا كانت كل الشروط السابقة خاطئة.
      - السلسلة تنفذ **أول كتلة برمجية** فقط يكون شرطها صحيحاً، ثم تتجاهل الباقي.
      - ترتيب الشروط الخاصة بك أمر بالغ الأهمية للحصول على المنطق الصحيح!

      أنت الآن جاهز لاتخاذ قرارات أكثر تعقيداً في برامجك.
