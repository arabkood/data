title: "تصحيح أخطاء المنطق الشرطي (Debugging)"
steps:
  - type: "markdown"
    content: |
      مرحباً أيها المحقق البرمجي!

      حتى الآن، كنت تركز على بناء المنطق الشرطي. الآن، سنتعلم مهارة لا تقل أهمية: **إصلاح المنطق الشرطي عندما لا يعمل كما هو متوقع.**

      كتابة الأخطاء (Bugs) ليست علامة على أنك مبرمج سيء. إنها جزء طبيعي تماماً من العملية. أفضل المبرمجين في العالم يقضون وقتاً طويلاً في تصحيح الأخطاء.

      فكر في نفسك كمحقق. الكود الخاطئ هو مسرح الجريمة، والبرنامج الذي يتصرف بغرابة هو الشاهد الوحيد. مهمتك هي البحث عن الأدلة (الأخطاء) وحل اللغز!

  - type: "markdown"
    content: |
      ### **الخطأ الشائع الأول: الخلط بين التعيين والمقارنة (`=` vs `==`)**

      هذا هو الخطأ الأكثر شيوعاً للمبتدئين. من السهل جداً كتابته عن طريق الخطأ.

      - `=` **علامة يساوي واحدة**: هذه **لتعيين قيمة**. `user_role = "admin"` تعني "اجعل قيمة `user_role` هي `admin`".
      - `==` **علامتا يساوي**: هذه **للمقارنة**. `user_role == "admin"` تسأل "هل قيمة `user_role` تساوي `admin`؟" والإجابة هي `True` أو `False`.

      استخدام `=` داخل `if` سيؤدي إلى خطأ في بايثون، لأن `if` تتوقع سؤالاً (مقارنة) وليس أمراً (تعييناً).

