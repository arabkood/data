      ### **أقوى أداة لديك: `print()`**

      عندما لا تفهم لماذا يتصرف برنامجك بشكل غريب، فإن أفضل صديق لك هو `print()`.

      يمكنك وضع عبارات `print()` مؤقتة في الكود الخاص بك لترى قيم المتغيرات في نقاط مختلفة. هذا يشبه وضع كاميرات مراقبة داخل برنامجك لمعرفة ما يحدث بالضبط.

      ```python
      def calculate_final_price(original_price, discount_code):
          # ... منطق معقد ...
          print(f"DEBUG: السعر قبل الخصم هو {price}")
          print(f"DEBUG: كود الخصم هو {discount_code}")
          # ... المزيد من المنطق ...
          return final_price
      ```
      هذه الطريقة البسيطة يمكنها حل 90% من الأخطاء التي ستواجهها.

