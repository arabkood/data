  - type: "markdown"
    content: |
      أحسنت! تصحيح الأخطاء هو مهارة، وكلما تدربت عليها أكثر، أصبحت أفضل.

      **ملخص أساليب التحقيق:**
      1.  **تحقق من المقارنات:** هل تستخدم `==` وليس `=`؟
      2.  **افحص الحدود:** هل تحتاج إلى `>=` و `<=` بدلاً من `>` و `<`؟
      3.  **راجع الترتيب:** هل شروط `elif` مرتبة من الأكثر تحديداً إلى الأكثر عمومية؟
      4.  **استخدم `print()`:** عندما تشك في شيء، اطبعه! شاهد قيم متغيراتك لتتبع مسار تنفيذ برنامجك.

      كن صبوراً، كن فضولياً، وعامل كل خطأ على أنه فرصة للتعلم.
