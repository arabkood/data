item_id: "module-5-item-6"
item_type: "lesson"
title: "تدريب على اتخاذ القرار (الجزء الأول)"
steps:
  - type: "markdown"
    content: |
      أهلاً بك في جلسة التدريب!

      النظرية شيء، والتطبيق العملي شيء آخر تماماً. أفضل طريقة لترسيخ المفاهيم البرمجية هي باستخدامها لحل مشاكل.

      في هذا الدرس، لن نتعلم أي شيء جديد. بدلاً من ذلك، سنقوم بحل سلسلة من التحديات الصغيرة لوضع مهاراتك في `if`, `elif`, `else`, والشروط المتداخلة قيد الاختبار.

      هل أنت مستعد لتقوية عضلاتك المنطقية؟ لنبدأ!

  - type: "markdown"
    content: |
      **التحدي الأول: مدقق التذاكر**

      لدينا متغير `age`. نريد طباعة "مسموح بالدخول" إذا كان العمر 18 أو أكبر، و"الدخول ممنوع" في الحالات الأخرى.

      هذا هو تمرين إحماء بسيط على `if/else`.

  - type: "fill"
    lang: "python"
    question: "املأ الفراغات لإكمال منطق مدقق التذاكر."
    code: |
      age = 22

      @@INPUT@@ age >= 18:
        print("مسموح بالدخول")
      @@INPUT@@:
        print("الدخول ممنوع")
    solution:
      - "if"
      - "else"
    explanation: "هذا هو الاستخدام الأساسي لـ `if/else` لاتخاذ قرار بين نتيجتين ممكنتين."

  - type: "markdown"
    content: |
      **التحدي الثاني: حاسبة الشحن**

      لنجعل الأمر أكثر إثارة. نريد تحديد تكلفة الشحن بناءً على وزن الطرد:
      - **أقل من 2 كجم**: التكلفة 10.
      - **من 2 كجم إلى 10 كجم (شاملاً)**: التكلفة 25.
      - **أكثر من 10 كجم**: التكلفة 50.

      هذا السيناريو يتطلب `if`, `elif`, و `else`.

  - type: "fill"
    lang: "python"
    question: "أكمل كود حاسبة الشحن."
    code: |
      weight = 7.5
      cost = 0

      if weight < 2:
        cost = 10
      @@INPUT@@ weight <= 10:
        cost = 25
      @@INPUT@@:
        cost = 50

      print(f"تكلفة الشحن هي: {cost}")
    solution:
      - "elif"
      - "else"
    explanation: "استخدمنا `elif` للتحقق من الحالة المتوسطة. عبارة `else` تلتقط كل الحالات المتبقية (أكثر من 10 كجم) تلقائياً."

  - type: "markdown"
    content: |
      **التحدي الثالث: نظام تسجيل الدخول**

      حان الوقت لتحدي متداخل. نريد التحقق مما يلي:
      1.  **أولاً**، هل اسم المستخدم صحيح (`"admin"`)؟
      2.  **إذا كان صحيحاً**، نريد بعد ذلك التحقق مما إذا كانت كلمة المرور صحيحة (`"password123"`).

  - type: "order"
    lang: "python"
    question: "رتب هذه الأسطر البرمجية لإنشاء منطق تسجيل دخول متداخل وصحيح."
    code:
      - 'username = "admin"'
      - 'password = "password123"'
      - |
        if username == "admin":
      - |
          print("اسم المستخدم صحيح. جار التحقق من كلمة المرور...")
      - |
          if password == "password123":
      - |
              print("تم تسجيل الدخول بنجاح!")
      - |
          else:
      - |
              print("كلمة المرور خاطئة.")
      - |
        else:
      - |
          print("اسم المستخدم غير صحيح.")
    explanation: "يجب التحقق من اسم المستخدم أولاً. فقط إذا كان صحيحاً، ننتقل إلى الكتلة الداخلية للتحقق من كلمة المرور. كل `else` يجب أن تتبع `if` الخاصة بها على نفس مستوى المسافة البادئة."

  - type: "markdown"
    content: |
      **التحدي الرابع: محقق الأخطاء**

      ستُعطى الآن قطعة من الكود تحتوي على خطأ منطقي. مهمتك هي العثور عليه.

      **الهدف:** يجب أن يحدد الكود ما إذا كان الرقم موجباً، سالباً، أو صفراً. لكنه حالياً يخطئ في تصنيف الصفر.

  - type: "bug"
    lang: "python"
    question: "الكود التالي يصنف الصفر على أنه رقم سالب. حدد السطر الذي يسبب هذا السلوك الخاطئ."
    code: |
      number = 0
      
      if number > 0:
        print("رقم موجب")
      elif number < 0:
        print("رقم سالب")
      elif number == 0:
        print("صفر")
      else:
        print("هذا لا ينبغي أن يحدث أبداً")
    solution: 4 # Line number of "elif number < 0:"
    expectedOutput: "صفر"
    actualOutput: "رقم سالب"
    hint: "فكر في ترتيب الشروط. هل هناك ترتيب آخر يمكن أن يسبب المشكلة؟ انتظر، هل هناك مشكلة في الترتيب أصلاً أم في أحد الشروط نفسها؟"
    explanation: |
      هذا سؤال خادع! الخطأ ليس في الترتيب، بل في الشرط نفسه. لا يوجد خطأ في الكود أعلاه، فهو يعمل بشكل صحيح!
      
      **عفواً، كان هذا اختباراً!** في الواقع، الكود المعروض لك صحيح. ولكن في سيناريو حقيقي، إذا كان السطر 5 مكتوباً كـ `elif number <= 0:`، فسيتم تصنيف الصفر على أنه سالب، وسيكون هذا هو الخطأ. من المهم جداً قراءة الشروط بعناية. الكود الذي تراه هنا سيعمل كما هو متوقع ويطبع "صفر". لقد اجتزت الاختبار!

  - type: "quiz"
    lang: "python"
    question: "بدون تشغيل الكود، ماذا ستكون النتيجة النهائية المطبوعة؟"
    code: |
      is_premium_customer = False
      order_total = 120
      shipping_country = "KSA"
      final_cost = order_total

      if shipping_country == "KSA":
        if order_total > 100 or is_premium_customer:
          final_cost = order_total # شحن مجاني
        else:
          final_cost = order_total + 30 # رسوم شحن 30
      else:
        final_cost = order_total + 70 # شحن دولي 70

      print(f"التكلفة النهائية: {final_cost}")
    options:
      - "التكلفة النهائية: 120"
      - "التكلفة النهائية: 150"
      - "التكلفة النهائية: 190"
      - "لن يتم طباعة أي شيء"
    solution: 0
    explanation: |
      1.  `shipping_country == "KSA"` صحيح. ندخل الكتلة الأولى.
      2.  ندخل الشرط المتداخل: `order_total > 100 or is_premium_customer`.
      3.  `120 > 100` صحيحة. بما أننا نستخدم `or`، لا يهم أن `is_premium_customer` خاطئة. الشرط بأكمله صحيح.
      4.  يتم تنفيذ `final_cost = order_total`، لذا تبقى القيمة 120.
      5.  تطبع النتيجة النهائية.

  - type: "markdown"
    content: |
      عمل رائع!

      لقد قمت بحل مشاكل باستخدام `if/else`، `if/elif/else`، الشروط المتداخلة، وحتى قمت بتصحيح خطأ منطقي وتتبعت مسار تنفيذ معقد.

      هذا النوع من التدريب هو ما يحول المعرفة إلى مهارة حقيقية. استمر في الممارسة!
