    content: |
      لقد أكملت الجولة الثانية بنجاح!

      لاحظ كيف أن المشاكل أصبحت أكثر واقعية، وتتطلب منك التفكير في طبقات متعددة من الشروط والجمع بينها.

      **ما اكتسبته:**
      - ممارسة على سلاسل `elif` المعقدة.
      - تصحيح الأخطاء في الشروط المتداخلة.
      - تتبع مسار التنفيذ في سيناريوهات متعددة المتغيرات.
      - بناء منطق مركب باستخدام `and` و `or` داخل هياكل `if`.

      أنت الآن لا تكتب الشروط فحسب، بل تصمم تدفقات منطقية كاملة. استمر في هذا العمل الممتاز!
