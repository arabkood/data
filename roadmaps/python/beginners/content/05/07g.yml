title: "تدريب على اتخاذ القرار (الجزء الثاني)"
steps:
  - type: "markdown"
    content: |
      مرحباً بك مجدداً في صالة الألعاب الرياضية للمنطق!

      لقد قمت بعمل رائع في الجولة الأولى من التدريب. الآن، حان الوقت لرفع المستوى قليلاً. في هذا الدرس، سنتناول مشاكل تتطلب طبقات متعددة من التفكير وسيناريوهات أكثر دقة.

      الهدف هو الانتقال من مجرد "كتابة الكود" إلى "تصميم الحلول". لنبدأ الجولة الثانية!

  - type: "markdown"
    content: |
      **التحدي الأول: تسعير تذاكر مدينة الملاهي**

      تحتاج مدينة ملاهي إلى نظام لتحديد سعر التذكرة بناءً on عمر الزائر:
      - **الأطفال (العمر 4 أو أقل)**: مجاناً.
      - **الأطفال (العمر 5 إلى 12)**: 20 ريال.
      - **الكبار (العمر 13 إلى 64)**: 50 ريال.
      - **كبار السن (العمر 65 أو أكبر)**: 25 ريال.

      هذا يتطلب سلسلة `if/elif` مرتبة بعناية.

  - type: "fill"
    lang: "python"
    question: "املأ الفراغات لإكمال منطق تسعير التذاكر."
    code: |
      age = 65
      price = 0

      if age <= 4:
        price = 0
      elif age <= 12:
        price = 20
      @@INPUT@@ age <= 64:
        price = 50
      @@INPUT@@:
        price = 25

      print(f"سعر التذكرة: {price} ريال")
    solution:
      - "elif"
      - "else"
    explanation: "بما أن الشروط مرتبة تصاعدياً، يمكننا التحقق من كل حد أعلى. `elif age <= 64` تتحقق من فئة الكبار. وأخيراً، `else` تلتقط كل الأعمار المتبقية (65 فما فوق) تلقائياً."

  - type: "markdown"
    content: |
      **التحدي الثاني: نظام التحقق من صلاحية القسيمة**

      لدى متجر إلكتروني نظام قسائم. لتكون القسيمة صالحة، يجب أن يتحقق شرطان:
      1.  يجب ألا تكون القسيمة قد "استُخدمت" بالفعل (`is_used` يجب أن تكون `False`).
      2.  يجب أن يكون تاريخ انتهاء صلاحيتها لم يأت بعد (`is_expired` يجب أن تكون `False`).

      فقط إذا تحقق **كلا الشرطين**، يتم تطبيق الخصم.

  - type: "bug"
    lang: "python"
    question: "هذا الكود يطبق الخصم بشكل خاطئ حتى لو انتهت صلاحية القسيمة. حدد السطر الذي يحتوي على الخطأ المنطقي."
    code: |
      is_used = False
      is_expired = True # القسيمة منتهية الصلاحية
      discount = 0

      if not is_used:
        if is_expired:
            discount = 0
        else:
            discount = 20
      
      print(f"الخصم المطبق: {discount}%")
    solution: 5
    expectedOutput: "الخصم المطبق: 0%"
    actualOutput: "الخصم المطبق: 20%"
    hint: "انظر جيداً إلى الشرط المتداخل. ماذا يعني `if is_expired:`؟"
    explanation: |
      الخطأ يكمن في `if is_expired:`. هذه العبارة تُقرأ كـ "إذا كانت منتهية الصلاحية (`True`)..."، ثم الكود بداخلها لا يفعل شيئاً تقريباً. المنطق الصحيح هو التحقق من أنها **ليست** منتهية الصلاحية. يجب أن يكون الشرط `if not is_expired:` أو `if is_expired == False:`.

  - type: "markdown"
    content: |
      **التحدي الثالث: تحليل حالة الطقس**

      لنتخيل أننا نبرمج تطبيقاً للطقس يقدم نصائح. لدينا ثلاثة متغيرات:
      - `temperature` (درجة الحرارة)
      - `is_raining` (هل تمطر؟)
      - `is_sunny` (هل هي مشمسة؟)

      سنكتب الآن كوداً معقداً بعض الشيء، ومهمتك هي تتبع المسار الذي سيتخذه البرنامج لمعرفة النصيحة النهائية.

  - type: "quiz"
    lang: "python"
    question: "بناءً على قيم المتغيرات، ما هي النصيحة التي سيطبعها هذا الكود؟"
    code: |
      temperature = 28
      is_raining = True
      is_sunny = True # قد تكون مشمسة وممطرة في نفس الوقت!

      advice = ""

      if temperature > 25:
        advice = "الجو حار. "
        if is_raining:
          advice += "ابق في الداخل."
        elif is_sunny:
          advice += "استخدم واقي الشمس."
      else:
        advice = "الجو معتدل. "
        if is_raining:
          advice += "خذ معك مظلة."
      
      print(advice)
    options:
      - "الجو حار. ابق في الداخل."
      - "الجو حار. استخدم واقي الشمس."
      - "الجو معتدل. خذ معك مظلة."
      - "الجو حار. "
    solution: 0
    explanation: |
      1. `temperature > 25` (28 > 25) صحيح. ندخل الكتلة الأولى.
      2. `advice` يصبح "الجو حار. ".
      3. ندخل الشرط المتداخل. أولاً، `if is_raining:`. بما أن `is_raining` هي `True`، يتم تنفيذ الكود الخاص بها.
      4. `advice` يصبح "الجو حار. " + "ابق في الداخل.".
      5. بما أن شرط `if` الداخلي كان صحيحاً، يتم تجاهل `elif is_sunny` بالكامل.
      6. يتم طباعة القيمة النهائية لـ `advice`.

  - type: "markdown"
    content: |
      **التحدي الرابع: مدقق أهلية القرض**

      يحتاج بنك إلى برنامج لتحديد ما إذا كان العميل مؤهلاً للحصول على قرض. القواعد هي:
      - يجب أن يكون لدى العميل درجة ائتمان (`credit_score`) تزيد عن 650.
      - **بالإضافة إلى ذلك**، يجب أن يتحقق أحد الشرطين التاليين (أو كلاهما):
        - أن يكون دخله السنوي (`income`) 50000 أو أكثر.
        - أو أن يكون لديه ضامن (`has_guarantor`).

      هذا يتطلب دمج الشروط المتداخلة مع المنطق البوليني (`or`).

  - type: "order"
    lang: "python"
    question: "أعد ترتيب هذه الأسطر لإنشاء مدقق أهلية القرض بالمنطق الصحيح."
    code:
      - "credit_score = 700"
      - "income = 45000"
      - "has_guarantor = True"
      - "is_eligible = False"
      - |
        if credit_score > 650:
      - |
          if income >= 50000 or has_guarantor:
      - |
              is_eligible = True
      - |
        if is_eligible:
            print("العميل مؤهل للحصول على قرض.")
        else:
            print("العميل غير مؤهل.")
    explanation: |
      المنطق الصحيح هو التحقق من الشرط الأساسي (درجة الائتمان) أولاً. ثم، داخل هذا الشرط، نتحقق من الشرط المركب (الدخل أو الضامن) باستخدام `or`. وأخيراً، نطبع النتيجة بناءً على القيمة النهائية للمتغير `is_eligible`.

