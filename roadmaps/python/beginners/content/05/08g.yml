  - type: "bug"
    lang: "python"
    question: |
      **الهدف:** السماح بالدخول إذا كان الشخص موظفاً ولديه بطاقة دخول، **أو** إذا كان ضيفاً مع مرافق.
      
      الكود الحالي يسمح للموظفين بالدخول حتى بدون بطاقة دخول بسبب خطأ في أولويات `and`/`or`. حدد السطر الذي يحتاج إلى أقواس لتصحيح المنطق.
    code: |
      is_employee = True
      has_badge = False
      is_guest_with_escort = False
      
      can_enter = False
      
      # Python تقييمها كـ (is_employee and has_badge) or is_guest_with_escort
      # ولكن الهدف هو is_employee and (has_badge or is_guest_with_escort) 
      # هذا ليس الهدف المطلوب، الهدف هو: (is_employee and has_badge) or is_guest_with_escort

      if is_employee and has_badge or is_guest_with_escort:
          can_enter = True
      
      print(can_enter)
    solution: 11 # The line with the complex if statement
    expectedOutput: "False"
    actualOutput: "True"
    hint: "كيف يمكنك إجبار بايثون على تقييم شرطين معاً قبل تقييم الشرط الثالث؟"
    explanation: |
      المشكلة تكمن في أن `and` لها أولوية أعلى من `or`. لذلك، يقوم بايثون بتقييم `is_employee and has_badge` أولاً (`True and False` -> `False`). ثم يقيم `False or is_guest_with_escort` (`False or False` -> `False`).
      
      لكن دعنا نفترض أن `is_guest_with_escort` كانت `True`. الكود سيسمح بالدخول. المنطق المطلوب هو أن الموظف يحتاج *دائماً* إلى بطاقة. يجب تجميع شروط الموظف معاً.
      
      **الحل الصحيح:** `if (is_employee and has_badge) or is_guest_with_escort:`
      استخدام الأقواس يجعل المنطق واضحاً لا لبس فيه ويضمن تنفيذ الشروط بالترتيب الذي تريده.

  - type: "markdown"
    content: |
      لقد وصلت إلى مستوى متقدم حقاً!

      **ملخص التقنيات المتقدمة:**
      - **الدائرة القصيرة:** تجعل الكود أسرع وتساعد على تجنب الأخطاء.
      - **الشروط الحارسة:** تجعل الكود أنظف وأسهل في القراءة عن طريق معالجة الأخطاء أولاً.
      - **العامل الثلاثي:** اختصار مفيد للتعيينات الشرطية البسيطة.
      - **الأقواس في الشروط المعقدة:** استخدمها دائماً لجعل المنطق واضحاً وتجنب الأخطاء المتعلقة بالأولويات.

      تذكر دائماً، الهدف النهائي هو كتابة كود ليس فقط يعمل، بل يكون واضحاً وصحيحاً وسهل الصيانة. أنت الآن تمتلك الأدوات اللازمة لتحقيق ذلك.
