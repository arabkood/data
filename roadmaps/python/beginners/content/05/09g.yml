title: "المراجعة النهائية: صناعة القرارات الذكية"
steps:
  - type: "markdown"
    content: |
      لقد وصلت إلى نهاية فصل مهم جداً في رحلتك البرمجية! لقد انتقلت من كتابة برامج تنفذ الأوامر بشكل مباشر إلى برامج يمكنها **التفكير واتخاذ القرارات**.

      في هذه المراجعة، سنقوم بربط كل المفاهيم معاً. من أبسط جمل `if` إلى بناء هياكل منطقية معقدة. سنرى كيف تتفاعل القرارات مع أنواع البيانات المختلفة وكيفية تجنب الأخطاء الشائعة.

      فكر في الأمر كأنك قمت ببناء سيارة. لقد تعلمت عن المحرك (`if`), ناقل الحركة (`elif`), والمكابح (`else`). الآن، حان الوقت للقيام بجولة أخيرة للتأكد من أن كل شيء يعمل معاً بسلاسة.

  - type: "markdown"
    content: |
      ### **الأساس: ثلاثي القرار**

      كل ما تعلمته في هذا الفصل يدور حول هذا الهيكل الأساسي:

      - **`if`**: "إذا كان هذا الشرط صحيحاً، افعل هذا." (نقطة البداية)
      - **`elif`**: "وإلا، إذا كان هذا الشرط *الآخر* صحيحاً، افعل هذا بدلاً من ذلك." (الخيار الثاني، الثالث، إلخ.)
      - **`else`**: "وإلا، إذا لم يكن أي من الشروط السابقة صحيحاً، افعل هذا." (الخيار الافتراضي الأخير)

      **القاعدة الذهبية:** في سلسلة `if/elif/else`، يتم تنفيذ **كتلة واحدة فقط** من الكود. بمجرد أن يجد بايثون شرطاً صحيحاً، ينفذ الكود الخاص به ويتجاهل كل ما تبقى في السلسلة.

  - type: "quiz"
    lang: "python"
    question: "ماذا سيطبع هذا الكود؟ فكر جيداً في الفرق بين `elif` و `if` المستقلة."
    code: |
      temperature = 35
      
      if temperature > 20:
        print("الجو دافئ.")
      
      if temperature > 30:
        print("الجو حار.")
    options:
      - "الجو دافئ."
      - "الجو حار."
      - "الجو دافئ.\nالجو حار."
      - "لن يطبع أي شيء."
    solution: 2
    explanation: |
      هنا لدينا عبارتي `if` مستقلتين. يتم تقييم كل واحدة منهما على حدة.
      1. الشرط الأول `temperature > 20` (35 > 20) صحيح، لذا يطبع "الجو دافئ.".
      2. ينتقل البرنامج ويكمل، ويقيم الشرط الثاني `temperature > 30` (35 > 30) وهو صحيح أيضاً، لذا يطبع "الجو حار.".
      لو استخدمنا `elif`، لكان قد طبع "الجو دافئ." فقط.

  - type: "markdown"
    content: |
      ### **القرارات داخل القرارات (التداخل)**

      تذكرنا أن الحياة ليست دائماً بسيطة. في بعض الأحيان، يعتمد قرار على نتيجة قرار آخر. هذا هو المكان الذي نستخدم فيه **الشروط المتداخلة**، حيث نضع `if` داخل `if` أخرى.

      المفتاح هنا هو **المسافة البادئة (Indentation)**. هي التي تخبر بايثون أي قرار يتبع أي قرار آخر.

      ```python
      # مراجعة من الوحدة 3: الحصول على المدخلات وتحويلها
      age_input = input("ادخل عمرك: ")
      age = int(age_input)

      # منطق متداخل
      if age >= 18:
        print("مرحباً بك.")
        if age >= 65:
          print("لديك خصم لكبار السن.")
      else:
        print("الدخول للكبار فقط.")
      ```
      هنا، لن نتحقق أبداً من خصم كبار السن إلا إذا تم استيفاء شرط العمر 18+ أولاً.

