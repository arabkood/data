  - type: "markdown"
    content: |
      ### **أدوات صنع القرار (مراجعة من الوحدة 4)**

      لا تنسَ الأدوات التي تستخدمها لبناء شروطك:
      - **المقارنة:** `==`, `!=`, `>`, `<`, `>=`, `<=`
      - **المنطق:** `and`, `or`, `not`

      هذه هي التي تسمح لك بطرح أسئلة معقدة مثل:
      `if (user_role == "admin" or is_editor == True) and last_login_days < 30:`

