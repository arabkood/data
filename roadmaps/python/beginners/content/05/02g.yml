item_id: "module-5-item-2"
item_type: "lesson"
title: "الشروط المتداخلة (Nesting)"
steps:
  - type: "markdown"
    content: |
      رائع! لقد أتقنت استخدام `if`, `elif`, و `else` لاتخاذ قرارات. ولكن، ماذا لو كان القرار يعتمد على قرار آخر؟

      تخيل أنك تحاول الدخول إلى منطقة VIP في حفل. هناك شرطان يجب تحقيقهما بالتتابع:
      1.  **أولاً**، يجب أن يكون لديك تذكرة عادية للدخول إلى الحفل.
      2.  **ثانياً**، *إذا كان لديك تذكرة*، يجب أن تكون من نوع "VIP".

      لا يمكنك التحقق من الشرط الثاني إلا بعد تحقق الشرط الأول. هذا هو جوهر الشروط المتداخلة! إنها ببساطة عبارة `if` داخل عبارة `if` أخرى.

  - type: "markdown"
    content: |
      في بايثون، يتم تحقيق التداخل (Nesting) باستخدام المسافات البادئة (Indentation). العبارة الداخلية تكون مزاحة بمسافة بادئة إضافية عن العبارة الخارجية.

      ```python
      if condition_outer:
          # هذا الكود يُنفذ إذا كان الشرط الخارجي صحيحاً

          if condition_inner:
              # هذا الكود يُنفذ فقط إذا كان كلا الشرطين (الخارجي والداخلي) صحيحين
      ```

      فكر فيها كصناديق داخل صناديق. لا يمكنك الوصول إلى الصندوق الداخلي إلا بعد فتح الصندوق الخارجي أولاً.

      # media_idea: رسم توضيحي بسيط يظهر صندوقاً كبيراً بعنوان "if has_ticket:" وبداخله صندوق أصغر بعنوان "if ticket_type == 'VIP':".

  - type: "fill"
    lang: "python"
    question: "لنطبق سيناريو منطقة الـ VIP. املأ الفراغ للتحقق من نوع التذكرة."
    code: |
      has_ticket = True
      ticket_type = "VIP"

      if has_ticket == True:
        print("لديك تذكرة. جار التحقق من النوع...")
        @@INPUT@@ ticket_type == "VIP":
          print("تفضل بالدخول إلى منطقة VIP!")
    solution:
      - "if"
    explanation: |
      وضعنا عبارة `if` الثانية داخل الأولى. لن يتم التحقق من `ticket_type` إلا إذا كانت قيمة `has_ticket` هي `True` في البداية.

  - type: "markdown"
    content: |
      يمكن أن تحتوي الشروط المتداخلة أيضاً على `else` خاصة بها. كل عبارة `else` تتبع `if` التي على **نفس مستوى المسافة البادئة**.

      ```python
      age = 20
      has_license = False

      if age >= 18:  # المستوى الأول
          print("العمر مناسب للقيادة.")

          if has_license:  # المستوى الثاني
              print("يمكنك القيادة.")
          else:  # تتبع if المستوى الثاني
              print("لكنك تحتاج إلى رخصة قيادة!")

      else:  # تتبع if المستوى الأول
          print("أنت صغير جداً على القيادة.")
      ```
      لاحظ كيف أن كل `else` مقترنة بـ `if` التي تسبقها مباشرة وعلى نفس المستوى.

  - type: "order"
    lang: "python"
    question: "أنت تبرمج نظام دخول لمكتبة. للدخول، يجب أن تكون طالباً، وإذا كنت طالباً، يجب ألا تكون لديك كتب متأخرة. رتب الكود التالي."
    code:
      - "is_student = True"
      - "has_overdue_books = False"
      - |
        if is_student:
      - |
