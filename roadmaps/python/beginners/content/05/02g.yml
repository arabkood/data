  - type: "quiz"
    lang: "python"
    question: "ماذا سيطبع هذا الكود؟"
    code: |
      is_logged_in = True
      is_admin = False
      access_level = 3

      if is_logged_in:
        print("المستخدم مسجل دخوله.")
        if is_admin:
          print("مرحباً أيها المدير.")
        else:
          print("مرحباً أيها المستخدم.")
          if access_level > 2:
            print("لديك صلاحيات متقدمة.")
      else:
        print("يرجى تسجيل الدخول.")
    options:
      - "المستخدم مسجل دخوله."
      - "المستخدم مسجل دخوله.\nمرحباً أيها المستخدم."
      - "المستخدم مسجل دخوله.\nمرحباً أيها المستخدم.\nلديك صلاحيات متقدمة."
      - "لن يطبع أي شيء."
    solution: 2
    explanation: |
      1. `is_logged_in` صحيحة، لذا يطبع "المستخدم مسجل دخوله." ويدخل للكتلة الداخلية.
      2. `is_admin` خاطئة، لذا يتجاهل `if` الداخلية وينتقل إلى `else` الخاصة بها، ويطبع "مرحباً أيها المستخدم.".
      3. داخل هذه الـ `else`، يوجد شرط متداخل آخر. `access_level > 2` (3 > 2) صحيحة، لذا يطبع "لديك صلاحيات متقدمة.".

  - type: "bug"
    lang: "python"
    question: |
      هناك خطأ منطقي في كود حساب تكلفة الشحن هذا.
      **المتطلبات:** الأعضاء المميزون (Premium) يحصلون دائماً على شحن مجاني (`shipping_cost = 0`).
      
      الكود الحالي يفرض عليهم رسوماً بقيمة 5 إذا كانت قيمة طلبهم أقل من 50. حدد السطر الذي يحتوي على الخطأ.
    code: |
      is_premium_member = True
      cart_total = 40
      shipping_cost = 0

      if is_premium_member:
          if cart_total > 50:
              shipping_cost = 0
          else:
              shipping_cost = 5 # This is the bug
      else:
          if cart_total > 50:
              shipping_cost = 10
          else:
              shipping_cost = 15
              
      print(f"تكلفة الشحن: {shipping_cost}")
    solution: 8
    expectedOutput: "تكلفة الشحن: 0"
    actualOutput: "تكلفة الشحن: 5"
    explanation: |
      الخطأ يكمن في فرض رسوم على الأعضاء المميزين. وفقاً للمتطلبات، يجب أن يكون الشحن مجانياً لهم بغض النظر عن قيمة السلة. الحل الصحيح هو إما إزالة الشرط الداخلي بالكامل لهم، أو جعل كلا الحالتين `shipping_cost = 0`. السطر 9 يخالف هذه القاعدة.

  - type: "markdown"
    content: |
      ممتاز! لقد تعلمت الآن واحدة من أقوى الأدوات في البرمجة.

      **خلاصة:**
      - **التداخل (Nesting)** يسمح لك بوضع هياكل شرطية داخل هياكل أخرى.
      - **المسافات البادئة** هي كل شيء! هي التي تحدد أي `if` تتبعها أي `else`.
      - التداخل يتيح لك بناء منطق معقد ومتعدد المستويات لحل مشاكل أكثر واقعية.

      **نصيحة للمحترفين:** كن حذراً! التداخل العميق جداً (مثلاً `if` داخل `if` داخل `if`...) يمكن أن يجعل قراءة الكود صعبة جداً. حاول دائماً الحفاظ على بساطة الكود قدر الإمكان.
