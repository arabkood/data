  # Step 1: Quick reminder about indexing
  - type: "markdown"
    content: |
      مرحباً في صالة التدريب! 💪
      
      تذكير سريع: الفهرسة (indexing) تسمح لنا بالوصول لعنصر محدد في القائمة.
      
      ```python
      fruits = ["تفاح", "موز", "برتقال"]
      print(fruits[0])  # تفاح (العنصر الأول)
      print(fruits[2])  # برتقال (العنصر الثالث)
      ```
      
      هيا نبدأ التدريب المكثف!

  # Step 2: Basic positive indexing practice
  - type: "fill"
    lang: "python"
    question: |
      أكمل الكود للوصول للعناصر المطلوبة:
    code: |
      colors = ["أحمر", "أزرق", "أخضر", "أصفر", "بنفسجي"]
      
      # احصل على اللون الأول
      first = colors[@@INPUT@@]
      
      # احصل على اللون الثالث
      third = colors[@@INPUT@@]
      
      # احصل على اللون الأخير (الخامس)
      last = colors[@@INPUT@@]
      
      print(first, third, last)
    solution:
      - "0"
      - "2"
      - "4"
    explanation: "الفهرسة تبدأ من 0، لذا العنصر الأول عند 0، والثالث عند 2، والخامس عند 4"

  # Step 3: Negative indexing introduction
  - type: "markdown"
    content: |
      **الفهرسة السالبة** - ميزة قوية في Python!
      
      ```python
      numbers = [10, 20, 30, 40, 50]
      print(numbers[-1])  # 50 (آخر عنصر)
      print(numbers[-2])  # 40 (ثاني آخر عنصر)
      ```
      
      الفهرسة السالبة تبدأ من النهاية:
      - `-1` = آخر عنصر
      - `-2` = ثاني آخر عنصر
      - وهكذا...

  # Step 4: Negative indexing practice
  - type: "fill"
    lang: "python"
    question: |
      استخدم الفهرسة السالبة للوصول للعناصر:
    code: |
      days = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"]
      
      # احصل على آخر يوم
      last_day = days[@@INPUT@@]
      
      # احصل على ثاني آخر يوم
      before_last = days[@@INPUT@@]
      
      # احصل على أول يوم باستخدام الفهرسة السالبة
      first_day = days[@@INPUT@@]
      
      print(last_day, before_last, first_day)
    solution:
      - "-1"
      - "-2"
      - "-7"
    explanation: "في قائمة من 7 عناصر، -7 يشير للعنصر الأول، و -1 للأخير"

  # Step 5: Mixed indexing challenge
  - type: "quiz"
    question: "ما الناتج من هذا الكود؟"
    code: |
      grades = [85, 92, 78, 95, 88, 91]
      result = grades[1] + grades[-2]
      print(result)
    lang: python
    options:
      - "177"
      - "180"
      - "183"
      - "186"
    solution: 2
    explanation: "grades[1] = 92 (العنصر الثاني) و grades[-2] = 88 (ثاني آخر عنصر). المجموع = 92 + 88 = 180"

  # Step 6: Bug hunting with indexing
  - type: "bug"
    lang: "python"
    question: "اكتشف الخطأ في الكود:"
    code: |
      inventory = ["قلم", "دفتر", "ممحاة", "مسطرة"]
      print("لدينا", len(inventory), "أدوات")
      print("الأداة الأولى:", inventory[1])
      print("الأداة الأخيرة:", inventory[-1])
    solution: 2
    explanation: "الفهرسة تبدأ من 0، لذا inventory[1] يعطي العنصر الثاني وليس الأول. الصحيح: inventory[0]"
    expectedOutput: "الأداة الأولى: قلم"
    actualOutput: "الأداة الأولى: دفتر"

