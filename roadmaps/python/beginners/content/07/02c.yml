  # Step 8: Dynamic indexing practice
  - type: "fill"
    lang: "python"
    question: |
      استخدم المتغيرات للفهرسة الديناميكية:
    code: |
      products = ["كمبيوتر", "هاتف", "سماعات", "شاشة", "لوحة مفاتيح", "فأرة"]
      
      # احسب فهرس العنصر الأوسط
      middle_index = len(products) // @@INPUT@@
      
      # احصل على العنصر الأوسط
      middle_item = products[@@INPUT@@]
      
      # احصل على العنصر قبل الأخير باستخدام len()
      before_last_index = len(products) - @@INPUT@@
      before_last_item = products[@@INPUT@@]
      
      print(f"العنصر الأوسط: {middle_item}")
      print(f"قبل الأخير: {before_last_item}")
    solution:
      - "2"
      - "middle_index"
      - "2"
      - "before_last_index"
    explanation: "القسمة على 2 تعطينا الفهرس الأوسط، وطرح 2 من الطول يعطينا فهرس العنصر قبل الأخير"

  # Step 9: Order challenge with different indexing methods
  - type: "order"
    lang: "python"
    question: "رتب الكود للحصول على العناصر الأول والأوسط والأخير:"
    code:
      - "letters = ['A', 'B', 'C', 'D', 'E']"
      - "first = letters[0]"
      - "middle = letters[len(letters) // 2]"
      - "last = letters[-1]"
      - "print(first, middle, last)"

  # Step 10: IndexError understanding
  - type: "bug"
    lang: "python"
    question: "أي سطر سيسبب IndexError؟"
    code: |
      scores = [100, 85, 92, 78, 95]
      print(scores[0])     # الأول
      print(scores[4])     # الخامس
      print(scores[5])     # خطأ! لا يوجد عنصر سادس
      print(scores[-1])    # الأخير
    solution: 3
    hint: "القائمة تحتوي 5 عناصر (فهارس 0-4)"
    expectedOutput: "طباعة العناصر"
    actualOutput: "IndexError: list index out of range"

  # Step 11: Advanced negative indexing
  - type: "fill"
    lang: "python"
    question: |
      استخدم الفهرسة السالبة بطرق متقدمة:
    code: |
      playlist = ["أغنية1", "أغنية2", "أغنية3", "أغنية4", "أغنية5", "أغنية6"]
      
      # احصل على الأغنية في المنتصف من النهاية
      # (إذا كان لدينا 6 أغاني، نريد الثالثة من النهاية)
      middle_from_end = playlist[@@INPUT@@]
      
      # احصل على الأغنية الثانية باستخدام الفهرسة السالبة
      second = playlist[@@INPUT@@]
      
      # تحقق أن العنصر الأول بالموجب = العنصر الأخير بالسالب المناسب
      same_element = playlist[0] == playlist[@@INPUT@@]
      
      print(middle_from_end, second, same_element)
    solution:
      - "-3"
      - "-5"
      - "-6"
    explanation: "-3 تعطي الثالث من النهاية، -5 تعطي الثاني من البداية، -6 تعطي الأول في قائمة من 6 عناصر"

  # Step 12: Quiz on equivalent indexing
  - type: "quiz"
    question: "أي من هذه الخيارات تعطي نفس العنصر في قائمة من 8 عناصر؟"
    code: |
      items = [1, 2, 3, 4, 5, 6, 7, 8]
      # أي خيارين متكافئين؟
    lang: python
    options:
      - "items[3] و items[-5]"
      - "items[2] و items[-6]"
      - "items[5] و items[-2]"
      - "items[0] و items[-7]"
    solution: 0
    explanation: "items[3] يعطي العنصر الرابع (4)، و items[-5] أيضاً يعطي العنصر الرابع من النهاية = 4"

  # Step 13: Complex bug with indexing logic
  - type: "bug"
    lang: "python"
    question: "اكتشف الخطأ المنطقي:"
    code: |
      queue = ["أحمد", "فاطمة", "علي", "مريم", "يوسف"]
      
      # نريد طباعة الشخص في منتصف الطابور
      middle_position = len(queue) / 2
      middle_person = queue[middle_position]
      print(f"الشخص في المنتصف: {middle_person}")
    solution: 2
    explanation: "القسمة العادية (/) تعطي عدد عشري، لكن الفهرسة تحتاج عدد صحيح. استخدم // للقسمة الصحيحة"
    hint: "الفهارس يجب أن تكون أعداد صحيحة"

