      temperatures = [22, 24, 19, 26, 28, 23, 21, 25]
      
      # احصل على أول 3 درجات حرارة
      print(temperatures[@@INPUT@@], temperatures[@@INPUT@@], temperatures[@@INPUT@@])
      
