  - type: "markdown"
    content: |
      تهانينا! لقد استخدمت القوائم والحلقات معاً في تحديات مختلفة. 

      الآن حان الوقت لتتعرف على **الأنماط الشائعة** (Common Patterns) التي تعلمتها بشكل عملي.

      هذه الأنماط هي "وصفات" برمجية تستطيع استخدامها لحل مشاكل مختلفة. تماماً مثل وصفات الطبخ! 👨‍🍳

      **ستتعلم اليوم 5 أنماط أساسية** يستخدمها المبرمجون يومياً.

  - type: "markdown"
    content: |
      ## النمط الأول: التكرار والعرض 📺

      **المشكلة:** تريد طباعة أو عرض كل عنصر في القائمة.

      **الحل:**
      ```python
      # النمط الأساسي
      for item in my_list:
          print(item)
      
      # نمط محسّن مع ترقيم
      for i, item in enumerate(my_list):
          print(f"{i+1}. {item}")
      ```

      هذا هو أكثر الأنماط استخداماً! بسيط وفعال.

