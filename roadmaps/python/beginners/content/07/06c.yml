  # --- STEP 1: Introduction and motivation ---
  - type: "markdown"
    content: |
      مرحباً بك في مارثون بناء القوائم! 🏃‍♂️
      
      حتى الآن تعلمت كيف تستخدم القوائم الموجودة. اليوم ستتعلم كيف **تبني قوائمك الخاصة من الصفر** باستخدام الحلقات.
      
      تخيل أنك تريد إنشاء قائمة بجميع الأرقام الزوجية من 1 إلى 20. بدلاً من كتابتها يدوياً، ستجعل البرنامج يبنيها لك تلقائياً!

  # --- STEP 2: The basic pattern ---
  - type: "markdown"
    content: |
      ## نمط بناء القوائم الأساسي
      
      الطريقة المعتادة لبناء قائمة:
      1. ابدأ بقائمة فارغة `[]`
      2. استخدم حلقة للمرور عبر البيانات
      3. أضف العناصر واحداً تلو الآخر باستخدام `append()`
      
      هذا هو النمط الذهبي الذي ستستخدمه مراراً وتكراراً!

