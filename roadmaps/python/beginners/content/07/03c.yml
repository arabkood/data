      ```

      ولكن ماذا لو كنت تريد الحصول على **عدة عناصر** في نفس الوقت؟ 

      على سبيل المثال، ماذا لو كنت تريد أول 3 أرقام فقط؟ أو آخر عنصرين؟

  - type: "markdown"
    content: |
      ## الحل: تقطيع القوائم! 🔪

      **تقطيع القوائم** (List Slicing) يسمح لك بالحصول على **جزء من القائمة** بدلاً من عنصر واحد فقط.

      ```python
      numbers = [10, 20, 30, 40, 50]
      first_three = numbers[0:3]
      print(first_three)  # [10, 20, 30]
      ```

      لاحظ الصيغة: `قائمة[البداية:النهاية]`
      
      **مهم:** النهاية **غير مشمولة**! `[0:3]` يأخذ العناصر في المواضع 0 و 1 و 2 (لا يشمل 3).

  - type: "quiz"
    question: "إذا كان لدينا `colors = ['red', 'blue', 'green', 'yellow']`، فماذا ستطبع `colors[1:3]`؟"
    options:
      - "['red', 'blue']"
      - "['blue', 'green']"
      - "['blue', 'green', 'yellow']"
    solution: 1
    explanation: "تقطيع [1:3] يأخذ العناصر في المواضع 1 و 2 (النهاية غير مشمولة)، وهي 'blue' و 'green'."

