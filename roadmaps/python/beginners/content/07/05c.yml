  - type: "markdown"
    content: |
      ## طريقة `.pop()` مع الفهرس

      يمكنك أيضاً استخدام `.pop()` مع **فهرس محدد** لحذف عنصر من أي موضع:

      ```python
      students = ["أحمد", "فاطمة", "محمد", "عائشة"]
      removed = students.pop(1)  # يحذف "فاطمة" (الفهرس 1)
      print(removed)   # فاطمة
      print(students)  # ['أحمد', 'محمد', 'عائشة']
      ```

