  # Step 14: Real-World Application
  - type: "markdown"
    content: |
      **متى نستخدم القوائم في الحياة الواقعية؟**
      
      📱 **تطبيقات الهاتف:**
      - قائمة جهات الاتصال
      - قائمة الرسائل
      - قائمة التطبيقات المثبتة
      
      🛒 **التسوق الإلكتروني:**
      - قائمة المنتجات في السلة
      - قائمة الطلبات السابقة
      - قائمة المفضلات
      
      📊 **تحليل البيانات:**
      - قائمة درجات الطلاب
      - قائمة المبيعات اليومية
      - قائمة درجات الحرارة
      
      القوائم في كل مكان حولنا!

