  - type: "markdown"
    content: |
      تخيل أنك تريد تخزين درجات 5 طلاب في برنامجك. مع ما تعلمته حتى الآن، ستحتاج إلى إنشاء متغير منفصل لكل درجة:

      ```python
      student1_grade = 85
      student2_grade = 92
      student3_grade = 78
      student4_grade = 90
      student5_grade = 88
      ```

      هذا يبدو مملاً جداً، أليس كذلك؟ والأسوأ من ذلك... ماذا لو كان لديك 100 طالب؟ أو 1000؟

  - type: "markdown"
    content: |
      المشكلة الحقيقية تظهر عندما تريد حساب متوسط الدرجات. ستحتاج لكتابة شيء مثل هذا:

      ```python
      average = (student1_grade + student2_grade + student3_grade + student4_grade + student5_grade) / 5
      ```

      تخيل كتابة هذا لـ 100 طالب! 😵

      **يجب أن تكون هناك طريقة أفضل...**

  - type: "quiz"
    question: "ما هي المشكلة الأساسية في استخدام متغيرات منفصلة لتخزين بيانات مشابهة؟"
    options:
      - "صعوبة في تذكر أسماء المتغيرات"
      - "استهلاك ذاكرة أكبر من اللازم"
      - "صعوبة في معالجة البيانات كمجموعة واحدة"
    solution: 2
    explanation: "المشكلة الأساسية هي أننا لا نستطيع التعامل مع البيانات المترابطة كوحدة واحدة، مما يجعل العمليات عليها معقدة ومملة."

  - type: "markdown"
    content: |
      ## الحل: القوائم! 🎉

      **القائمة (List)** هي حاوية يمكنها تخزين عدة قيم في متغير واحد. فكر فيها كصندوق كبير يمكنك وضع عدة عناصر بداخله.

      بدلاً من 5 متغيرات منفصلة، يمكننا استخدام قائمة واحدة:

      ```python
      grades = [85, 92, 78, 90, 88]
      ```

      الآن جميع الدرجات موجودة في مكان واحد! ✨

  - type: "fill"
    lang: "python"
    question: "أنشئ قائمة تحتوي على أسماء 4 فواكه مفضلة لديك:"
    code: |
      my_fruits = @@INPUT@@
      print("الفواكه المفضلة لدي:", my_fruits)
    solution:
      - "/^\\[\\s*['\"][^'\"]+['\"]\\s*(,\\s*['\"][^'\"]+['\"]\\s*){3}\\]$/"
    explanation: "تُنشأ القائمة باستخدام الأقواس المربعة []، وتُفصل العناصر بفاصلة. النصوص توضع بين علامات تنصيص."

  - type: "markdown"
    content: |
      ## لماذا القوائم مذهلة؟

      **1. تنظيم أفضل**: بدلاً من عشرات المتغيرات، قائمة واحدة منظمة

      **2. عمليات سهلة**: يمكنك بسهولة إضافة عناصر جديدة أو حذف موجودة

      **3. تعمل بشكل رائع مع الحلقات**: تذكر حلقات `for`؟ ستصبح أقوى بكثير مع القوائم!

