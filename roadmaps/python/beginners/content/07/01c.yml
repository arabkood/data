    question: "ما هي أهم فائدة للقوائم مقارنة بالمتغيرات المنفصلة؟"
    options:
      - "استهلاك ذاكرة أقل"
      - "سرعة تنفيذ أعلى"
      - "تجميع البيانات المترابطة وسهولة معالجتها"
    solution: 2
    explanation: "الفائدة الأساسية للقوائم هي تجميع البيانات المترابطة في مكان واحد، مما يجعل الكود أكثر تنظيماً وسهولة في الفهم والصيانة."
