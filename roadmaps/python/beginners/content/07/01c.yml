      ## أمثلة واقعية للقوائم

      القوائم موجودة في كل مكان في البرمجة الحقيقية:

      **📋 قائمة مهام**: `["شراء الخضار", "دراسة Python", "زيارة الطبيب"]`

      **📱 جهات الاتصال**: `["أحمد", "فاطمة", "محمد", "عائشة"]`

      **🛒 سلة التسوق**: `["تفاح", "خبز", "حليب", "بيض"]`

      **📊 بيانات الطقس**: `[25, 28, 22, 30, 27]` (درجات الحرارة لآخر 5 أيام)

