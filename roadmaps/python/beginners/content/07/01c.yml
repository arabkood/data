  - type: "markdown"
    content: |
      ## القوائم + الحلقات = قوة خارقة! 💪

      الآن أصبحت الأمور ممتعة حقاً! تذكر حلقات `for` التي تعلمناها؟ 

      يمكننا استخدامها مع القوائم لمعالجة كل عنصر بسهولة:

      ```python
      grades = [85, 92, 78, 90, 88]
      
      for grade in grades:
          print(f"الدرجة: {grade}")
      ```

      هذا أفضل بكثير من كتابة 5 أسطر منفصلة!

  - type: "fill"
    lang: "python"
    question: "استخدم حلقة for لطباعة كل فاكهة في القائمة:"
    code: |
      fruits = ["تفاح", "موز", "برتقال", "عنب"]
      
      @@INPUT@@ fruit @@INPUT@@ fruits:
          print(f"أحب أكل: {fruit}")
    solution:
      - "for"
      - "in"
    explanation: "هذا هو النمط الأساسي للحلقات مع القوائم: for [عنصر] in [قائمة]"

  - type: "order"
    lang: "python"
    question: "رتب الكود لإنشاء قائمة بدرجات الحرارة وطباعة رسالة لكل درجة:"
    code:
      - "temperatures = [22, 25, 28, 24, 26]"
      - "for temp in temperatures:"
      - "    if temp > 25:"
      - "        print(f\"اليوم حار: {temp} درجة\")"
      - "    else:"
      - "        print(f\"اليوم معتدل: {temp} درجة\")"
    explanation: "نبدأ بإنشاء القائمة، ثم نستخدم الحلقة للمرور عبر كل عنصر، وأخيراً نستخدم الشروط للتحقق من كل قيمة."

  - type: "markdown"
    content: |
      ## تلخيص: لماذا تعتبر القوائم ثورية؟

      **قبل القوائم**:
      - متغيرات كثيرة ومبعثرة
      - كود طويل ومعقد
      - صعوبة في إضافة بيانات جديدة

      **مع القوائم**:
      - ✅ تنظيم مثالي للبيانات المترابطة
      - ✅ كود أقصر وأوضح
      - ✅ سهولة في الإضافة والحذف والتعديل
      - ✅ تعمل بسلاسة مع الحلقات والشروط

      **القادم**: سنتعلم كيف نصل لعناصر القائمة واحداً تلو الآخر، وكيف نغيرها ونتلاعب بها!

