item_id: "module-1-item-2"
item_type: "lesson"
title: "الذاكرة والمتغيرات"

steps:
  # --- STEP 1: The problem we need to solve ---
  - type: "markdown"
    content: |
      تخيل أنك تكتب برنامجًا يذكر اسمك 10 مرات. سيتعين عليك كتابته في كل مرة:

      ```python
      print("مرحباً يا فيصل!")
      print("أهلاً بعودتك يا فيصل!")
      print("يا فيصل، لديك 5 رسائل")
      ```

      هذا أمر مرهق! وماذا لو أردت تغيير الاسم لاحقًا؟ سيتعين عليك البحث عنه واستبداله في كل مكان. لا بد أن هناك طريقة أفضل...

  # --- STEP 2: Variables as labeled boxes ---
  - type: "markdown"
    content: |
      الحل هو **`المتغيرات`**. فكر في `المتغير` كصندوق عليه ملصق في ذاكرة حاسوبك.

      تمامًا كما قد يكون لديك صندوق يحمل ملصق "ملابس الشتاء" ويحتوي على ستراتك ومعاطفك، فإن `المتغير` هو صندوق له اسم ويحتوي على بعض المعلومات.

      على سبيل المثال:
      - صندوق باسم `name` قد يحتوي على النص "فيصل"
      - صندوق باسم `age` قد يحتوي على الرقم 25
      - صندوق باسم `score` قد يحتوي على الرقم 100

      بمجرد وضع شيء في الصندوق، يمكنك استخدامه مرارًا وتكرارًا بمجرد الإشارة إلى اسم الصندوق.

  # --- STEP 2b: Variables as labeled boxes 2 ---
  - type: "markdown"
    content: |
      إنشاء `متغير` في بايثون أمر بسيط.

      ```python
      city = "الرياض"
      ```
      <!-- media_idea: Simple illustration showing the code "city = 'Riyadh'" and a box with the text "city" and the word "Riyadh" with an arrow pointing inside the box. -->

  # --- STEP 3: Creating your first variable ---
  - type: "markdown"
    content: |
      أنت تستخدم علامة المساواة `=` لربط اسم بقيمة:

      ```python
      name = "ريم"
      ```

      هذا ينشئ متغيرًا يسمى `name` ويخزن النص "ريم" بداخله.

      النمط دائمًا هو: `اسم_المتغير = القيمة`

      - الاسم يكون على اليسار
      - علامة المساواة `=` تكون في المنتصف (نسمي هذه العملية **الإسناد**)
      - القيمة تكون على اليمين

  # --- STEP 4: First variable practice ---
  - type: "fill"
    lang: "python"
    question: "أنشئ متغيرًا باسم 'city' وخزّن فيه النص 'بغداد'."
    code: |
      @@INPUT@@ = @@INPUT@@
    solution:
      - "city"
      - '"بغداد"'
    explanation: "توضع أسماء المتغيرات على اليسار، وتربطها علامة المساواة، وتوضع القيمة على اليمين. القيم النصية تحتاج إلى علامات اقتباس."

  # --- STEP 5: Variables with numbers ---
  - type: "markdown"
    content: |
      يمكن للمتغيرات أيضًا تخزين الأرقام. تذكر، الأرقام لا تحتاج إلى علامات اقتباس:

      ```python
      age = 25
      score = 100
      ```

      الآن لديك متغيران:
      - `age` يحتوي على الرقم 25
      - `score` يحتوي على الرقم 100

  # --- STEP 6: Practice with number variables ---
  - type: "fill"
    lang: "python"
    question: "أنشئ متغيرًا باسم 'temperature' وخزّن فيه الرقم 29."
    code: |
      @@INPUT@@ = @@INPUT@@
    solution:
      - "temperature"
      - "29"
    explanation: "الأرقام لا تحتاج إلى علامات اقتباس عند تخزينها في متغيرات، تمامًا كما استخدمناها مع أمر print()."

  # --- STEP 6b: Practice with number variables ---
  - type: "fill"
    lang: "python"
    question: "أكمل هذا السطر لتعيين القيمة للمتغير."
    code: |
      website @@INPUT@@ "akood.com"
    solution:
      - "="
    explanation: "نستخدم علامة المساواة `=` لإسناد القيم للمتغيرات."

  # --- STEP 7: Using variables with print ---
  - type: "markdown"
    content: |
      هنا تظهر قوة `المتغيرات`! بمجرد إنشاء `متغير`، يمكنك استخدامه مع `print()` بكتابة اسمه **بدون علامات اقتباس**:

      ```python
      name = "عاصم"
      print(name)
      ```

      سيؤدي هذا إلى عرض: `عاصم`

      هل لاحظت أننا لا نضع علامات اقتباس حول `name` في أمر الطباعة؟ ذلك لأننا نريد طباعة القيمة المخزنة في `المتغير`، وليس كلمة "name" نفسها.

  # --- STEP 8: Quiz about using variables ---
  - type: "quiz"
    question: "ما الذي سيعرضه هذا الكود؟"
    code: |
      favorite_website = "akood.com"
      print(favorite_website)
    lang: "python"
    options:
      - "favorite_website"
      - "akood.com"
      - '"akood.com"'
    solution: 1
    explanation: "عندما تستخدم اسم متغير في `print()` بدون علامات اقتباس، فإنه يعرض القيمة المخزنة في ذلك المتغير."

  # --- STEP 9: Practice using variables ---
  - type: "fill"
    lang: "python"
    question: "أنشئ متغيرًا باسم 'hobby' بقيمة 'البرمجة'، ثم اطبعه."
    code: |
      @@INPUT@@ = @@INPUT@@
      print(@@INPUT@@)
    solution:
      - "hobby"
      - '"البرمجة"'
      - "hobby"
    explanation: "أولاً تنشئ المتغير مع نص بين علامتي اقتباس، ثم تطبع اسم المتغير بدون علامات اقتباس."

  # --- STEP 10: Multiple variables example ---
  - type: "markdown"
    content: |
      يمكنك إنشاء أي عدد تريده من المتغيرات واستخدامها معًا:

      ```python
      first_name = "محمد"
      last_name = "محمود"
      age = 21

      print(first_name)
      print(last_name)
      print(age)
      ```

      هذا ينشئ ثلاثة "صناديق" منفصلة في الذاكرة، لكل منها اسمه وقيمته الخاصة.

  # --- STEP 11: Creating multiple variables ---
  - type: "fill"
    lang: "python"
    question: "أنشئ متغيرات لمعلومات شخص: 'name' بقيمة 'عبير'، و 'age' بقيمة 23، ثم اطبعهما."
    code: |
      @@INPUT@@ = @@INPUT@@
      @@INPUT@@ = @@INPUT@@
      print(@@INPUT@@)
      print(@@INPUT@@)
    solution:
      - "name"
      - '"عبير"'
      - "age"
      - "23"
      - "name"
      - "age"
    explanation: "كل متغير يحتاج إلى سطر خاص به بالنمط: اسم = قيمة. ثم يمكنك طباعة كل متغير باسمه."

  # --- STEP 12: Common mistake - quotes around variable names ---
  - type: "bug"
    lang: "python"
    question: "نحن نحاول طباعة اسم المستخدم، ابحث عن السطر الذي يحتوي على الخطأ"
    code: |
      username = "مبرمج123"
      print("username")
    solution: 1
    explanation: "عندما تضع علامات اقتباس حول اسم المتغير، فإنك تطبع الاسم نفسه، وليس القيمة المخزنة في المتغير."
    expectedOutput: "مبرمج123"
    actualOutput: "username"

  # --- STEP 13: Order matters ---
  - type: "order"
    lang: "python"
    question: "ضع هذه الأسطر بالترتيب الصحيح لإنشاء متغير ثم استخدامه."
    code:
      - score = 95
      - print("نتيجتك هي:")
      - print(score)
    explanation: "يجب عليك إنشاء المتغير قبل أن تتمكن من استخدامه. يأتي إسناد المتغير أولاً، ثم يمكنك طباعة قيمته."

  # --- STEP 14: Text vs variable names ---
  - type: "quiz"
    question: "ما الفرق بين هذين السطرين؟"
    code: |
      print("message")
      print(message)
    lang: "python"
    options:
      - "لا يوجد فرق - كلاهما يفعل نفس الشيء"
      - "السطر الأول يطبع كلمة 'message'، والثاني يطبع القيمة المخزنة في متغير يسمى message"
    solution: 1
    explanation: "مع علامات الاقتباس، بايثون يعرض النص مباشرة. بدون علامات اقتباس، يبحث بايثون عن متغير بذلك الاسم."

  # --- STEP 15: Final practice ---
  - type: "fill"
    lang: "python"
    question: "أكمل هذا الكود لتخزين فيلمك المفضل في متغير وعرضه مرتين."
    code: |
      favorite_movie = @@INPUT@@
      print("فيلمي المفضل هو:")
      print(@@INPUT@@)
      print("أنا حقًا أحب:")
      print(@@INPUT@@)
    solution:
      - '/^"[^"]+"$/'
      - "favorite_movie"
      - "favorite_movie"
    explanation: "بمجرد تخزين قيمة في متغير، يمكنك استخدامها عدة مرات كما تريد بالإشارة إلى اسمها."

  # --- STEP 16: Congratulations ---
  - type: "markdown"
    content: |
      عمل ممتاز! لقد تعلمت للتو أحد أهم المفاهيم في البرمجة: **`المتغيرات`**.

      **ماذا تعلمت:**
      - تستخدم برامج الحاسوب `المتغيرات` لتذكر المعلومات الهامة
      - `للمتغير` اسم وقيمة
      - يمكنك إنشاء `متغير` عن طريق ربط الاسم والقيمة بعلامة المساواة `=`
      - القيم النصية تحتاج إلى علامات اقتباس: `name = "محمد"`
      - القيم الرقمية لا تحتاج إلى علامات اقتباس: `age = 30`
      - يمكنك استخدام `المتغير` بكتابة اسمه بدون علامات اقتباس: `print(name)`

      > [!NEXT]
      > في الدرس القادم، سنتعمق أكثر في التعامل مع النصوص (`نص`) وسنرى طرقًا أكثر لاستخدام المتغيرات!
