  - type: "markdown"
    content: |
      **الكود بعد except ينفذ دائماً:**

      ```python
      try:
          x = int("abc")
      except:
          print("خطأ")

      print("البرنامج مستمر")  # ينفذ دائماً!
      ```

      البرنامج لا يتوقف، يستمر بعد معالجة الخطأ!

