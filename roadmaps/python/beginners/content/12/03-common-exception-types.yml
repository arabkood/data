    content: |
      ممتاز! 🎯 الآن تعرف:

      ✅ ValueError - قيم غير صحيحة
      ✅ ZeroDivisionError - القسمة على صفر
      ✅ IndexError - فهارس خارج النطاق
      ✅ KeyError - مفاتيح غير موجودة
      ✅ TypeError - أنواع غير متوافقة
      ✅ معالجة أنواع مختلفة معاً

      معرفة الأنواع تساعدك على معالجة أدق! 🎯
