      - "KeyError"
    solution: 1
    explanation: "لا يمكن ضرب نصين، هذا TypeError"

  - type: "markdown"
    content: |
      **معالجات متعددة:**

      يمكنك معالجة أنواع مختلفة:

      ```python
      try:
          # كود
      except ValueError:
          print("قيمة خاطئة")
      except ZeroDivisionError:
          print("قسمة على صفر")
      except:
          print("خطأ آخر")
      ```

