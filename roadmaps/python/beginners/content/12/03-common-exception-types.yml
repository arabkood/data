steps:
  - type: "markdown"
    content: |
      ليست كل الأخطاء متشابهة! 🎯

      Python تعطي كل خطأ **اسم** محدد يخبرك بالمشكلة:

      ```python
      int("abc")      # ValueError
      10 / 0          # ZeroDivisionError
      [1][5]          # IndexError
      ```

      لنتعرف على الأنواع الشائعة!

  - type: "markdown"
    content: |
      **1. ValueError** - قيمة غير صحيحة

      يحدث عند تحويل قيمة غير مناسبة:

      ```python
      try:
          num = int("abc")  # ValueError!
      except ValueError:
          print("لا يمكن تحويل النص لرقم")
      ```

      لاحظ: `except ValueError` تعالج هذا النوع فقط!

  - type: "fill"
    lang: "python"
    question: "عالج ValueError محدداً"
    code: |
      try:
          age = int("عشرون")
      except @@INPUT@@:
          print("القيمة غير صحيحة")
    solution:
      - "ValueError"

  - type: "markdown"
    content: |
      **2. ZeroDivisionError** - القسمة على صفر

      يحدث عند محاولة القسمة على صفر:

      ```python
      try:
          result = 10 / 0
      except ZeroDivisionError:
          print("لا يمكن القسمة على صفر!")
      ```

  - type: "fill"
    lang: "python"
    question: "عالج ZeroDivisionError"
    code: |
      try:
          x = 100 / 0
      except @@INPUT@@:
          print("القسمة على صفر!")
    solution:
      - "ZeroDivisionError"

  - type: "markdown"
    content: |
      **3. IndexError** - فهرس خارج النطاق

      يحدث عند محاولة الوصول لفهرس غير موجود:

      ```python
      try:
          items = [1, 2, 3]
          print(items[10])  # IndexError!
      except IndexError:
          print("الفهرس غير موجود")
      ```

  - type: "fill"
    lang: "python"
    question: "عالج IndexError"
    code: |
      numbers = [10, 20, 30]
      try:
          print(numbers[5])
      except @@INPUT@@:
          print("الفهرس خارج النطاق")
    solution:
      - "IndexError"

  - type: "markdown"
    content: |
      **4. KeyError** - مفتاح غير موجود

      يحدث عند محاولة الوصول لمفتاح غير موجود في قاموس:

      ```python
      try:
          person = {"name": "أحمد"}
          print(person["age"])  # KeyError!
      except KeyError:
          print("المفتاح غير موجود")
      ```

  - type: "fill"
    lang: "python"
    question: "عالج KeyError"
    code: |
      data = {"x": 10, "y": 20}
      try:
          print(data["z"])
      except @@INPUT@@:
          print("المفتاح غير موجود")
    solution:
      - "KeyError"

  - type: "markdown"
    content: |
      **5. TypeError** - نوع خاطئ

      يحدث عند استخدام عملية على نوع خاطئ:

      ```python
      try:
          result = "5" + 10  # TypeError!
      except TypeError:
          print("لا يمكن جمع نص ورقم")
      ```

  - type: "quiz"
    question: "أي استثناء سيحدث؟"
    code: |
      x = "hello" * "world"
    lang: "python"
    options:
