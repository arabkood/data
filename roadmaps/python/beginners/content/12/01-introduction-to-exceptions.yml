steps:
  - type: "markdown"
    content: |
      ماذا يحدث عندما يحدث خطأ في برنامجك؟ 💥

      ```python
      number = int("abc")  # خطأ!
      # ValueError: invalid literal for int()
      ```

      البرنامج يتوقف! 😱 لكن هناك طريقة أفضل...

  - type: "markdown"
    content: |
      **الاستثناءات** (Exceptions) = الأخطاء التي تحدث أثناء التشغيل

      عندما يحدث خطأ، Python "ترمي" (throw) استثناء:

      ```python
      # أنواع شائعة من الأخطاء:
      int("abc")          # ValueError
      10 / 0              # ZeroDivisionError
      [1, 2][5]           # IndexError
      {"a": 1}["b"]       # KeyError
      ```

      كل خطأ له **نوع** محدد!

  - type: "quiz"
    question: "ما هو الاستثناء (Exception)؟"
    options:
      - "خطأ في كتابة الكود"
      - "خطأ يحدث أثناء تشغيل البرنامج"
      - "تحذير من Python"
    solution: 1
    explanation: "الاستثناء هو خطأ يحدث عند تشغيل البرنامج (runtime error)"

  - type: "markdown"
    content: |
      **لماذا نهتم بالاستثناءات؟**

      بدون معالجة:
      ```python
      age = int(input("عمرك: "))  # المستخدم يكتب "abc"
      # البرنامج يتوقف! ❌
      ```

      مع معالجة:
      ```python
      try:
          age = int(input("عمرك: "))
      except:
          print("أدخل رقماً صحيحاً!")
      # البرنامج يستمر! ✅
      ```

  - type: "quiz"
    question: "ماذا يحدث بدون معالجة الاستثناءات؟"
    options:
      - "البرنامج يستمر بشكل طبيعي"
      - "البرنامج يتوقف عند الخطأ"
      - "Python يصلح الخطأ تلقائياً"
    solution: 1
    explanation: "بدون معالجة، البرنامج يتوقف تماماً عند حدوث الخطأ"

  - type: "markdown"
    content: |
      **البنية الأساسية: try-except**

      ```python
      try:
          # كود قد يسبب خطأ
          risky_code()
      except:
          # ماذا نفعل إذا حدث خطأ
          print("حدث خطأ!")
      ```

      - `try`: حاول تنفيذ هذا الكود
      - `except`: إن حدث خطأ، نفذ هذا

  - type: "fill"
    lang: "python"
    question: "أكمل البنية الأساسية"
    code: |
      @@INPUT@@:
          result = 10 / 0
      @@INPUT@@:
          print("لا يمكن القسمة على صفر!")
    solution:
