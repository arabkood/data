  - type: "markdown"
    content: |
      **ملاحظة مهمة:**

      الكود داخل `try` ينفذ عادياً إذا لم يحدث خطأ:

      ```python
      try:
          x = 5 + 5  # لا خطأ
          print(x)   # يطبع 10
      except:
          print("خطأ")  # لن ينفذ!
      ```

      `except` تنفذ فقط عند حدوث خطأ!

