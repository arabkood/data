  - type: "markdown"
    content: |
      الدوال تعمل معاً كأوركسترا موسيقية! 🎵

      دالة تستدعي دالة، التي تستدعي دالة أخرى...

      ```python
      def func_a():
          print("A")
          func_b()

      def func_b():
          print("B")
          func_c()

      def func_c():
          print("C")

      func_a()  # A, B, C
      ```

  - type: "markdown"
    content: |
      **تسلسل الاستدعاء** (Call Stack):

      ```python
      def first():
          print("بداية first")
          second()
          print("نهاية first")

      def second():
          print("  بداية second")
          third()
          print("  نهاية second")

      def third():
          print("    داخل third")

      first()
      ```

      كل دالة تنتهي قبل أن ترجع للتي استدعتها!

