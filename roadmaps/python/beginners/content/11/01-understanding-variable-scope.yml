  - type: "markdown"
    content: |
      **الأولوية:** المحلي أولاً!

      ```python
      x = 10  # عام

      def test():
          x = 20  # محلي (مختلف!)
          print(x)  # 20

      test()
      print(x)  # 10
      ```

      المتغير المحلي "يخفي" العام داخل الدالة!

  - type: "quiz"
    question: "ماذا سيطبع؟"
    code: |
      num = 5

      def change():
          num = 10
          print(num)

      change()
      print(num)
    lang: "python"
    options:
      - "10 ثم 10"
      - "10 ثم 5"
      - "5 ثم 10"
    solution: 1
    explanation: "داخل الدالة num محلي = 10، خارجها num العام = 5"

