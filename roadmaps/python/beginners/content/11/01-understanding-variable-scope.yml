steps:
  - type: "markdown"
    content: |
      سؤال مهم: أين يمكن استخدام المتغير؟ 🤔

      ```python
      def test():
          x = 10
          print(x)  # يعمل ✅

      test()
      print(x)  # خطأ! ❌
      ```

      لماذا؟ بسبب **النطاق** (Scope)!

  - type: "markdown"
    content: |
      **النطاق** (Scope) = المنطقة التي يمكن استخدام المتغير فيها

      هناك نوعان رئيسيان:

      1. **Local Scope** (محلي): داخل الدالة فقط
      2. **Global Scope** (عام): في كل البرنامج

      ```python
      # Global
      name = "أحمد"

      def greet():
          # Local
          message = "مرحباً"
          print(name)     # يمكن قراءة العام ✅
          print(message)  # يمكن قراءة المحلي ✅

      greet()
      print(name)     # ✅
      print(message)  # ❌ خطأ! محلي فقط
      ```

  - type: "quiz"
    question: "ما هو النطاق المحلي (Local Scope)؟"
    options:
      - "المتغيرات في كل البرنامج"
      - "المتغيرات داخل الدالة فقط"
      - "المتغيرات خارج الدالة"
    solution: 1
    explanation: "النطاق المحلي هو المتغيرات المعرّفة داخل الدالة، ولا يمكن استخدامها خارجها"

  - type: "fill"
    lang: "python"
    question: "حدد أي متغير محلي وأيهما عام"
    code: |
      x = 10  # @@INPUT@@ scope

      def func():
          y = 20  # @@INPUT@@ scope
          print(x, y)

      func()
    solution:
      - "/^(global|عام)$/"
      - "/^(local|محلي)$/"

  - type: "markdown"
    content: |
      **القاعدة الذهبية:**

      - داخل الدالة → يمكن **قراءة** المتغيرات العامة ✅
      - داخل الدالة → لا يمكن **تعديل** المتغيرات العامة ❌ (بدون global)
      - خارج الدالة → لا يمكن الوصول للمحلية ❌

  - type: "bug"
