steps:
  - type: "markdown"
    content: |
      كيف نُعدّل متغير عام من داخل دالة؟ 🤔

      ```python
      count = 0

      def increment():
          count = count + 1  # خطأ! ❌

      increment()
      ```

      Python تظن أن count محلي! نحتاج `global` 🔑

  - type: "markdown"
    content: |
      **الكلمة المفتاحية `global`** تخبر Python:

      "هذا المتغير عام، ليس محلي!"

      ```python
      count = 0

      def increment():
          global count  # الآن Python تعرف!
          count = count + 1  # ✅

      increment()
      print(count)  # 1
      ```

  - type: "quiz"
    question: "متى نستخدم global؟"
    options:
      - "عند قراءة متغير عام"
      - "عند تعديل متغير عام من داخل دالة"
      - "دائماً مع كل المتغيرات"
    solution: 1
    explanation: "نستخدم global فقط عند **تعديل** متغير عام من داخل دالة"

