  - type: "markdown"
    content: |
      **تحذير:** استخدم global بحذر! ⚠️

      ```python
      # ❌ سيء - صعب التتبع
      count = 0
      def func1():
          global count
          count += 1
      def func2():
          global count
          count += 10

      # ✅ أفضل - استخدم return
      def add_one(n):
          return n + 1
      count = add_one(count)
      ```

      استخدم `return` عندما يمكنك!

  - type: "quiz"
    question: "أيهما أفضل؟"
    code: |
      # خيار 1
      total = 0
      def add(n):
          global total
          total += n

      # خيار 2
      def add(total, n):
          return total + n
      total = add(total, 5)
    lang: "python"
    options:
      - "خيار 1 (global)"
      - "خيار 2 (return)"
      - "كلاهما متساويان"
    solution: 1
    explanation: "الخيار 2 أفضل - أوضح وأسهل للفهم والاختبار"

