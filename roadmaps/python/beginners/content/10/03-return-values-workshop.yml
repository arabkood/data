steps:
  - type: "markdown"
    content: |
      حتى الآن دوالنا تطبع فقط. لكن ماذا لو أردنا **استخدام النتيجة**؟

      ```python
      def add(a, b):
          print(a + b)  # تطبع فقط

      result = add(3, 5)  # result = None ❌
      ```

      هنا يأتي دور `return`! 🎯

  - type: "markdown"
    content: |
      **return** تُرجع قيمة من الدالة:

      ```python
      def add(a, b):
          return a + b  # أرجع النتيجة

      result = add(3, 5)  # result = 8 ✅
      print(result)  # 8
      ```

      `return` تعطيك النتيجة لتستخدمها في أي مكان!

  - type: "quiz"
    question: "ما الفرق بين print و return في الدالة؟"
    options:
      - "لا يوجد فرق"
      - "print تعرض فقط، return تُرجع قيمة يمكن استخدامها"
      - "return تعرض، print تُرجع قيمة"
    solution: 1
    explanation: "print تعرض على الشاشة فقط، return تُرجع قيمة يمكن حفظها واستخدامها"

