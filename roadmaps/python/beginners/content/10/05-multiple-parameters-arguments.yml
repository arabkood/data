steps:
  - type: "markdown"
    content: |
      الدوال يمكنها استقبال **أكثر من معامل**! 🎯

      ```python
      def greet(name, age):
          print(f"مرحباً {name}، عمرك {age}")

      greet("أحمد", 25)
      ```

      نفصل المعاملات بفاصلة `,`

  - type: "fill"
    lang: "python"
    question: "أنشئ دالة تأخذ اسمين وتطبعهما"
    code: |
      def print_names(@@INPUT@@, @@INPUT@@):
          print(@@INPUT@@, @@INPUT@@)

      print_names("أحمد", "سارة")
    solution:
      - "/^(name1|first|n1)$/"
      - "/^(name2|second|n2)$/"
      - "/^(name1|first|n1)$/"
      - "/^(name2|second|n2)$/"

  - type: "markdown"
    content: |
      **ترتيب المعاملات مهم جداً!**

      ```python
      def subtract(a, b):
          return a - b

      subtract(10, 3)  # 7
      subtract(3, 10)  # -7 (مختلف!)
      ```

      الوسيط الأول يذهب للمعامل الأول، والثاني للثاني!

  - type: "quiz"
    question: "ما ناتج هذه الدالة؟"
    code: |
      def divide(x, y):
          return x / y

      result = divide(20, 4)
    lang: "python"
    options:
      - "5.0"
      - "0.2"
      - "خطأ"
    solution: 0
    explanation: "20 / 4 = 5.0 (x=20, y=4)"

