steps:
  - type: "markdown"
    content: |
      تخيل أنك تكتب نفس الكود مراراً وتكراراً:

      ```python
      print("مرحباً أحمد!")
      print("مرحباً سارة!")
      print("مرحباً علي!")
      ```

      هذا متعب ومكرر! 😓

  - type: "markdown"
    content: |
      **الدوال** (Functions) هي الحل!

      الدالة مثل **وصفة طبخ**: تكتبها مرة واحدة، ثم تستخدمها كلما احتجتها.

      ```python
      def greet():
          print("مرحباً!")

      greet()  # نستدعي الدالة
      greet()  # يمكن استدعاؤها مراراً
      ```

      الكلمة `def` تعني "define" أي "عرّف الدالة"

  - type: "quiz"
    question: "لماذا نستخدم الدوال؟"
    options:
      - "لتجعل البرنامج أبطأ"
      - "لتجنب تكرار نفس الكود"
      - "لجعل الكود أطول"
    solution: 1
    explanation: "الدوال تساعدنا على عدم تكرار الكود وتجعله أكثر تنظيماً وسهولة في الصيانة"

  - type: "markdown"
    content: |
      **تشريح الدالة:**

      ```python
      def say_hello():  # 1. تعريف الدالة (اسمها + أقواس)
          print("Hello")  # 2. جسم الدالة (مسافة بادئة!)

      say_hello()  # 3. استدعاء الدالة
      ```

      ⚠️ مهم: جسم الدالة يجب أن يكون مسافة بادئة (indented)!

