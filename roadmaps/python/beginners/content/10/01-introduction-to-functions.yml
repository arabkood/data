      رائع! أنت الآن تعرف:

      ✅ ما هي الدالة ولماذا نستخدمها
      ✅ كيف تُنشئ دالة باستخدام `def`
      ✅ كيف تستدعي دالة باستخدام `()`
      ✅ أن جسم الدالة يحتاج مسافة بادئة

      الدوال ستجعل كودك أنظف وأسهل! 🎯
