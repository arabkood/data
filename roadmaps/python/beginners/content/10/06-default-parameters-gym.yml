steps:
  - type: "markdown"
    content: |
      أحياناً نريد معامل **اختياري** بقيمة افتراضية:

      ```python
      def greet(name, greeting="مرحباً"):
          print(f"{greeting} {name}!")

      greet("أحمد")              # مرحباً أحمد!
      greet("سارة", "أهلاً")     # أهلاً سارة!
      ```

      إذا لم نمرر الوسيط، يستخدم القيمة الافتراضية! 🎯

  - type: "markdown"
    content: |
      **كيف تُعرّف معامل افتراضي:**

      ```python
      def function(param1, param2=default_value):
          # ...
      ```

      المعاملات الافتراضية تأتي **بعد** المعاملات الإجبارية!

  - type: "quiz"
    question: "ما ناتج هذا الاستدعاء؟"
    code: |
      def say(msg, times=2):
          for i in range(times):
              print(msg)

      say("Hi")
    lang: "python"
    options:
      - "يطبع 'Hi' مرة واحدة"
      - "يطبع 'Hi' مرتين"
      - "خطأ"
    solution: 1
    explanation: "times له قيمة افتراضية 2، فيطبع 'Hi' مرتين"

