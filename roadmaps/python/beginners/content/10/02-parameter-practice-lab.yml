  - type: "markdown"
    content: |
      الدوال أصبحت أقوى الآن! 💪

      **المعاملات** (Parameters) تسمح للدالة باستقبال بيانات:

      ```python
      def greet(name):  # name هو المعامل
          print(f"مرحباً {name}!")

      greet("أحمد")  # "أحمد" هو الوسيط (argument)
      greet("سارة")  # نفس الدالة، بيانات مختلفة!
      ```

  - type: "markdown"
    content: |
      **المصطلحات المهمة:**

      - **Parameter** (معامل): المتغير في تعريف الدالة `def greet(name)`
      - **Argument** (وسيط): القيمة التي نمررها عند الاستدعاء `greet("أحمد")`

      المعامل مثل صندوق فارغ، والوسيط هو ما نضعه فيه!

