    lang: "python"
    options:
      - "لا يوجد فرق"
      - "x في التعريف معامل، 5 عند الاستدعاء وسيط"
      - "5 في التعريف معامل، x عند الاستدعاء وسيط"
    solution: 1
    explanation: "المعامل (parameter) في التعريف، الوسيط (argument) عند الاستدعاء"

