  - type: "markdown"
    content: |
      الآن يبدأ السحر الحقيقي! ✨

      **تركيب الدوال** = استخدام دالة داخل دالة أخرى

      ```python
      def double(n):
          return n * 2

      def add_ten(n):
          return n + 10

      result = add_ten(double(5))  # 5 * 2 = 10، ثم 10 + 10 = 20
      ```

  - type: "markdown"
    content: |
      فكر في الدوال كـ**مكعبات ليجو**: تبني أشياء معقدة من قطع بسيطة!

      ```python
      def square(n):
          return n * n

      def sum_of_squares(a, b):
          return square(a) + square(b)

      print(sum_of_squares(3, 4))  # 9 + 16 = 25
      ```

