item_id: "module-1-item-3"
item_type: "lesson"
title: "النصوص في بايثون"

steps:
  # --- STEP 1: What are strings? ---
  - type: "markdown"
    content: |
      لقد كنت تستخدم النصوص في الكود الخاص بك، لكن دعنا نعطها اسمها الصحيح: في البرمجة، أي جزء من النص يسمى **`سلسلة نصية`** أو ببساطة **`نص`** (`string`).

      لماذا "سلسلة"؟ فكر فيها كسلسلة من الأحرف - حروف وأرقام ومسافات ورموز - كلها مرتبطة معًا في تسلسل.

      ```python
      "مرحباً بالعالم!"
      "بايثون رائعة"
      "شارع النهضة رقم 123"
      ```

      كل من هذه الأمثلة هو `نص`. لاحظ أن لديها جميعًا شيئًا واحدًا مشتركًا: علامات الاقتباس حولها.

  # --- STEP 2: Strings need quotation marks ---
  - type: "markdown"
    content: |
      علامات الاقتباس ليست مجرد زخرفة - إنها **ضرورية**! فهي تخبر بايثون "هذا نص، وليس أمرًا برمجيًا."

      بدون علامات الاقتباس، يعتقد بايثون أنك تحاول استخدام `متغير` أو أمر:

      ```python
      print(مرحباً)  # تبحث بايثون عن متغير اسمه "مرحباً"
      print("مرحباً")  # تعرف بايثون أن هذا نص
      ```

      علامات الاقتباس تشبه قولك "أنا أعني حرفيًا هذا النص تمامًا كما هو مكتوب."

  # --- STEP 3: Quiz about strings ---
  - type: "quiz"
    question: "أي من هذه الخيارات يمثل `نصًا`؟"
    options:
      - "مرحباً"
      - '"114"'
      - "print"
    solution: 1
    explanation: "الـ `نص` هو أي محتوى نصي محاط بعلامات اقتباس. حتى الأرقام يمكن أن تكون نصوصًا إذا كانت داخل علامات اقتباس!"

  # --- STEP 4: Single vs double quotes ---
  - type: "markdown"
    content: |
      تقبل بايثون كلاً من علامات الاقتباس المفردة `'` والمزدوجة `"` للنصوص. كل هذه الأمثلة صحيحة:

      ```python
      message1 = "أهلاً بك"
      message2 = 'أهلاً بك'
      message3 = "إنه يوم جميل"
      message4 = 'بايثون "رائعة"'
      ```

      كلاهما يعمل بنفس الطريقة تمامًا. يفضل العديد من المبرمجين علامات الاقتباس المزدوجة، ولكن يمكنك استخدام أي منهما تفضل.

  # --- STEP 5: Practice with different quotes ---
  - type: "fill"
    lang: "python"
    question: "أنشئ متغيرًا نصيًا باستخدام علامات الاقتباس المفردة لكلمة 'سلام'"
    code: |
      greeting = @@INPUT@@
    solution:
      - "'سلام'"
    explanation: "علامات الاقتباس المفردة تعمل تمامًا مثل المزدوجة لإنشاء النصوص. الشيء المهم هو وجود علامات متطابقة في البداية والنهاية."

  # --- STEP 6: Strings in variables ---
  - type: "markdown"
    content: |
      هل تتذكر المتغيرات من الدرس الماضي؟ إنها تعمل بشكل مثالي مع النصوص. يمكنك تخزين أي نص في `متغير` واستخدامه لاحقًا:

      ```python
      الاسم_الأول = "عمر"
      اسم_العائلة = "أحمد"
      المدينة = "القاهرة"

      print(الاسم_الأول)
      print(اسم_العائلة)
      print(المدينة)
      ```

      هذا الكود ينشئ ثلاثة متغيرات نصية، كل منها يحتوي على نص مختلف.

  # --- STEP 7: Creating string variables ---
  - type: "fill"
    lang: "python"
    question: |
      أنشئ ثلاثة متغيرات نصية: 
      - `book_title` بقيمة 'القانون في الطب'.
      - `author` بقيمة 'ابن سينا'.
      - `year_hijri` بقيمة '416'
    code: |
      @@INPUT@@ = @@INPUT@@
      @@INPUT@@ = @@INPUT@@
      @@INPUT@@ = @@INPUT@@
    solution:
      - "book_title"
      - |
        /^['"]القانون في الطب['"]$/
      - "author"
      - |
        /^['"]ابن سينا['"]$/
      - "year_hijri"
      - |
        /^['"]416['"]$/
    explanation: "لاحظ أن '416' موضوعة بين علامتي اقتباس، مما يجعلها `نصًا` وليس `رقمًا`. أحيانًا نقوم بتخزين الأرقام كنصوص عندما لا نحتاج إلى إجراء عمليات حسابية عليها."

  # --- STEP 9: Printing practice ---
  - type: "fill"
    lang: "python"
    question: "اكتب الكود لطباعة قيمة المتغير `favorite_food`."
    code: |
      favorite_food = "بيتزا"
      @@INPUT@@
    solution:
      - "print(favorite_food)"
    explanation: "استخدم دائمًا `دالة` الطباعة `print` مع اسم المتغير (بدون علامات اقتباس) لعرض قيمته."

  # --- STEP 10: Statements in programming ---
  - type: "markdown"
    content: |
      لنتحدث عن **الجمل البرمجية** (`statements`). في البرمجة، الجملة البرمجية هي تعليمة كاملة تخبر الحاسوب بالقيام بشيء ما.

      كل سطر من الكود كتبته هو جملة برمجية:
      ```python
      name = "خالد"        # هذه جملة برمجية
      print(name)          # هذه أيضًا جملة برمجية
      age = 25             # جملة برمجية أخرى
      ```

      فكر في الجمل البرمجية كالجمل في اللغة العربية - كل واحدة تعبر عن فكرة أو إجراء كامل.

  # --- STEP 11: Identifying statements ---
  - type: "quiz"
    question: "كم عدد الجمل البرمجية في هذا الكود؟"
    code: |
      username = "مبرمج١٢٣"
      password = "سري"
      print(username)
      print("تم تسجيل الدخول بنجاح")
    lang: "python"
    options:
      - "جملتان برمجيتان"
      - "٣ جمل برمجية"
      - "٤ جمل برمجية"
    solution: 2
    explanation: "كل سطر يخبر الحاسوب بفعل شيء ما هو جملة برمجية. هذا الكود يحتوي على ٤ جمل برمجية: جملتا إسناد (تخزين قيمة) وجملتا طباعة."

  # --- STEP 12: Order of statements ---
  - type: "order"
    lang: "python"
    question: "ضع هذه الجمل البرمجية بالترتيب الصحيح لإنشاء وعرض معلومات شخصية."
    code:
      - full_name = "أحمد زويل"
      - occupation = "عالم"
      - print(full_name)
      - print(occupation)
    alternate:
      - [1, 0, 2, 3]
      - [0, 1, 3, 2]
      - [1, 0, 3, 2]
    explanation: "يجب عليك إنشاء المتغيرات قبل أن تتمكن من استخدامها. جمل الإسناد تأتي أولاً، ثم جمل الطباعة."

  # --- STEP 13: Common string mistakes ---
  - type: "bug"
    lang: "python"
    question: "ابحث عن السطر الذي يحتوي على الخطأ"
    code: |
      first_name = "حياة"
      last_name = "السندي'
      print(first_name)
      print(last_name)
    solution: 1
    explanation: "كل `نص` يجب أن يحتوي على علامتي اقتباس متطابقتين في البداية والنهاية."
    hint: "ابحث عن علامات الاقتباس غير المتطابقة."

  # --- STEP 14: Mixing strings and variables ---
  - type: "fill"
    lang: "python"
    question: "أكمل هذا الكود لعرض معلومات عن هواية شخص ما."
    code: |
      hobby = "البرمجة"
      skill_level = "مبتدئ"
      print("هوايتي هي:")
      print(@@INPUT@@)
      print("مستواي:")
      print(@@INPUT@@)
    solution:
      - "hobby"
      - "skill_level"

  # --- STEP 15: String content variety ---
  - type: "fill"
    lang: "python"
    question: "أنشئ متغيرات نصية لأنواع مختلفة من المحتوى: `email` لعنوان بريد إلكتروني، و `phone` لرقم هاتف، و `website` لرابط موقع إلكتروني."
    code: |
      @@INPUT@@ = @@INPUT@@
      @@INPUT@@ = @@INPUT@@
      @@INPUT@@ = @@INPUT@@
      print(email)
      print(phone)
      print(website)
    solution:
      - "email"
      - "/^\"[^\"@]+@[^\"@]+\\.[^\"@]+\"$/"
      - "phone"
      - '/^"[^"]+"$/'
      - "website"
      - '/^"[^"]+"$/'
    explanation: "يمكن للنصوص أن تحتوي على أي شيء - عناوين بريد إلكتروني، أرقام هواتف، روابط مواقع، أو أي معلومات أخرى. كلها مجرد `نص` بالنسبة لبايثون."

  # --- STEP 16: Empty strings ---
  - type: "markdown"
    content: |
      أحيانًا تحتاج إلى `نص` فارغ - وهو نص لا يحتوي على أي محتوى. هذا صحيح تمامًا في بايثون:

      ```python
      رسالة_فارغة = ""
      رسالة_اخرى_فارغة = ''
      print(رسالة_فارغة)  # هذا يطبع سطراً فارغاً
      ```

      النصوص الفارغة مفيدة عندما تريد أن تبدأ بدون نص ثم تضيف المحتوى لاحقًا.

  # --- STEP 17: Final comprehensive practice ---
  - type: "fill"
    lang: "python"
    question: "أنشئ ملفًا شخصيًا مصغرًا: خزّن فيلمك المفضل، ولونك المفضل، ومسقط رأسك في متغيرات، ثم اطبعها مع تسميات توضيحية."
    code: |
      favorite_movie = @@INPUT@@
      favorite_color = @@INPUT@@
      hometown = @@INPUT@@

      print("الفيلم المفضل:")
      print(@@INPUT@@)
      print("اللون المفضل:")
      print(@@INPUT@@)
      print("مسقط الرأس:")
      print(@@INPUT@@)
    solution:
      - '/^"[^"]+"$/'
      - '/^"[^"]+"$/'
      - '/^"[^"]+"$/'
      - "favorite_movie"
      - "favorite_color"
      - "hometown"
    explanation: "هذا النمط - تخزين المعلومات في متغيرات، ثم طباعتها مع تسميات وصفية - شائع جدًا في البرمجة."

  # --- STEP 18: Congratulations ---
  - type: "markdown"
    content: |
      رائع! أنت الآن تفهم النصوص بشكل أفضل بكثير.

      **ماذا تعلمت:**
      - أي جزء من النص يسمى **`نصًا`** أو **`سلسلة نصية`**.
      - النصوص تتطلب علامات اقتباس (مفردة `'` أو مزدوجة `"`).
      - كل سطر من الكود يقوم بشيء ما يسمى **جملة برمجية**.

      النصوص موجودة في كل مكان في البرمجة - رسائل المستخدم، أسماء الملفات، عناوين الويب، وغير ذلك الكثير. ستستخدمها باستمرار، لذا فإن التعود عليها الآن سيخدمك جيدًا.

      > [!NEXT]
      > في الدرس التالي، سنستكشف الأرقام بعمق ونتعلم كيفية إجراء العمليات الحسابية بها!
