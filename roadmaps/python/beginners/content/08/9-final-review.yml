      في هذه المراجعة النهائية، سنختبر كل ما تعلمته:
      - حلقات While
      - التحكم في الحلقات (break, continue, pass)
      - الحلقات المتداخلة
      - اختيار الحلقة المناسبة
      - تصحيح أخطاء الحلقات

