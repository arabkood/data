  - type: "markdown"
    content: |
      ممتاز! الآن تمتلك كل أدوات التحكم في الحلقات:

      **ملخص سريع:**
      - `break`: اخرج من الحلقة فوراً
      - `continue`: تخطى هذه الدورة واذهب للتالية
      - `pass`: لا تفعل شيئاً (مكان حافظ)

      هذه الأدوات ستجعل حلقاتك أكثر مرونة وقوة!
