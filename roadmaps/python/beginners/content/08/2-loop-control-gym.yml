  - type: "markdown"
    content: |
      ## ثانياً: كلمة `continue` - التخطي والمتابعة

      `continue` تتخطى **باقي** الدورة الحالية وتذهب مباشرة للدورة التالية.

      ```python
      for i in range(1, 6):
          if i == 3:
              continue  # تخطى الرقم 3
          print(i)
      ```

      **النتيجة:** سيطبع 1, 2, 4, 5 (يتخطى 3)

