steps:
  - type: "markdown"
    content: |
      أحياناً تحتاج إلى **التحكم** في سلوك الحلقات بطريقة أكثر دقة.

      ماذا لو أردت:
      - إيقاف الحلقة في منتصفها؟
      - تخطي بعض الدورات؟
      - وضع علامة مؤقتة دون فعل أي شيء؟

      Python تمنحك ثلاث أدوات قوية: `break`، `continue`، و `pass`!

  - type: "markdown"
    content: |
      ## أولاً: كلمة `break` - الإيقاف الفوري

      `break` تخرج من الحلقة **فوراً**، حتى لو لم ينته الشرط.

      ```python
      count = 0

      while count < 10:
          if count == 5:
              break  # توقف عندما نصل إلى 5
          print(count)
          count = count + 1

      print("خرجنا من الحلقة!")
      ```

      **النتيجة:** سيطبع 0, 1, 2, 3, 4 ثم يتوقف!

