      الحلقات قوية، لكنها أيضاً مصدر شائع للأخطاء!

      في هذه العيادة، ستتعلم أكثر الأخطاء شيوعاً في الحلقات وكيف تكتشفها وتصلحها.

      استعد لتصبح خبيراً في تصحيح الأخطاء!

  - type: "markdown"
    content: |
      ## الخطأ #1: الحلقة اللانهائية

      **المشكلة:** الحلقة لا تتوقف أبداً!

      ```python
      # ⚠️ خطأ!
      x = 0
      while x < 5:
          print(x)
          # نسينا زيادة x!
      ```

      **الحل:** تأكد أن الشرط سيصبح خاطئاً في النهاية!
      ```python
      # ✅ صحيح
      x = 0
      while x < 5:
          print(x)
          x = x + 1  # الآن سيتوقف!
      ```

