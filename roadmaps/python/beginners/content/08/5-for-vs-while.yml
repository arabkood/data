    content: |
      الآن تعرف كلاً من حلقات `for` و `while`، لكن متى تستخدم كل واحدة؟

      هذا سؤال مهم! اختيار الحلقة الصحيحة يجعل كودك أوضح وأسهل في القراءة.

      دعنا نتعلم كيف نختار!

  - type: "markdown"
    content: |
      ## حلقة For: عندما تعرف العدد

      استخدم `for` عندما تعرف **بالضبط** كم مرة تريد التكرار، أو عندما تمر على **قائمة محددة**.

      **مثال 1: عدد محدد من التكرارات**
      ```python
      for i in range(5):
          print(i)
      ```

      **مثال 2: المرور على قائمة**
      ```python
      fruits = ["تفاح", "موز", "برتقال"]
      for fruit in fruits:
          print(fruit)
      ```

      **لماذا for؟** لأننا نعرف مسبقاً: 5 مرات، أو 3 فواكه.

  - type: "markdown"
    content: |
      ## حلقة While: عندما لا تعرف العدد

      استخدم `while` عندما **لا تعرف** كم مرة ستتكرر، أو عندما تريد الاستمرار حتى يحدث شيء معين.

      **مثال 1: حتى يتحقق شرط**
      ```python
      password = ""
      while password != "سر123":
          password = input("أدخل كلمة السر: ")
      ```

      **مثال 2: حتى يصل رقم لقيمة معينة**
      ```python
      balance = 100
      while balance < 1000:
          balance = balance * 1.1
      ```

      **لماذا while؟** لا نعرف كم محاولة للباسورد، أو كم مرة سنضاعف!

