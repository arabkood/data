steps:
  - type: "markdown"
    content: |
      حتى الآن، استخدمنا حلقات `for` لتكرار العمليات. لكن ماذا لو لم نعرف بالضبط **كم مرة** نريد التكرار؟

      تخيل أنك تلعب لعبة تخمين الأرقام. ستستمر في المحاولة حتى تخمن الرقم الصحيح، لكنك لا تعرف كم محاولة ستحتاج!

      هنا تأتي حلقات `while` للإنقاذ!

  - type: "markdown"
    content: |
      حلقة `while` تستمر في التنفيذ **طالما** الشرط صحيح.

      إليك المفهوم الأساسي:

      ```python
      while condition:
          # افعل شيئاً
      ```

      الحلقة ستستمر في تنفيذ الكود بداخلها حتى يصبح `condition` خاطئاً.

  - type: "markdown"
    content: |
      لنرى مثالاً بسيطاً:

      ```python
      count = 1

      while count <= 3:
          print(f"العد: {count}")
          count = count + 1

      print("انتهى!")
      ```

      **ماذا يحدث؟**
      1. نبدأ بـ `count = 1`
      2. نتحقق: هل `count <= 3`؟ نعم! → ننفذ الكود
      3. نطبع "العد: 1" ثم نزيد `count` إلى 2
      4. نتحقق مجدداً: هل `2 <= 3`؟ نعم! → ننفذ مرة أخرى
      5. نستمر حتى يصبح `count = 4`، عندها `4 <= 3` يصبح خاطئاً
      6. نخرج من الحلقة ونطبع "انتهى!"

  - type: "quiz"
    question: "كم مرة ستطبع هذه الحلقة كلمة 'مرحبا'؟"
    code: |
      x = 5

      while x > 2:
          print("مرحبا")
          x = x - 1
    lang: "python"
    options:
      - "مرتين"
      - "ثلاث مرات"
      - "أربع مرات"
      - "خمس مرات"
    solution: 1
    explanation: "تبدأ x بـ 5. الحلقة تعمل عندما x > 2، أي عندما x هي 5، 4، 3. بمجرد أن تصبح x = 2، الشرط يصبح خاطئاً وتتوقف الحلقة. إذن: 3 مرات."

  - type: "fill"
    lang: "python"
    question: "أكمل الكود لطباعة الأرقام من 1 إلى 5 باستخدام while:"
    code: |
      number = 1

      @@INPUT@@ number <= 5:
          print(number)
          number = @@INPUT@@
    solution:
      - "while"
      - "/^number\\s*\\+\\s*1$/"
    explanation: "نستخدم while للتحقق من الشرط، ثم نزيد number بمقدار 1 في كل دورة."

  - type: "markdown"
    content: |
      الآن دعنا نرى الفرق الرئيسي بين `for` و `while`:

      **استخدم for عندما:**
      - تعرف بالضبط كم مرة تريد التكرار
      - تريد المرور عبر قائمة أو نطاق محدد

      **استخدم while عندما:**
      - لا تعرف عدد المرات بالضبط
      - تريد الاستمرار حتى يتحقق شرط معين

  - type: "fill"
    lang: "python"
    question: "اكتب حلقة while تستمر حتى يصبح المجموع أكبر من أو يساوي 100:"
    code: |
      total = 0

      @@INPUT@@ total @@INPUT@@ 100:
          total = total + 15

      print(f"المجموع النهائي: {total}")
    solution:
      - "while"
      - "<"
    explanation: "نريد الاستمرار طالما total أصغر من 100، لذا نستخدم while total < 100."

  - type: "markdown"
    content: |
      **تحذير مهم:** كن حذراً من الحلقات اللانهائية!

      ```python
      # ⚠️ لا تجرب هذا!
      x = 1
      while x < 10:
          print(x)
          # نسينا زيادة x!
      ```

      هذا الكود سيستمر للأبد لأن `x` لن تتغير أبداً، و `x < 10` سيظل صحيحاً دائماً!

  - type: "quiz"
    question: "أي من الحلقات التالية ستسبب حلقة لانهائية؟"
    options:
      - |
        n = 5
        while n > 0:
            print(n)
            n = n - 1
      - |
        n = 0
        while n < 5:
            print(n)
            n = n + 1
      - |
        n = 10
        while n > 5:
            print(n)
            n = n + 1
      - |
        n = 1
        while n <= 3:
            print(n)
            n = n + 1
    solution: 2
    explanation: "الخيار الثالث سيستمر للأبد! n تبدأ بـ 10 وتزداد، لكن الشرط n > 5 سيظل صحيحاً دائماً لأن n تكبر وتكبر."

  - type: "fill"
    lang: "python"
    question: "أكمل حلقة while لطباعة كل الأرقام الزوجية من 2 إلى 10:"
    code: |
