  - type: "markdown"
    content: |
      رائع! الآن تفهم أساسيات حلقات `while`.

      **تذكر:**
      - `while` تعمل طالما الشرط صحيح
      - تأكد دائماً أن الشرط سيصبح خاطئاً في نهاية المطاف
      - استخدم `while` عندما لا تعرف عدد التكرارات مسبقاً

      في الدروس القادمة، سنتعلم كيف نتحكم بشكل أفضل في سلوك الحلقات!
