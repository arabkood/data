  - type: "markdown"
    content: |
      رائع! الآن أصبحت خبيراً في الحلقات المتداخلة!

      **نصائح مهمة:**
      - الحلقة الداخلية تنفذ **كاملة** في كل دورة من الحلقة الخارجية
      - عدد التكرارات الكلي = دورات الخارجية × دورات الداخلية
      - استخدمها للأنماط، الجداول، والمصفوفات
      - `break` يخرج من الحلقة الحالية فقط

      استعد للتحدي القادم!
