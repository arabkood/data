  - type: "markdown"
    content: |
      الحلقات المتداخلة رائعة لإنشاء **الأنماط** (Patterns)!

      لنصنع مربعاً من النجوم:

      ```python
      for row in range(3):
          for col in range(3):
              print("*", end="")
          print()  # سطر جديد بعد كل صف
      ```

      **النتيجة:**
      ```
      ***
      ***
      ***
      ```

      الحلقة الخارجية للصفوف، والداخلية للأعمدة!

