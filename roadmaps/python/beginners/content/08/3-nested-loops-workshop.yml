steps:
  - type: "markdown"
    content: |
      تخيل أن لديك صندوق من الأدراج، وكل درج يحتوي على صناديق صغيرة.

      للوصول لكل صندوق صغير، تحتاج إلى:
      1. فتح كل درج (حلقة خارجية)
      2. داخل كل درج، فتح كل صندوق صغير (حلقة داخلية)

      هذا بالضبط ما تفعله **الحلقات المتداخلة** (Nested Loops)!

  - type: "markdown"
    content: |
      إليك أبسط مثال لحلقات متداخلة:

      ```python
      for i in range(1, 4):
          for j in range(1, 3):
              print(f"i={i}, j={j}")
      ```

      **ماذا يحدث؟**
      - الحلقة الخارجية: i تأخذ القيم 1, 2, 3
      - لكل قيمة من i، الحلقة الداخلية تعمل كاملة!
      - عندما i=1، j تأخذ 1, 2
      - عندما i=2، j تأخذ 1, 2 مرة أخرى
      - وهكذا...

      **النتيجة:** 6 أسطر (3 × 2)

  - type: "quiz"
