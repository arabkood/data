      ## لماذا نحتاج للعد والتتبع؟

      تخيل أنك تعمل كمحاسب في متجر، وتريد معرفة:
      - كم عدد المبيعات اليوم؟
      - كم إجمالي المبلغ المحصل؟
      - كم عدد العملاء الذين اشتروا أكثر من 100 ريال؟

      هذا بالضبط ما نسميه **العد والتتبع في الحلقات** - استخدام متغيرات خاصة لجمع المعلومات أثناء تكرار العمليات.

  - type: "markdown"
    content: |
      ## المتغير العداد (Counter Variable)

      **العداد** هو متغير نستخدمه لحساب عدد المرات التي حدث فيها شيء معين.

      إليك المثال الأساسي:

      ```python
      counter = 0  # نبدأ من الصفر
      
      for i in range(5):
          counter = counter + 1  # أو counter += 1
          print(f"المرة رقم: {counter}")
      
      print(f"المجموع النهائي: {counter}")
      ```

      **النتيجة:**
      ```
      المرة رقم: 1
      المرة رقم: 2
      المرة رقم: 3
      المرة رقم: 4
      المرة رقم: 5
      المجموع النهائي: 5
      ```

