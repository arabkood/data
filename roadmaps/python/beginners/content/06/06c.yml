steps:
  # Step 1: Introduction - Why patterns matter
  - type: "markdown"
    content: |
      الآن بعد أن تعلمت حلقات for والدالة range، حان الوقت للمرح الحقيقي!

      **بناء الأنماط** هو مثل الرسم بالكود. سنستخدم حلقات for لإنشاء أشكال وأنماط رائعة على الشاشة.

      لماذا نتعلم هذا؟ لأنه يساعدك على:
      - **فهم كيف تعمل الحلقات** بصريًا
      - **التفكير المنطقي** في حل المشاكل
      - **الإبداع** في البرمجة

  # Step 2: Simple horizontal line
  - type: "markdown"
    content: |
      لنبدأ بأبسط نمط: **خط أفقي من النجوم**

      ```python
      for i in range(5):
          print("*", end="")
      ```

      الناتج: `*****`

      لاحظ `end=""` - هذا يجعل النجوم تطبع في نفس السطر بدلاً من أسطر منفصلة!

  # Step 3: Fill - Create horizontal line
  - type: "fill"
    lang: "python"
    question: |
      اكتب كود لطباعة خط أفقي من 8 نجوم:
    code: |
      for @@INPUT@@ in range(@@INPUT@@):
          print("*", @@INPUT@@)
    solution:
      - "/^[a-zA-Z_][a-zA-Z0-9_]*$/"
      - "8"
      - "end=\"\""
    explanation: "نستخدم range(8) للحصول على 8 تكرارات، و end=\"\" لطباعة النجوم في نفس السطر."

  # Step 4: Vertical line pattern
  - type: "markdown"
    content: |
      الآن لنصنع **خط عمودي**:

      ```python
      for i in range(4):
          print("*")
      ```

      الناتج:
      ```
      *
      *
      *
      *
      ```

      هنا لا نحتاج `end=""` لأننا نريد كل نجمة في سطر منفصل.

  # Step 5: Fill - Vertical pattern with numbers
  - type: "fill"
    lang: "python"
    question: |
      اكتب كود لطباعة الأرقام من 1 إلى 6 عموديًا:
    code: |
      for @@INPUT@@ in range(1, @@INPUT@@):
          print(@@INPUT@@)
    solution:
      - "/^[a-zA-Z_][a-zA-Z0-9_]*$/"
      - "7"
      - "/^[a-zA-Z_][a-zA-Z0-9_]*$/"
    explanation: "نستخدم range(1, 7) للحصول على الأرقام من 1 إلى 6، ونطبع قيمة المتغير في كل دورة."

  # Step 6: Rectangle pattern
  - type: "markdown"
    content: |
      الآن شيء أكثر تعقيدًا: **مستطيل من النجوم**!

      ```python
      for i in range(3):
          for j in range(5):
              print("*", end="")
          print()  # سطر جديد بعد كل صف
      ```

      الناتج:
      ```
      *****
      *****
      *****
      ```

      هذا يُسمى **حلقة متداخلة** - حلقة داخل حلقة!

  # Step 7: Quiz - Understanding nested loops
  - type: "quiz"
    question: "كم نجمة سيطبع هذا الكود؟"
    code: |
      for i in range(2):
          for j in range(4):
              print("*", end="")
          print()
    options:
      - "6 نجوم"
      - "8 نجوم"
      - "4 نجوم"
      - "2 نجوم"
    solution: 1
    explanation: "الحلقة الخارجية تتكرر مرتين، والداخلية 4 مرات في كل دورة. إذن: 2 × 4 = 8 نجوم إجمالاً."

  # Step 8: Triangle pattern - increasing
  - type: "markdown"
    content: |
      الآن لنصنع **مثلث متزايد**:

      ```python
      for i in range(1, 5):
          for j in range(i):
              print("*", end="")
          print()
      ```

      الناتج:
      ```
      *
      **
      ***
      ****
      ```

      السر: في كل صف، نطبع عدد النجوم = رقم الصف!

  # Step 9: Fill - Complete the triangle
  - type: "fill"
    lang: "python"
    question: |
      أكمل الكود لإنشاء مثلث من 5 صفوف:
    code: |
      for i in range(@@INPUT@@, @@INPUT@@):
          for j in range(@@INPUT@@):
              print("*", end="")
          @@INPUT@@
    solution:
      - "1"
      - "6"
      - "i"
      - "print()"
    explanation: "نستخدم range(1, 6) للصفوف من 1 إلى 5، ونطبع i نجوم في كل صف، ثم ننتقل لسطر جديد."

  # Step 10: Number triangle
  - type: "markdown"
    content: |
      مثلث من **الأرقام** أجمل!

      ```python
      for i in range(1, 4):
          for j in range(1, i + 1):
              print(j, end="")
          print()
      ```

      الناتج:
      ```
      1
      12
      123
      ```

      هنا نطبع الرقم `j` بدلاً من النجوم.

  # Step 11: Bug finding - Triangle with error
  - type: "bug"
    lang: "python"
    question: "هذا الكود يجب أن ينشئ مثلث أرقام لكن به خطأ. أين المشكلة؟"
    code: |
      for i in range(1, 5):
          for j in range(1, i):
              print(j, end="")
          print()
    solution: 1
    explanation: "المشكلة في range(1, i) - يجب أن تكون range(1, i + 1) لتشمل الرقم i نفسه."
    hint: "انتبه لنهاية نطاق الحلقة الداخلية"

  # Step 12: Order exercise - Build countdown pattern
  - type: "order"
    lang: "python"
    question: "رتب الأسطر لإنشاء نمط عكسي (4321، 321، 21، 1):"
    code:
      - "for i in range(4, 0, -1):"
      - "    for j in range(i, 0, -1):"
      - "        print(j, end=\"\")"
      - "    print()"
    explanation: "نبدأ من 4 وننزل لـ 1، وفي كل صف نطبع من i إلى 1 تنازليًا."

  # Step 13: Complex pattern challenge
  - type: "fill"
    lang: "python"
    question: |
      تحدي متقدم! اكتب كود لإنشاء هذا النمط:
      ```
      1
      22
      333
      4444
      ```
    code: |
      for i in range(@@INPUT@@, @@INPUT@@):
          for j in range(@@INPUT@@):
              print(@@INPUT@@, end="")
          print()
    solution:
      - "1"
      - "5"
      - "i"
      - "i"
    explanation: "نطبع الرقم i في كل موضع، وعدد المرات = i أيضًا. لذلك الصف الثالث يطبع 3 ثلاث مرات."

  # Step 14: Diamond pattern introduction
  - type: "markdown"
    content: |
      **تحدي الخبراء**: نمط الماس! 💎

      ```python
      # الجزء العلوي
      for i in range(1, 4):
          for j in range(3 - i):
              print(" ", end="")
          for j in range(i):
              print("* ", end="")
          print()
      ```

      الناتج:
      ```
        * 
       * * 
      * * * 
      ```

      هذا يستخدم **مسافات فارغة** لإنشاء الشكل!

