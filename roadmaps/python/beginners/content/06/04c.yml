steps:
  - type: "markdown"
    content: |
      مرحباً بك في عالم الحلقات المتداخلة! 🎯

      تخيل أنك تريد طباعة جدول الضرب من 1 إلى 3:

      ```
      1 × 1 = 1    1 × 2 = 2    1 × 3 = 3
      2 × 1 = 2    2 × 2 = 4    2 × 3 = 6  
      3 × 1 = 3    3 × 2 = 6    3 × 3 = 9
      ```

      لإنشاء هذا الجدول، نحتاج إلى:
      - حلقة للأرقام الأولى (1، 2، 3)
      - **داخل كل مرة**: حلقة أخرى للأرقام الثانية (1، 2، 3)

      هذا ما نسميه **الحلقات المتداخلة**!

  - type: "markdown"
    content: |
      ## فكر في الأمر كصندوق داخل صندوق 📦

      تخيل أن لديك صندوق كبير يحتوي على 3 صناديق صغيرة.  
      كل صندوق صغير يحتوي على 3 كرات.

      **للوصول إلى كل كرة:**
      1. افتح الصندوق الكبير (الحلقة الخارجية)
      2. اختر صندوق صغير (المرة الأولى، الثانية، الثالثة...)
      3. افتح الصندوق الصغير (الحلقة الداخلية) 
      4. اختر كرة (الأولى، الثانية، الثالثة...)

      هذا بالضبط كيف تعمل الحلقات المتداخلة!

