  # Step 16: Temperature conversion practice
  - type: "fill"
    lang: "python"
    question: |
      اطبع درجات الحرارة من 0 إلى 100 فهرنهايت (بخطوات 20):
    code: |
      print("جدول تحويل الحرارة:")
      for f in range(@@INPUT@@, @@INPUT@@, @@INPUT@@):
          c = (f - 32) * 5/9
          print(f"{f}°F = {c:.1f}°C")
    solution:
      - "0"
      - "101"
      - "20"
    explanation: "من 0 إلى 100 بخطوات 20: 0, 20, 40, 60, 80, 100"

