title: "التحكم الكامل في range - البداية والنهاية والخطوة"
base_xp: 850
difficulty: "medium"

steps:
  # Step 1: Quick recap and motivation
  - type: "markdown"
    content: |
      في الدرس السابق، تعلمنا أساسيات `range()`. 
      
      لكن هل تعلم أن `range()` لديها قوى خفية؟ يمكنك التحكم في:
      - **من أين تبدأ** (ليس دائماً من 0!)
      - **أين تنتهي** 
      - **حجم القفزات** (يمكنك القفز 2، 3، أو حتى للخلف!)
      
      هذه القوى ستجعلك تكتب حلقات أكثر ذكاءً وقوة. دعنا نكتشفها!

  # Step 2: Start parameter introduction
  - type: "markdown"
    content: |
      ## المعامل الأول: نقطة البداية (start)
      
      حتى الآن، كنا نستخدم `range(5)` والذي يبدأ من 0 تلقائياً.
      
      لكن ماذا لو أردنا البدء من رقم آخر؟ نستخدم معاملين:
      ```python
      range(start, stop)
      ```
      
      **مثال:** `range(3, 8)` تعطينا: 3, 4, 5, 6, 7
      
      لاحظ: يبدأ من 3 (مُضمَّن) وينتهي قبل 8 (غير مُضمَّن)

  # Step 3: Practice start parameter
  - type: "fill"
    lang: "python"
    question: |
      أكمل الكود لطباعة الأرقام من 10 إلى 14:
    code: |
      for i in range(@@INPUT@@, @@INPUT@@):
          print(i)
    solution:
      - "10"
      - "15"
    explanation: "نبدأ من 10 (مُضمَّن) ونتوقف عند 15 (غير مُضمَّن)، فنحصل على: 10, 11, 12, 13, 14"

  # Step 4: Practice with different ranges
  - type: "fill"
    lang: "python"
    question: |
      اطبع أعمار الأطفال في الروضة (من 3 إلى 6 سنوات):
    code: |
      print("أعمار أطفال الروضة:")
      for age in range(@@INPUT@@, @@INPUT@@):
          print(f"عمر {age} سنوات")
    solution:
      - "3"
      - "7"
    explanation: "الأعمار من 3 إلى 6، لذا نحتاج range(3, 7)"

  # Step 5: Common mistake with range
  - type: "bug"
    lang: "python"
    question: "هذا الكود يجب أن يطبع الأرقام من 5 إلى 10. أين الخطأ؟"
    code: |
      print("الأرقام من 5 إلى 10:")
      for num in range(5, 10):
          print(num)
      print("انتهى!")
    solution: 1
    hint: "تذكر أن range تتوقف قبل الرقم النهائي"
    explanation: "range(5, 10) تعطي 5,6,7,8,9 فقط. نحتاج range(5, 11) للحصول على 10"

  # Step 6: Step parameter introduction
  - type: "markdown"
    content: |
      ## المعامل الثالث: حجم الخطوة (step)
      
      الآن للجزء المثير! يمكننا القفز بأكثر من 1:
      ```python
      range(start, stop, step)
      ```
      
      **أمثلة:**
      - `range(0, 10, 2)` → 0, 2, 4, 6, 8 (الأرقام الزوجية)
      - `range(1, 10, 2)` → 1, 3, 5, 7, 9 (الأرقام الفردية)
      - `range(0, 21, 5)` → 0, 5, 10, 15, 20 (مضاعفات الخمسة)

  # Step 7: Practice step parameter
  - type: "fill"
    lang: "python"
    question: |
      اطبع الأرقام الزوجية من 2 إلى 10:
    code: |
      for even in range(@@INPUT@@, @@INPUT@@, @@INPUT@@):
          print(even)
    solution:
      - "2"
      - "11"
      - "2"
    explanation: "نبدأ من 2، ننتهي عند 11، ونقفز خطوتين في كل مرة"

  # Step 8: Practice odd numbers
  - type: "fill"
    lang: "python"
    question: |
      اطبع الأرقام الفردية من 1 إلى 9:
    code: |
      print("الأرقام الفردية:")
      for odd in range(@@INPUT@@, @@INPUT@@, @@INPUT@@):
