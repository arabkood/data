      - "2"
    explanation: "نبدأ من 1 (فردي)، ونقفز خطوتين للحصول على: 1, 3, 5, 7, 9"

  # Step 9: Multiples practice
  - type: "fill"
    lang: "python"
    question: |
      اطبع جدول ضرب الـ 3 (من 3 إلى 30):
    code: |
      print("جدول ضرب 3:")
      for multiple in range(@@INPUT@@, @@INPUT@@, @@INPUT@@):
          print(f"3 × {multiple//3} = {multiple}")
    solution:
      - "3"
      - "31"
      - "3"
    explanation: "نبدأ من 3، نقفز 3 خطوات: 3, 6, 9, 12... حتى 30"

  # Step 10: Negative step introduction
  - type: "markdown"
    content: |
      ## العد التنازلي بخطوة سالبة!
      
      مفاجأة! يمكننا العد للخلف باستخدام خطوة سالبة:
      ```python
      range(10, 0, -1)  # من 10 إلى 1 (تنازلي)
      ```
      
      **مهم عند العد التنازلي:**
      - البداية يجب أن تكون أكبر من النهاية
      - الخطوة يجب أن تكون سالبة
      
      مثال: `range(5, -1, -1)` → 5, 4, 3, 2, 1, 0

  # Step 11: Practice countdown
  - type: "fill"
    lang: "python"
    question: |
      اكتب عد تنازلي من 10 إلى 1:
    code: |
      print("العد التنازلي يبدأ!")
      for count in range(@@INPUT@@, @@INPUT@@, @@INPUT@@):
          print(count)
      print("انطلق! 🚀")
    solution:
      - "10"
      - "0"
      - "-1"
    explanation: "نبدأ من 10، ننتهي عند 0 (غير مضمن)، نقفز -1 كل مرة"

