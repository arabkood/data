  # Step 16: Summary
  - type: "markdown"
    content: |
      **🎉 مبروك! تعلمت أساسيات حلقات for:**
      
      ✅ `for i in range(n)` - تكرار n مرة
      ✅ `range(start, stop)` - تحديد البداية والنهاية
      ✅ استخدام متغير الحلقة في الحسابات
      ✅ الحلقات توفر الوقت والجهد!
      
      **في الدرس القادم:** سنتعمق أكثر في `range()` ونتعلم الخطوة (step) والعد العكسي!
