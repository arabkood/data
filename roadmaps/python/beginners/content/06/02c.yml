  - type: "markdown"
    content: |
      # حالات استخدام عملية

      **متى نستخدم break:**
      - البحث عن عنصر معين
      - التوقف عند حدوث خطأ
      - الخروج من لعبة أو برنامج تفاعلي

      **متى نستخدم continue:**
      - تصفية البيانات
      - تخطي القيم غير صالحة
      - معالجة حالات خاصة

      **متى نستخدم pass:**
      - كتابة كود مؤقت
      - placeholder للكود المستقبلي
      - في الحالات التي لا نريد فعل شيء

