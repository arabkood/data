    hint: "ابحث عن السطر الذي يستخدم \\n"

  - type: "markdown"
    content: |
      ## متى نستخدم `end`؟

      **استخدم `end` عندما تريد:**

      ✅ طباعة عدة أجزاء في نفس السطر  
      ✅ بناء أشكال وأنماط نصية  
      ✅ إنشاء عدادات أو أشرطة تقدم  
      ✅ تجميع النصوص بفواصل مخصصة  

      **مثال من الحياة الواقعية:**
      ```python
      print("اسم المستخدم: ", end="")
      username = input()
      # المستخدم يكتب اسمه في نفس السطر!
      ```

  - type: "order"
    lang: "python"
    question: "رتب الأسطر لطباعة قائمة تسوق مرقمة في تنسيق جميل:"
    code:
      - 'print("قائمة التسوق:")'
      - 'print("1. ", end="")'
      - 'print("خبز")'
      - 'print("2. ", end="")'
      - 'print("حليب")'
      - 'print("3. ", end="")'
      - 'print("بيض")'
    explanation: "نطبع العنوان أولاً، ثم لكل عنصر نطبع الرقم بدون سطر جديد، ثم اسم العنصر مع السطر الجديد."

  - type: "markdown"
    content: |
      ## تحدي إضافي: الإبداع مع `end`

      جرب هذه الأفكار:

      ```python
      # إنشاء خط فاصل
      for i in range(10):
          print("-", end="")
      print()  # سطر جديد في النهاية

      # طباعة الوقت بتنسيق جميل
      hours = "14"
      minutes = "30"
      print("الوقت الآن: ", end="")
      print(hours, end=":")
      print(minutes)
      ```

      الآن أنت تعرف سر التحكم في نهايات `print()`! 🎉

