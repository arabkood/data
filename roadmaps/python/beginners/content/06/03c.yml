      ## دمج `end` مع الحلقات
      
      المعامل `end` قوي جداً عند استخدامه مع الحلقات:
      
      ```python
      for i in range(5):
          print("*", end=" ")
      # الناتج: * * * * *
      ```
      
      لاحظ كيف طبعنا 5 نجوم على نفس السطر!

