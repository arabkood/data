    content: |
      # مشكلة نحتاج لحلها

      تخيل أنك تريد رسم مربع من النجوم حجمه 3×3:

      ```
      * * *
      * * *
      * * *
      ```

      بالطريقة التي نعرفها، ستكتب:

      ```python
      print("* * *")
      print("* * *")
      print("* * *")
      ```

      لكن ماذا لو أردت مربعاً حجمه 10×10؟ أو حتى 100×100؟ هذا مستحيل!

      # media_idea: رسم يوضح مقارنة بين الطريقة اليدوية والطريقة الذكية لرسم المربعات

  - type: "markdown"
    content: |
      # الحل: الحلقات المتداخلة

      **الحلقة المتداخلة** هي حلقة داخل حلقة أخرى.

      فكر فيها مثل **ساعة**:
      - العقرب الكبير (الحلقة الخارجية) يدور دورة واحدة
      - العقرب الصغير (الحلقة الداخلية) يدور 60 مرة في كل دورة للكبير

      أو مثل **بناء عمارة**:
      - لكل طابق (الحلقة الخارجية)
      - تبني عدة شقق (الحلقة الداخلية)

  - type: "markdown"
    content: |
      # أولاً: تعلم شيئاً جديداً عن print()

      قبل أن نبدأ بالحلقات المتداخلة، نحتاج لتعلم حيلة جديدة!

      عادة `print()` ينتقل لسطر جديد بعد الطباعة:

      ```python
      print("مرحبا")
      print("كيف حالك")
      ```
      
      النتيجة:
      ```
      مرحبا
      كيف حالك
      ```

      لكن أحياناً نريد الطباعة على **نفس السطر**!

  - type: "markdown"
    content: |
      # معامل end في print()

      يمكننا التحكم في ما يحدث بعد الطباعة باستخدام `end`:

      ```python
      print("مرحبا", end=" ")
      print("كيف حالك")
      ```

      النتيجة:
      ```
      مرحبا كيف حالك
      ```

      **الشرح:**
      - `end=" "` يعني "ضع مسافة بدلاً من سطر جديد"
      - `end=""` يعني "لا تضع شيئاً"
      - `end="-"` يعني "ضع شرطة"

