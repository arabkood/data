  # Step 1: Quick introduction to end parameter
  - type: "markdown"
    content: |
      ## تحكم في نهاية السطر مع `end`
      
      حتى الآن، كل أمر `print()` كان ينتقل لسطر جديد تلقائياً. لكن ماذا لو أردنا طباعة عدة أشياء على نفس السطر؟
      
      المعامل `end` يتحكم في ما يحدث بعد الطباعة:
      ```python
      print("مرحبا", end=" ")  # مسافة بدلاً من سطر جديد
      print("بالعالم")         # الآن على نفس السطر!
      ```
      
      **الناتج:** `مرحبا بالعالم`

  # Step 2: First practice - basic end usage
  - type: "fill"
    lang: "python"
    question: |
      اجعل الأرقام تطبع على نفس السطر مع فاصلة بينهم:
    code: |
      print(1, @@INPUT@@)
      print(2, @@INPUT@@)
      print(3)
    solution:
      - 'end=", "'
      - 'end=", "'
    explanation: "استخدمنا end=', ' لإضافة فاصلة ومسافة بدلاً من سطر جديد"

