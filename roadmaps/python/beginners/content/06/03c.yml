item_type: "lesson"
title: "التحكم في نهاية النص - معامل end"

steps:
  - type: "markdown"
    content: |
      مرحباً بك! هل لاحظت شيئاً مثيراً للاهتمام عندما تستخدم `print()` عدة مرات؟
      
      دعنا نرى مثالاً:

      ```python
      print("مرحبا")
      print("كيف حالك؟")
      print("أتمنى لك يوماً سعيداً")
      ```

      النتيجة ستكون:
      ```
      مرحبا
      كيف حالك؟
      أتمنى لك يوماً سعيداً
      ```

      كل `print()` ينتقل إلى **سطر جديد** تلقائياً! لكن ماذا لو أردنا التحكم في هذا السلوك؟

  - type: "markdown"
    content: |
      ## المشكلة: عندما لا نريد أسطر جديدة

      تخيل أنك تريد طباعة عداد من 1 إلى 5، لكن في نفس السطر:

      ```python
      print("1")
      print("2") 
      print("3")
      print("4")
      print("5")
      ```

      هذا سيعطينا:
      ```
      1
      2
      3
      4
      5
      ```

      لكن ما نريده حقاً هو: `1 2 3 4 5` في سطر واحد!

  - type: "quiz"
    question: "لماذا تعتقد أن كل print() ينتقل إلى سطر جديد؟"
    options:
      - "لأن هذا هو السلوك الافتراضي لـ print()"
      - "لأنه خطأ في الكود"
      - "لأننا نسينا إضافة شيء ما"
    solution: 0
    explanation: "صحيح! print() يضيف تلقائياً رمز السطر الجديد '\\n' في نهاية كل نص."

  - type: "markdown"
    content: |
      ## الحل: معامل `end`

      السر يكمن في معامل خاص يسمى `end`. 

      **بشكل افتراضي:** `print("النص", end="\n")`

      رمز `\n` يعني "انتقل إلى سطر جديد". لكن يمكننا تغيير هذا!

      **لطباعة النص بدون انتقال إلى سطر جديد:**

      ```python
      print("مرحبا", end="")
      print("عالم")
      ```

      النتيجة: `مرحباعالم`

  - type: "fill"
    lang: "python"
    question: "اكمل الكود لطباعة الأرقام في نفس السطر مع مسافة بينها:"
    code: |
      print("1", @@INPUT@@)
      print("2", @@INPUT@@)
      print("3", @@INPUT@@)
      print("4", @@INPUT@@)
      print("5")
    solution:
      - 'end=" "'
      - 'end=" "'
      - 'end=" "'
      - 'end=" "'
    explanation: "نستخدم end=\" \" لإضافة مسافة بدلاً من السطر الجديد. آخر print() لا يحتاج end لأننا نريد الانتقال للسطر التالي في النهاية."

  - type: "markdown"
    content: |
      ## أمثلة متنوعة على استخدام `end`

      يمكنك وضع أي نص تريده في `end`:

      ```python
      # باستخدام النقطة
      print("أ", end=".")
      print("ب", end=".")
      print("ج")
      # النتيجة: أ.ب.ج

      # باستخدام السهم
      print("البداية", end=" -> ")
      print("الوسط", end=" -> ")
      print("النهاية")
      # النتيجة: البداية -> الوسط -> النهاية
      ```

