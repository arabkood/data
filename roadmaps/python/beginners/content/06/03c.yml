    explanation: "كل print() ينتهي بـ * بدلاً من السطر الجديد، باستثناء الأخير الذي يستخدم السطر الجديد الافتراضي."

  - type: "markdown"
    content: |
      ## تطبيق عملي: بناء شريط التحميل

      دعنا نبني شريط تحميل بسيط باستخدام `end`:

      ```python
      print("تحميل: ", end="")
      print("[", end="")
      print("=", end="")
      print("=", end="")
      print("=", end="")
      print("   ]")
      ```

      النتيجة: `تحميل: [===   ]`

      بدون `end`، كان سيظهر كل رمز في سطر منفصل!

