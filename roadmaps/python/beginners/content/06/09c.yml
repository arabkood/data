title: "لماذا نحتاج إلى القوائم؟"
base_xp: 600
difficulty: "easy"
premium_only: true

steps:
  - type: "markdown"
    content: |
      تهانينا! لقد أتقنت الحلقات التكرارية. الآن يمكنك تكرار أي شيء تريده.

      ولكن... هل لاحظت شيئاً؟ عندما نعمل مع البيانات، نحتاج دائماً إلى تخزين أكثر من قيمة واحدة.

      تخيل أنك تريد حفظ درجات 5 طلاب. كيف ستفعل ذلك الآن؟

  - type: "quiz"
    question: "إذا أردت حفظ درجات 5 طلاب، ماذا ستحتاج بالطريقة الحالية؟"
    options:
      - "5 متغيرات منفصلة (student1, student2, student3, student4, student5)"
      - "متغير واحد فقط"
      - "حلقة تكرارية واحدة"
    solution: 0
    explanation: "نعم! ستحتاج إلى 5 متغيرات منفصلة، وهذا مرهق جداً!"

  - type: "markdown"
    content: |
      بالضبط! ستكتب شيئاً مثل هذا:

      ```python
      student1 = 85
      student2 = 92
      student3 = 78
      student4 = 96
      student5 = 88
      ```

      الآن تخيل لو كان لديك 100 طالب... أو 1000 طالب! 😱

  - type: "fill"
    lang: "python"
    question: "كم متغيراً ستحتاج لحفظ درجات 50 طالباً؟"
    code: |
      # لحفظ درجات 50 طالباً، سأحتاج إلى:
      عدد_المتغيرات = @@INPUT@@
    solution:
      - "50"
    explanation: "50 متغيراً منفصلاً! هذا كثير جداً ومرهق."

  - type: "markdown"
    content: |
      المشكلة الأخرى: كيف ستطبع كل الدرجات؟

      ```python
      print(student1)
      print(student2)
      print(student3)
      print(student4)
      print(student5)
      ```

      أو كيف ستحسب المجموع؟

      ```python
      total = student1 + student2 + student3 + student4 + student5
      ```

      هذا طويل ومملّ! 😫

  - type: "quiz"
    question: "ما المشكلة الأساسية في استخدام متغيرات منفصلة للبيانات المتشابهة؟"
    options:
      - "لا يمكن استخدام الحلقات التكرارية معها بسهولة"
      - "تستهلك ذاكرة أكثر"
      - "صعبة الكتابة فقط"
    solution: 0
    explanation: "المشكلة الأساسية أننا لا نستطيع استخدام الحلقات التكرارية بفعالية مع متغيرات منفصلة!"

  - type: "markdown"
    content: |
      تخيل لو أنه يمكنك وضع كل البيانات المتشابهة في **مكان واحد**، مثل صندوق كبير به أقسام مرقمة:

      ```
      صندوق_الدرجات:
      [0] → 85
      [1] → 92  
      [2] → 78
      [3] → 96
      [4] → 88
      ```

      عندها يمكنك استخدام حلقة تكرارية واحدة للتعامل مع كل البيانات! 🎉

  - type: "fill"
    lang: "python"
    question: "إذا كانت البيانات في صندوق واحد، كيف ستطبعها جميعاً؟"
    code: |
      # لو كان لدينا صندوق بالدرجات
      # يمكننا طباعة كل البيانات بـ:
      for i in range(@@INPUT@@):
          print(درجة_رقم[i])
    solution:
      - "5"
    explanation: "حلقة واحدة بسيطة بدلاً من 5 أوامر print منفصلة!"

  - type: "markdown"
    content: |
      وهذا بالضبط ما تحققه **القوائم** (Lists) في Python! 

      القوائم تحل كل هذه المشاكل:
      ✅ تجمع البيانات المتشابهة في مكان واحد  
      ✅ تعمل بسلاسة مع الحلقات التكرارية  
      ✅ توفر عليك كتابة كود مكرر  
      ✅ تجعل الكود أقصر وأوضح  

      في الوحدة التالية، ستتعلم كيف تستخدم القوائم لتجعل البرمجة أسهل وأقوى بكثير! 🚀

  - type: "quiz"
    question: "بعد تعلم القوائم، ستتمكن من:"
    options:
      - "تخزين عشرات القيم في متغير واحد واستخدام الحلقات معها"
      - "كتابة كود أطول وأعقد"
      - "الاستغناء عن الحلقات التكرارية"
    solution: 0
    explanation: "القوائم + الحلقات = قوة برمجية هائلة! ستوفر عليك الكثير من الوقت والجهد."
