    solution:
      - "i"
      - "i"

  - type: "markdown"
    content: |
      # تخصيص range() أكثر

      يمكن لـ `range()` أن تأخذ أكثر من معامل واحد:

      **البداية والنهاية:**
      - `range(2, 6)` ينشئ: 2, 3, 4, 5
      - `range(1, 4)` ينشئ: 1, 2, 3

      **البداية والنهاية والخطوة:**
      - `range(0, 10, 2)` ينشئ: 0, 2, 4, 6, 8
      - `range(1, 8, 3)` ينشئ: 1, 4, 7

