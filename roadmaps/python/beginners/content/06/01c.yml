  - type: "markdown"
    content: |
      # لماذا نحتاج إلى الحلقات؟

      تخيل أنك تريد طباعة "مرحبا" خمس مرات. بالطريقة التي تعلمناها حتى الآن، ستكتب:

      ```python
      print("مرحبا")
      print("مرحبا") 
      print("مرحبا")
      print("مرحبا")
      print("مرحبا")
      ```

      هذا مرهق ومملل! والأسوأ من ذلك، ماذا لو أردت طباعتها 100 مرة؟ أو 1000 مرة؟

      # media_idea: رسم بياني يوضح مقارنة بين كتابة الكود يدوياً مقابل استخدام الحلقة

  - type: "markdown"
    content: |
      # الحل: حلقات For

      **الحلقة (Loop)** هي طريقة لتكرار تنفيذ مجموعة من التعليمات عدة مرات.

      فكر في الحلقة مثل **آلة تصوير المستندات**:
      - تضع المستند مرة واحدة
      - تخبرها كم نسخة تريد
      - تقوم هي بالباقي تلقائياً!

      في Python، نستخدم `for` لإنشاء الحلقات.

  - type: "markdown"
    content: |
      # أول حلقة لك

      إليك كيفية كتابة حلقة تطبع "مرحبا" خمس مرات:

      ```python
      for i in range(5):
          print("مرحبا")
      ```

      دعني أفسر لك كل جزء:
      - `for`: كلمة مفتاحية تخبر Python أننا نريد حلقة
      - `i`: متغير مؤقت (يمكن أن نسميه أي شيء)
      - `range(5)`: دالة تنشئ الأرقام من 0 إلى 4
      - `:`: نهاية سطر الحلقة
      - `print("مرحبا")`: الكود الذي سيتكرر

