    solution: 0
    explanation: "range(4) ينشئ الأرقام من 0 إلى 3 (أي 4 أرقام إجمالاً)"

  - type: "markdown"
    content: |
      # استخدام المتغير i

      المتغير `i` يحتوي على القيمة الحالية في كل دورة من الحلقة.

      ```python
      for i in range(3):
          print("الدورة رقم:", i)
      ```

      سيطبع:
      ```
      الدورة رقم: 0
      الدورة رقم: 1
      الدورة رقم: 2
      ```

