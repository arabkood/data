item_id: "m6-intro-for-loops-range"
item_type: "lesson"
title: "مقدمة إلى حلقات For والدالة Range"

steps:
  - type: "markdown"
    content: |
      تخيل أنك تريد طباعة الأرقام من 1 إلى 100. هل ستكتب `print()` مئة مرة؟

      ```python
      print(1)
      print(2)
      print(3)
      # ... و 97 سطر آخر؟!
      ```

      هذا سيكون مرهقاً جداً! لحسن الحظ، لدينا **حلقات For** لحل هذه المشكلة بالضبط.

  - type: "markdown"
    content: |
      **حلقة For** هي مثل إعطاء تعليمات للكمبيوتر: "كرر هذا العمل عدد معين من المرات".

      فكر فيها كما لو كنت تقول لصديق: "اكتب اسمك 5 مرات على الورقة". سيفعل ذلك تلقائياً دون أن تطلب منه في كل مرة.

      الآن دعنا نتعلم كيف نكتب حلقة For بسيطة!

  - type: "markdown"
    content: |
      إليك أبسط حلقة for في Python:

      ```python
      for i in range(3):
          print("مرحبا!")
      ```

      دعني أفسر لك ما يحدث هنا:
      - `for i in range(3):` تعني "كرر 3 مرات"
      - `print("مرحبا!")` هو العمل الذي سيتكرر
      - `i` هو متغير العد (سنفهمه أكثر قريباً)

  - type: "fill"
    lang: "python"
    question: "أكمل الكود لطباعة 'أهلاً وسهلاً' 5 مرات:"
    code: |
      for i in @@INPUT@@:
          @@INPUT@@
    solution:
      - "range(5)"
      - 'print("أهلاً وسهلاً")'
    explanation: "نستخدم range(5) للتكرار 5 مرات، وprint() لطباعة النص المطلوب."

  - type: "markdown"
    content: |
      ممتاز! الآن دعنا نفهم متغير العد `i` أكثر.

      في كل دورة من الحلقة، يأخذ `i` قيمة مختلفة:
      - الدورة الأولى: `i = 0`
      - الدورة الثانية: `i = 1` 
      - الدورة الثالثة: `i = 2`

      **ملاحظة مهمة**: range(3) يعطينا الأرقام 0, 1, 2 (وليس 1, 2, 3)!

  - type: "quiz"
    question: "إذا كتبنا `for i in range(4):` فما هي قيم i في كل دورة؟"
    options:
      - "1, 2, 3, 4"
      - "0, 1, 2, 3"
      - "4, 3, 2, 1"
    solution: 1
    explanation: "range(4) يبدأ من 0 وينتهي عند 3، لذلك القيم هي: 0, 1, 2, 3"

  - type: "fill"
    lang: "python"
    question: "اكتب حلقة تطبع قيمة i في كل دورة لـ 4 مرات:"
    code: |
      for @@INPUT@@ in range(@@INPUT@@):
          print(@@INPUT@@)
    solution:
      - "i"
      - "4"
      - "i"
    explanation: "المتغير i يأخذ قيماً من 0 إلى 3، وسنطبع قيمته في كل دورة."

  - type: "markdown"
    content: |
      رائع! الآن دعنا نجرب شيئاً أكثر إفادة.

      يمكننا استخدام قيمة `i` لإنشاء أنماط مختلفة:

      ```python
      for i in range(3):
          print(f"هذه هي الدورة رقم {i}")
      ```

      سيطبع:
      ```
      هذه هي الدورة رقم 0
      هذه هي الدورة رقم 1  
      هذه هي الدورة رقم 2
      ```

  - type: "fill"
    lang: "python"
    question: "أكمل الكود ليطبع 'المحاولة رقم X' لـ 5 محاولات:"
    code: |
      for i in range(@@INPUT@@):
          print(f"@@INPUT@@")
    solution:
      - "5"
      - "المحاولة رقم {i}"
    explanation: "نستخدم f-string لدمج قيمة i مع النص، وrange(5) للحصول على 5 دورات."

  - type: "bug"
    lang: "python"
    question: "ابحث عن الخطأ في هذا الكود:"
    code: |
      for i in range(3)
          print(f"العدد هو {i}")
    solution: 0
    explanation: "نسيان النقطتين (:) في نهاية سطر for. يجب أن يكون: for i in range(3):"
    hint: "تحقق من نهاية السطر الأول"

  - type: "order"
    lang: "python" 
    question: "رتب هذه الأسطر لإنشاء حلقة تطبع الأرقام من 0 إلى 2:"
    code:
      - "for i in range(3):"
      - "    print(i)"
    explanation: "أولاً نكتب حلقة for، ثم نطبع قيمة i مع المسافة البادئة."

  - type: "markdown"
    content: |
      ممتاز! لقد تعلمت الأساسيات:

      - **حلقة for** تكرر كوداً معين عدد محدد من المرات
      - **range(n)** يعطي الأرقام من 0 إلى n-1  
      - **متغير العد i** يأخذ قيمة مختلفة في كل دورة
      - **النقطتان (:)** ضروريتان بعد for
      - **المسافة البادئة** ضرورية للكود داخل الحلقة

      في الدرس القادم، سنتعلم كيف نتحكم أكثر في range() لبدء العد من أرقام مختلفة!
