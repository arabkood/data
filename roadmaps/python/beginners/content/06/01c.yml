  - type: "markdown"
    content: |
      # فهم range() بشكل أعمق

      `range()` هي دالة خاصة تنشئ سلسلة من الأرقام.

      - `range(5)` ينشئ: 0, 1, 2, 3, 4
      - `range(3)` ينشئ: 0, 1, 2
      - `range(1)` ينشئ: 0

      **لاحظ:** range() تبدأ من 0 وتنتهي **قبل** الرقم المحدد بواحد.

      # media_idea: رسم توضيحي لكيفية عمل range() مع أمثلة مختلفة

