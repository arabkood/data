type: "bug"
lang: "python"
question: "نحن نختبر لعبتنا ونريد تخطي رسالة المقدمة في الوقت الحالي. أي سطر يجب عليك 'تعطيله بالتعليق' لإيقافه؟"
code: |
  # تسلسل بدء اللعبة
  print("أهلاً بك في عرين التنين!")
  print("مغامرتك تبدأ الآن...")
solution: 1
explanation: "بإضافة `#` في بداية ذلك السطر (`# print(\"أهلاً بك...\")`)، فإنك تخبر بايثون بتخطيه. هذه طريقة سريعة لاختبار أجزاء مختلفة من برنامجك."
