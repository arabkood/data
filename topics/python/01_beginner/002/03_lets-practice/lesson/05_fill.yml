question: "أنشئ `متغيرًا` باسم `border` عن طريق تكرار الحرف `=` عشرين مرة. يجب عليك استخدام `*`."
code: |
  border = "=" @@INPUT@@
  print(border)
solution:
  - |
    /^\s*\*\s*20\s*$/
explanation: "استخدام `\"=\" * 20` يخبر بايثون بإنشاء `نص` جديد يحتوي على 20 علامة يساوي. هذا أسهل بكثير من كتابتها كلها يدويًا!"
