type: "quiz"
question: "ماذا سيكون ناتج هذا الكود؟"
code: |
  print("نا" * 8 + " باتمان!")
lang: "python"
options:
  - "خطأ"
  - "نانانانانانانانا باتمان!"
  - "نا8 باتمان!"
  - "8نا باتمان!"
solution: 1
explanation: "بايثون تتعامل أولاً مع عملية الضرب (`\"نا\" * 8`)، لتنشئ `\"نانانانانانانانا\"`، ثم تتعامل مع عملية الجمع (`+ \" باتمان!\"`)، لدمج النصين."
