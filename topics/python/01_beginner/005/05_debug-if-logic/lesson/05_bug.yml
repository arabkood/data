type: "bug"
lang: "python"
question: "للتخرج، يجب أن يحصل الطالب على 80 نقطة أو أكثر. الكود الحالي لا يعتبر الطالب الذي حصل على 80 نقطة بالضبط ناجحاً. حدد السطر الذي به الخطأ."
code: |
  credits = 80

  if credits > 80:
    print("مؤهل للتخرج!")
  else:
    print("غير مؤهل بعد.")
solution: 2
expectedOutput: "مؤهل للتخرج!"
actualOutput: "غير مؤهل بعد."
explanation: "الشرط `credits > 80` لا يشمل قيمة 80 نفسها. يجب أن يكون `credits >= 80` ليشمل الطلاب الذين حصلوا على 80 نقطة بالضبط."
