type: "fill"
lang: "python"
question: |
  الكود أدناه لا يعمل بشكل صحيح. لاكتشاف المشكلة، أضف عبارات `print()` للتحقق من قيم `score_text` و `score_number` **مباشرة بعد تحويل النوع**.
code: |
  score_text = " 95 "

  score_number = int(score_text)
  @@INPUT@@
  @@INPUT@@

  if score_number >= 90:
    print("ممتاز!")
  else:
    print("جيد.")
solution:
  - |
    /print\s*\([^)]*(?:score_text|score_number)[^)]*\)/i
  - |
    /print\s*\([^)]*(?:score_text|score_number)[^)]*\)/i
explanation: |
  عند إضافة `print()`، ستكتشف أن `score_text` يحتوي على مسافات، وهذا ما يسبب خطأ عند محاولة تحويله إلى `int()`. هذا يوضح كيف أن `print()` تساعدك في "رؤية" المشكلة. (في الواقع، الكود سيتوقف مع `ValueError`. هذه مقدمة جيدة لهذا المفهوم!)
