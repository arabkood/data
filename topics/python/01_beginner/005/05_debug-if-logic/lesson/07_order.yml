type: "order"
lang: "python"
question: "رتب الكتل البرمجية التالية لإنشاء منطق شحن صحيح يحدد طريقة الشحن حسب الوزن. يجب أن تبدأ بالمتغيرات، ثم ترتب الشروط من الأثقل إلى الأخف."
code:
  - |
    weight = 25
    shipping_method = ""
  - |
    if weight > 50:
        shipping_method = "الشحن الخاص للبضائع"
  - |
    elif weight > 20:
        shipping_method = "الشحن الثقيل"
  - |
    elif weight > 1:
        shipping_method = "الشحن العادي"
  - |
    else:
        shipping_method = "شحن الرسائل"

explanation: "يجب عليك دائماً التحقق من الحالة الأكثر تحديداً (الأثقل) أولاً. عندما يكون الوزن 25، فإن الشرط الأول `weight > 1` يكون صحيحاً، فيتم تعيين 'الشحن العادي' ويتوقف التنفيذ، وهذا خطأ. الترتيب الصحيح هو من الأثقل إلى الأخف: أولاً التحقق من > 50، ثم > 20، ثم > 1، وأخيراً الحالة الافتراضية."
