type: "quiz"
lang: "python"
question: "ما الذي سيتم طباعته على الشاشة عند تشغيل هذا الكود؟"
code: |
  score = 85

  if score >= 90:
    print("التقدير: A")
  elif score >= 80:
    print("التقدير: B")
  elif score >= 70:
    print("التقدير: C")
  else:
    print("التقدير: F")
options:
  - "التقدير: B"
  - "التقدير: B و التقدير: C"
  - "التقدير: A"
  - "لن يتم طباعة أي شيء"
solution: 0
explanation: |
  الشرط الأول `score >= 90` (85 >= 90) خاطئ.
  ينتقل بايثون إلى الشرط الثاني `score >= 80` (85 >= 80) وهو صحيح.
  لذلك، يطبع "التقدير: B" ثم يتجاهل بقية عبارات `elif` و `else` فوراً.
