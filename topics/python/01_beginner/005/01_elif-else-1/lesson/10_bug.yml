type: "bug"
lang: "python"
question: |
  الترتيب مهم جداً! هذا الكود يحتوي على خطأ منطقي. حتى لو أنفقت 150، سيمنحك خصماً بنسبة 10% فقط.

  حدد السطر الذي يسبب المشكلة.
code: |
  total_spent = 150
  discount = 0

  if total_spent > 50:
    discount = 10
  elif total_spent > 100:
    discount = 20
  else:
    discount = 0

  print(f"خصمك هو {discount}%")
solution: 2
expectedOutput: "خصمك هو 20%"
actualOutput: "خصمك هو 10%"
explanation: |
  المشكلة في الترتيب. بما أن 150 أكبر من 50، فإن الشرط الأول في السطر 3 يكون صحيحاً. يقوم الكود بتعيين الخصم إلى 10 ثم يتجاهل بقية السلسلة، بما في ذلك شرط `elif` الذي يتحقق من `> 100`.

  **الحل الصحيح:** يجب دائماً ترتيب الشروط من الأكثر تحديداً (الأكبر) إلى الأقل تحديداً (الأصغر).
