type: "bug"
lang: "python"
question: |
  هناك خطأ منطقي في كود حساب تكلفة الشحن هذا.
  **المتطلبات:** الأعضاء المميزون (Premium) يحصلون دائماً على شحن مجاني (`shipping_cost = 0`).

  الكود الحالي يفرض عليهم رسوماً بقيمة 5 إذا كانت قيمة طلبهم أقل من 50. حدد السطر الذي يحتوي على الخطأ.
code: "is_premium_member = True\ncart_total = 40\nshipping_cost = 0\n\nif is_premium_member:\n    if cart_total > 50:\n        shipping_cost = 0\n    else:\n        shipping_cost = 5 # This is the bug\nelse:\n    if cart_total > 50:\n        shipping_cost = 10\n    else:\n        shipping_cost = 15\n        \nprint(f\"تكلفة الشحن: {shipping_cost}\")\n"
solution: 8
expectedOutput: "تكلفة الشحن: 0"
actualOutput: "تكلفة الشحن: 5"
explanation: |
  الخطأ يكمن في فرض رسوم على الأعضاء المميزين. وفقاً للمتطلبات، يجب أن يكون الشحن مجانياً لهم بغض النظر عن قيمة السلة. الحل الصحيح هو إما إزالة الشرط الداخلي بالكامل لهم، أو جعل كلا الحالتين `shipping_cost = 0`. السطر 9 يخالف هذه القاعدة.
