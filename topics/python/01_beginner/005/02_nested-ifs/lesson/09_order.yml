question: "أنت تبرمج نظام صراف آلي (ATM). لسحب النقود، يجب أن يكون الرقم السري صحيحاً، وبعد ذلك، يجب أن يكون الرصيد كافياً. رتب الكود التالي."
code:
  - |
    pin_is_correct = True
    balance = 500
    withdrawal_amount = 200
  - "if pin_is_correct:"
  - "    if balance >= withdrawal_amount:"
  - "        print('تمت العملية بنجاح. اسحب نقودك.')"
  - "    else:"
  - "        print('عذراً، رصيدك غير كافٍ.')"
  - "else:"
  - "    print('الرقم السري غير صحيح.')"
explanation: |
  يجب أن يتبع المنطق تسلسلًا أمنيًا صارمًا. أولاً، نتحقق من الشرط الأهم: هل الرقم السري صحيح؟ فقط إذا نجح هذا التحقق، ننتقل إلى التحقق المتداخل: هل الرصيد كافٍ؟ كل جملة `else` تتعامل مع الحالة الفاشلة لجملة `if` المقابلة لها. المسافات البادئة هي التي تخبر بايثون أي كود يتبع أي قرار.
