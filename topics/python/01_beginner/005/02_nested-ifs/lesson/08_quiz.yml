type: "quiz"
lang: "python"
question: "ماذا سيطبع هذا الكود؟"
code: |
  is_logged_in = True
  is_admin = False
  access_level = 3

  if is_logged_in:
    print("المستخدم مسجل دخوله.")
    if is_admin:
      print("مرحباً أيها المدير.")
    else:
      print("مرحباً أيها المستخدم.")
      if access_level > 2:
        print("لديك صلاحيات متقدمة.")
  else:
    print("يرجى تسجيل الدخول.")
options:
  - "المستخدم مسجل دخوله."
  - "المستخدم مسجل دخوله.\nمرحباً أيها المستخدم."
  - "المستخدم مسجل دخوله.\nمرحباً أيها المستخدم.\nلديك صلاحيات متقدمة."
  - "لن يطبع أي شيء."
solution: 2
explanation: |
  1. `is_logged_in` صحيحة، لذا يطبع "المستخدم مسجل دخوله." ويدخل للكتلة الداخلية.
  2. `is_admin` خاطئة، لذا يتجاهل `if` الداخلية وينتقل إلى `else` الخاصة بها، ويطبع "مرحباً أيها المستخدم.".
  3. داخل هذه الـ `else`، يوجد شرط متداخل آخر. `access_level > 2` (3 > 2) صحيحة، لذا يطبع "لديك صلاحيات متقدمة.".
