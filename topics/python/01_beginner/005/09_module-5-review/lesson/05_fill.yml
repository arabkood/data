lang: "python"
question: "أكمل هذا الكود الذي يحدد ما إذا كان اليوم مناسباً للخروج. يجب أن يكون الطقس صافياً، ودرجة الحرارة بين 15 و 30."
code: |
  weather = "صافي"
  temperature = 22

  if weather == "صافي":
    @@INPUT@@ temperature > 15 and temperature < 30:
      print("إنه يوم مثالي للخروج!")
    @@INPUT@@:
      print("الطقس جيد، لكن درجة الحرارة غير مناسبة.")
  else:
    print("من الأفضل البقاء في الداخل اليوم.")
solution:
  - "if"
  - "else"
explanation: "نستخدم `if` متداخلة للتحقق من درجة الحرارة فقط بعد التأكد من أن الطقس صافٍ. `else` الداخلية تتعامل مع الحالة التي يكون فيها الطقس صافياً ولكن درجة الحرارة إما شديدة البرودة أو شديدة الحرارة."
