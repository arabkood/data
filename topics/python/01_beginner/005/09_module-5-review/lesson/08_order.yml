type: "order"
lang: "python"
question: "أنت تبني نظام تحقق بسيط. اطلب من المستخدم إدخال كلمة مرور. إذا كانت 'Python123'، اطبع 'تم الدخول'. وإلا، اطبع 'كلمة المرور خاطئة'. رتب الأسطر التالية."
code:
  - 'password_input = input("ادخل كلمة المرور: ")'
  - 'if password_input == "Python123":'
  - '    print("تم الدخول")'
  - 'else:'
  - '    print("كلمة المرور خاطئة")'
explanation: "التسلسل القياسي: احصل على المدخلات أولاً، ثم استخدم `if` للتحقق من قيمتها، ثم استخدم `else` للتعامل مع جميع الحالات الأخرى."
