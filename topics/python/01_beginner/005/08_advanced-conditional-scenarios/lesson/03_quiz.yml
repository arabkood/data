type: "quiz"
lang: "python"
question: "هذا الكود يبدو أنه سيسبب خطأ قسمة على صفر (`ZeroDivisionError`). لماذا يعمل بأمان دون أن يتوقف؟"
code: "x = 0\nresult = \"\"\n\nif x != 0 and 10 / x > 2:\n  result = \"النتيجة أكبر من 2\"\nelse:\n  result = \"لا يمكن الحساب\"\n  \nprint(result)\n"
options:
  - "لأن بايثون تتجاهل الأخطاء داخل جمل if."
  - "بسبب خاصية الدائرة القصيرة: بما أن `x != 0` خاطئة، فإن بايثون لا تقوم أبداً بتقييم `10 / x > 2`."
  - "هذا الكود سيتوقف مع خطأ، السؤال خاطئ."
  - "لأن `print` تصلح الخطأ."
solution: 1
explanation: "هذا هو مثال قوي على فائدة الدائرة القصيرة. بما أن الشرط الأول `x != 0` هو `False`، فإن `and` تجعل بايثون تتجاهل الشرط الثاني تماماً، مما يمنع حدوث خطأ القسمة على صفر."
