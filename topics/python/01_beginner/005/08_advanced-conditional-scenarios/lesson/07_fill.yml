question: "أكمل الكود باستخدام العامل الثلاثي. يجب أن يعطي المتغير `result` القيمة 'ناجح' إذا كان `score` أكبر من أو يساوي 50، و 'راسب' خلاف ذلك:"
code: |
  score = 75
  result = "ناجح" @@INPUT@@ score >= 50 @@INPUT@@ "راسب"
  print(result)
solution:
  - "if"
  - "else"
explanation: "العامل الثلاثي في Python يستخدم الصيغة: القيمة_الأولى if الشرط else القيمة_الثانية. الكلمة `if` تأتي بعد القيمة الأولى، و `else` تأتي قبل القيمة الثانية."
