question: |
  **الهدف:** السماح بالدخول إذا كان الشخص موظفاً ولديه بطاقة دخول، **أو** إذا كان ضيفاً مع مرافق.
  
  الكود الحالي يرفض دخول الموظف الذي لديه بطاقة بسبب خطأ في المنطق المنطقي. حدد السطر الذي يحتاج إلى تصحيح.
code: |
  is_employee = True
  has_badge = True
  is_guest_with_escort = False
  can_enter = False
  if is_employee and has_badge and is_guest_with_escort:
      can_enter = True
  print(can_enter)
solution: 4
expectedOutput: "True"
actualOutput: "False"
hint: "المنطق الحالي يستخدم AND بين جميع الشروط. ما هو العامل المنطقي الذي يجب استخدامه بين مجموعتي الشروط؟"
explanation: "المشكلة في استخدام `and` بين جميع الشروط. المطلوب: `(is_employee and has_badge) or is_guest_with_escort` - أي موظف مع بطاقة أو ضيف مع مرافق."
