lang: "python"
question: "لديك متغير `score`. استخدم العامل الثلاثي لتعيين قيمة المتغير `result` إلى 'ناجح' إذا كان `score` أكبر من أو يساوي 50، و 'راسب' خلاف ذلك. رتب الأجزاء التالية."
code:
  - 'result = "ناجح"'
  - "if score >= 50"
  - 'else "راسب"'
explanation: "الصيغة دائماً هي القيمة_الصحيحة ثم `if` ثم الشرط ثم `else` ثم القيمة_الخاطئة."
