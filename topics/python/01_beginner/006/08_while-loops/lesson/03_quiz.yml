type: "quiz"
question: "متى نستخدم حلقة while بدلاً من for؟"
options:
  - "عندما نريد تكرار كود 10 مرات بالضبط"
  - "عندما نريد المرور عبر قائمة معروفة"
  - "عندما لا نعرف كم مرة سنحتاج للتكرار مسبقاً"
  - "عندما نريد طباعة الأرقام من 1 إلى 100"
solution: 2
explanation: "while مفيدة عندما نريد الاستمرار حتى يتحقق شرط معين، دون معرفة عدد التكرارات مسبقاً."
