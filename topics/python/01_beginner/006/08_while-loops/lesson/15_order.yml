question: "رتب هذا الكود لحساب العد التنازلي:"
code:
  - "start = int(input('ادخل رقم البداية: '))"
  - "current = start"
  - |
    while current >= 0:
        print(f"العد التنازلي: {current}")
        current -= 1
  - "print('انطلق! \U0001F680')"
explanation: "نأخذ رقم البداية، نضعه في current، نعد تنازلياً حتى الصفر، ثم نطبع رسالة الإنطلاق."
