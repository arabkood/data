type: "quiz"
question: "إذا كان لدينا حلقة خارجية تتكرر 3 مرات وحلقة داخلية تتكرر 4 مرات، كم مرة ستتم طباعة print() الموجودة داخل الحلقة الداخلية؟"
options:
  - "7 مرات (3 + 4)"
  - "12 مرة (3 × 4)"
  - "4 مرات فقط"
solution: 1
explanation: "الحلقة الداخلية تتكرر 4 مرات لكل مرة من الحلقة الخارجية. إذن: 3 × 4 = 12 مرة إجمالاً."
