question: |
  أكمل الكود التالي لطباعة هرم من الأرقام بحيث يحتوي الصف الأول على الرقم 1، والصف الثاني على الأرقام 1 و 2، والصف الثالث على الأرقام 1 و 2 و 3، وهكذا حتى 4 صفوف:
  
  **المخرجات المطلوبة:**
  ```
  1
  12
  123
  1234
  ```
code: |
  for i in range(1, @@INPUT@@):
      for j in range(1, @@INPUT@@):
          print(j, end="")
      @@INPUT@@
solution:
  - "5"
  - "i + 1"
  - "print()"
explanation: "نريد 4 صفوف (1 إلى 4)، لذلك range(1, 5). في كل صف i، نطبع الأرقام من 1 إلى i، لذلك range(1, i + 1)."
