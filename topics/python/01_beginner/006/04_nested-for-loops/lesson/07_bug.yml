question: "هذا الكود يجب أن يطبع مربع 3×3 من النجوم، لكن هناك خطأ. أين هو؟"
code: |
  for i in range(3):
      for j in range(3):
          print("*", end="")
  print()
solution: 3
explanation: "print() الموجود خارج الحلقات سيطبع سطر جديد واحد فقط في النهاية، مما يجعل كل النجوم في سطر واحد. يجب وضع print() داخل الحلقة الخارجية."
hint: "أين يجب أن نضع السطر الجديد؟ بعد كل صف أم في نهاية كل شيء؟"
