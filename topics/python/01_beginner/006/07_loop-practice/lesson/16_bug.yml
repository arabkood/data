lang: "python"
question: "اعثر على الخطأ في كود حساب أرباح التجارة:"
code: |
  capital = 1000
  print("نمو رأس المال مع الأرباح:")
  for year in range(2020, 2025):
      profit = capital * 0.2
      capital = profit
      print(f"السنة {year}: {capital} ريال")
solution: 4
explanation: "الخطأ أن الكود يستبدل رأس المال بالأرباح فقط (`capital = profit`). الصحيح أن نضيف الربح إلى رأس المال: `capital += profit`."
