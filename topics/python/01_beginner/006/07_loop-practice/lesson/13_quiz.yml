type: "quiz"
question: "ما معنى العبارة total_hours += daily_hours؟"
options:
  - "total_hours = daily_hours"
  - "total_hours = total_hours + daily_hours"
  - "daily_hours = total_hours + daily_hours"
solution: 1
explanation: "الرمز += هو اختصار لإضافة القيمة إلى المتغير. فهو مساوي لكتابة total_hours = total_hours + daily_hours"
