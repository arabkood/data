type: "order"
lang: "python"
question: "رتب هذا الكود لإنشاء قاموس يحسب تكرار كل حرف في نص:"
code:
  - 'text = "مرحبا بالعالم"'
  - "letter_count = {}"
  - |
    for letter in text:
        if letter != " ":
            if letter in letter_count:
                letter_count[letter] += 1
            else:
                letter_count[letter] = 1
  - "print(letter_count)"
explanation: "نعرف النص، ننشئ قاموس فارغ، نمر عبر كل حرف ونحسب تكراره، ثم نطبع النتيجة."
