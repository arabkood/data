type: "quiz"
question: "أي نوع من الحلقات تستخدم عندما تريد تكرار عملية 'حتى يدخل المستخدم كلمة خروج'؟"
options:
  - "for مع range"
  - "while مع شرط"
  - "for مع قائمة"
  - "حلقة متداخلة"
solution: 1
explanation: "while مناسبة عندما لا نعرف عدد التكرارات مسبقاً ونريد الاستمرار حتى يتحقق شرط معين."
