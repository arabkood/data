type: "quiz"
question: "ما الذي يحدث في هذا الكود؟"
code: |
  x = 1
  while x <= 4:
      print(x)
      x *= 2
lang: python
options:
  - "يطبع: 1, 2, 3, 4"
  - "يطبع: 1, 2, 4"
  - "يطبع: 1, 2, 4, 8"
  - "حلقة لا نهائية"
solution: 1
explanation: "x يبدأ بـ 1، يطبع 1 ويصبح 2، يطبع 2 ويصبح 4، يطبع 4 ويصبح 8، ثم يتوقف لأن 8 > 4."
