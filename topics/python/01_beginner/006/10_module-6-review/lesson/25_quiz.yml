type: "quiz"
question: "أي من هذه الأكواد يحسب عدد الكلمات في جملة بشكل صحيح؟"
code: "sentence = \"مرحبا بك في عالم البرمجة\"\n\n# الخيار A\nword_count = 0\nfor char in sentence:\n    if char == \" \":\n        word_count += 1\n\n# الخيار B  \nwords = sentence.split(\" \")\nword_count = len(words)\n\n# الخيار C\nword_count = 1\nfor char in sentence:\n    if char == \" \":\n        word_count += 1\n\n# الخيار D\nword_count = sentence.count(\" \")\n"
lang: python
options:
  - "الخيار A فقط"
  - "الخيار B فقط"
  - "الخيارين B و C"
  - "جميع الخيارات صحيحة"
solution: 2
explanation: "الخيار B يقسم الجملة إلى كلمات ويحسب العدد. الخيار C يبدأ من 1 ويضيف عدد المسافات. A و D يحسبان المسافات فقط وليس الكلمات."
