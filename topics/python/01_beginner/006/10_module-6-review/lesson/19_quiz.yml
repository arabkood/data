type: "quiz"
question: "في كود لعبة التخمين، لماذا نستخدم حلقة while داخلية للحصول على المدخل؟"
options:
  - "لتوفير الذاكرة"
  - "للتأكد من صحة المدخل قبل المتابعة"
  - "لتسريع البرنامج"
  - "للزينة فقط"
solution: 1
explanation: "الحلقة الداخلية تضمن حصولنا على مدخل صحيح (رقم من 1-100) قبل المتابعة للمقارنة."
