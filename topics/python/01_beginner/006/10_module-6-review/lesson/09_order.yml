type: "order"
lang: "python"
question: "رتب هذا الكود لحساب متوسط الأرقام الموجبة فقط:"
code:
  - "numbers = [3, -2, 7, -1, 12, 0, 8]"
  - "total = 0"
  - "count = 0"
  - |
    for num in numbers:
        if num > 0:
            total += num
            count += 1
  - |
    if count > 0:
        average = total / count
        print(f"متوسط الأرقام الموجبة: {average:.1f}")
explanation: "نعرف القائمة، ننشئ متغيرات التتبع، نجمع الأرقام الموجبة فقط، ثم نحسب المتوسط."
