type: "quiz"
question: "ما أفضل طريقة لإصلاح حلقة لا تعمل كما متوقع؟"
options:
  - "إعادة كتابة الكود من الصفر"
  - "إضافة رسائل print() لتتبع المتغيرات"
  - "السؤال في منتدى برمجة"
  - "تجاهل المشكلة والمتابعة"
solution: 1
explanation: "أفضل طريقة هي إضافة print() لتتبع قيم المتغيرات وفهم سبب عدم عمل الكود كما متوقع."
