type: "quiz"
question: "كم عدد الأرقام الموجبة في هذه القائمة؟"
code: |
  numbers = [5, -3, 8, -1, 0, 12, -7]
  positive_count = 0

  for num in numbers:
      if num > 0:
          positive_count += 1

  print(positive_count)
lang: python
options:
  - "2"
  - "3"
  - "4"
  - "5"
solution: 1
explanation: "الأرقام الموجبة في القائمة هي: 5، 8، و 12. إذن العدد هو 3."
