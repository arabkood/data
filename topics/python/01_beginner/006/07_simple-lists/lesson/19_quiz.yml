type: "quiz"
question: "ما الذي سيطبعه هذا الكود؟"
code: |
  numbers = [1, 2, 3, 4, 5]
  result = []

  for num in numbers:
      if num % 2 == 1:  # الأرقام الفردية
          result.append(num * 2)

  print(result)
lang: python
options:
  - "[1, 3, 5]"
  - "[2, 4, 6, 8, 10]"
  - "[2, 6, 10]"
  - "[1, 2, 3, 4, 5]"
solution: 2
explanation: "الكود يأخذ الأرقام الفردية (1, 3, 5) ويضاعفها، فالنتيجة [2, 6, 10]."
