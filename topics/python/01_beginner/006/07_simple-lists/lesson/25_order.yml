type: "order"
lang: "python"
question: "رتب هذا الكود لإنشاء قائمة الأرقام المضاعفة والفردية منفصلة:"
code:
  - "numbers = [1, 4, 7, 8, 12, 15, 18]"
  - "even = []"
  - "odd = []"
  - |
    for num in numbers:
        if num % 2 == 0:
            even.append(num)
        else:
            odd.append(num)
  - 'print("زوجية:", even)'
  - 'print("فردية:", odd)'
explanation: "نبدأ بالقائمة الأصلية، ننشئ قائمتين فارغتين، نمر عبر الأرقام ونصنفها، ثم نطبع النتائج."
