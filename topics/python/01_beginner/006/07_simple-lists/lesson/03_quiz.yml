type: "quiz"
question: "ما هي الطريقة الصحيحة لإنشاء قائمة من الألوان؟"
options:
  - "colors = (أحمر، أزرق، أخضر)"
  - 'colors = ["أحمر", "أزرق", "أخضر"]'
  - "colors = {أحمر، أزرق، أخضر}"
