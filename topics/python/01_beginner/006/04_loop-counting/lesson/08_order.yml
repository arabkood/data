# Step 8: Order challenge
type: "order"
lang: "python"
question: "رتب هذا الكود لحساب عدد الأرقام بين 1 و 50 القابلة للقسمة على 3:"
code:
  - "count = 0"
  - "for i in range(1, 51):"
  - "    if i % 3 == 0:"
  - "        count = count + 1"
  - "print(f\"عدد الأرقام القابلة للقسمة على 3: {count}\")"
