# Step 4: Product accumulation
type: "fill"
lang: "python"
question: |
  دعنا نحسب حاصل ضرب كل الأرقام من 1 إلى 4 باستخدام حلقة:

  المطلوب: أكمل الكود ليحسب النتيجة (1 × 2 × 3 × 4).

  ملاحظة: لا تبدأ من 0، لأن ضرب أي رقم في 0 يعطي دائمًا 0. ابدأ من 1.
code: |
  product = @@INPUT@@
  for i in range(1, 5):
      product = product @@INPUT@@ i
  print(f"4! = {product}")
solution:
  - "1"
  - "*"
explanation: "للضرب التراكمي، نبدأ بـ 1 (ليس 0!) ونضرب في كل رقم."
