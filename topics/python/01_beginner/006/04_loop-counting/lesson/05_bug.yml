question: "هذا الكود يجب أن يحسب مجموع الأرقام من 1 إلى 10، لكن النتيجة خاطئة. اكتشف الخطأ:"
code: |
  total = 1
  for i in range(1, 11):
      total = total + i
  print(f"المجموع: {total}")
solution: 0
hint: "ما القيمة الابتدائية الصحيحة للمجموع؟"
expectedOutput: "المجموع: 55"
