type: "quiz"
question: "ما ناتج هذا الكود؟"
code: |
  print("A", end="")
  print("B", end=" ")
  print("C")
lang: "python"
options:
  - "A B C على أسطر منفصلة"
  - "AB C على نفس السطر"
  - "A B C على نفس السطر"
solution: 1
explanation: "end=\"\" لا يضع شيئاً بعد A، end=\" \" يضع مسافة بعد B، والأخير ينتقل لسطر جديد"
