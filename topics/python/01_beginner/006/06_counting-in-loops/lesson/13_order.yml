type: "order"
lang: "python"
question: "رتب هذا الكود لحساب متوسط الأرقام الموجبة فقط:"
code:
  - "positive_sum = 0"
  - "positive_count = 0"
  - "numbers = [5, -3, 8, -1, 12]"
  - |
    for num in numbers:
        if num > 0:
            positive_sum += num
            positive_count += 1
  - |
    if positive_count > 0:
        average = positive_sum / positive_count
        print(f"متوسط الأرقام الموجبة: {average}")
explanation: "نحتاج أولاً لتعريف المتغيرات، ثم القائمة، ثم الحلقة لجمع القيم الموجبة، وأخيراً حساب وطباعة المتوسط."
