type: "bug"
lang: python
question: "اعثر على الخطأ في هذا الكود الذي يحسب مجموع الأرقام الموجبة:"
code: |
  total = 0
  numbers = [3, -2, 7, -1, 5]

  for num in numbers:
      if num > 0:
          total = num

  print(f"مجموع الأرقام الموجبة: {total}")
solution: 4
explanation: "يجب استخدام += بدلاً من = لتجميع القيم. استخدام = يعني استبدال القيمة بدلاً من إضافتها."
hint: "انظر لكيفية إضافة القيم إلى المجموع"
