type: "quiz"
question: "ما قيمة المتغير `count` بعد تنفيذ هذا الكود؟"
code: |
  count = 0
  for i in range(3):
      count += 1
  print(count)
lang: python
options:
  - "0"
  - "2"
  - "3"
  - "4"
solution: 2
explanation: "المتغير count يبدأ من 0، وفي كل تكرار من التكرارات الثلاثة يزيد بـ 1، فالنتيجة النهائية هي 3."
