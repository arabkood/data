# Step 5: Common mistake with range
type: "bug"
lang: "python"
question: "هذا الكود يجب أن يطبع الأرقام من 5 إلى 10. أين الخطأ؟"
code: |
  print("الأرقام من 5 إلى 10:")
  for num in range(5, 10):
      print(num)
  print("انتهى!")
solution: 1
hint: "تذكر أن range تتوقف قبل الرقم النهائي"
explanation: |
  range(5, 10) = 5,6,7,8,9 
  range(5, 11) = 5,6,7,8,9,10
