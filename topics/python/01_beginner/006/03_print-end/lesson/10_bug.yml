question: "هناك خطأ في الكود التالي يمنع طباعة النتيجة المطلوبة في سطر واحد. أين الخطأ؟"
code: |
  print("A", end=" ")
  print("B", end=" ")
  print("C", end="\n")
  print("D")
solution: 2
explanation: "السطر الثالث يستخدم end=\"\\n\" مما يسبب انتقال إلى سطر جديد قبل طباعة D. يجب استخدام end=\" \" للحفاظ على النص في نفس السطر."
hint: "ابحث عن السطر الذي يستخدم \\n"
