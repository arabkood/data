type: "quiz"
question: "ما النتيجة المتوقعة للكود التالي؟"
code: |
  print("Python", end="*")
  print("هو", end="*")
  print("رائع")
lang: "python"
options:
  - |
    Python هو رائع
  - |
    Python\nهو\nرائع
  - |
    Python\*هو\*رائع
solution: 2
explanation: "كل print() ينتهي بـ * بدلاً من السطر الجديد، باستثناء الأخير الذي يستخدم السطر الجديد الافتراضي."
