type: "bug"
lang: "python"
question: "هناك خطأ شائع في هذا الكود. هل يمكنك تحديد السطر الذي يحتوي على الخطأ؟"
code: |
  user_age = 25
  if type(user_age) == "int":
      print("العمر هو عدد صحيح.")
solution: 1
explanation: |
  هذا خطأ شائع جداً! عند المقارنة مع نتيجة `type()`, يجب أن نقارنها بنوع البيانات نفسه (`int`, `str`, `float`) وليس بنسخة نصية منه (`"int"`).

  الطريقة الصحيحة هي: `if type(user_age) == int:`
  والطريقة الأفضل والأكثر شيوعاً هي: `if isinstance(user_age, int):`
