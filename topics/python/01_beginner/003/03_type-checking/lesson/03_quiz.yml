type: "quiz"
question: "إذا أدخلت الرقم `50` في الكود السابق، ماذا ستكون نتيجة `type(user_input)`؟"
options:
  - "<class 'int'>"
  - "<class 'str'>"
  - "<class 'number'>"
  - "50"
solution: 1
explanation: |
  صحيح! بغض النظر عما تدخله، فإن دالة `input()` تُرجع دائماً سلسلة نصية (`str`). لهذا السبب، نحتاج إلى أن نكون حذرين عند التعامل مع مدخلات المستخدم.
