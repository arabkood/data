type: "quiz"
question: "أي من الخيارات التالية يطرح سؤالاً (يقارن) بدلاً من إعطاء أمر (إسناد قيمة)؟"
options:
  - "`name = 'سارة'`"
  - "`is_valid = True`"
  - "`name == 'سارة'`"
  - "`level = 1`"
solution: 2
explanation: "علامتا يساوي `==` تُستخدم دائماً للمقارنة (طرح سؤال). علامة يساوي واحدة `=` تُستخدم دائماً للإسناد (إعطاء أمر)."
