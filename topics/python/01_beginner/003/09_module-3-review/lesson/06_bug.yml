type: "bug"
lang: "python"
question: "هذا الكود يحاول توحيد إجابة المستخدم إلى أحرف صغيرة، لكن المقارنة لا تزال تفشل إذا كتب المستخدم 'Yes'. لماذا لا يتغير المتغير `answer`؟"
code: |
  answer = "Yes"
  # محاولة تحويل الإجابة إلى أحرف كبيرة
  answer.upper()
  if answer == "YES":
    print("تمت الموافقة.")
  else:
    print("الإجابة غير متطابقة.")
solution: 2
explanation: |
  هذا هو الفخ الكلاسيكي! تذكر، أساليب النصوص مثل `.lower()` أو `.strip()` لا تُعدّل المتغير الأصلي. إنها تُرجع **نسخة جديدة** ومُعدّلة. بما أننا لم نحفظ هذه النسخة الجديدة، فقد ضاع تأثيرها.

  **الحل الصحيح:** 

  `answer = answer.upper()`
