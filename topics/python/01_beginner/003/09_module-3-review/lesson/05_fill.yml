question: "املأ الفراغات لتنظيف وتحويل درجة الحرارة التي أدخلها المستخدم."
code: |
  raw_temp = input("أدخل درجة الحرارة: ")

  # الخطوة 1: إزالة المسافات الزائدة
  clean_temp_str = @@INPUT@@

  # الخطوة 2: تحويل النص النظيف إلى رقم عشري
  temp_value = @@INPUT@@

  # الخطوة 3: طباعة النص باستخدام f-string
  print(@@INPUT@@"درجة الحرارة المسجلة هي: {@@INPUT@@}")
solution:
  - "raw_temp.strip()"
  - "float(clean_temp_str)"
  - "f"
  - "temp_value"
explanation: |
  عمل ممتاز! هذا هو سير العمل النموذجي لمعالجة مدخلات المستخدم:

  1.  **الفراغ الأول (`raw_temp.strip()`):** نبدأ بتنظيف المدخلات الخام. `.strip()` يزيل أي مسافات زائدة من البداية والنهاية، مما يجهز النص للخطوة التالية.
  2.  **الفراغ الثاني (`float(clean_temp_str)`):** بعد التنظيف، نقوم بتحويل النص إلى رقم. استخدمنا `float()` لأن درجة الحرارة قد تحتوي على أجزاء عشرية.
  3.  **الفراغ الثالث والرابع (`f` و `temp_value`):** أخيراً، لعرض النتيجة، استخدمنا f-string. وضع الحرف `f` قبل علامات الاقتباس يسمح لنا بدمج قيمة المتغير `temp_value` مباشرة داخل النص باستخدام الأقواس `{}`.
