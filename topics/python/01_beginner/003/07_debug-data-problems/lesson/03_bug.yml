type: "bug"
lang: "python"
question: | 
  زميلك كتب برنامجاً لحساب عمر شخص ما بعد 5 سنوات. لكن عندما يتم تشغيله، يحدث شيء غريب بدلاً من عملية الجمع الحسابية.

  حدد السطر الذي يسبب خطأ `TypeError`
code: |
  age_text = input("كم عمرك؟ ")
  # لنفترض أن المستخدم أدخل "25"

  print("بعد 5 سنوات، سيكون عمرك...")
  age_in_future = age_text + 5

  print(age_in_future)
solution: 3
explanation: |
  هذا هو الخطأ الكلاسيكي! `input()` تُرجع نصاً (`str`). الكود يحاول جمع النص "25" مع الرقم 5، وهو ما لا يمكن لبايثون القيام به.

  **الحل:** يجب تحويل `age_text` إلى عدد صحيح أولاً باستخدام `int()`:
  `age_in_future = int(age_text) + 5`
