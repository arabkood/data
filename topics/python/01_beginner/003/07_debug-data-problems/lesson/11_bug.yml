type: "bug"
lang: "python"
question: "استخدام دالة التحويل الخاطئة هنا يسبب المشكلة. حدد السطر الذي يمثل الاختيار الخاطئ."
code: |
  weight_str = input("أدخل وزن الشحنة (بالكيلوغرام): ")
  # المستخدم يدخل "4.5"

  # هذا السطر سيسبب خطأ ValueError
  weight_num = int(weight_str)

  shipping_cost = weight_num * 2.5
  print(f"تكلفة الشحن هي: {shipping_cost} ريال")
solution: 4
explanation: |
  لقد وجدتها! هذه مشكلة منطقية. الوزن يمكن أن يحتوي على أجزاء عشرية، ولكن دالة `int()` لا يمكنها التعامل إلا مع الأعداد الصحيحة. عندما ترى `int()` النص "4.5"، فإنها لا تعرف ماذا تفعل وتطلق خطأ `ValueError`.

  **الحل:** بما أن الوزن قد يكون عشرياً، يجب أن نستخدم الأداة المناسبة: `float()`.
  `weight_num = float(weight_str)`
