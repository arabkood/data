question: |
  هذا البرنامج يحاول قراءة سعر منتج من نص، لكن النص يحتوي على رمز العملة ومسافات زائدة. هذا يسبب انهيار البرنامج عند محاولة تحويله إلى رقم.

  املأ الفراغات لإزالة الرمز '$' ثم إزالة المسافات، لتحضير النص للتحويل إلى `float`.
code: |
  price_with_currency = " $19.99 "
  
  # الخطوة 1: إزالة رمز العملة
  clean_price_1 = price_with_currency@@INPUT@@("$", "")
  
  # الخطوة 2: إزالة المسافات الزائدة من النص الجديد
  clean_price_2 = clean_price_1@@INPUT@@
  
  # الخطوة 3: الآن التحويل آمن
  price_value = float(clean_price_2)
  
  print(f"السعر كرقم هو: {price_value}")
solution:
  - ".replace"
  - ".strip()"
explanation: |
  ممتاز! هذه عملية تنظيف من خطوتين. أولاً، نستخدم `.replace()` للتخلص من رمز '$' غير الرقمي. ثانياً، نستخدم `.strip()` على النتيجة لإزالة أي مسافات بادئة أو لاحقة. بعد هاتين العمليتين، يصبح النص جاهزاً للتحويل بأمان إلى `float`.
