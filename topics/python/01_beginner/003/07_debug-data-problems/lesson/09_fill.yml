question: | 
  يسأل هذا البرنامج المستخدم سؤالاً بسيطاً ويتوقع إجابة بـ `yes`.
  لكن إذا كتب المستخدم `YES` بأي أحرف كبيرة (مثل yEs أو YeS)، فإن البرنامج يفشل في التعرف عليها.

  استخدم الـ method المناسب لتوحيد إدخال المستخدم إلى أحرف صغيرة قبل مقارنته.
code: |
  answer = input("هل تريد المتابعة؟ (yes/no): ")
  # لنفترض أن المستخدم أدخل YES

  # قم بتعديل السطر التالي ليعمل بشكل صحيح
  if answer.@@INPUT@@ == "yes":
    print("حسناً، لنكمل...")
  else:
    print("إلغاء الأمر.")
solution:
  - "lower()"
explanation: |
  بالضبط! باستخدام `.lower()`، نقوم بتحويل إجابة المستخدم دائماً إلى أحرف صغيرة قبل مقارنتها بـ yes.
