type: "quiz"
question: "بغض النظر عما يكتبه المستخدم، ما هو نوع البيانات الذي تُرجعه دالة `input()` **دائماً**؟"
options:
  - "يعتمد على ما إذا كان المستخدم قد أدخل أرقاماً أم نصاً."
  - "`int` (عدد صحيح)"
  - "`str` (نص)"
  - "`bool` (قيمة منطقية)"
solution: 2
explanation: "هذه هي القاعدة الذهبية الأولى عند التعامل مع مدخلات المستخدم: `input()` تُرجع دائماً نصاً (`str`). لهذا السبب نحتاج دائماً إلى التفكير في تحويل النوع."
