lang: "python"
question: "أعد ترتيب هذه الأسطر لإنشاء برنامج يعمل بشكل صحيح: يقرأ عمر المستخدم، ويحوله إلى رقم، ثم يتحقق مما إذا كان أكبر من 18."
code:
  - 'age_str = input("كم عمرك؟ ")'
  - 'age_num = int(age_str)'
  - 'if age_num > 18:'
  - '    print("يمكنك الدخول.")'
explanation: |
  هذا هو التسلسل المنطقي الصحيح للمعالجة:
  1.  الحصول على المدخلات كنص (`input`).
  2.  تحويل النص إلى رقم (`int`).
  3.  استخدام الرقم في شرط (`if`).
  4.  تنفيذ الإجراء بناءً على الشرط.
