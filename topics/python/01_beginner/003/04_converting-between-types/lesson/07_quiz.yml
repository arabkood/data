type: "quiz"
question: "أي من الأسطر التالية سيسبب `ValueError`؟"
options:
  - "int('500')"
  - "int('  500  ')"
  - "int('5.0')"
  - "int('-500')"
solution: 2
explanation: |
  إجابة دقيقة! `int()` يمكنها التعامل مع الأرقام الموجبة والسالبة والمسافات الفارغة حول الرقم. لكنها لا تفهم الفاصلة العشرية. لتحويل "5.0"، نحتاج إلى أداة مختلفة.
