# --- STEP 6: Quiz about input ---
type: "quiz"
question: "ماذا يحدث عندما يصل البرنامج لسطر `input()`؟"
options:
  - "يتجاهل السطر ويكمل للسطر التالي"
  - "يتوقف وينتظر المستخدم أن يكتب شيئًا ويضغط Enter"
  - "يطبع رسالة خطأ"
solution: 1
explanation: "صحيح! الدالة `input()` تتوقف تمامًا وتنتظر المستخدم. هذا ما يجعل البرامج تفاعلية."
