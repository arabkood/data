type: "bug"
lang: "python"
question: "هناك خطأ نحوي شائع جداً في جملة `if` هذه. حدد السطر الذي به المشكلة."
code: |
  access_level = "admin"

  if access_level = "admin":
    print("تم منح الوصول الكامل.")
solution: 2
explanation: "هذا هو الخطأ الكلاسيكي `=` مقابل `==`! نحن هنا نحاول إسناد قيمة داخل جملة `if`، وهو ما لا معنى له ويسبب خطأ. للمقارنة، يجب أن نستخدم `==`. السطر الصحيح هو: `if access_level == 'admin':`"
