type: "bug"
lang: "python"
question: "هناك خطأ شائع جداً. حدد السطر الذي به المشكلة."
code: |
  access_level = "admin"

  if access_level = "admin":
    print("تم منح الوصول الكامل.")
solution: 1
explanation: | 
  هذا هو الخطأ الكلاسيكي `=` مقابل `==`! 

  للمقارنة، يجب أن نستخدم `==`. السطر الصحيح هو:

  `if access_level == 'admin':`"
