type: "bug"
lang: "python"
question: "من المفترض أن يحسب هذا الكود التكلفة الإجمالية لـ 7 منتجات ثم يضيف الضريبة والإكرامية، ولكن هناك خطأ. \nيجب أن يطبع `125` ولكنه يطبع `131`. ابحث عن الخطأ:\n"
code: |
  price1 = 10
  price2 = 9
  price2 = 15
  price3 = 5
  price4 = 21
  price5 = 7
  price6 = 28
  total = price1 + price2 + price2 + price3 + price4 + price5 + price6
