# --- STEP 11: Identifying statements ---
type: "quiz"
question: "كم عدد الجمل البرمجية في هذا الكود؟"
code: |
  username = "مبرمج١٢٣"
  password = "سري"
  print(username)
  print("تم تسجيل الدخول بنجاح")
lang: "python"
options:
  - "جملتان برمجيتان"
  - "٣ جمل برمجية"
  - "٤ جمل برمجية"
solution: 2
explanation: "كل سطر يخبر الحاسوب بفعل شيء ما هو جملة برمجية. هذا الكود يحتوي على ٤ جمل برمجية: جملتا إسناد (تخزين قيمة) وجملتا طباعة."
