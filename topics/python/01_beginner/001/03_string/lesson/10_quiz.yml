type: "quiz"
question: "كم عدد الجمل البرمجية في هذا الكود؟"
code: |
  username = "coder123"
  password = "لا تسرق مني الفلافل"
  print(username)
  print("تم تسجيل الدخول بنجاح")
lang: "python"
options:
  - "جملتان برمجيتان"
  - "3 جمل برمجية"
  - "4 جمل برمجية"
solution: 2
explanation: "كل سطر يخبر الحاسوب بفعل شيء ما هو جملة برمجية. هذا الكود يحتوي على 4 جمل برمجية: جملتا إسناد (تخزين قيمة) وجملتا طباعة."
