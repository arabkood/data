# --- STEP 7: Creating string variables ---
type: "fill"
lang: "python"
question: "Create three string variables: \n- 'book_title' with 'القانون في الطب'.\n- 'author' with 'Ibn Sina'.\n- 'year_hijri' with '416'\n"
code: |
  @@INPUT@@ = @@INPUT@@
  @@INPUT@@ = @@INPUT@@
  @@INPUT@@ = @@INPUT@@
solution:
  - "book_title"
  - |
    /^['"]القانون في الطب['"]$/
  - "author"
  - |
    /^['"]Ibn Sina['"]$/
  - "year_hijri"
  - |
    /^['"]416['"]$/
explanation: "Notice that '416' is in quotes, making it a string (text) rather than a number. Sometimes we store numbers as strings when we don't need to do math with them."
