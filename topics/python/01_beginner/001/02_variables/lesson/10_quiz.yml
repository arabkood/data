# --- STEP 8: Quiz about using variables ---
type: "quiz"
question: "ما الذي سيعرضه هذا الكود؟"
code: |
  favorite_website = "akood.com"
  print(favorite_website)
lang: "python"
options:
  - "favorite_website"
  - "akood.com"
  - '"akood.com"'
solution: 1
explanation: "عندما تستخدم اسم متغير في `print()` بدون علامات اقتباس، فإنه يعرض القيمة المخزنة في ذلك المتغير."
