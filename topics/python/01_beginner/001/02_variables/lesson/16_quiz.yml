# --- STEP 14: Text vs variable names ---
type: "quiz"
question: "What's the difference between these two lines?"
code: |
  print("message")
  print(message)
lang: "python"
options:
  - "There's no difference - they do the same thing"
  - "The first prints the word 'message', the second prints the value stored in a variable called message"
solution: 1
explanation: "With quotes, Python directly know the string. Without quotes, Python looks for a variable with that name."
