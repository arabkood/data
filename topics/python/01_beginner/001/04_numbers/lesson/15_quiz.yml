# --- STEP 15: Order of operations practice ---
type: "quiz"
question: "ماذا سيعرض هذا الكود؟"
code: |
  calculation = 10 + 5 * 2
  print(calculation)
lang: "python"
options:
  - "30"
  - "20"
  - "17"
solution: 1
explanation: "وفقًا لأولويات العمليات الحسابية: 5 * 2 = 10، ثم 10 + 10 = 20. عملية الضرب تحدث قبل عملية الجمع."
