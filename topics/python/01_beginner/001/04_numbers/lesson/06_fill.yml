# --- STEP 6: Practice printing number variables ---
type: "fill"
lang: "python"
question: "أنشئ متغيرًا باسم `points` بقيمة 250، ثم اطبعه."
code: |
  points @@INPUT@@ 250
  print(@@INPUT@@)
solution:
  - "="
  - "points"
explanation: "يمكنك إسناد القيم للمتغيرات باستخدام علامة المساواة. ويمكنك الوصول إلى القيمة المخزنة في متغير عن طريق استدعاء اسمه بدون علامات اقتباس."
