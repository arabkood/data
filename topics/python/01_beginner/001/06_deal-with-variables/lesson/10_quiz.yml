# --- STEP 7: Quiz about variable updating ---
type: "quiz"
question: "ما هي القيمة النهائية للمتغير `points` بعد تشغيل هذا الكود؟"
code: |
  points = 100
  points = points - 20
  points = points + 15
lang: "python"
options:
  - "100"
  - "95"
  - "80"
  - "115"
solution: 1
explanation: |
  هذا ما يفعله الكود خلف الكواليس:

  ```python
  points = 100
  points = 100 - 20 # 80
  points = 80 + 15 # 95
  ```
