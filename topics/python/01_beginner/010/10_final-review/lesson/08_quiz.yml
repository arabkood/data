type: "quiz"
question: "أين يجب أن تكون المعاملات الافتراضية؟"
code: |
  def func(a, b=10, c):  # صح أم خطأ؟
      return a + b + c
lang: "python"
options:
  - "صحيح"
  - "خطأ - الافتراضية يجب أن تكون في النهاية"
  - "صحيح لكن غير موصى به"
solution: 1
explanation: "المعاملات الافتراضية يجب أن تأتي بعد كل المعاملات الإجبارية"
