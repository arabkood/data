type: "quiz"
question: "هل يمكن أن يكون لدينا أكثر من معامل افتراضي؟"
code: |
  def func(a, b=10, c=20):
      return a + b + c
lang: "python"
options:
  - "لا، معامل افتراضي واحد فقط"
  - "نعم، يمكن عدة معاملات افتراضية"
  - "هذا سيسبب خطأ"
solution: 1
explanation: "يمكن أن يكون لدينا عدة معاملات افتراضية، لكن يجب أن تكون في النهاية"
