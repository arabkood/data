type: "quiz"
question: "ما الفرق بين هاتين الحلقتين؟"
code: |
  # الكود أ:
  for i in range(5):
      if i == 2:
          break
      print(i)

  # الكود ب:
  for i in range(5):
      if i == 2:
          continue
      print(i)
lang: "python"
options:
  - "الكود أ يطبع: 0, 1 والكود ب يطبع: 0, 1, 3, 4"
  - "كلاهما يطبع نفس الشيء"
  - "الكود أ يطبع: 0, 1, 2 والكود ب يطبع: 0, 1, 3, 4"
  - "الكود أ يتخطى 2 والكود ب يوقف عند 2"
solution: 0
explanation: "break يخرج من الحلقة عند i=2، بينما continue يتخطى فقط طباعة 2 ويكمل الحلقة."
