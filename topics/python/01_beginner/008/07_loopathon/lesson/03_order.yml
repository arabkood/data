type: "order"
lang: "python"
question: "رتب الكود لإيجاد كل الأعداد الأولية من 2 إلى 20:"
code:
  - "for num in range(2, 21):"
  - "    is_prime = True"
  - "    for i in range(2, num):"
  - "        if num % i == 0:"
  - "            is_prime = False"
  - "            break"
  - "    if is_prime:"
  - "        print(num)"
explanation: "لكل رقم، نتحقق إذا كان له قاسم من 2 إلى num-1. إذا وجدنا قاسماً، ليس أولياً."
