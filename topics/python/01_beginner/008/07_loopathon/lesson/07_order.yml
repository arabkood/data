type: "order"
lang: "python"
question: "رتب الكود لإيجاد الأرقام المكررة في قائمة:"
code:
  - "numbers = [1, 2, 3, 2, 4, 5, 3, 6]"
  - "duplicates = []"
  - "for i in range(len(numbers)):"
  - "    for j in range(i + 1, len(numbers)):"
  - "        if numbers[i] == numbers[j]:"
  - "            if numbers[i] not in duplicates:"
  - "                duplicates.append(numbers[i])"
  - "print(f'الأرقام المكررة: {duplicates}')"
explanation: "نقارن كل عنصر مع العناصر التي بعده، ونضيف المكررات لقائمة بدون تكرار."
