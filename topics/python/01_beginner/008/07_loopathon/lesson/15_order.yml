question: "رتب الكود لتحويل مصفوفة 2D إلى قائمة واحدة (flatten):"
code:
  - "matrix = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]"
  - "flat_list = []"
  - "for row in matrix:"
  - "    for item in row:"
  - "        flat_list.append(item)"
  - "print(flat_list)"
explanation: "نمر على كل صف، ثم على كل عنصر في الصف، ونضيفه للقائمة المسطحة."
