lang: "python"
question: "رتب الكود لإيجاد كل الكلمات التي تحتوي على حرف معين في قائمة جمل:"
code:
  - "sentences = ['Python سهلة', 'البرمجة ممتعة', 'التعلم مستمر']"
  - "target_letter = 'م'"
  - "matching_words = []"
  - "for sentence in sentences:"
  - "    words = sentence.split()"
  - "    for word in words:"
  - "        if target_letter in word:"
  - "            if word not in matching_words:"
  - "                matching_words.append(word)"
  - "print(matching_words)"
explanation: "نقسم كل جملة، نتحقق من كل كلمة، ونضيف الكلمات التي تحتوي الحرف المطلوب."
