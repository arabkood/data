type: "order"
lang: "python"
question: "رتب الكود لإيجاد أطول سلسلة من الأرقام المتزايدة في قائمة:"
code:
  - "nums = [1, 2, 3, 2, 3, 4, 5, 6, 2, 3]"
  - "max_length = 1"
  - "current_length = 1"
  - "for i in range(1, len(nums)):"
  - "    if nums[i] > nums[i - 1]:"
  - "        current_length = current_length + 1"
  - "        max_length = max(max_length, current_length)"
  - "    else:"
  - "        current_length = 1"
  - "print(f'أطول سلسلة: {max_length}')"
explanation: "نتتبع طول السلسلة الحالية، ونحدث الأطول عند إيجاد رقم أكبر."
