question: "هذا الكود يجب أن يطبع كل رقم مع مربعه، لكن يطبع 'تم!' بعد كل رقم. ما المشكلة؟"
code: |
  for i in range(1, 4):
      print(f"{i} -> {i**2}")
      print("تم!")
solution: 2
hint: "انظر إلى المسافة البادئة لـ print الثانية"
explanation: "print('تم!') داخل الحلقة، لذا يطبع 3 مرات. يجب إزالة المسافة البادئة لطباعتها مرة واحدة فقط."
expectedOutput: "1->1, 2->4, 3->9, ثم 'تم!' مرة واحدة"
actualOutput: "1->1, تم!, 2->4, تم!, 3->9, تم!"
