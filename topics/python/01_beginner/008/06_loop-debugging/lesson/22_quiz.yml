type: "quiz"
question: "ما المشكلة في استخدام نفس اسم المتغير في حلقات متداخلة؟"
options:
  - "لا توجد مشكلة"
  - "سيسبب خطأ في البرنامج"
  - "يجعل الكود مربكاً والحلقة الداخلية تطغى على الخارجية"
  - "سيجعل البرنامج أبطأ"
solution: 2
explanation: "لن يسبب خطأاً تقنياً، لكنه مربك جداً! الحلقة الداخلية ستعيد تعريف المتغير."
