type: "quiz"
question: "متى يجب استخدام while بدلاً من for؟"
options:
  - "دائماً، while أفضل من for"
  - "عندما نعرف عدد التكرارات بالضبط"
  - "عندما لا نعرف عدد التكرارات مسبقاً"
  - "عندما نريد المرور على قائمة"
solution: 2
explanation: "while مثالية عندما لا نعرف عدد التكرارات، بينما for أفضل عندما نعرف العدد أو لدينا قائمة محددة."
