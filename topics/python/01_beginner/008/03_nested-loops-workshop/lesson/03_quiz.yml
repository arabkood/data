type: "quiz"
question: "كم مرة سيطبع هذا الكود كلمة 'مرحبا'؟"
code: |
  for i in range(3):
      for j in range(4):
          print("مرحبا")
lang: "python"
options:
  - "7 مرات"
  - "12 مرة"
  - "3 مرات"
  - "4 مرات"
solution: 1
explanation: "الحلقة الخارجية تعمل 3 مرات، والحلقة الداخلية تعمل 4 مرات لكل دورة خارجية. المجموع: 3 × 4 = 12"
