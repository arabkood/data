question: "أكمل الكود لإيجاد كل أزواج الأرقام من قائمتين والتي مجموعها 10:"
code: |
  list1 = [1, 2, 3, 4, 5, 6]
  list2 = [4, 5, 6, 7, 8, 9]

  for num1 @@INPUT@@ list1:
      for num2 in @@INPUT@@:
          if num1 @@INPUT@@ num2 == 10:
              print(f"{num1} + {num2} = 10")
solution:
  - "in"
  - "list2"
  - "+"
explanation: "نمر على كل رقم في list1، ثم كل رقم في list2، ونطبع الأزواج التي مجموعها 10."
