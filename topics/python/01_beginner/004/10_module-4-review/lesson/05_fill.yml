question: "املأ الفراغات بالمعاملات الصحيحة للتحقق مما إذا كان عمر المستخدم مسموحاً به (بين 18 و 65 عاماً، شاملة)."
code: |
  age = 30
  if age @@INPUT@@ 18 and age @@INPUT@@ 65:
      print("العمر ضمن النطاق المسموح به.")
solution:
