type: "bug"
lang: "python"
question: "هناك خطأ في هذا الكود. تحصل على خصم إذا كان لديك 5 منتجات أو أقل في عربة التسوق. لكن الكود لا يعمل عندما يكون لديك 5 منتجات بالضبط. حدد السطر الذي يحتوي على الخطأ."
code: |
  items_in_cart = 5

  if items_in_cart < 5:
      print("لقد حصلت على خصم!")
  else:
      print("أضف المزيد من المنتجات أو قلل منها للحصول على خصم.")
solution: 2
explanation: "الخطأ هو استخدام `<` بدلاً من `<=`. الشرط `items_in_cart < 5` يكون `False` عندما تكون قيمة المتغير هي 5. الشرط الصحيح هو `items_in_cart <= 5` ليتم تضمين حالة وجود 5 منتجات بالضبط."
expectedOutput: "لقد حصلت على خصم!"
actualOutput: "أضف المزيد من المنتجات أو قلل منها للحصول على خصم."
