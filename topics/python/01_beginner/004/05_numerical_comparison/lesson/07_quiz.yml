type: "quiz"
question: "لديك كوب يمكنه استيعاب 250 مل من السائل كحد أقصى. أي شرط يتحقق مما إذا كان حجم السائل `liquid_ml` مناسباً للكوب (لا ينسكب)؟"
code: |
  liquid_ml = 250
  # أي شرط يجب وضعه هنا؟
lang: python
options:
  - "liquid_ml < 250"
  - "liquid_ml > 250"
  - "liquid_ml <= 250"
  - "liquid_ml >= 250"
solution: 2
explanation: "نريد التحقق مما إذا كان حجم السائل أصغر من أو يساوي سعة الكوب. إذا كان الحجم 250 مل بالضبط، فهو لا يزال مناسباً، لذلك نستخدم `<=`."
