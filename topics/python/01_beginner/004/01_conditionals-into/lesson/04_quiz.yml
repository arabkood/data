type: "quiz"
question: "أي من الخيارات التالية يمثل القيم البولينية الصحيحة في بايثون؟"
options:
  - '`"True"` و `"False"`'
  - "`Yes` و `No`"
  - "`True` و `False`"
  - "`1` و `0`"
solution: 2
explanation: |
  القيمتان البولينيتان في بايثون هما الكلمتان المفتاحيتان `True` و `False`. لاحظ أنهما تبدآن بحرف كبير وبدون علامات اقتباس.
