type: "bug"
lang: "python"
question: "هذا الكود يهدف إلى طباعة رسالتين إذا كان المستخدم هو المدير، لكنه يطبع الرسالة الثانية دائماً. حدد السطر الذي يسبب المشكلة."
code: |
  user_role = "guest"
  if user_role == "admin":
      print("مرحباً أيها المدير!")
  print("لديك صلاحيات كاملة.")
solution: 3
explanation: "السطر `print(\"لديك صلاحيات كاملة.\")` يفتقر إلى المسافة البادئة. وبسبب ذلك، هو ليس جزءاً من كتلة `if` ويتم تنفيذه دائماً، بغض النظر عن الشرط. يجب أن يكون بمسافة بادئة ليكون تابعاً للشرط."
