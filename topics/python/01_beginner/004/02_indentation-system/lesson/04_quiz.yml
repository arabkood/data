type: "quiz"
question: "ما الذي تستخدمه بايثون لتحديد بداية ونهاية كتل الكود (مثل تلك الموجودة داخل جملة `if`)؟"
options:
  - "الأقواس المتعرجة `{}`"
  - "الأقواس المربعة `[]`"
  - "المسافة البادئة (Indentation)"
  - "الكلمة المفتاحية `end`"
solution: 2
explanation: "تعتمد بايثون بشكل فريد على المسافة البادئة لتحديد بنية الكود وتجميع الأوامر في كتل. هذا يجعل الكود نظيفًا وسهل القراءة."
