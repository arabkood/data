type: "quiz"
question: "أي من مقتطفات الكود التالية يحتوي على مسافة بادئة صحيحة؟"
options:
  - |
    ```python
    if 10 > 5:
        print("صحيح")
    ```
  - |
    ```python
    if 10 > 5:
    print("صحيح")
    ```
  - |
    ```python
    if 10 > 5: print("صحيح")
    ```
  - |
    ```python
        if 10 > 5:
      print("صحيح")
    ```
solution: 0
explanation: |
  الخيار الأول هو الصحيح. جملة `if` موجودة في المستوى الخارجي، وسطر `print` مزاح بشكل صحيح للداخل بأربع مسافات، مما يشير إلى أنه ينتمي إلى كتلة `if`. الخيارات الأخرى إما تفتقر إلى المسافة البادئة أو لديها مسافة بادئة غير متسقة.
