type: "bug"
lang: "python"
question: "هذا الكود لن يعمل بسبب خطأ في المسافة البادئة. حدد السطر الذي يحتوي على الخطأ."
code: |
  needs_water = True
  if needs_water:
  print("من فضلك اسقِ النبتة.")
solution: 2
explanation: |
  السطر `print(...)` يجب أن يكون مزاحًا للداخل (عادة بـ 4 مسافات) لأنه يتبع جملة `if:`. بدون هذه المسافة البادئة، لا يعرف بايثون أن هذا السطر ينتمي إلى كتلة `if`، مما يسبب خطأ `IndentationError`.
