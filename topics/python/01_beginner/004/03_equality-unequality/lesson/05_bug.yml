type: "bug"
lang: "python"
question: "هذا الكود يحاول التحقق مما إذا كانت `player_level` تساوي 10، لكنه يستخدم عامل الإسناد بدلاً من عامل المقارنة. حدد السطر الذي به الخطأ."
code: |
  player_level = 10
  if player_level = 10:
      print("أنت في المستوى العاشر!")
solution: 1
explanation: |
  داخل جملة `if`، يجب أن تستخدم عامل المقارنة `==` لطرح سؤال. استخدام `=` واحد هنا هو خطأ نحوي شائع (`SyntaxError`) لأن `if` تتوقع شرطًا (سؤالاً) وليس أمرًا (إسنادًا).
