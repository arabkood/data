type: "bug"
lang: "python"
question: "الهدف هو طباعة 'مرحبًا أيها المدير!' فقط إذا كان المستخدم هو 'admin'. حدد السطر الذي به الخطأ المنطقي."
code: |
  user = "admin"
  if user != "admin":
      print("مرحبًا أيها المدير!")
solution: 2
explanation: |
  الخطأ هنا منطقي وليس نحويًا. الشرط `user != "admin"` يعني "إذا لم يكن المستخدم هو admin". بما أن المستخدم *هو* 'admin'، فإن الشرط يصبح `False` ولن يتم طباعة الرسالة أبدًا. يجب أن يكون الشرط `user == "admin"`.
