type: "bug"
lang: "python"
question: "اللاعب يفوز باللعبة إذا وصل إلى 1000 نقطة **أو** وجد المخرج. هذا الكود يستخدم المعامل الخاطئ، مما يجعل الفوز مستحيلاً تقريباً. حدد السطر الذي يحتوي على الخطأ."
code: |
  score = 1200
  found_exit = False

  # يفوز اللاعب إذا تحقق أي من الشرطين
  if score >= 1000 and found_exit:
      print("لقد فزت!")
  else:
      print("استمر في اللعب!")
solution: 4
explanation: "الخطأ المنطقي هو استخدام `and` بدلاً من `or`. مع `and`، يجب على اللاعب تحقيق 1000 نقطة *وفي نفس الوقت* العثور على المخرج. قواعد اللعبة تتطلب فقط تحقق أحد الشرطين، لذا يجب استخدام `or`."
expectedOutput: "لقد فزت!"
actualOutput: "استمر في اللعب!"
