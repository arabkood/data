type: "quiz"
question: "ما هي المشكلة الأساسية في استخدام متغيرات منفصلة لتخزين بيانات مشابهة؟"
options:
  - "صعوبة في تذكر أسماء المتغيرات"
  - "استهلاك ذاكرة أكبر من اللازم"
  - "صعوبة في معالجة البيانات كمجموعة واحدة"
solution: 2
explanation: "المشكلة الأساسية هي أننا لا نستطيع التعامل مع البيانات المترابطة كوحدة واحدة، مما يجعل العمليات عليها معقدة ومملة."
