question: |
  أكمل النمط للوصول لعناصر متباعدة:
code: |
  alphabet = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j']

  # احصل على كل حرف ثاني (a, c, e, g, i)
  pattern1 = []
  pattern1.append(alphabet[@@INPUT@@])  # a
  pattern1.append(alphabet[@@INPUT@@])  # c
  pattern1.append(alphabet[@@INPUT@@])  # e
  pattern1.append(alphabet[@@INPUT@@])  # g
  pattern1.append(alphabet[@@INPUT@@])  # i

  print(pattern1)
solution:
