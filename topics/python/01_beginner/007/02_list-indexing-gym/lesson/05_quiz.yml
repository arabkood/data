type: "quiz"
question: "ما قيمة المتغير result؟"
code: |
  numbers = [10, 20, 30, 40, 50, 60]
  result = numbers[1] == numbers[-2]
  print(result)
lang: python
options:
  - "True"
  - "False"
  - "20"
  - "50"
solution: 2
explanation: "numbers[1] = 20 و numbers[-2] = 50. المقارنة 20 == 50 تعطي False"
