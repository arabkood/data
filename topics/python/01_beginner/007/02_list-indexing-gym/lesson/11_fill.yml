# Step 11: Advanced negative indexing
type: "fill"
lang: "python"
question: |
  استخدم الفهرسة السالبة بطرق متقدمة:
code: |
  playlist = ["أغنية1", "أغنية2", "أغنية3", "أغنية4", "أغنية5", "أغنية6"]

  # احصل على الأغنية في المنتصف من النهاية
  # (إذا كان لدينا 6 أغاني، نريد الثالثة من النهاية)
  middle_from_end = playlist[@@INPUT@@]

  # احصل على الأغنية الثانية باستخدام الفهرسة السالبة
  second = playlist[@@INPUT@@]

  # تحقق أن العنصر الأول بالموجب = العنصر الأخير بالسالب المناسب
  same_element = playlist[0] == playlist[@@INPUT@@]

  print(middle_from_end, second, same_element)
solution:
  - "-3"
  - "-5"
  - "-6"
explanation: "-3 تعطي الثالث من النهاية، -5 تعطي الثاني من البداية، -6 تعطي الأول في قائمة من 6 عناصر"
