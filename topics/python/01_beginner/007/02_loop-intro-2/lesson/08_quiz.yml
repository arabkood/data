# Step 8: Why Lists Are Powerful
type: "quiz"
question: "ما الميزة الأساسية لاستخدام القوائم بدلاً من متغيرات منفصلة؟"
options:
  - "القوائم أسرع في التنفيذ"
  - "يمكن تخزين عدد كبير من القيم في متغير واحد"
  - "القوائم تستهلك ذاكرة أقل"
  - "القوائم أسهل في الكتابة دائماً"
solution: 1
explanation: "بالضبط! القائمة تسمح لك بتخزين مئات أو آلاف القيم في متغير واحد بدلاً من إنشاء متغير منفصل لكل قيمة."
