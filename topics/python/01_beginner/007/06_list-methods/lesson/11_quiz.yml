type: "quiz"
question: "ما الفرق بين `.pop()` و `.remove()`؟"
options:
  - "لا يوجد فرق، كلاهما يحذف العناصر"
  - ".pop() يحذف بالفهرس ويرجع العنصر، .remove() يحذف بالقيمة ولا يرجع شيئاً"
  - ".remove() يحذف جميع التطابقات، .pop() يحذف واحداً فقط"
solution: 1
explanation: "`.pop()` يعمل بالفهرس ويرجع العنصر المحذوف، بينما `.remove()` يبحث عن القيمة ويحذف أول تطابق دون إرجاع شيء."
