type: "quiz"
question: "أيّ من هذه الأكواد يحسب متوسط الأرقام بشكل صحيح؟"
options:
  - |
    total = 0
    for num in numbers:
        total += num
    average = total / len(numbers)
  - "total = 0\ncount = 0  \nfor num in numbers:\n    total += num\n    count += 1\naverage = total / count\n"
  - "كلاهما صحيح"
solution: 2
explanation: "كلا الحلين صحيحان! الأول يستخدم len() والثاني يعد العناصر يدوياً. لكن الأول أكثر كفاءة."
