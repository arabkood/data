# --- STEP 5: Counting Elements ---
type: "quiz"
question: "ما الناتج المتوقع لهذا الكود؟"
code: |
  numbers = [10, 5, 8, 5, 12, 5]
  count = 0
  for num in numbers:
      if num == 5:
          count += 1
  print(count)
options:
  - "2"
  - "3"
  - "5"
  - "6"
solution: 1
explanation: "الرقم 5 يظهر ثلاث مرات في القائمة، لذلك المتغير count سيزيد ثلاث مرات."
