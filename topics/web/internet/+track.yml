title: كيف يعمل الإنترنت؟
blurb: >-
  هل تساءلت يومًا ما الذي يحدث بالضبط عندما تكتب عنوان موقع وتضغط على Enter؟ في
  هذا المسار، وبدون أي كود برمجي، سنأخذك في رحلة لاستكشاف السحر خلف شبكة
  الإنترنت. من الخوادم وعناوين IP إلى كيفية وصول المواقع إلى شاشتك. نقطة انطلاق
  مثالية لكل شخص لديه فضول حول عالم التقنية.
