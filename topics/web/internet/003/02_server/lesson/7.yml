type: "bug"
lang: "text"
question: "ابحث عن الجملة غير الصحيحة المتعلقة بالخوادم:"
code: |
  الخوادم هي حواسيب قوية تعمل على مدار الساعة.
  الخوادم تخزن المواقع والملفات والبيانات الأخرى.
  الخوادم تطلب معلومات من متصفحك.
  الخوادم ترسل الردود إلى العملاء.
  الخوادم يمكنها التعامل مع آلاف الطلبات في وقت واحد.
solution: 2
explanation: "صحيح! `الخوادم` لا تطلب معلومات من متصفحك. بل العكس هو الصحيح—متصفحك (`العميل`) هو الذي يطلب المعلومات من `الخوادم`. `الخوادم` تستجيب للطلبات، ولا تقدمها."
