type: "quiz"
question: "ما هي الوظيفة الرئيسية لـ`الخادم`؟"
options:
  - "طلب المعلومات من الحواسيب الأخرى"
  - "استقبال الطلبات وإرسال الردود"
  - "تصفح المواقع للمستخدمين"
solution: 1
explanation: "صحيح! الوظيفة الرئيسية لـ`الخادم` هي استقبال الطلبات من `العملاء` وإرسال الردود. `الخوادم` تقدم المعلومات، ولا تطلبها."
