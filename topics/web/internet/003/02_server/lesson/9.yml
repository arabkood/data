type: "quiz"
question: "يمكن وصف `الخادم` بأفضل شكل بأنه:"
options:
  - "حاسوب يطلب معلومات من المواقع الإلكترونية"
  - "حاسوب قوي يخزن البيانات ويستجيب لطلبات `العملاء`"
  - "برنامج يساعدك على تصفح الإنترنت"
solution: 1
explanation: "ممتاز! `الخادم` هو حاسوب قوي يخزن البيانات ويستجيب لطلبات `العملاء`. إنه `المُقدِّم` في علاقة العميل والخادم."
