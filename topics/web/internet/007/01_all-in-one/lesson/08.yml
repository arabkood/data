type: "quiz"
question: "ما هو دور الخادم في هذه العملية؟"
options:
  - "يقوم بترجمة أسماء النطاقات إلى عناوين IP"
  - "يستقبل الطلبات ويرسل ملفات صفحة الويب"
  - "يقوم بتشفير البيانات من أجل الأمان"
solution: 1
explanation: "وظيفة `الخادم` هي استقبال طلبات `HTTP` من `العملاء` (مثل متصفحك) والاستجابة بالملفات والبيانات المطلوبة."
