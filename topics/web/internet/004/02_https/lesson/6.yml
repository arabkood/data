type: "quiz"
question: "أي من هذه العبارات حول `HTTPS` صحيحة؟"
options:
  - "`HTTPS` يجعل المواقع الإلكترونية تُحمَّل بشكل أسرع من `HTTP`"
  - "`HTTPS` يشفر البيانات المرسلة بين متصفحك والخادم"
  - "`HTTPS` ضروري فقط لمواقع التسوق عبر الإنترنت"
solution: 1
explanation: "`HTTPS` يشفر جميع البيانات المنقولة بين متصفحك والخادم، مما يجعلها غير قابلة للقراءة لأي شخص قد يعترضها. هذه الحماية قيمة لجميع أنواع الاتصالات الحساسة، وليس فقط للتسوق."
