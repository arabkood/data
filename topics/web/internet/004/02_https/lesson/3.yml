type: "quiz"
question: "يجب عليك دائمًا البحث عن `HTTPS` عند:"
options:
  - "مشاهدة مقاطع الفيديو على يوتيوب"
  - "قراءة المقالات الإخبارية"
  - "إدخال كلمة مرور أو رقم بطاقة ائتمان"
solution: 2
explanation: "`HTTPS` ضروري عند نقل المعلومات الحساسة مثل كلمات المرور أو أرقام بطاقات الائتمان أو البيانات الشخصية. على الرغم من أن العديد من المواقع تستخدم `HTTPS` الآن لجميع المحتويات، إلا أنه مهم للغاية للمعلومات الحساسة."
