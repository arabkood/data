type: "quiz"
question: "ما هو الغرض الأساسي من `بروتوكول HTTP`؟"
options:
  - "لجعل المواقع الإلكترونية تُحمَّل بشكل أسرع"
  - "لتوفير طريقة قياسية لتواصل المتصفحات والخوادم"
  - "لتأمين نقل البيانات عبر الإنترنت"
solution: 1
explanation: "`HTTP` هو البروتوكول الذي يحدد القواعد والتنسيق للتواصل بين متصفحات الويب والخوادم، مما يضمن فهم كل منهما للآخر."
