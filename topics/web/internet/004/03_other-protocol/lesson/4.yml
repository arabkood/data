type: "quiz"
question: "طابق كل بروتوكول مع غرضه الأساسي:"
code: |
  البروتوكول أ: SMTP
  البروتوكول ب: HTTP
  البروتوكول ج: FTP

  الغرض 1: نقل الملفات بين الحواسيب
  الغرض 2: إرسال رسائل البريد الإلكتروني
  الغرض 3: طلب واستقبال صفحات الويب
options:
  - "أ-1، ب-2، ج-3"
  - "أ-2، ب-3، ج-1"
  - "أ-3، ب-1، ج-2"
solution: 1
explanation: "`SMTP` مخصص لإرسال البريد الإلكتروني (أ-2)، و `HTTP` لصفحات الويب (ب-3)، و `FTP` لنقل الملفات (ج-1). كل `بروتوكول` متخصص لنوع الاتصال الخاص به."
