type: "quiz"
question: "أي عبارة عن بروتوكولات الإنترنت غير صحيحة؟"
options:
  - "تم تصميم بروتوكولات مختلفة لأنواع مختلفة من الاتصالات"
  - "`HTTP` هو البروتوكول الوحيد اللازم لجميع اتصالات الإنترنت"
  - "يستخدم البريد الإلكتروني بروتوكولات مختلفة عن تصفح الويب"
solution: 1
explanation: "`HTTP` هو مجرد واحد من العديد من البروتوكولات. يستخدم الإنترنت بروتوكولات مختلفة لأغراض مختلفة - البريد الإلكتروني (`SMTP`)، نقل الملفات (`FTP`)، الاتصال في الزمن الحقيقي (`WebRTC`)، وغيرها الكثير."
