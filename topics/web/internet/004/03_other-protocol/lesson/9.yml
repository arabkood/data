question: "رتب هذه الخطوات بالترتيب الصحيح لكيفية عمل طلب `HTTP`:"
code:
  - "يقوم المستخدم بإدخال عنوان URL في المتصفح"
  - "يرسل المتصفح (`العميل`) طلب `HTTP` إلى الخادم"
  - "يستقبل الخادم الطلب ويعالجه"
  - "يرسل الخادم استجابة `HTTP`"
  - "يعرض المتصفح (`العميل`) الاستجابة للمستخدم"
