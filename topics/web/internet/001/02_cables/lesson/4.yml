type: "quiz"
question: "كيف تنتقل بيانات الإنترنت بين القارات؟"
options:
  - "عبر الأقمار الصناعية في الفضاء"
  - "عبر كابلات الألياف الضوئية البحرية في قاع المحيط"
  - "عبر موجات الراديو التي ترتد عن الغلاف الجوي"
solution: 1
explanation: "هذا صحيح! معظم حركة الإنترنت بين القارات تنتقل عبر كابلات الألياف الضوئية البحرية. على الرغم من أن الأقمار الصناعية تنقل بعض حركة الإنترنت، إلا أن الغالبية العظمى تمر عبر هذه الكابلات المادية في قاع المحيط."
