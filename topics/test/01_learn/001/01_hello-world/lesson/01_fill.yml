lang: "javascript"
question: |
  أكمل الفراغات لإنشاء دالة باسم `greet`.
  يجب أن تستخدم **قوالب النصوص (template literals)** لإرجاع رسالة ترحيب بالصيغة: `Hello, {name}!`

code: |
  // أنشئ دالة ترحيب تأخذ اسماً وترجع رسالة
  @@INPUT@@ greet(name) {
    @@INPUT@@ message = @@INPUT@@;
    return message;
  }

solution:
  - "function"
  - "/^(let|var|const)$/"
  #    - It enforces the use of backticks (`).
  #    - It enforces the use of the `${name}` interpolation syntax.
  #    - It allows for optional a comma and/or an exclamation mark.
  #    - It is forgiving about the amount of whitespace after the comma.
  - "/^`Hello,?\\s*\\${name}!?`$/"
