type: "quiz"
lang: "javascript"
question: |
  ارتكاب الأخطاء جزء من التعلّم. لنتفحص معًا خطأً شائعًا.

  لا يمكنك تعريف نفس `المتغيّر` مرتين في نفس النطاق باستخدام `let`. **أي سطر يسبب الخطأ؟**
code: |
  let itemCount = 3;

  let itemCount = 5;
  console.log(itemCount);
solution: 2
options:
  - "السطر 1"
  - "السطر 2"
  - "السطر 3"
  - "السطر 4"
explanation: |
  الخطأ في `السطر 3` لأن `المتغيّر` `itemCount` قد تم تعريفه بالفعل.

  لإصلاح ذلك، ستكتب ببساطة `itemCount = 5;` بدون الكلمة المفتاحية `let`.

