type: "quiz"
lang: "javascript"
question: |
  الصق الكود التالي في `الكونسول` الخاص بمتصفحك واضغط على زر Enter.
  ما هي القيمة التي تعرضها دالة `console.log`؟
code: |
  console.log("أهلاً بالعالم!");
solution: 0
options:
  - "أهلاً بالعالم!"
  - "console.log"
  - "خطأ"
  - "undefined"
explanation: |
  دالة `console.log()` مصممة للقيام بشيء أساسي واحد: **طباعة** القيمة التي تعطيها لها في الكونسول.
  قد ترى أيضاً كلمة `undefined` تظهر بعد رسالتك. تجاهل هذا الأمر في الوقت الحالي.
