type: "quiz"
lang: "javascript"
question: |
  ماذا يحدث للكود الذي كتبته في الكونسول بعد تحديث صفحة الويب؟
solution: 1
options:
  - "يتم حفظه تلقائياً."
  - "يختفي."
  - "يعمل مرة أخرى."
explanation: |
  الكونسول بيئة مؤقتة. إنه "ملعب"، وليس مكاناً دائماً لحفظ الكود. عندما تقوم بتحديث الصفحة، تتم إعادة تعيين بيئة التشغيل، وأي كود كتبته يختفي. في الدرس التالي، سنتعلم كيفية حفظ الكود بشكل دائم.
