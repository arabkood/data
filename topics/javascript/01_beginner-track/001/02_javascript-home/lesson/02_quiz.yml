type: "quiz"
lang: "javascript"
question: |
  إذا كتبت كوداً لإرسال بريد إلكتروني ترحيبي تلقائياً عند تسجيل مستخدم جديد في موقع ويب، فأين سيعمل هذا الكود على الأرجح؟
solution: 1
options:
  - "في متصفح المستخدم."
  - "على الخادم."
  - "في كلا المكانين."
explanation: |
  هذه مهمة كلاسيكية من مهام `الخادم`. لا تريد أن يكون متصفح المستخدم مسؤولاً عن إرسال بريد إلكتروني. الخادم هو الذي يتولى العمليات الآمنة والموثوقة مثل هذه بعد استلام معلومات تسجيل المستخدم.
