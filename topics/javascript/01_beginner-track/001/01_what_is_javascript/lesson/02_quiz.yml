type: "quiz"
lang: "javascript"
question: |
  ما هو الدور الأساسي للغة `جافاسكريبت` في صفحات الويب؟
solution: 2
options:
  - "بناء هيكل المحتوى."
  - "تنسيق الصفحة بالألوان والخطوط."
  - "إضافة التفاعلية والسلوك."
explanation: |
  بينما تهتم `HTML` بهيكلة المحتوى و `CSS` بتنسيقه، فإن الوظيفة الرئيسية لـ `جافاسكريبت` هي إضافة السلوك، مثل الاستجابة لنقرات المستخدم، والتحقق من صحة النماذج، وإنشاء تأثيرات تفاعلية.
