type: "quiz"
lang: "javascript"
question: |
  What is the primary role of JavaScript on a webpage?
solution: 2
options:
  - "To structure the content."
  - "To style the page with colors and fonts."
  - "To add interactivity and behavior."
explanation: |
  While HTML structures the content and CSS styles it, JavaScript's main job is to add behavior, like responding to user clicks, validating forms, and creating dynamic effects.
