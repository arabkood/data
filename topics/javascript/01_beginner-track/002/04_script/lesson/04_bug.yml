type: "bug"
lang: "html"
question: "هذا الكود يحاول إضافة `جافاسكريبت` إلى الصفحة، لكن `وسم` الـ `&lt;script&gt;` موضوع في مكان غير موصى به. أي سطر يحتوي على هذا الخطأ في الممارسة؟"
code: |
  <html>
    <head>
      <title>My Page</title>
      <script></script>
    </head>
    <body>
      <h1>Welcome</h1>
    </body>
  </html>
solution: 3
explanation: |
  على الرغم من أن الكود قد يعمل، فإن أفضل ممارسة هي وضع `وسم` الـ `&lt;script&gt;` قبل إغلاق `وسم` الـ `&lt;body&gt;` مباشرةً. وضعه في الـ `&lt;head&gt;` يمكن أن يؤخر عرض محتوى الصفحة للمستخدم، لأن المتصفح سيحاول تحميل وتنفيذ السكريبت أولاً.
hint: "تذكر، نريد أن يظهر محتوى الصفحة للمستخدم في أسرع وقت ممكن. أين يجب أن يكون السكريبت لكي لا يعيق ذلك؟"
