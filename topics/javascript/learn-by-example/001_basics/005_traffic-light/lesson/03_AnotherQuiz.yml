type: "quiz"
lang: javascript
question: |
  الآن جرب تطبيق ما تعلمته! ما هو الناتج المتوقع لهذا الكود؟
code: |
  // حالة الطقس اليوم
  const temperature = 22;

  if (temperature > 30) {
    console.log("الجو حار جداً 🔥");
  } else if (temperature > 20) {
    console.log("الجو معتدل 🌤️");
  } else if (temperature > 10) {
    console.log("الجو بارد قليلاً 🌥️");
  } else {
    console.log("الجو بارد جداً ❄️");
  }
solution: 1
options:
  - "الجو حار جداً 🔥"
  - "الجو معتدل 🌤️"
  - "الجو بارد قليلاً 🌥️"
  - "الجو بارد جداً ❄️"
explanation: |
  قيمة المتغير `temperature` هي 22. الكود يفحص الشروط بالترتيب:
  - `temperature > 30` خطأ (22 ليس أكبر من 30)
  - `temperature > 20` صحيح (22 أكبر من 20) ✅

  لذلك ينفذ الكود داخل أول `else if` ويطبع "الجو معتدل 🌤️" ثم يتوقف عن فحص باقي الشروط.
