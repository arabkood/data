type: "quiz"
lang: javascript
question: |
  هذه المرة، نبدأ بسؤال. خمّن ما هو الناتج المتوقع لهذا الكود؟
code: |
  // تحديد مستوى الطالب
  const grade = 85;
  if (grade >= 90) {
    console.log("ممتاز (A)");
  } 
  if (grade >= 80) {
    console.log("جيد جداً (B)");
  } 
  if (grade >= 70) {
    console.log("جيد (C)");
  } 
  if (grade < 70) {
    console.log("يحتاج تحسين (F)");
  }
solution: 2
options:
  - "ممتاز (A)"
  - "جيد جداً (B)"
  - "جيد جداً (B) و جيد (C)"
  - "يحتاج تحسين (F)"
explanation: |
  قيمة المتغير `grade` هي 85. الكود يفحص كل شرط منفصل:
  - `grade >= 90` خطأ (85 < 90)
  - `grade >= 80` صحيح (85 ≥ 80) → يطبع "جيد جداً (B)"
  - `grade >= 70` صحيح أيضاً (85 ≥ 70) → يطبع "جيد (C)"
  - `grade < 70` خطأ (85 ليس أقل من 70)

  النتيجة: سيطبع "جيد جداً (B)" و "جيد (C)" معاً! لكن هناك طريقة أفضل لكتابة هذا الكود.
