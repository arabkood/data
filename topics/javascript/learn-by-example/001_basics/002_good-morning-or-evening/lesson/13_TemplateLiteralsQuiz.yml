type: "quiz"
lang: "javascript"
question: |
  What will the following code print?

code: |
  const name = "Hanif";
  const age = 25;
  console.log(`${name} is ${age} years old.`);

options:
  - "Hanif is age years old."
  - "name is 25 years old."
  - "Hanif is 25 years old."
  - "${name} is ${age} years old."

solution: 3
explanation: |
  Template literals replace `${name}` and `${age}` with the values of those variables, so the output is: "Hanif is 25 years old."
