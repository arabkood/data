type: "quiz"
lang: "javascript"
question: |
  What does the `console.log()` function do in JavaScript?

options:
  - "Stops the program from running"
  - "Displays messages or values in the console"
  - "Changes the color of the webpage"
  - "Saves data to a file"

solution: 1
explanation: |
  `console.log()` is used to display messages or values in the console, which helps developers see output or debug their code.
