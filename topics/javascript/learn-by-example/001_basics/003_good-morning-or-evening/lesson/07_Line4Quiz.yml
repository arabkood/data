type: "quiz"
lang: javascript
question: |
  What will happen if you write the following code without quotation marks around the name?

code: |
  const yourName = Muhammad;

solution: 2
options:
  - "It will store Muhammad as a string automatically"
  - "It will ask the user to enter their name"
  - "It will throw an error because Muhammad is not defined"
  - "It will convert Muhammad to a number"
explanation: |
  Without quotation marks, the computer thinks `Muhammad` is a variable, not a string. Since that variable doesn’t exist, it throws an error.
