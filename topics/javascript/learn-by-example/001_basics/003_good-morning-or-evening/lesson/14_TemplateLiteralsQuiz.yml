type: "quiz"
lang: "javascript"
question: |
  ما هي النتيجة التي ستُطبع عند تشغيل هذا الكود؟
code: |
  const studentName = "خالد";
  let score = 95;

  if (score >= 90) {
    console.log(`مبروك ${studentName}! درجتك ممتاز`);
  } else {
    console.log(`${studentName}، تحتاج إلى تحسين`);
  }
solution: 0
options:
  - "مبروك خالد! درجتك ممتاز"
  - "خالد، تحتاج إلى تحسين"
  - "`مبروك ${studentName}! درجتك ممتاز`"
  - "سيحدث خطأ في الكود"
explanation: |
  لنتابع الكود خطوة بخطوة:

  1. `studentName` يحمل القيمة `"خالد"` (نص محفوظ في **ثابت**)
  2. `score` يحمل القيمة `95` (رقم محفوظ في **متغير**)
  3. الشرط `score >= 90` يعني: هل `95 >= 90`؟ **نعم** (`:true`)
  4. لذلك ينفذ كتلة `if` ويطبع الرسالة الأولى
  5. **النصوص المتقدمة** تستبدل `${studentName}` بـ `"خالد"`

  النتيجة: `"مبروك خالد! درجتك ممتاز"`
