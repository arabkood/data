type: "quiz"
lang: javascript
question: |
  If the current time is 3:45 PM, what is the value of `hour` after this code runs?

code: |
  const now = new Date();
  const hour = now.getHours();

solution: 2
options:
  - "3"
  - "345"
  - "15"
  - "45"
explanation: |
  The `.getHours()` method returns the hour in 24-hour time. So 3:45 PM becomes `15`. The value of `hour` is `15`.
