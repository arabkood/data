type: "quiz"
lang: "javascript"
question: |
  ما هي وظيفة `console.log()` في جافاسكريبت؟
options:
  - "إيقاف تشغيل البرنامج"
  - "عرض الرسائل أو القيم في وحدة التحكم"
  - "تغيير لون صفحة الويب"
  - "حفظ البيانات في ملف"
solution: 1
explanation: |
  `console.log()` تُستخدم لعرض الرسائل أو القيم في **وحدة التحكم** (`:console`)، مما يساعد المطورين على رؤية مخرجات البرنامج أو تتبع الأخطاء في الكود.

  إنها مثل "النافذة" التي نطل منها لنرى ما يحدث داخل برنامجنا!
