type: "quiz"
lang: javascript
question: |
  إذا كانت الساعة الحالية 3:45 مساءً، فما قيمة `hour` بعد تنفيذ الكود التالي؟

code: |
  const now = new Date();
  const hour = now.getHours();

solution: 2
options:
  - "12"
  - "345"
  - "15"
  - "45"
explanation: |
  الدالة `.getHours()` تُرجع الساعة بنظام 24 ساعة. لذلك، 3:45 مساءً تُصبح `15`. وبالتالي، قيمة `hour` هي `15`.
