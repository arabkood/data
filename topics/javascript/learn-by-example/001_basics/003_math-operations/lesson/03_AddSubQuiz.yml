type: "quiz"
lang: javascript
question: |
  ما هي القيمة النهائية للمتغير `result` في هذا الكود؟
code: |
  let num1 = 15;
  let num2 = 7;
  let num3 = 3;
  let result = num1 - num2 + num3;
solution: 1
options:
  - "5"
  - "11"
  - "19"
  - "25"
explanation: |
  لنتبع العمليات خطوة بخطوة:
  1. `num1 - num2` يعني `15 - 7`، والناتج هو `8`.
  2. ثم `8 + num3` يعني `8 + 3`، والناتج النهائي هو `11`.

  لذلك، `result` سيحمل القيمة `11`.
