type: "quiz"
lang: javascript
question: |
  ماذا سيتم طباعته في الكونسول بعد تنفيذ هذا الكود؟
code: |
  let x = 2;
  let y = 3;
  console.log(x + y * 2);
solution: 1
options:
  - "7"
  - "8"
  - "10"
  - "6"
explanation: |
  نطبق ترتيب العمليات:

  العبارة: `x + y * 2`
  القيم: `x = 2`, `y = 3`

  1. نبدأ بالضرب: `y * 2 = 3 * 2 = 6`
  2. ثم الجمع: `x + 6 = 2 + 6 = 8`

  إذن، الرقم الذي سيتم طباعته هو `8`.
