type: "quiz"
lang: javascript
question: |
  ما هي القيمة النهائية للمتغير `finalValue` بعد تنفيذ هذا الكود؟
code: |
  let x = 5;
  let y = 3;
  let z = 2;
  let finalValue = (x + y) * z - x % y + z * z;
solution: 1
options:
  - "15"
  - "18"
  - "20"
  - "12"
explanation: |
  لنقم بحسابها خطوة بخطوة مع مراعاة ترتيب العمليات:

  العبارة هي: `(x + y) * z - x % y + z * z`
  القيم: `x = 5`, `y = 3`, `z = 2`

  1.  **الأقواس `(x + y)`**:
      `5 + 3 = 8`
      العبارة تصبح: `8 * z - x % y + z * z`

  2.  **الضرب والقسمة وباقي القسمة (من اليسار إلى اليمين)**:
      -   `8 * z` (الضرب): `8 * 2 = 16`
      -   `x % y` (باقي القسمة): `5 % 3 = 2` (لأن 5 قسمة 3 هي 1 والباقي 2) -   `z * z` (الضرب): `2 * 2 = 4`
      العبارة تصبح: `16 - 2 + 4`

  3.  **الجمع والطرح (من اليسار إلى اليمين)**:
      -   `16 - 2` (الطرح): `14`
      -   `14 + 4` (الجمع): `18`

  إذن، القيمة النهائية لـ `finalValue` هي `18`.
