type: "quiz"
lang: javascript
question: |
  ما هو الخطأ في هذا الكود الذي يهدف إلى طباعة الأرقام من 1 إلى 5؟
code: |
  for (let i = 1; i <= 5; i--) {
    console.log(i);
  }
solution: 3
options:
  - "الشرط غير صحيح (`i <= 5`) ❌"
  - "المتغير `i` لم يتم تعريفه بشكل صحيح ❌"
  - "يجب استخدام `i++` بدلاً من `i--` ✅"
  - "الحلقة لا يمكن أن تعد إلى 5 ❌"
explanation: |
  لاحظ أن الحلقة تستخدم `i--`، مما يعني أن القيمة تقلّ بدلًا من أن تزداد.  
  - البداية: `i = 1`
  - التكرار الأول: `i = 1`, يطبع 1 → ثم `i--` ← `i = 0`
  - التكرار الثاني: `i = 0`, الشرط `0 <= 5` صحيح، لكن مع الاستمرار هكذا، ستُصبح القيم سالبة وستستمر الحلقة إلى الأبد ⇒ **حلقة لا نهائية!**

  ✅ الحل الصحيح هو استبدال `i--` بـ `i++` داخل جزء التحديث في الحلقة.
