type: "quiz"
lang: javascript
question: |
  ما هو `:type` القيمة `"123"`؟
code: |
  let value = "123";
solution: 1
options:
  - "`number` - لأنه يحتوي على أرقام"
  - "`string` - لأنه محاط بعلامات اقتباس"
  - "`boolean` - لأنها قيمة بسيطة"
  - "`undefined` - لأنه ليس رقمًا حقيقيًا"
explanation: |
  على الرغم من أن `"123"` يحتوي على أرقام، فإن علامات الاقتباس تجعله `:string`.

  - بدون علامات اقتباس، سيكون `123` من النوع `:number`.
  - علامات الاقتباس هي المؤشر الرئيسي لنوع البيانات `:string`.
