type: "quiz"
lang: javascript
question: |
  كيف تطبع رسالة تحتوي على نص وقيمة متغير باستخدام `console.log()`؟
  مثلًا: لديك متغير `points` يحتوي على عدد النقاط، وتريد طباعة: `لديك 50 نقطة`.
code: |
  let points = 50;
  __@@INPUT@@__
solution: 2
options:
  - "console.log('لديك points نقطة');"
  - 'console.log("لديك", points, "نقطة");'
  - "console.log('لديك' + 'points' + 'نقطة');"
  - 'console.log(points "نقطة");'
explanation: |
  في جافاسكريبت، يمكنك طباعة نصوص مع المتغيرات باستخدام `console.log()` بتمريرها مفصولة بفواصل:

  ```javascript
  console.log("لديك", points, "نقطة");
  ```
