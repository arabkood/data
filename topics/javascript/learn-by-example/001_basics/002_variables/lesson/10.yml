type: "quiz"
lang: javascript
question: |
  كيف تطبع نصًا وقيمة `:variable` معًا؟
code: |
  let points = 50;
  __@@INPUT@@__
solution: 1
options:
  - "console.log(You have points points);"
  - 'console.log("You have", points, "points");'
  - "console.log(You have + points + points);"
  - 'console.log("points");'
explanation: |
  يمكنك تمرير قيم متعددة إلى `console.log()` مفصولة بفواصل. سيتم عرض كل قيمة (نص بين علامتي اقتباس و `:variable`) مع مسافات بينها.
