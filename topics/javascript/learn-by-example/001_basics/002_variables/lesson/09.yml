type: "quiz"
lang: javascript
question: |
  ماذا سيعرض هذا الكود في `:console`؟
code: |
  let message = "Welcome";
  console.log(message);
solution: 0
options:
  - "Welcome"
  - "message"
  - "let message"
  - "undefined"
explanation: |
  الدالة `console.log(message)` تعرض القيمة المخزنة في `:variable` `message`، وهي `"Welcome"`. إنها تطبع محتويات الـ `:variable`، وليس اسم الـ `:variable` نفسه.
