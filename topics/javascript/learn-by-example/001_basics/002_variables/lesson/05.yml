type: "quiz"
lang: javascript
question: |
  ما هو `:type` البيانات الذي يجب أن تستخدمه لتخزين اسم شخص؟
code: |
  let name = ?;
solution: 0
options:
  - "`string`"
  - "`number`"
  - "`boolean`"
  - "`undefined`"
explanation: |
  اسم الشخص هو نص، لذا يجب تخزينه كـ `:type` بيانات `:string`. على سبيل المثال: 
  `let personName = "محمد";`
