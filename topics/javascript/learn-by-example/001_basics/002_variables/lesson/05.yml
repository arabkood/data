type: "quiz"
lang: javascript
question: |
  ما هو نوع `:type` البيانات الذي يجب أن تستخدمه لتخزين اسم شخص؟
code: |
  let name = ?;
solution: 0
options:
  - "`:string`"
  - "`:number`"
  - "`:boolean`"
  - "`:undefined`"
explanation: |
  اسم الشخص هو نص، لذا يجب تخزينه كـ `:string`. على سبيل المثال: 
  ```javascript
  let personName = "محمد";
  ```
