type: "quiz"
lang: javascript
question: |
  أي من هذه المتغيرات هو `:boolean`؟
code: |
  let a = "true";
  let b = 1;
  let c = false;
  let d = "yes";
solution: 2
options:
  - "المتغير a"
  - "المتغير b"
  - "المتغير c"
  - "المتغير d"
explanation: |
  - المتغير `c` يحتوي على `false`، وهي إحدى القيمتين من النوع `:boolean`.

  - المتغير `a` هو `string` لأن القيمة `true` محاطة بعلامتي اقتباس. 
  - المتغير `b` هو من النوع `number`، والمتغير `d` هو أيضًا `:string`.
