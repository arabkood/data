type: "quiz"
lang: javascript
question: |
  ماذا سيكون ناتج هذا البرنامج؟
code: |
  let city = "الرياض";
  let population = 7000000;
  console.log("City: " + city);
  console.log("Population: " + population);
solution: 2
options:
  - "City: city\nPopulation: population"
  - "الرياض 7000000"
  - "City: الرياض\nPopulation: 7000000"
  - "خطأ - لا يمكن مزج العربية والأرقام"
explanation: |
  العامل `+` يُستخدم لدمج النص مع المتغير.
  كل سطر `console.log()` يطبع جزءًا منفصلًا:
  "City: الرياض"
  ثم "Population: 7000000".
