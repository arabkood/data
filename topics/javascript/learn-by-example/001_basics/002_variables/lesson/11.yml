type: "quiz"
lang: javascript
question: |
  What will this program output?
code: |
  let city = "الرياض";
  let population = 7000000;
  console.log("City: " + city);
  console.log("Population: " + population);
solution: 2
options:
  - "City: city\nPopulation: population"
  - "الرياض 7000000"
  - "City: الرياض\nPopulation: 7000000"
  - "Error - cannot mix Arabic and numbers"
explanation: |
  The `+` operator combines the text with the variable values. Each `console.log()` prints on a separate line, showing "City: الرياض" then "Population: 7000000".
