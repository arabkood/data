type: "quiz"
lang: javascript
question: |
  ماذا يفعل هذا الكود؟
code: |
  let studentName = "أحمد";
solution: 1
options:
  - "يطبع أحمد"
  - "ينشئ `:variable` يسمى `studentName` ويخزن `أحمد` فيه"
  - "يغير `:variable` موجود إلى `أحمد`"
  - "يحذف `:variable` يسمى `أحمد`"
explanation: |
  الكلمة `let` تنشئ متغير (`:variable`) جديد باسم `studentName` وتسند إليه القيمة "أحمد"
