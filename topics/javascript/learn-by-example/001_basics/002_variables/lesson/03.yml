type: "quiz"
lang: javascript
question: |
  ماذا يفعل هذا الكود؟
code: |
  let studentName = "Ahmed";
solution: 1
options:
  - "يطبع `Ahmed` إلى `:console`"
  - "ينشئ `:variable` يسمى `studentName` ويخزن `Ahmed` فيه"
  - "يغير `:variable` موجود إلى `Ahmed`"
  - "يحذف `:variable` يسمى `Ahmed`"
explanation: |
  الكلمة  `let` تنشئ `:variable` جديد باسم `studentName` وتسند إليه القيمة `"Ahmed"`. يمكن الآن استخدام هذا `:variable` في أماكن أخرى من الكود.
