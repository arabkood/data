type: "quiz"
lang: javascript
question: |
  ماذا سيطبع هذا الكود؟
code: |
  let count = 5;

  while (count > 2) {
    console.log(count);
    count--;
  }
solution: 2
options:
  - "5, 4, 3, 2"
  - "5, 4, 3, 2, 1"
  - "5, 4, 3"
  - "لا يطبع شيئاً"
explanation: |
  لنتتبع الحلقة:

  - **الشرط**: `count > 2` (نستمر طالما count أكبر من 2)
  - نبدأ بـ `count = 5`

  التكرارات:
  1. `count = 5` ← الشرط `5 > 2` صحيح، يطبع 5، ثم `count = 4`
  2. `count = 4` ← الشرط `4 > 2` صحيح، يطبع 4، ثم `count = 3`
  3. `count = 3` ← الشرط `3 > 2` صحيح، يطبع 3، ثم `count = 2`
  4. `count = 2` ← الشرط `2 > 2` خاطئ، تتوقف الحلقة

  النتيجة: `5, 4, 3`
