type: "quiz"
lang: javascript
question: |
  ما هي النتيجة الكاملة لهذا الكود؟
code: |
  console.log("تحضير الإطلاق...");

  for (let countdown = 3; countdown >= 1; countdown--) {
    console.log(`T-${countdown}`);
  }

  console.log("إقلاع!");
solution: 2
options:
  - "تحضير الإطلاق...\nT-1\nT-2\nT-3\nإقلاع!"
  - "تحضير الإطلاق...\nT-3\nT-2\nT-1"
  - "تحضير الإطلاق...\nT-3\nT-2\nT-1\nإقلاع!"
  - "T-3\nT-2\nT-1\nإقلاع!"
explanation: |
  لننفذ الكود خطوة بخطوة:

  1. يطبع: `"تحضير الإطلاق..."`
  2. الحلقة تبدأ بـ `countdown = 3`:
     - التكرار 1: `countdown = 3` ← يطبع `"T-3"`
     - التكرار 2: `countdown = 2` ← يطبع `"T-2"`
     - التكرار 3: `countdown = 1` ← يطبع `"T-1"`
     - `countdown = 0` ← الشرط `0 >= 1` خاطئ، تتوقف الحلقة
  3. يطبع: `"إقلاع!"`

  النتيجة الكاملة:
  ```

  تحضير الإطلاق...
  T-3
  T-2
  T-1
  إقلاع!

  ```
