type: "quiz"
lang: "javascript"
question: |
  أنت تبني نظامًا لمكتبة مدرسية. تحتاج إلى تخزين العنوان "Omar's Journey".

  **أي خيار يُنشئ السلسلة النصية بشكل صحيح**؟
code: |
  // كيف يجب أن نخزّن العنوان؟
  let title = @@INPUT@@;
solution: 1
options:
  - |
    'Omar's Journey'
  - |
    "Omar's Journey"
  - |
    'Omar"s Journey'
explanation: |
  لأن النص يحتوي على علامة اقتباس مفردة (فاصلة عليا)، فإن تغليف الـ`سلسلة النصية` بأكملها بعلامات اقتباس مزدوجة هي الطريقة الأنظف لكتابتها.

  استخدام علامات الاقتباس المفردة كان سيتطلب معالجة خاصة سنتطرق إليها لاحقًا.
