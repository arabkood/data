type: "quiz"
lang: "javascript"
question: |
  أوه، يبدو أنه تم نسيان شيء ما عند استدعاء الدالة.

  **ما الذي سيُطبع في الطرفية ** عند تشغيل هذا الكود؟
code: |
  function announceCity(cityName) {
    console.log("انا اعيش في " + cityName);
  }

  announceCity(); // لقد نسينا تمرير الوسيط!
solution: 3
options:
  - "انا اعيش في"
  - Error
  - "انا اعيش في cityName"
  - "انا اعيش في undefined"
explanation: |
  عندما تتوقع دالةٌ وسيطًا ولكنها لا تستلمه، يصبح `المُعامِل` الخاص بها `undefined`.

  الكود سيعمل، لكن النتيجة لن تكون كما أردنا!
