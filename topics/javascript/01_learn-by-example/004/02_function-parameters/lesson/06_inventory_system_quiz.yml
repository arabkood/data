type: "quiz"
lang: "javascript"
question: |
  أنت تبني نظام جرد لمحل تمور محلي.

  **أي سطر من الكود** سيطبع الرسالة التالية بشكل صحيح: `لدينا 50 صندوقًا من تمر العجوة.`؟
code: |
  function updateInventory(type, quantity) {
    console.log("لدينا " + quantity + " صندوقًا من تمر " + type + ".");
  }

  @@INPUT@@
solution: 1
options:
  - updateInventory(50, "عجوة");
  - updateInventory("عجوة", 50);
  - updateInventory(type, quantity);
  - updateInventory("50", "عجوة");
explanation: |
  يجب تمرير `الوسائط` بنفس ترتيب تعريف `المُعامِلات`.

  `المُعامِل` الأول هو `type` (أي `"عجوة"`)، والثاني هو `quantity` (أي `50`). الخيار الآخر يعكس الترتيب، مما سيؤدي لطباعة رسالة خاطئة.

