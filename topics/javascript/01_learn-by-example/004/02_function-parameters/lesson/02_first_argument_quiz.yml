type: "quiz"
lang: "javascript"
question: |
  لنساعد عمر في تحية صديقه.

  **املأ الفراغ** لجعل الدالة تطبع `أهلاً، خالد!`
code: |
  function welcome(friendName) {
    console.log("أهلاً، " + friendName + "!");
  }

  welcome(@@INPUT@@);
solution: 1
options:
  - friendName
  - \"خالد\"
  - خالد
explanation: |
  إجابة صحيحة! `المُعامِل` هو `friendName`، والذي يعمل كمكان مخصص.

  لكي تعمل الدالة، نحتاج إلى تمرير قيمة بيانات حقيقية - أي `وسيط` - مثل النص `"خالد"`.

