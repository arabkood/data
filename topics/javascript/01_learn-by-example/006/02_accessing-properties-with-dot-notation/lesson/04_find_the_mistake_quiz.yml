type: "quiz"
lang: "javascript"
question: |
  هذا كائن لسيارة جديدة. الكود أدناه يحتوي على خطأ.

  **ما هو سبب المشكلة؟**
code: |
  let car = {
    make: "Toyota",
    model: "Camry",
    year: 2023
  };

  console.log(car.color);
solution: 0
options:
  - "خاصية `color` غير موجودة في الكائن `car`."
  - "يجب أن تكون قيمة `year` نصًا (`string`) وليس رقمًا."
  - "لا يمكنك استخدام `console.log` مع الكائنات."
  - "الكائن `car` لم يتم تعريفه بشكل صحيح."
explanation: |
  الكائن `car` يحتوي على الخصائص `make` و `model` و `year`، ولكنه لا يحتوي على خاصية `color`. محاولة الوصول إليها تُرجع القيمة `undefined`.

