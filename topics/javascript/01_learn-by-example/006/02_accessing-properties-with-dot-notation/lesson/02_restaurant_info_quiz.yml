type: "quiz"
lang: "javascript"
question: |
  لنتدرب قليلًا! لدينا كائن يمثّل مطعمًا في القاهرة.

  ما هو ناتج هذا الكود؟
code: |
  let restaurant = {
    name: "Gad Restaurants",
    city: "Cairo",
    rating: 4.5
  };

  console.log(restaurant.city);
solution: 1
options:
  - "name"
  - "Cairo"
  - "4.5"
  - "city"
explanation: |
  الكود `restaurant.city` يستخدم `ترميز النقطة` للوصول إلى قيمة خاصية `city`، وهي "Cairo".

