type: "quiz"
lang: "javascript"
question: |
  لدينا هنا كائن للطالب `Adel`. 

  **املأ الفراغ** حتى تتمكن الدالة `getReport` من الوصول إلى اسم الطالب بشكل صحيح.
code: |
  const student = {
    name: "Adel",
    grade: 88,
    getReport: function() {
      return `تقرير لـ: ${@@INPUT@@}`;
    }
  };

  console.log(student.getReport());
solution: 2
options:
  - "name"
  - "this.name"
  - "this"
  - "student.name"
explanation: |
  داخل الدالة، `this` هي الكلمة المفتاحية المستخدمة للإشارة إلى الكائن نفسه.

  لذا، `this.name` تصل بشكل صحيح إلى خاصية `name` في كائن `student`.

