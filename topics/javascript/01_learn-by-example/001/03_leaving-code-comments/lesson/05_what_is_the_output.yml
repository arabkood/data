type: "quiz"
lang: "javascript"
question: |
  لنرى ما إذا كان بإمكانك تمييز التعليقات!

  ما هو الناتج النهائي لهذه الشيفرة؟
code: |
  // هذا البرنامج يتتبع مخزون متجر صغير
  console.log("المنتجات المتوفرة:");

  /*
  console.log("تمور");
  console.log("حبوب البن");
  */

  console.log("بهارات");
solution: 3
options:
  - "المنتجات المتوفرة:"
  - |
    المنتجات المتوفرة:
    تمور
    حبوب البن
    بهارات
  - بهارات
  - |
    المنتجات المتوفرة:
    بهارات
explanation: |
  الكتلة التي تحتوي على "تمور" و"حبوب البن" موجودة داخل `تعليق` متعدد الأسطر (`/* ... */`)، لذلك يتخطاها الحاسوب. هو يطبع فقط الأسطر التي ليست تعليقات. ✨

