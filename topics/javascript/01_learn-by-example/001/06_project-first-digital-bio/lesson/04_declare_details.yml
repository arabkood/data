type: "quiz"
lang: "javascript"
question: |
  لنخزّن العمر والمسمى الوظيفي. قد تتغير هذه القيم في المستقبل.

  **أي خيار ينشئ هذه المتغيرات بشكل صحيح؟**
code: |
  // الخيار 1
  const age = 32;
  const job = "محاسبة";

  // الخيار 2
  let age = 32;
  let job = "محاسبة";

  // الخيار 3
  let age: 32;
  let job: "محاسبة";
solution: 1
options:
  - "الخيار 1"
  - "الخيار 2"
  - "الخيار 3"
explanation: |
  نستخدم `let` للتصريح عن المتغيرات عندما نتوقع أن قيمها **قد تحتاج إلى تحديث لاحقًا**. استخدام `const` سيسبب خطأ لو حاولنا تغيير العمر في العام القادم.

