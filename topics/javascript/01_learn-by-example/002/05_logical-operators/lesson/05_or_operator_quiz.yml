type: "quiz"
lang: "javascript"
question: |
  يقدم مقهى قهوة مجانية إذا كان اسمك `Omar` **أو** إذا كان يوم ميلادك. بالنظر إلى الشيفرة أدناه، ما هو الناتج؟
code: |
  let customerName = "Khalid";
  let isBirthday = true;

  let freeCoffee = (customerName === "Omar") || (isBirthday === true);

  console.log(freeCoffee);
solution: 2
options:
  - "`false`"
  - "`SyntaxError`"
  - "`true`"
  - "`undefined`"
explanation: |
  على الرغم من أن `customerName === "Omar"` نتيجته `false`، إلا أن الشرط الثاني `isBirthday === true` نتيجته `true`. المُعامِل `||` (`OR`) يحتاج فقط إلى شرط واحد صحيح لتكون النتيجة النهائية `true`.

