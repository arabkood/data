  let found = false;

  for (let i = 0; i < numbers.length; i++) {
    // ما هو الشرط الصحيح هنا؟
    if ( __@@INPUT@@__ ) {
      found = true;
      break;
    }
  }
options:
  - "`numbers[i] === target`"
  - "`numbers[i] = target`"
  - "`numbers.length === 7`"
