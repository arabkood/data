type: "quiz"
lang: "javascript"
question: |
  لديك `:array` تحتوي على بيانات منتج. إذا كان السعر (في الفهرس 1) مفقودًا، فيجب أن يكون `50` افتراضيًا. ما هو التعديل الصحيح للكود؟
code: |
  const productData = ["كتاب"];
  const price = productData[1] || 50;
  const finalPrice = price + 10;
  console.log(finalPrice);
options:
  - "يطبع `60`"
  - "يطبع `NaN`"
  - "يحدث `:syntax error`"
  - "يطبع `5010`"
solution: 0
explanation: |
  بما أن `productData[1]` هو `:undefined`، فإن `:variable` المسمى `price` يأخذ القيمة الافتراضية `50`. بعد ذلك، `50 + 10` يساوي `60`.