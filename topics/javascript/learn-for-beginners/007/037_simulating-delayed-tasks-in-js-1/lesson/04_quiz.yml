type: "quiz"
lang: "javascript"
question: |
  أكمل الكود التالي لطباعة "مرحباً بعد 3 ثوانٍ" باستخدام `:setTimeout`.
code: |
  function showWelcome() {
    console.log("مرحباً بعد 3 ثوانٍ");
  }

  setTimeout(showWelcome, __@@INPUT@@__);
options:
  - "3"
  - "300"
  - "3000"
  - "'3000'"
solution: 2
explanation: |
  الوقت في `:setTimeout` يُقاس بالمللي ثانية. لتأجيل المهمة لمدة 3 ثوانٍ، نحتاج إلى `3 * 1000 = 3000` مللي ثانية.