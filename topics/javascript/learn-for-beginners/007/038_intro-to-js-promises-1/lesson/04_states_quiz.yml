type: "quiz"
lang: "javascript"
question: |
  أي من الخيارات التالية **ليست** حالة من حالات الـ `:Promise`؟
solution: 2
options:
  - "`:pending`"
  - "`:fulfilled`"
  - "`:waiting`"
  - "`:rejected`"
explanation: |
  الحالات الرسمية الثلاث للـ `:Promise` هي `:pending` (قيد الانتظار)، `:fulfilled` (تم الوفاء به)، و `:rejected` (تم رفضه). مصطلح `:waiting` ليس جزءاً من مواصفات الـ `:Promise`.