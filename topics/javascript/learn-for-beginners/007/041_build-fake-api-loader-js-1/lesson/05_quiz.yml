type: "quiz"
lang: "javascript"
question: |
  أي دالة من دوال الـ`:callback` التالية نستخدمها داخل `:Promise` للإشارة إلى أن العملية قد اكتملت بنجاح؟
code: |
  const myPromise = new Promise((resolve, reject) => {
    // أي دالة تستدعى هنا للنجاح؟
  });
options:
  - "`reject()`"
  - "`success()`"
  - "`complete()`"
  - "`resolve()`"
solution: 3
explanation: |
  عند إنشاء `:Promise` جديد، يتم تمرير دالتين: `resolve` و `reject`. نستخدم `resolve()` للإشارة إلى أن العملية غير المتزامنة قد نجحت وأعادت قيمة.