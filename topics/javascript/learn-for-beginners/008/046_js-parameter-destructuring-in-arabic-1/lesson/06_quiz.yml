type: "quiz"
lang: "javascript"
question: |
  أكمل الكود الناقص لتعريف `:function` بحيث تقوم بالآتي:
  1. تستخرج خاصية `host` من الكائن وتسميها `serverAddress`.
  2. تستخرج خاصية `port`، وتعطيها قيمة افتراضية `8080`.
code: |
  function connect({ __@@INPUT@@__ }) {
    return `Connecting to ${serverAddress}:${port}`;
  }
  
  const config = { host: 'api.example.com' };
  console.log(connect(config));
options:
  - "`serverAddress: host, port: 8080`"
  - "`host: serverAddress, port = 8080`"
  - "`host as serverAddress, port || 8080`"
  - "`host, port`"
solution: 1
explanation: |
  الصيغة الصحيحة للجمع بين إعطاء اسم مستعار وتحديد قيمة افتراضية هي `host: serverAddress, port = 8080`.
  - `host: serverAddress` تعني: ابحث عن خاصية `host` وأنشئ متغيراً اسمه `serverAddress` بقيمتها.
  - `port = 8080` تعني: ابحث عن خاصية `port`، وإذا لم تجدها، أنشئ متغيراً اسمه `port` بقيمة `8080`.