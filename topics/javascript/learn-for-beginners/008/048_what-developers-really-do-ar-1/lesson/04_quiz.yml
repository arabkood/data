type: "quiz"
lang: "javascript"
question: |
  مطلوب منك إنشاء `:function` تقوم بدمج اسم أول وأخير. قام مبرمج مبتدئ بوضع الخطة التالية:
  
  1.  استقبال الاسم الأول.
  2.  استقبال الاسم الأخير.
  3.  ضرب الاسمين معًا.
  4.  إرجاع النتيجة.
  
  أي خطوة في هذه **الخطة** خاطئة؟
options:
  - "خطوة 1: استقبال الاسم الأول"
  - "خطوة 2: استقبال الاسم الأخير"
  - "خطوة 3: ضرب الاسمين معًا"
  - "خطوة 4: إرجاع النتيجة"
solution: 2
explanation: |
  الخطأ يكمن في مرحلة التخطيط. لا يمكن "ضرب" النصوص (`:string`). كان يجب أن تكون الخطة هي "دمج" أو "جمع" الاسمين معًا، وليس ضربهما. اكتشاف مثل هذه الأخطاء المنطقية مبكرًا يوفر الكثير من الوقت.