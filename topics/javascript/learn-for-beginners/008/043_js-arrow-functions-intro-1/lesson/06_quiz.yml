type: "quiz"
lang: "javascript"
question: |
  باستخدام ميزة الإرجاع الضمني، ما ناتج تنفيذ الكود التالي؟
code: |
  const createGreeting = name => "أهلاً, " + name;
  console.log(createGreeting("علي"));
options:
  - "`أهلاً, name`"
  - "`:undefined`"
  - "`أهلاً, علي`"
  - "سيحدث خطأ `SyntaxError`"
solution: 2
explanation: |
  الدالة `createGreeting` تستخدم الإرجاع الضمني. عند استدعائها بالقيمة `"علي"`، فإنها تُرجع `:string` `"أهلاً, علي"` مباشرة.