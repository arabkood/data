type: "quiz"
lang: "javascript"
question: |
  هذه المرة، الأداة خاصة. ما هو الخطأ في هذا الكود الذي سيمنع تشغيله؟
code: |
  function workInRoom() {
    let privateTool = "مفك"; // أداة خاصة
    console.log("أستخدم: " + privateTool);
  }

  workInRoom();
  console.log(privateTool); // محاولة استخدامها في الخارج
solution: 1
options:
  - "لا يوجد خطأ"
  - "تم استخدام `:variable` غير معرف خارج نطاقه"
  - "اسم `:function` غير صحيح"
  - "يجب استخدام `:const` بدلاً من `let`"
explanation: |
  المتغير `:privateTool` معرف داخل `:function`، لذلك هو ينتمي إلى النطاق المحلي (`:local scope`) الخاص بها ولا يمكن الوصول إليه من الخارج، مما يسبب `ReferenceError`.