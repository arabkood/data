type: "quiz"
lang: "javascript"
question: |
  الكود التالي يحتوي على خطأ يمنعه من العمل. ما هو الخطأ؟
code: |
  let contact = {
    name: "سارة",
    phone; "555-1234"
  };
options:
  - "يجب وضع فاصلة منقوطة بعد `"سارة"`"
  - "تم استخدام فاصلة منقوطة `;` بدلاً من نقطتين رأسيتين `:` للفصل بين المفتاح والقيمة"
  - "قيمة `:phone` يجب أن تكون رقمًا وليس نصًا"
  - "اسم الكائن `:contact` غير صالح"
solution: 1
explanation: |
  في الكائنات، يجب استخدام النقطتين الرأسيتين `:` للفصل بين كل `:key` و `:value` الخاص به. الفاصلة المنقوطة `;` تُستخدم لنهاية الأوامر البرمجية.