type: "quiz"
lang: "javascript"
question: |
  لماذا سيتوقف هذا الكود عن العمل ويعطي خطأ؟
code: |
  console.log(userAge);
  let userAge = 30;
options:
  - "لم يتم استدعاء `:function`"
  - "محاولة استخدام `:variable` قبل تعريفه"
  - "قيمة `30` كبيرة جدًا"
  - "يجب استخدام `:const` بدلاً من `let`"
solution: 1
explanation: |
  هذا ما يسمى `:ReferenceError`. لا يمكنك الوصول إلى قيمة `:variable` تم تعريفه بـ `let` أو `:const` قبل سطر التعريف. يجب أن يتم التعريف أولاً.