type: "quiz"
lang: "javascript"
question: |
  الكود التالي لا يطبع أي شيء على الشاشة. ما هو الخطأ المنطقي؟
code: |
  function showNumber() {
    let number = 10;
    console.log(number);
  }
options:
  - "الـ`:function` تحتاج إلى `:parameter`"
  - "يجب استخدام `:const` بدلاً من `let`"
  - "الـ`:function` تم تعريفها ولكن لم يتم استدعاؤها"
  - "اسم الـ`:function` غير صالح"
solution: 2
explanation: |
  مجرد تعريف `:function` لا يكفي لتشغيل الكود بداخلها. يجب عليك `استدعاء` الـ`:function` باسمها متبوعًا بقوسين `()` لتنفيذها، مثل `showNumber();`.