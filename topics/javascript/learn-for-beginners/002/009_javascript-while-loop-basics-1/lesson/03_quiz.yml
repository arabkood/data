type: "quiz"
lang: "javascript"
question: |
  أكمل الكود التالي لطباعة الأرقام من 0 إلى 2.
code: |
  let i = 0;
  while (__@@INPUT@@__) {
    console.log(i);
    i++;
  }
options:
  - "`i < 2`"
  - "`i <= 2`"
  - "`i > 2`"
  - "`i == 2`"
solution: 1
explanation: |
  نحن نريد أن تستمر الحلقة طالما أن `i` أصغر من أو يساوي `2`. سيتم تنفيذ الكود عندما تكون `i` تساوي `0`, `1`, و `2`. استخدام `i < 2` كان سيوقف الحلقة بعد طباعة `1` فقط.
