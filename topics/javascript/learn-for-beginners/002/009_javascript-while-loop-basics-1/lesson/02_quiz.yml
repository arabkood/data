type: "quiz"
lang: "javascript"
question: |
  ما هو الناتج النهائي الذي سيظهر على الشاشة عند تشغيل هذا الكود؟
code: |
  let count = 1;
  while (count < 4) {
    console.log("مرحباً");
    count = count + 1;
  }
options:
  - "سيطبع 'مرحباً' مرتين"
  - "سيطبع 'مرحباً' ثلاث مرات"
  - "سيطبع 'مرحباً' أربع مرات"
  - "لن يتوقف عن الطباعة (حلقة لا نهائية)"
solution: 1
explanation: |
  تبدأ الحلقة عندما يكون `:variable` `count` يساوي `1`. في كل مرة، يتم التحقق من الشرط `count < 4` ويتم طباعة "مرحباً". 
  سيتم التنفيذ عندما تكون `count` تساوي `1`, `2`, و `3`. عندما تصبح `4`، يتوقف الشرط وتنتهي الحلقة.
