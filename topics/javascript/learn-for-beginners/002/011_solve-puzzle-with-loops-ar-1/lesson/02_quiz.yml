type: "quiz"
lang: "javascript"
question: |
  لنبدأ بمفهوم أساسي. ما هو ناتج تنفيذ الكود التالي؟
code: |
  for (let i = 1; i < 4; i++) {
    console.log(i);
  }
options:
  - "`1 2 3 4`"
  - "`1 2 3`"
  - "`0 1 2`"
  - "سيحدث خطأ"
solution: 1
explanation: |
  هذه `:for loop` تبدأ العد من `1` وتستمر طالما أن `:variable` العداد `i` أصغر من `4`. في كل مرة، تطبع قيمة `i` ثم تزيدها بواحد. لذلك، ستطبع `1`، ثم `2`، ثم `3` وتتوقف.