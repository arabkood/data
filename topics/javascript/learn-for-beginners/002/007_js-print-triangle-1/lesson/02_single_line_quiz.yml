type: "quiz"
lang: "javascript"
question: |
  لنبني الأساس أولاً. أكمل الكود لطباعة سطر واحد يحتوي على 5 نجوم (`*****`).
code: |
  let line = "";
  for (let i = 0; i < 5; i++) {
    line += __@@INPUT@@__;
  }
  console.log(line);
solution: 1
options:
  - "`i`"
  - "`"*"`"
  - "`line`"
  - "`5`"
explanation: |
  في كل دورة من الـ`:loop`، نضيف `:string` يحتوي على `*` إلى `:variable` المسمى `line` لنبني السطر المطلوب.