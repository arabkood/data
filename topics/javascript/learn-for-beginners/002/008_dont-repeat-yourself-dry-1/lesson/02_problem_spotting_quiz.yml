type: "quiz"
lang: "javascript"
question: |
  ألقِ نظرة على هذا الكود. ما هي المشكلة الأساسية فيه من وجهة نظر الكفاءة والصيانة؟
code: |
  // طباعة رسالة للمستخدم الأول
  console.log("مرحباً بك، علي!");
  console.log("نتمنى لك يوماً سعيداً.");

  // طباعة رسالة للمستخدم الثاني
  console.log("مرحباً بك، فاطمة!");
  console.log("نتمنى لك يوماً سعيداً.");
options:
  - "الكود لا يعمل وسيسبب خطأ"
  - "يوجد تكرار غير ضروري في الكود"
  - "استخدام `:console.log` بكثرة يبطئ البرنامج"
  - "أسماء المتغيرات غير واضحة"
solution: 1
explanation: |
  المشكلة الرئيسية هي تكرار جملة `console.log("نتمنى لك يوماً سعيداً.")`. هذا التكرار يجعل تحديث الكود صعباً وعرضة للأخطاء.