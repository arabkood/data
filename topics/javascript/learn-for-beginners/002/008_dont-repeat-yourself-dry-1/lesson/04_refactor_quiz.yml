type: "quiz"
lang: "javascript"
question: |
  لنعد إلى مثال الترحيب بالمستخدمين. أكمل الكود لإنشاء `:function` تقوم بطباعة رسالة الترحيب العامة.
code: |
  function greetUser() {
    __@@INPUT@@__
  }

  // استدعاء الدالة للمستخدمين
  greetUser(); // للمستخدم علي
  greetUser(); // للمستخدمة فاطمة
options:
  - "console.log(\"مرحباً بك، علي!\");"
  - "console.log(\"نتمنى لك يوماً سعيداً.\");"
  - "return \"نتمنى لك يوماً سعيداً.\";"
  - "log(\"مرحباً\");"
solution: 1
explanation: |
  السطر المكرر الذي نريد وضعه داخل `:function` هو `console.log("نتمنى لك يوماً سعيداً.")`. بهذه الطريقة، نطبق مبدأ `:DRY`.