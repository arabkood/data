type: "quiz"
lang: "javascript"
question: |
  الكود الآن أفضل، لكن رسالة الترحيب لا تزال غير شخصية. كيف يمكننا تعديل الـ`:function` لتقبل اسم المستخدم كمدخل (input)؟
code: |
  function greetUser(name) { // name هو parameter
    console.log("مرحباً بك، " + name + "!");
    console.log("نتمنى لك يوماً سعيداً.");
  }

  greetUser("علي");
  greetUser("فاطمة");

  ماذا سيطبع الاستدعاء `greetUser("فاطمة")`؟
options:
  - "مرحباً بك، علي!\nنتمنى لك يوماً سعيداً."
  - "مرحباً بك، name!\nنتمنى لك يوماً سعيداً."
  - "مرحباً بك، فاطمة!\nنتمنى لك يوماً سعيداً."
  - "مرحباً بك، فاطمة!"
solution: 2
explanation: |
  عند استدعاء `:function` مع القيمة `"فاطمة"`، هذه القيمة (تُسمى `:argument`) تُسند إلى الـ`:parameter` المسمى `name` داخل الدالة. بالتالي، يتم طباعة الرسالة الشخصية الصحيحة.