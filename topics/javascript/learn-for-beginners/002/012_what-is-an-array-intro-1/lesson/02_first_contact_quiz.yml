type: "quiz"
lang: "javascript"
question: |
  أي من الخيارات التالية هي الطريقة الصحيحة لإنشاء قائمة (أو ما يسمى `:array`) بالمهام اليومية؟
options:
  - "`let tasks = 'Read, Code, Eat';`"
  - "`let tasks = ['Read', 'Code', 'Eat'];`"
  - "`let tasks = ('Read', 'Code', 'Eat');`"
  - "`let tasks = {'Read', 'Code', 'Eat'};`"
solution: 1
explanation: |
  لإنشاء `:array` في `:javascript`، نستخدم الأقواس المربعة `[]` ونفصل بين العناصر بفاصلة `,`.