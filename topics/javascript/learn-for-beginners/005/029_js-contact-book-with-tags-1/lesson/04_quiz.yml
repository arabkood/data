type: "quiz"
lang: "javascript"
question: |
  أكمل الكود لإضافة جهة اتصال جديدة إلى قائمة `contacts` باستخدام الـ `:method` المناسب.
code: |
  const contacts = [
    { name: 'علياء', phone: '111-222' }
  ];
  const newContact = { name: 'سامي', phone: '555-666' };
  
  contacts.__@@INPUT@@__(newContact);
options:
  - ".add"
  - ".push"
  - ".insert"
  - ".append"
solution: 1
explanation: |
  الـ `:method` المسمى `.push()` هو الطريقة القياسية في `:javascript` لإضافة عنصر جديد إلى نهاية `:array`.