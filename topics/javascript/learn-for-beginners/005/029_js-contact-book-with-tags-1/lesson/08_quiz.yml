type: "quiz"
lang: "javascript"
question: |
  أكمل الفراغ في `:function` التالية لتصفية جهات الاتصال بناءً على الوسم المطلوب.
code: |
  const contacts = [
    { name: 'نورة', tags: ['family', 'doctor'] },
    { name: 'خالد', tags: ['work'] }
  ];

  function findByTag(tag) {
    return contacts.filter(contact => {
      return contact.tags.__@@INPUT@@__(tag);
    });
  }
options:
  - ".contains"
  - ".hasTag"
  - ".includes"
  - ".find"
solution: 2
explanation: |
  نستخدم `contacts.filter()` للمرور على كل جهة اتصال. ولكل واحدة، نستخدم `contact.tags.includes(tag)` للتحقق مما إذا كانت مصفوفة الوسوم الخاصة بها تحتوي على الوسم الذي نبحث عنه.