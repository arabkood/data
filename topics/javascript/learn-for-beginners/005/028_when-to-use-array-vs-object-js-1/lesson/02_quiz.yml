type: "quiz"
lang: "javascript"
question: |
  لديك قائمة مهام مرتبة. ما هي القيمة التي سيتم طباعتها في هذا الكود؟
code: |
  const tasks = ["قراءة كتاب", "حل تمرين", "مشاهدة درس"];
  console.log(tasks[1]);
options:
  - "`'قراءة كتاب'`"
  - "`'حل تمرين'`"
  - "`'مشاهدة درس'`"
  - "`:undefined`"
solution: 1
explanation: |
  في `:javascript`، يبدأ العد في `:array` من الصفر. لذلك، `:index` رقم `1` يشير إلى العنصر الثاني في القائمة وهو "حل تمرين".