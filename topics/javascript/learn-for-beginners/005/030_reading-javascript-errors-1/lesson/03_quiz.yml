type: "quiz"
lang: "javascript"
question: |
  لماذا سيفشل هذا الكود عند تشغيله ويعطي خطأ؟
code: |
  let price = 100;
  console.log(prce);
options:
  - "خطأ في بناء الجملة `:SyntaxError`"
  - "استخدام متغير غير مُعرَّف `:ReferenceError`"
  - "نوع بيانات خاطئ `:TypeError`"
  - "لا يمكن طباعة الأرقام"
solution: 1
explanation: |
  تم تعريف المتغير باسم `price` ولكن تمت محاولة طباعة `prce` (خطأ إملائي). عندما يحاول الكود الوصول إلى `:variable` غير موجود، يحدث `:ReferenceError`.
