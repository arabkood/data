type: "quiz"
lang: "javascript"
question: |
  بالنظر إلى رسالة الخطأ `TypeError: greeting.toLowerCase is not a function`، ما هو سبب المشكلة؟
code: |
  let greeting = 123;
  console.log(greeting.toLowerCase());
options:
  - "الدالة `:toLowerCase()` يجب أن تكون `:toUpperCase()`"
  - "المتغير `greeting` من نوع `:number` وليس `:string`"
  - "يوجد خطأ إملائي في اسم المتغير `greeting`"
  - "يجب استخدام `:const` بدلاً من `let`"
solution: 1
explanation: |
  يحدث `:TypeError` عندما نحاول تنفيذ عملية على نوع بيانات لا يدعمها. هنا، قيمة `greeting` هي `:number`، والأرقام لا تملك `:function` باسم `:toLowerCase()`، فهذه الدالة خاصة بالـ `:string` فقط.
