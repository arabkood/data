type: "quiz"
lang: "javascript"
question: |
  كود إطلاق الصاروخ شبه جاهز، لكن هناك خطأ منطقي يمنع الإطلاق حتى لو كان الوقود كافياً! ما هو الخطأ؟
code: |
  let fuel = 100; // الوقود ممتلئ
  let isReady = false;
  
  if (fuel < 90) { // يجب أن يكون الوقود 90 أو أكثر
    isReady = true;
  }
  
  if (isReady) {
    console.log("إطلاق!");
  } else {
    console.log("إلغاء الإطلاق.");
  }
options:
  - "يجب استخدام `:const` لتعريف `isReady`"
  - "اسم `:variable` `fuel` غير صحيح"
  - "الشرط `fuel < 90` يجب أن يكون `fuel >= 90`"
  - "لا يمكن استخدام `else` هنا"
solution: 2
explanation: |
  الخطأ المنطقي هنا هو أن الشرط `fuel < 90` يعني "إذا كان الوقود أقل من 90". نحن نريد الإطلاق إذا كان الوقود كافياً، لذا يجب أن يكون الشرط `fuel >= 90`.