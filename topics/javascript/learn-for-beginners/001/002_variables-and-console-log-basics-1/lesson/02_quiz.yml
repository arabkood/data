type: "quiz"
lang: "javascript"
question: |
  أي من الخيارات التالية هي الطريقة الصحيحة لإنشاء "صندوق" (أو `:variable`) لتخزين عمر شخص ما؟
options:
  - "`let age = 25;`"
  - "`age: 25;`"
  - "`create variable age = 25;`"
  - "`25 = age;`"
solution: 0
explanation: |
  لتعريف `:variable` في `:javascript`، نستخدم الكلمة المفتاحية `:let`، متبوعة باسم المتغير، ثم علامة `=`، ثم القيمة. وينتهي السطر عادة بفاصلة منقوطة `;`.