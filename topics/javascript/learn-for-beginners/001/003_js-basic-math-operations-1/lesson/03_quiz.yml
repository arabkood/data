type: "quiz"
lang: "javascript"
question: |
  أنت الآن تريد حساب تكلفة 4 قطع من منتج سعره 10. أي :operator: حسابي يجب وضعه في الفراغ للحصول على الناتج الصحيح؟
code: |
  let price = 10;
  let quantity = 4;
  let totalCost = price __@@INPUT@@__ quantity;
  console.log(totalCost); // يجب أن يطبع 40
options:
  - "`+`"
  - "`&`"
  - "`x`"
  - "`*`"
solution: 3
explanation: |
  في البرمجة، نستخدم النجمة `*` كـ:operator: للضرب. استخدام `+` كان سيعطي الناتج `14`.