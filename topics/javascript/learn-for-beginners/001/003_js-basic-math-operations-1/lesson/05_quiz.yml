type: "quiz"
lang: "javascript"
question: |
  لديك 13 كتابًا وتريد توزيعها بالتساوي في صناديق، كل صندوق يتسع لـ 5 كتب. ما هو الكود الصحيح لمعرفة عدد الكتب *المتبقية* بعد ملء الصناديق؟
code: |
  let totalBooks = 13;
  let boxCapacity = 5;
  // ما هو السطر الصحيح؟
options:
  - "`let remaining = totalBooks / boxCapacity;`"
  - "`let remaining = totalBooks * boxCapacity;`"
  - "`let remaining = totalBooks % boxCapacity;`"
  - "`let remaining = totalBooks - boxCapacity;`"
solution: 2
explanation: |
  عامل باقي القسمة (`%`) هو الأداة المثالية لهذه المهمة. `13 % 5` يعطي `3`، وهو عدد الكتب المتبقية التي لا تملأ صندوقًا كاملاً.