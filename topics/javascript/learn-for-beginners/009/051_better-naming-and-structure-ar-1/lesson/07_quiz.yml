type: "quiz"
lang: "javascript"
question: |
  الكود التالي يجمع اسم المستخدم الأول والأخير. ما هي أفضل طريقة لتنظيم هذا المنطق لإعادة استخدامه؟
code: |
  let firstName = "علي";
  let lastName = "الأحمد";
  let fullName = firstName + " " + lastName;
  console.log(fullName);
options:
  - "لا شيء، الكود بسيط بالفعل"
  - "وضعه داخل `:function` اسمها `getFullName` تأخذ `firstName` و `lastName` كمعاملات"
  - "استخدام متغيرات `:variables` بأسماء أقصر مثل `f` و `l`"
  - "دمج كل شيء في سطر واحد"
solution: 1
explanation: |
  إنشاء `:function` مثل `getFullName` هو الطريقة المثلى لتغليف هذا المنطق. هذا يسمح لك بإعادة استخدامه بسهولة في أي مكان في تطبيقك دون تكرار الكود، مما يجعل الكود أكثر تنظيمًا وكفاءة.
