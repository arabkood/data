type: "quiz"
lang: "javascript"
question: |
  في الكود التالي، أي اسم للمتغير `:variable` يعتبر الأفضل لوصف سعر المنتج؟
code: |
  let __@@INPUT@@__ = 150;
options:
  - "`x`"
  - "`val`"
  - "`productPrice`"
  - "`number`"
solution: 2
explanation: |
  الاسم `productPrice` هو الأوضح والأكثر وصفًا. فهو يخبرنا فورًا أن هذا الـ`:variable` يحمل سعر منتج، مما يجعل الكود أسهل للقراءة والفهم.
