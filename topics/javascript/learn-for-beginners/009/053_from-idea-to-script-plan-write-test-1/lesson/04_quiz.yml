type: "quiz"
lang: "javascript"
question: |
  أكمل الكود التالي داخل الدالة `:calculateArea` ليقوم بحساب المساحة بشكل صحيح.
code: |
  function calculateArea(length, width) {
    let area = __@@INPUT@@__;
    return area;
  }
options:
  - "`length + width`"
  - "`length * width`"
  - "`length - width`"
  - "`'length * width'`"
solution: 1
explanation: |
  لحساب مساحة المستطيل، نستخدم عملية الضرب (`*`) بين الطول والعرض. هذا هو الجزء العملي من مرحلة **الكتابة**.