type: "quiz"
lang: "javascript"
question: |
  قبل كتابة أي سطر من الكود لحساب مساحة مستطيل، ما هي أهم خطوة في مرحلة التخطيط؟
options:
  - "اختيار أسماء للمتغيرات مثل `x` و `y`."
  - "التفكير في الألوان التي ستُستخدم في التطبيق."
  - "تحديد المدخلات (الطول والعرض) والمخرج المتوقع (المساحة)."
  - "كتابة التعليقات التي تصف الكود."
solution: 2
explanation: |
  التخطيط هو أساس كل شيء. قبل الكتابة، يجب أن تعرف بوضوح ما هي البيانات التي تحتاجها (`:inputs`) وما هو الهدف الذي تريد تحقيقه (`:output`). هذا يمنع الأخطاء ويوجه عملية كتابة الكود.