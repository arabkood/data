type: "quiz"
lang: "javascript"
question: |
  What will be displayed in the console when this code runs?

  It can be tricky to spot the difference at first!
---
code: |
  console.log("100" + "50");
---
solution: 2
options:
  - 150
  - Error
  - "10050"
  - "100 50"
explanation: |
  Since both `"100"` and `"50"` are `string`s (because of the quotes), the `+` operator joins them together as text, rather than performing a mathematical addition.