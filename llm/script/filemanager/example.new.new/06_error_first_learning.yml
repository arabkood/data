type: "quiz"
lang: "javascript"
question: |
  I used to get these mixed up all the time. Let's see what happens if we forget the quotes for a filename.

  **Focus**: What do you think will happen when this code runs?
---
code: |
  console.log(Amman);
---
solution: 2
options:
  - It will print the word `Amman`.
  - It will do nothing.
  - It will cause an error.
  - It will print `"Amman"`.
explanation: |
  Aha! It caused an error. This is a classic! 
  
  Without quotes, the computer thought `Amman` was a command, not text. **Remembering quotes for strings is a key skill!**