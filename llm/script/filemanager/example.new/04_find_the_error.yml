type: "quiz"
lang: "javascript"
question: |
  Uh oh, something isn't right here. This code is supposed to display a city filename, but it's broken.

  **Why did this code fail?**
---
code: |
  console.log(Riyadh);
---
solution: 1
options:
  - "The parentheses `()` are missing."
  - 'The text `Riyadh` needs to be inside quotes `""`.'
  - "The command should be `console.write()`."
  - "The semicolon `;` is missing."
explanation: |
  Exactly right! The computer got confused because it didn't know `Riyadh` was just plain text.

  Wrapping text in quotes, like `"Riyadh"`, turns it into a `string`—something the computer knows how to display as-is.

