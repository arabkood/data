# This is the mini-project that combines both lessons.
prompt: "Time to set up your profile!\n1. Create a variable named `userCity` and set its value to `"New York"`.\n2. On the next line, use `console.log()` to print the value stored in your `userCity` variable."

solution: |
  let userCity = "New York";
  console.log(userCity);

success_message: "MISSION COMPLETE! 🏆 You just created a variable AND displayed it in the console. This is a fundamental skill in all of programming! You've completed the 'Identity' module and earned 100 XP!"

failure_hint: "Remember the two steps. First, `let userCity = ...;`. Then, on a new line, `console.log(userCity);`. Make sure you don't put quotes around `userCity` in the second line!"