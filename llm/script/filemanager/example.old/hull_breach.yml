type: "emergency_drill"
lang: "javascript"
countdown: 90  // seconds
situation: |
  💥 CATASTROPHIC HULL BREACH!
  Section 4 compromised! 

  OBJECTIVES:
  1. Declare 'damagedSections' container with value 1
  2. Set constant 'TOTAL_SECTIONS' to 8
  3. Calculate integrity percentage
  4. Transmit: "Hull integrity: [calculated]%"

audio_cue: "red_alert"
visual_feedback:
  - integrity_bar: true
  - pressure_warning: true
hint_system:
  - after_30s: "Remember: integrity = (working sections / total) * 100"
  - after_60s: "Working sections = TOTAL_SECTIONS - damagedSections"

solution: |
  let damagedSections = 1;
  const TOTAL_SECTIONS = 8;
  let integrity = (TOTAL_SECTIONS - damagedSections) / TOTAL_SECTIONS * 100;
  console.log("Hull integrity:", integrity, "%");

rewards:
  success: 
    rank: "Chief Engineer"
    badge: "Hull Breach Responder"
  failure:
    consequence: "Section 4 jettisoned"
    retry: true