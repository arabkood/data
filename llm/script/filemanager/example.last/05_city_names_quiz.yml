type: "quiz"
lang: "javascript"
question: |
  Let's practice one more time. We want to display the name of a famous city.

  What will be the **exact output** in the console when this code runs?
---
code: |
  console.log("القاهرة");
---
solution: 1
options:
  - '`"القاهرة"`'
  - '`القاهرة`'
  - '`console.log("القاهرة")`'
  - 'An error message'
explanation: |
  Perfect! The `console.log()` command prints the *value* that's inside the parentheses. In this case, it's the text 'القاهرة', so that's what appears. The quotes themselves are not part of the output.