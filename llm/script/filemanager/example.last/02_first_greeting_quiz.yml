type: "quiz"
lang: "javascript"
question: |
  Let's give it a try! It's a tradition for a programmer's first command to print "Hello, World!".

  How would you correctly write the command to print the arabic equivalent, **"مرحباً يا عالم"**?
---
code: |
  // Which command is correct?
---
solution: 0
options:
  - '`console.log("مرحباً يا عالم");`'
  - '`print("مرحباً يا عالم");`'
  - '`console.log(مرحباً يا عالم);`'
  - '`log.console("مرحباً يا عالم");`'
explanation: |
  Great start! The correct structure is the command `console.log()` with the text you want to display wrapped in `"quotation marks"` and placed inside the `()`. The semicolon `;` at the end signals the instruction is complete.