type: "quiz"
lang: "javascript"
question: |
  Imagine a system for a restaurant. We need to check if a table is available.

  If the table is **not available**, which `boolean` value should we use? **Fill in the blank.**
---
code: |
  // Is table #5 available? 
  console.log(______);
---
solution: 1
options:
  - "true"
  - "false"
  - "'no'"
  - "0"
explanation: |
  Perfect! `boolean` values are for logical states. `true` usually means 'yes' or 'on', while `false` means 'no' or 'off'. Since the table is not available, `false` is the correct choice.