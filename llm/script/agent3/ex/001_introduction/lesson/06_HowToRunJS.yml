type: "quiz"
lang: javascript
question: |
  لديك الكود التالي محفوظ في ملف يسمى `program.js`.

  ما هو الأمر الذي يجب أن تستخدمه في `:terminal` لتشغيه باستخدام `:nodejs`؟
code: |
  const now = new Date();
  const hour = now.getHours();

  const yourName = "محمد";

  if (hour < 12) {
    console.log(`صباح الخير، ${yourName}!`);
  } else {
    console.log(`مساء الخير، ${yourName}!`);
  }
solution: 2
options:
  - "run program.js"
  - "javascript program.js"
  - "node program.js"
  - "node run program.js"
explanation: |
  لتشغيل ملف جافاسكربت باستخدام `:nodejs`، استخدم الأمر `node` متبوعًا باسم الملف.

  بما أن الملف يسمى `program.js`، فإن الأمر الصحيح هو: 

  ```bash
  node program.js
  ```
