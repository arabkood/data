type: "quiz"
lang: "javascript"
question: |
  لدينا `:object` يمثل مستخدمًا. كيف نصل إلى قيمة `:property` البريد الإلكتروني؟
code: |
  const user = {
    name: "علي",
    email: "ali@example.com"
  };

  const userEmail = user.__@@INPUT@@__;

  console.log(userEmail);
options:
  - ".name"
  - "[email]"
  - ".email"
  - "('email')"
solution: 2
explanation: |
  للوصول إلى قيمة `:property` في `:object`، نستخدم اسم الـ`:object` متبوعًا بنقطة `.` ثم اسم الـ`:property`.