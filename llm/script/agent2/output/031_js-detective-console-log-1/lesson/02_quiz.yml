type: "quiz"
lang: "javascript"
question: |
  في عالم التحقيق البرمجي، ما هي المهمة الأساسية للأمر `:console.log()`؟
options:
  - "إيقاف تنفيذ الكود عند نقطة معينة"
  - "عرض معلومات أو قيم في لوحة التحكم (console)"
  - "تعريف `:variable` جديد"
  - "حذف الأخطاء من الكود تلقائيًا"
solution: 1
explanation: | 
  يستخدم `:console.log()` كأداة أساسية لعرض قيم `:variable` أو رسائل مخصصة في لوحة التحكم، مما يساعد المبرمجين على تتبع ما يحدث داخل الكود.