type: "quiz"
lang: "javascript"
question: |
  بعد إنشاء دالة `fetchFakeData`، كيف نستهلك البيانات التي تعيدها؟
code: |
  function fetchFakeData() {
    return new Promise((resolve) => {
      setTimeout(() => {
        resolve({ message: "اكتمل التحميل!" });
      }, 500);
    });
  }

  fetchFakeData()__@@INPUT@@__(data => {
    console.log(data.message);
  });
options:
  - "`.await`"
  - "`.then`"
  - "`.catch`"
  - "`.finally`"
solution: 1
explanation: |
  نستخدم التابع `.then()` على الـ`:Promise` لتحديد ما يجب فعله عند نجاح العملية. يستقبل `.then()` دالة `:callback` كوسيط، والتي يتم تمرير البيانات التي تم حلها إليها.