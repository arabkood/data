type: "quiz"
lang: "javascript"
question: |
  لنفهم المفهوم الأساسي أولاً. ما هو نوع القيمة التي تعيدها الـ`:function` التالية عند استدعائها؟
code: |
  function createFunction() {
    return function() {
      console.log("مرحباً من دالة داخلية!");
    };
  }

  let myNewFunction = createFunction();
options:
  - "`:string`"
  - "`:number`"
  - "`:function`"
  - "`:undefined`"
solution: 2
explanation: | 
  الـ`:function` المسماة `createFunction` لا تقوم بإرجاع نص أو رقم، بل تقوم بإرجاع `:function` أخرى. هذا هو أساس مفهوم "مصانع الدوال".