type: "quiz"
lang: "javascript"
question: |
  الآن نريد تحويل الحرف الأول إلى حرف كبير. أي من الخيارات التالية يقوم بذلك بشكل صحيح؟
code: |
  let word = "ahmed";
  // What's the correct code here?
options:
  - "`word.first().toUpperCase()`"
  - "`word.toUpperCase(0)`"
  - "`word[0].toUpperCase()`"
  - "`upper(word[0])`"
solution: 2
explanation: |
  للوصول إلى الحرف الأول في `:string`، نستخدم `[0]`. بعد ذلك، نطبق عليه الدالة `:toUpperCase()` لتحويله إلى حرف كبير.