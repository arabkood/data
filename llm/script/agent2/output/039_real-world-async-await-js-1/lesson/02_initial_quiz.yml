type: "quiz"
lang: "javascript"
question: |
  في :javascript، ما هو الغرض الأساسي من كائن :Promise؟
options:
  - "لتخزين البيانات بشكل دائم"
  - "لتمثيل قيمة قد تكون متاحة الآن، أو في المستقبل، أو لا تكون متاحة على الإطلاق"
  - "لتنفيذ العمليات الحسابية المعقدة فقط"
  - "لإيقاف تنفيذ الكود بالكامل حتى يتم استلام البيانات"
solution: 1
explanation: | 
  يمثل كائن :Promise إتمام (أو فشل) عملية غير متزامنة وقيمتها الناتجة. إنه وعد بالحصول على قيمة في المستقبل.