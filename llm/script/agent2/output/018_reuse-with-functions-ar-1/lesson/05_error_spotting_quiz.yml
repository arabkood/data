type: "quiz"
lang: "javascript"
question: |
  هذه الـ`:function` تهدف إلى مضاعفة الرقم المُمرر إليها، لكنها لا تعمل كما هو متوقع. ما هو الخطأ؟
code: |
  function double(number) {
    let result = number * 2;
    // أين الخطأ؟
  }

  let myNumber = double(5);
  console.log(myNumber); // الناتج المعروض: undefined
options:
  - "يجب تعريف الـ`:variable` `result` باستخدام `:const`."
  - "الـ`:function` لا تُرجع القيمة المحسوبة باستخدام `:return`."
  - "لا يمكن استدعاء `:function` داخل `let`."
  - "اسم الـ`:parameter` `number` غير صالح."
solution: 1
explanation: |
  تقوم الـ`:function` بالحساب بشكل صحيح، ولكنها لا "تُرسل" النتيجة إلى الخارج. بدون استخدام الكلمة المفتاحية `:return`، فإن أي `:function` في `:javascript` تُرجع القيمة `:undefined` افتراضيًا. الحل هو إضافة `return result;` داخل الـ`:function`.