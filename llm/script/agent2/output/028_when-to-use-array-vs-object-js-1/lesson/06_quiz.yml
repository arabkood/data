type: "quiz"
lang: "javascript"
question: |
  أكمل الكود لإنشاء `:object` يمثل كتابًا، بحيث يحتوي على `:array` من المؤلفين.
code: |
  const book = {
    title: "أساسيات البرمجة",
    year: 2023,
    authors: __@@INPUT@@__
  };
options:
  - "`["سارة", "أحمد"]`"
  - "`{"سارة", "أحمد"}`"
  - "`"سارة, أحمد"`"
  - "`authors("سارة", "أحمد")`"
solution: 0
explanation: |
  لتمثيل قائمة من المؤلفين داخل `:object` الكتاب، نستخدم `:array` (قائمة محاطة بأقواس مربعة `[]`). هذا يوضح كيف يمكن دمج الهيكلين معًا.