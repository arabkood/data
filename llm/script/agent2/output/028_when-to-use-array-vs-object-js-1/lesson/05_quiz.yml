type: "quiz"
lang: "javascript"
question: |
  أنت تبني تطبيقًا للطقس وتحتاج إلى تخزين درجات الحرارة المتوقعة للأسبوع القادم بالترتيب. ما هي أفضل بنية بيانات لاستخدامها؟
options:
  - "`:array` لتخزين الدرجات بالترتيب اليومي."
  - "`:object` حيث كل يوم هو `:key`."
  - "`:string` واحد يحتوي على كل الدرجات مفصولة بفاصلة."
  - "`:variable` منفصل لكل يوم."
solution: 0
explanation: |
  بما أن الترتيب (اليوم الأول، الثاني، إلخ) مهم، فإن `:array` هي الخيار الأمثل لتمثيل سلسلة مرتبة من البيانات المتشابهة (درجات الحرارة).