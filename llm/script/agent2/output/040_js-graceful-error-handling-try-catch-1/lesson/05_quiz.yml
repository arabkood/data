type: "quiz"
lang: "javascript"
question: |
  ما الذي سيتم طباعته في الـ`:console` عند تنفيذ الكود التالي؟
code: |
  try {
    console.log("بدء المحاولة");
    throw new Error("مشكلة مخصصة!");
    console.log("هذا السطر لن يتم تنفيذه");
  } catch (err) {
    console.log(err.message);
  }
solution: 1
options:
  - "`بدء المحاولة`"
  - "`بدء المحاولة`" ثم "`مشكلة مخصصة!`"
  - "`بدء المحاولة`" ثم "`هذا السطر لن يتم تنفيذه`"
  - "`مشكلة مخصصة!`"
explanation: |
  يطبع الكود "بدء المحاولة" أولاً. بعد ذلك، `throw new Error` توقف التنفيذ داخل `:try` فوراً وتنتقل إلى كتلة `:catch`. الخاصية `:message` لكائن الخطأ تحتوي على النص "مشكلة مخصصة!"، والذي يتم طباعته.