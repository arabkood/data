type: "quiz"
lang: "javascript"
question: |
  ما ناتج تنفيذ الكود التالي؟
code: |
  function multiply(a, b) {
    return a * b;
    console.log("This will not run");
  }
  
  let result = multiply(4, 5);
  console.log(result);
options:
  - "`This will not run`"
  - "`undefined`"
  - "`20`"
  - "لا شيء سيتم طباعته"
solution: 2
explanation: |
  الـ`:function` `multiply` تعيد ناتج `4 * 5` وهو `20`. يتم تخزين هذه القيمة في الـ`:variable` `result` ثم طباعتها. أي كود يأتي بعد عبارة `:return` داخل الـ`:function` لن يتم تنفيذه.