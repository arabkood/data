type: "quiz"
lang: "javascript"
question: |
  الدالة التقليدية التالية تقوم بمضاعفة الرقم. أي من الخيارات التالية هو المكافئ لها باستخدام صيغة دالة السهم؟
code: |
  const double = function(number) {
    return number * 2;
  };
options:
  - "`const double = (number) => number * 2;`"
  - "`const double => (number) { number * 2; }`"
  - "`const double = (number) -> number * 2;`"
  - "`function double => (number) * 2;`"
solution: 0
explanation: |
  الصيغة الأساسية لدالة السهم تستبدل كلمة `:function` بسهم `=>` بعد المعاملات. هذا يجعل الكود أكثر اختصاراً.