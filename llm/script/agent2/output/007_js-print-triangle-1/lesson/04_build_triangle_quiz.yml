type: "quiz"
lang: "javascript"
question: |
  الآن، لنبني المثلث. الـ`:loop` الخارجي (باستخدام `i`) يبني الأسطر. الـ`:loop` الداخلي (باستخدام `j`) يجب أن يطبع النجوم. كيف نجعل عدد النجوم يزداد مع كل سطر؟

  أكمل الشرط في الـ`:loop` الداخلي.
code: |
  for (let i = 1; i <= 5; i++) {
    let line = "";
    for (let j = 1; __@@INPUT@@__; j++) {
      line += "*";
    }
    console.log(line);
  }
solution: 2
options:
  - "`j <= 5`"
  - "`j < i`"
  - "`j <= i`"
  - "`j > i`"
explanation: |
  باستخدام `j <= i`، فإن الـ`:loop` الداخلي سيعمل مرة واحدة في السطر الأول، مرتين في الثاني، وهكذا. هذا يربط عدد النجوم برقم السطر الحالي `i`.