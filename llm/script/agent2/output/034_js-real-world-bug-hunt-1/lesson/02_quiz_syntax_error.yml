type: "quiz"
lang: "javascript"
question: |
  زميلك كتب هذا الكود على عجل، ولكنه لا يعمل. ما هو الخطأ الأول الذي تلاحظه ويمنع تشغيل الكود؟
code: |
  function greet(name) {
    console.log("مرحباً، " + name)
  }

  greet("علي")
options:
  - "اسم `:function` غير صالح"
  - "نسي الفاصلة المنقوطة (`;`) بعد استدعاء `:function`"
  - "النص العربي يسبب المشكلة"
  - "القوس المجعد `}` الخاص بالدالة مفقود"
solution: 3
explanation: |
  هذا `:syntax error` شائع جدًا. كل `:function` في `:javascript` يجب أن يكون لها قوس فتح `{` وقوس إغلاق `}`. بدون قوس الإغلاق، لا يعرف المترجم أين ينتهي تعريف `:function`.
