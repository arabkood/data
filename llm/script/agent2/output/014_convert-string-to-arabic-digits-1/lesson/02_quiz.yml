type: "quiz"
lang: "javascript"
question: |
  لتحويل كل رقم إنجليزي إلى نظيره العربي، ما هي أفضل بنية بيانات لتخزين هذا الربط (مثلاً: '1' يقابله '١')؟
options:
  - ":array` يحتوي على الأرقام العربية فقط"
  - ":object` يستخدم الأرقام الإنجليزية كمفاتيح والعربية كقيم"
  - ":string` واحد طويل يجمع كل الأرقام"
  - ":variable` من نوع `:number`"
solution: 1
explanation: |
  الـ`:object` (أو القاموس) مثالي لربط قيمة بأخرى. يمكننا استخدامه لإنشاء خريطة واضحة بين كل رقم إنجليزي ونظيره العربي، مما يسهل عملية البحث والاستبدال لاحقًا.