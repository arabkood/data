type: "quiz"
lang: "javascript"
question: |
  في البرمجة، غالبًا ما نحتاج إلى تمرير سلوك (كود) ليتم تنفيذه لاحقًا. 

  أي من الخيارات التالية يمثل تمرير الـ`:function` نفسها كقيمة، وليس استدعاءها فورًا؟
code: |
  function sayHello() {
    console.log("مرحباً!");
  }

  // كيف نمرر الدالة `sayHello` كقيمة؟
options:
  - "`sayHello()`"
  - "`sayHello`"
  - "`let action = sayHello()`"
  - "`'sayHello'`"
solution: 1
explanation: |
  لتمرير `:function` كقيمة لتُنفذ لاحقًا (مثلما نفعل مع المهام المؤجلة)، نستخدم اسمها فقط بدون الأقواس `()`. الأقواس `()` تعني "نفّذ هذه الـ`:function` الآن واستخدم ناتجها".