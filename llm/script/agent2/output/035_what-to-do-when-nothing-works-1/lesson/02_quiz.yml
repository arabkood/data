type: "quiz"
lang: "javascript"
question: |
  نظرة سريعة! ما الخطأ الأكثر وضوحًا في هذا الكود الذي يمنع تشغيله؟
code: |
  conole.log("مرحباً أيها العالم!");
options:
  - "اسم الـ `:function` به خطأ إملائي"
  - "النص يحتاج إلى علامات تنصيص مفردة"
  - "لا يوجد خطأ، الكود سليم"
  - "فاصلة منقوطة مفقودة في النهاية"
solution: 0
explanation: |
  كلمة `:console` مكتوبة بشكل خاطئ. الأخطاء الإملائية هي من أشهر أنواع الأخطاء البرمجية! المتصفح أو بيئة التشغيل لا تعرف `:function` باسم `conole`، وهذا يسبب `:ReferenceError`.