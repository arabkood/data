type: "quiz"
lang: "javascript"
question: |
  ما ناتج تنفيذ الكود التالي للوصول إلى ثاني وسم لجهة الاتصال الأولى؟
code: |
  const contacts = [
    { name: 'نورة', tags: ['family', 'doctor'] },
    { name: 'خالد', tags: ['work'] }
  ];
  console.log(contacts[0].tags[1]);
options:
  - "`family`"
  - "`work`"
  - "`doctor`"
  - "`:undefined`"
solution: 2
explanation: |
  `contacts[0]` يصل إلى أول `:object`. `tags` يصل إلى `:array` الوسوم. و `[1]` يصل إلى العنصر الثاني في تلك الـ `:array` (لأن الفهرسة تبدأ من 0).