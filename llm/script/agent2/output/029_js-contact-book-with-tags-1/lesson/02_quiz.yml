type: "quiz"
lang: "javascript"
question: |
  لنبدأ بتمثيل جهة اتصال واحدة. أي من الخيارات التالية يمثل بشكل صحيح جهة اتصال كـ `:object` في `:javascript`؟
options:
  - "`let contact = { name: 'علي', phone: '12345' };`"
  - "`let contact = ['علي', '12345'];`"
  - "`let contact = 'علي: 12345';`"
  - "`let contact = (name: 'علي', phone: '12345');`"
solution: 0
explanation: |
  الخيار الصحيح يستخدم صيغة الـ `:object` في `:javascript` مع أزواج من المفتاح والقيمة (`key: value`) لتمثيل البيانات المنظمة.