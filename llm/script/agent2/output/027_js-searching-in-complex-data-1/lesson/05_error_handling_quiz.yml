type: "quiz"
lang: "javascript"
question: |
  الكود التالي يبحث عن مستخدم غير موجود، مما قد يسبب خطأ. أي خيار هو الطريقة الأسلم للتعامل مع هذه الحالة؟
code: |
  const users = [
    { id: 1, name: 'علي' },
    { id: 2, name: 'فاطمة' }
  ];
  const foundUser = users.find(u => u.name === 'سعد');
  // ماذا لو كان foundUser غير موجود؟
options:
  - "التحقق مما إذا كان `foundUser` له قيمة قبل استخدامه"
  - "استخدام حلقة `:for` بدلاً من `:find`"
  - "إضافة المستخدم 'سعد' إلى المصفوفة دائمًا"
  - "الكود سليم ولا يحتاج تعديل"
solution: 0
explanation: |
  عندما لا تجد دالة `:find` أي عنصر مطابق، فإنها تعيد `:undefined`. محاولة الوصول إلى خاصية من `:undefined` (مثل `foundUser.name`) ستؤدي إلى `:TypeError`. لذلك، من الضروري دائمًا التحقق من أن المتغير الناتج ليس `:undefined` قبل محاولة استخدامه.