type: "quiz"
lang: "javascript"
question: |
  لنبدأ بمراجعة سريعة. ما هي القيمة التي سيحتويها المتغير `:message` بعد تنفيذ هذا الكود؟
code: |
  let isLoggedIn = true;
  let message;
  if (isLoggedIn) {
    message = "أهلاً بك مجدداً!";
  } else {
    message = "الرجاء تسجيل الدخول.";
  }
options:
  - "`'أهلاً بك مجدداً!'`"
  - "`'الرجاء تسجيل الدخول.'`"
  - "`:undefined`"
  - "سيحدث `:syntax error`"
solution: 0
explanation: |
  بما أن قيمة `:isLoggedIn` هي `:true`، فسيتم تنفيذ الكتلة الأولى من جملة `:if` وإسناد القيمة `"أهلاً بك مجدداً!"` إلى المتغير `:message`.