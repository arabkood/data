type: "quiz"
lang: "javascript"
question: |
  لدينا `:array` للمستخدمين. نريد طباعة رسالة فقط إذا كانت المصفوفة غير فارغة. أي الخيارات التالية يحقق ذلك باستخدام اختصار `:&&`؟
code: |
  const users = ["علي", "سارة"];
  // كيف نطبع الرسالة بشكل شرطي؟
options:
  - "`users.length > 0 && console.log('لدينا مستخدمون!');`"
  - "`users.length = 0 && console.log('لدينا مستخدمون!');`"
  - "`console.log('لدينا مستخدمون!') && users.length > 0;`"
  - "`if (users.length)`"
solution: 0
explanation: |
  الشرط هو `users.length > 0` الذي يُقيّم إلى `:true`. بناءً على نمط `:condition && action`، سيتم تنفيذ الجزء الثاني وهو `console.log('لدينا مستخدمون!')`.