type: "quiz"
lang: "javascript"
question: |
  الكود التالي يعمل، لكن أسماء المتغيرات `:variables` سيئة جدًا. ما القيمة التي سيتم طباعتها؟
code: |
  let a1 = "سارة";
  let b2 = 30;
  console.log(a1);
options:
  - "`30`"
  - "`a1`"
  - "`سارة`"
  - "`:undefined`"
solution: 2
explanation: |
  على الرغم من أن الأسماء `a1` و `b2` غير وصفية، إلا أن الكود صحيح من الناحية التقنية. الأمر `console.log(a1)` سيطبع قيمة الـ`:variable` المسمى `a1` وهي "سارة". هذا يوضح لماذا الأسماء الجيدة مهمة للوضوح وليس فقط للتشغيل.
