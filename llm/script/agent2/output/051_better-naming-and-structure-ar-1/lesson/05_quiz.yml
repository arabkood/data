question: |
  الدالة التالية تحسب المساحة. ما هو التعديل الصحيح لجعل الكود أكثر قابلية للقراءة؟
code: |
  function calc(w, h) {
    return w * h;
  }
options:
  - "تغيير اسم الـ`:function` إلى `calculateArea`"
  - "تغيير `w` إلى `x` و `h` إلى `y`"
  - "إضافة تعليق `// a function`"
  - "لا حاجة لأي تعديل، الكود يعمل"
solution: 0
explanation: |
  اسم الـ`:function` `calc` غامض. تغييره إلى `calculateArea` يوضح على الفور الغرض من الـ`:function`، وهو المبدأ الأساسي للتسمية الجيدة.
