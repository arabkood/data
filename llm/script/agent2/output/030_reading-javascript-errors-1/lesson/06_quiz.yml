question: |
  الكود التالي يسبب `:ReferenceError`. ما هو التعديل الصحيح لإصلاحه؟
code: |
  const greeting = "Hello, ";
  const target = "World!";
  console.log(greeting + trget);
options:
  - "تغيير `trget` إلى `target` في `console.log`"
  - "حذف السطر الثاني `const target = ...`"
  - "تغيير `const` إلى `let`"
  - "وضع `World!` مباشرة في `console.log`"
solution: 0
explanation: |
  رسالة الخطأ `:ReferenceError` تخبرنا أننا نحاول استخدام `:variable` غير موجود. الخطأ الإملائي في `trget` هو السبب. بتصحيحه إلى `target`، سيجد الكود المتغير الصحيح ويعمل كما هو متوقع.
