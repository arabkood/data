type: "quiz"
lang: "javascript"
question: |
  في عالم البرمجة، غالبًا ما نبدأ العد من الصفر! 
  
  بناءً على ذلك، ما الذي سيطبعه الكود التالي؟
code: |
  let fruits = ["تفاح", "موز", "برتقال"];
  console.log(fruits[1]);
options:
  - "`تفاح`"
  - "`موز`"
  - "`برتقال`"
  - "`:undefined`"
solution: 1
explanation: |
  الوصول إلى العناصر في `:array` يتم عبر الـ `:index` الخاص بها. الـ `:index` الأول هو `0`، والثاني هو `1`، وهكذا. لذلك `fruits[1]` يشير إلى العنصر الثاني وهو "موز".