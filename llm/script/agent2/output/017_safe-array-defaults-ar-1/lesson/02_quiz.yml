type: "quiz"
lang: "javascript"
question: |
  ما ناتج تنفيذ الكود التالي؟
code: |
  const scores = [90, 85];
  console.log(scores[2]);
options:
  - "`90`"
  - "`85`"
  - "`:undefined`"
  - "`error`"
solution: 2
explanation: |
  تحتوي `:array` على عنصرين في الفهرس `0` والفهرس `1`. عند محاولة الوصول إلى `:index` رقم `2`، والذي لا وجود له، تُرجع `:javascript` القيمة `:undefined`.