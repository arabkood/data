type: "quiz"
lang: "javascript"
question: |
  ما الذي يحاول هذا الكود حسابه؟ من الصعب معرفة ذلك، وهذا هو بيت القصيد!
code: |
  let a = 30;
  let b = 10;
  let c = a - b;
  let d = c * 365;
  console.log(d);
options:
  - "عدد الساعات في 10 سنوات"
  - "عدد الأيام في 30 سنة"
  - "عدد الأيام في 20 سنة"
  - "عدد الدقائق في شهر"
solution: 2
explanation: |
  الكود يحسب عدد الأيام في 20 سنة، لكن الأسماء الغامضة مثل `:variable` `a` و `:variable` `d` تجعل فهمه شبه مستحيل. هذا يوضح لماذا التسمية الجيدة ليست رفاهية، بل ضرورة.
