type: "quiz"
lang: "javascript"
question: |
  في الكود التالي، هناك خطأ منطقي بسبب اسم `:variable` مضلل. ما هو سبب الناتج الخاطئ؟
code: |
  // الهدف: حساب سعر المنتج بعد خصم 20%
  let price = 100;
  let discountPercentage = 20;
  
  // حساب قيمة الخصم بشكل خاطئ
  let discountValue = price * discountPercentage; // => 2000
  
  let finalPrice = price - discountValue;
  console.log(finalPrice); // الناتج -1900 بدلاً من 80
options:
  - "العملية الحسابية لحساب `discountValue` خاطئة."
  - "يجب استخدام `:const` بدلاً من `let`."
  - "العملية الحسابية `price - discountValue` خاطئة."
  - "اسم `:variable` `price` غير واضح."
solution: 0
explanation: |
  المشكلة هي أن طريقة حساب `discountValue` خاطئة. لحساب قيمة الخصم الصحيحة، كان يجب ضرب السعر في النسبة المئوية مقسومة على 100، هكذا: `price * (discountPercentage / 100)`. حتى مع الأسماء الجيدة، المنطق الخاطئ يؤدي إلى أخطاء.
