type: "quiz"
lang: "javascript"
question: |
  أي من الخيارات التالية يحل مشكلة "تسرب" المتغير `i` خارج حلقة `for` في الكود أدناه؟
code: |
  for (var i = 0; i < 5; i++) {
    console.log(i);
  }
  // كيف نمنع الوصول إلى 'i' هنا؟
options:
  - "تغيير `:var` إلى `:let`"
  - "تغيير `:var` إلى `:const`"
  - "حذف `console.log(i)` داخل الحلقة"
  - "لا يمكن حل هذه المشكلة"
solution: 0
explanation: |
  باستبدال `:var` بـ `:let`، يصبح المتغير `i` محصورًا داخل نطاق حلقة `for` فقط (`:block scope`). محاولة الوصول إليه خارج الحلقة ستؤدي إلى `:ReferenceError`، وهو السلوك المطلوب.