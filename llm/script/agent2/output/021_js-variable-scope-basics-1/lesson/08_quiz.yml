type: "quiz"
lang: "javascript"
question: |
  مع وجود متغيرين بنفس الاسم ولكن في نطاقين مختلفين، ما هو الناتج النهائي الذي سيطبعه الكود؟
code: |
  let planet = "الأرض"; // نطاق عام

  if (true) {
    let planet = "المريخ"; // نطاق الكتلة
    console.log("داخل الكتلة: " + planet);
  }

  console.log("خارج الكتلة: " + planet);
solution: 2
options:
  - "`داخل الكتلة: المريخ` ثم `خارج الكتلة: المريخ`"
  - "`داخل الكتلة: الأرض` ثم `خارج الكتلة: الأرض`"
  - "`داخل الكتلة: المريخ` ثم `خارج الكتلة: الأرض`"
  - "`داخل الكتلة: الأرض` ثم `خارج الكتلة: المريخ`"
explanation: |
  يطبع الكود "المريخ" أولاً لأن `:console.log` الأول يرى المتغير `:planet` المعرف داخل كتلة `:if`. بعد الخروج من الكتلة، يرى `:console.log` الثاني المتغير `:planet` المعرف في النطاق العام، والذي قيمته "الأرض".